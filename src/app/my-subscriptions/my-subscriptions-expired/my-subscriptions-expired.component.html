<div class="bg-gray-100 shadow-sm rounded-2xl border border-gray-300 px-4 py-3 flex justify-between items-center">
    <div>
        <p class="text-xs font-semibold text-gray-500 uppercase">Expired</p>
        <p class="text-base font-semibold text-gray-800">{{ subscription.planName }}</p>
        <p class="text-xs text-gray-500">Ended: {{ subscription.endDate | date:'mediumDate' }}</p>
    </div>

    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
