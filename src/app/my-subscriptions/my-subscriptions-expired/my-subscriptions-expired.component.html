<div
    class="relative p-3 border border-gray-200 rounded-xl bg-gray-50 flex items-start justify-between gap-3 opacity-70 hover:opacity-100 transition">
    <div class="w-2 h-2 rounded-full bg-gray-400 mt-1.5 shrink-0"></div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-700">{{ subscription.plan }}</p>
        <p class="text-[10px] text-gray-400 mt-0.5">
            Ended: {{ subscription.endDate | date:'mediumDate' }}
        </p>
        <span
            class="mt-1.5 inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-200 text-gray-500 border border-gray-300">
            Expired
        </span>
    </div>
    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
