<section class="font-sans flex flex-col gap-6">

  <div>
    <h2 class="text-base font-bold text-gray-900">Choose your plan</h2>
    <p class="text-xs text-gray-400 mt-0.5">
      Flexible options designed to match your fitness journey.
    </p>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

    <div *ngFor="let plan of plans" class="relative border border-gray-200 rounded-xl bg-white p-4 flex flex-col gap-3
             hover:shadow-sm hover:-translate-y-0.5 transition cursor-pointer">

      <!-- Discount badge -->
      <div
        class="absolute top-3 right-3 text-[10px] font-bold text-red-600 bg-red-50 border border-red-100 px-2 py-0.5 rounded-full">
        Save {{ plan.discount }}%
      </div>

      <!-- Plan name -->
      <h3 class="text-sm font-bold text-gray-900">{{ plan.name }}</h3>
      <p class="text-xs text-gray-400 leading-relaxed">{{ plan.description }}</p>

      <div class="border-t border-gray-100"></div>

      <!-- Features -->
      <ul class="flex flex-col gap-1.5">
        <li *ngFor="let detail of plan.details" class="flex items-start gap-2 text-xs text-gray-700">
          <i-feather name="check" style="width:12px;height:12px;" class="text-red-600 shrink-0 mt-0.5"></i-feather>
          {{ detail }}
        </li>
      </ul>

      <!-- Duration -->
      <div class="flex items-center gap-1 text-[11px] text-gray-500 mt-auto">
        <i-feather name="clock" style="width:11px;height:11px;"></i-feather>
        {{ plan.duration }}
      </div>

      <!-- CTA -->
      <button class="w-full py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
               hover:bg-red-700 active:scale-[0.98] transition">
        Select {{ plan.name }}
      </button>

    </div>

  </div>

</section>
