<section class="mt-10 font-sans">

  <!-- Header -->
  <div class="text-center mb-10">
    <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900">
      Choose Your Perfect Plan
    </h1>
    <p class="text-gray-600 mt-2 text-sm md:text-base max-w-xl mx-auto">
      Flexible options designed to match your fitness journey — from beginners to elite athletes.
    </p>
  </div>

  <!-- Plans Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">

    <div *ngFor="let plan of plans"
      class="rounded-2xl border border-gray-200 bg-white shadow-sm hover:shadow-md transition-all p-6 flex flex-col">

      <!-- Plan Name -->
      <h3 class="text-xl font-bold text-gray-900 text-center">
        {{ plan.name }}
      </h3>

      <!-- Description -->
      <p class="text-gray-600 text-sm text-center mt-1">
        {{ plan.description }}
      </p>

      <!-- Divider -->
      <div class="my-4 border-t border-gray-200"></div>

      <!-- Features -->
      <ul class="space-y-2 text-sm text-gray-700">
        <li *ngFor="let detail of plan.details" class="flex items-start gap-2">
          <span class="text-red-600 font-bold">•</span>
          <span>{{ detail }}</span>
        </li>
      </ul>

      <!-- Duration -->
      <div class="mt-6 text-center text-sm text-gray-800">
        <span class="font-semibold">Duration:</span> {{ plan.duration }}
      </div>

      <!-- Discount -->
      <div class="mt-2 text-center text-xs text-red-600 font-semibold">
        Save {{ plan.discount }}%
      </div>

      <!-- CTA -->
      <button
        class="mt-6 w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg font-semibold text-sm transition-all">
        Select {{ plan.name }}
      </button>

    </div>

  </div>

</section>
