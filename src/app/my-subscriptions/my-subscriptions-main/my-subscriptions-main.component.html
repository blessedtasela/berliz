<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="credit-card" class="text-red-600" style="width:16px;height:16px;"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900">My subscriptions</h1>
                <p class="text-[11px] text-gray-400">Track your plans, renewals and billing history</p>
            </div>
        </div>
        <app-refresh-button [loading]="loading" (refresh)="handleRefresh()"></app-refresh-button>
    </div>

    <app-my-subscriptions-empty *ngIf="subscriptionsList.length === 0"></app-my-subscriptions-empty>

    <app-my-subscriptions-analytics *ngIf="subscriptionsList.length > 0" [subscriptions]="subscriptionsList">
    </app-my-subscriptions-analytics>

    <app-my-subscriptions-list [subscriptions]="subscriptionsList" (refresh)="handleRefresh()">
    </app-my-subscriptions-list>

    <app-my-subscriptions-plans></app-my-subscriptions-plans>

    <app-my-subscriptions-timeline *ngIf="subscriptionsList.length > 0" [subscriptions]="subscriptionsList">
    </app-my-subscriptions-timeline>

</section>
