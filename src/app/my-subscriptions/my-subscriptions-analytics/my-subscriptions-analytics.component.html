<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

    <div class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Total</span>
        <span class="text-2xl font-bold text-gray-900 dark:text-gray-100">{{ total }}</span>
        <span class="text-[10px] text-gray-400 dark:text-gray-500">all plans</span>
    </div>

    <div class="bg-green-50 dark:bg-green-950/20 border border-green-100 dark:border-green-900 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-green-500 font-semibold uppercase tracking-wide">Active</span>
        <span class="text-2xl font-bold text-green-700 dark:text-green-400">{{ active }}</span>
        <span class="text-[10px] text-green-400">running now</span>
    </div>

    <div class="bg-yellow-50 dark:bg-yellow-950/20 border border-yellow-100 dark:border-yellow-900 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-yellow-500 font-semibold uppercase tracking-wide">Expiring soon</span>
        <span class="text-2xl font-bold text-yellow-600 dark:text-yellow-400">{{ expiringSoon }}</span>
        <span class="text-[10px] text-yellow-400">within 7 days</span>
    </div>

    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Expired</span>
        <span class="text-2xl font-bold text-gray-500 dark:text-gray-400">{{ expired }}</span>
        <span class="text-[10px] text-gray-400 dark:text-gray-500">ended</span>
    </div>

</div>
