<div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

    <div class="bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-gray-400 font-semibold uppercase tracking-wide">Total</span>
        <span class="text-2xl font-bold text-gray-900">{{ total }}</span>
        <span class="text-[10px] text-gray-400">all plans</span>
    </div>

    <div class="bg-green-50 border border-green-100 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-green-500 font-semibold uppercase tracking-wide">Active</span>
        <span class="text-2xl font-bold text-green-700">{{ active }}</span>
        <span class="text-[10px] text-green-400">running now</span>
    </div>

    <div class="bg-yellow-50 border border-yellow-100 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-yellow-500 font-semibold uppercase tracking-wide">Expiring soon</span>
        <span class="text-2xl font-bold text-yellow-600">{{ expiringSoon }}</span>
        <span class="text-[10px] text-yellow-400">within 7 days</span>
    </div>

    <div class="bg-white border border-gray-200 rounded-xl px-4 py-3 flex flex-col gap-1">
        <span class="text-[11px] text-gray-400 font-semibold uppercase tracking-wide">Expired</span>
        <span class="text-2xl font-bold text-gray-500">{{ expired }}</span>
        <span class="text-[10px] text-gray-400">ended</span>
    </div>

</div>
