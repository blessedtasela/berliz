<div
    class="relative p-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-900 flex items-start justify-between gap-3 hover:shadow-sm hover:-translate-y-0.5 transition">
    <div class="w-2 h-2 rounded-full bg-green-500 mt-1.5 shrink-0"></div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ subscription.plan }}</p>
        <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">
            Started: {{ subscription.startDate | date:'mediumDate' }}
        </p>
        <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
            <span
                class="inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 border border-green-100 dark:border-green-900">
                Active
            </span>
            <span *ngIf="subscription.autoRenew === false"
                class="inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 border border-amber-100 dark:border-amber-900">
                Won't renew · access until {{ subscription.endDate | date:'mediumDate' }}
            </span>
        </div>
    </div>
    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
