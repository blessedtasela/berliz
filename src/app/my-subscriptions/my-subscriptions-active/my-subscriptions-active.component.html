<div
    class="relative p-3 border border-gray-200 rounded-xl bg-white flex items-start justify-between gap-3 hover:shadow-sm hover:-translate-y-0.5 transition">
    <div class="w-2 h-2 rounded-full bg-green-500 mt-1.5 shrink-0"></div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900">{{ subscription.plan }}</p>
        <p class="text-[10px] text-gray-400 mt-0.5">
            Started: {{ subscription.startDate | date:'mediumDate' }}
        </p>
        <div class="mt-1.5 flex flex-wrap items-center gap-1.5">
            <span
                class="inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-green-50 text-green-700 border border-green-100">
                Active
            </span>
            <span *ngIf="subscription.autoRenew === false"
                class="inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-50 text-amber-700 border border-amber-100">
                Won't renew · access until {{ subscription.endDate | date:'mediumDate' }}
            </span>
        </div>
    </div>
    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
