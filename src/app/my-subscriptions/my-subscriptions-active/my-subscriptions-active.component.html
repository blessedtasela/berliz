<div class="bg-white shadow-sm rounded-2xl border border-green-500/60 px-4 py-3 flex justify-between items-center">
    <div>
        <p class="text-xs font-semibold text-green-600 uppercase">Active plan</p>
        <p class="text-base font-semibold text-gray-900">{{ subscription.planName }}</p>
        <p class="text-xs text-gray-500">Started: {{ subscription.startDate | date:'mediumDate' }}</p>
    </div>

    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
