<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col gap-3">

    <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Subscription timeline</h3>

    <div class="relative">
        <div class="absolute left-[7px] top-0 bottom-0 w-px bg-gray-200 dark:bg-gray-700"></div>

        <div *ngFor="let sub of sorted" class="relative pl-7 pb-4 last:pb-0">

            <div class="absolute left-0 top-1 w-[15px] h-[15px] rounded-full border-2 border-white dark:border-gray-900 shadow-sm"
                [ngClass]="isActive(sub) ? 'bg-green-500' : (isAwaiting(sub) ? 'bg-amber-400' : 'bg-gray-300 dark:bg-gray-600')">
            </div>

            <div
                class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-3 py-2.5 flex justify-between items-start gap-2 hover:border-gray-300 dark:hover:border-gray-600 transition">
                <div>
                    <p class="text-xs font-semibold text-gray-900 dark:text-gray-100">{{ sub.plan || 'Subscription' }}</p>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">
                        {{ sub.startDate | date:'mediumDate' }} –
                        {{ sub.endDate ? (sub.endDate | date:'mediumDate') : rangeEnd(sub) }}
                    </p>
                </div>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0" [ngClass]="statusClasses(sub)">
                    {{ statusLabel(sub) }}
                </span>
            </div>

        </div>
    </div>

</div>
