<div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col gap-3">

    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Subscription timeline</h3>

    <div class="relative">
        <div class="absolute left-[7px] top-0 bottom-0 w-px bg-gray-200"></div>

        <div *ngFor="let sub of sorted" class="relative pl-7 pb-4 last:pb-0">

            <div class="absolute left-0 top-1 w-[15px] h-[15px] rounded-full border-2 border-white shadow-sm"
                [ngClass]="sub.status === 'true' ? 'bg-green-500' : 'bg-gray-300'">
            </div>

            <div
                class="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 flex justify-between items-start gap-2 hover:border-gray-300 transition">
                <div>
                    <p class="text-xs font-semibold text-gray-900">{{ sub.plan || 'Subscription' }}</p>
                    <p class="text-[10px] text-gray-400 mt-0.5">
                        {{ sub.startDate | date:'mediumDate' }} –
                        {{ sub.endDate ? (sub.endDate | date:'mediumDate') : 'Ongoing' }}
                    </p>
                </div>
                <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0" [ngClass]="sub.status === 'true'
            ? 'bg-green-50 text-green-700 border border-green-100'
            : 'bg-gray-100 text-gray-500 border border-gray-200'">
                    {{ sub.status === 'true' ? 'Active' : 'Expired' }}
                </span>
            </div>

        </div>
    </div>

</div>
