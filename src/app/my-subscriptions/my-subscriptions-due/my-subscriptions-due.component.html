<div class="bg-yellow-50 shadow-sm rounded-2xl border border-yellow-400/70 px-4 py-3 flex justify-between items-center">
    <div>
        <p class="text-xs font-semibold text-yellow-600 uppercase">Expiring soon</p>
        <p class="text-base font-semibold text-gray-900">{{ subscription.planName }}</p>
        <p class="text-xs text-gray-600">Ends: {{ subscription.endDate | date:'mediumDate' }}</p>
    </div>

    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
