<div
    class="relative p-3 border border-yellow-200 dark:border-yellow-900 rounded-xl bg-yellow-50 dark:bg-yellow-950/20 flex items-start justify-between gap-3 hover:shadow-sm transition">
    <div class="w-2 h-2 rounded-full bg-yellow-400 mt-1.5 shrink-0"></div>
    <div class="flex-1 min-w-0">
        <p class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ subscription.plan }}</p>
        <p class="text-[10px] text-gray-500 dark:text-gray-400 mt-0.5">
            Ends: {{ subscription.endDate | date:'mediumDate' }}
        </p>
        <span
            class="mt-1.5 inline-flex text-[10px] font-semibold px-2 py-0.5 rounded-full bg-yellow-100 dark:bg-yellow-950/40 text-yellow-700 dark:text-yellow-400 border border-yellow-200 dark:border-yellow-900">
            Expiring soon
        </span>
    </div>
    <app-my-subscriptions-action [subscription]="subscription" (refresh)="refresh.emit()">
    </app-my-subscriptions-action>
</div>
