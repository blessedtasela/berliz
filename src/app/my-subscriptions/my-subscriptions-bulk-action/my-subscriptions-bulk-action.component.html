<div class="border border-gray-200 rounded-xl p-4 bg-white flex flex-col gap-3">

    <div class="flex items-center justify-between">
        <span class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Bulk actions</span>
        <button (click)="toggleBulkMode()" class="text-[11px] px-3 py-1 rounded-full border font-semibold transition"
            [ngClass]="bulkMode
        ? 'border-red-200 bg-red-50 text-red-600 hover:bg-red-100'
        : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
            {{ bulkMode ? 'Cancel' : 'Enable bulk mode' }}
        </button>
    </div>

    <p *ngIf="!bulkMode" class="text-[11px] text-gray-400">
        Enable bulk mode to manage multiple subscriptions at once.
    </p>

    <ng-container *ngIf="bulkMode">

        <!-- Select all -->
        <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" (change)="toggleSelectAll($any($event.target).checked)"
                class="w-3.5 h-3.5 accent-red-600" />
            <span class="text-xs text-gray-600 font-medium">Select all</span>
        </label>

        <!-- Subscription checkboxes -->
        <div class="flex flex-col gap-1.5 max-h-40 overflow-y-auto pr-1">
            <label *ngFor="let sub of subscriptions" class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" [checked]="isSelected(sub.id)"
                    (change)="toggleSelect(sub.id, $any($event.target).checked)" class="w-3.5 h-3.5 accent-red-600" />
                <span class="text-xs text-gray-700">{{ sub.planName }}</span>
                <span class="text-[10px] ml-auto font-semibold"
                    [ngClass]="sub.status === 'true' ? 'text-green-600' : 'text-gray-400'">
                    {{ sub.status === 'true' ? 'Active' : 'Expired' }}
                </span>
            </label>
        </div>

        <!-- Selected count -->
        <p class="text-[11px] text-gray-500">
            {{ selectedIds.length }} selected
        </p>

        <!-- Actions -->
        <div class="flex flex-wrap gap-2 pt-1 border-t border-gray-100">
            <button (click)="bulk('true')"
                class="px-3 py-1.5 rounded-xl text-[11px] font-semibold bg-green-50 text-green-700 border border-green-100 hover:bg-green-100 transition">
                ✅ Activate
            </button>
            <button (click)="bulk('false')"
                class="px-3 py-1.5 rounded-xl text-[11px] font-semibold bg-yellow-50 text-yellow-700 border border-yellow-100 hover:bg-yellow-100 transition">
                ⏸️ Deactivate
            </button>
            <button (click)="bulk('delete')"
                class="px-3 py-1.5 rounded-xl text-[11px] font-semibold bg-red-50 text-red-600 border border-red-100 hover:bg-red-100 transition">
                🗑️ Delete
            </button>
        </div>

    </ng-container>

</div>
