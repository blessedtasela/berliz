<div class="mt-6 bg-gray-50 border border-gray-200 rounded-2xl p-4">
    <div class="flex items-center justify-between mb-3">
        <h3 class="text-sm font-semibold text-gray-800">Bulk actions</h3>
        <button class="text-xs px-2 py-1 rounded-md border border-gray-300 text-gray-700 hover:bg-gray-100"
            (click)="toggleBulkMode()">
            {{ bulkMode ? 'Cancel' : 'Enable bulk mode' }}
        </button>
    </div>

    <div *ngIf="bulkMode" class="space-y-3">
        <div class="flex items-center gap-2">
            <input type="checkbox" class="w-4 h-4" (change)="toggleSelectAll($any($event.target).checked)" />
            <span class="text-xs text-gray-700">Select all</span>
        </div>

        <div class="flex flex-wrap gap-2 text-xs">
            <button class="px-3 py-1 rounded-md bg-red-600 text-white hover:bg-red-700" (click)="bulk('delete')">
                Delete selected
            </button>
            <button class="px-3 py-1 rounded-md bg-green-600 text-white hover:bg-green-700" (click)="bulk('true')">
                Activate selected
            </button>
            <button class="px-3 py-1 rounded-md bg-yellow-500 text-white hover:bg-yellow-600" (click)="bulk('false')">
                Deactivate selected
            </button>
        </div>

        <div class="mt-3 text-xs text-gray-600">
            Selected: {{ selectedIds.length }}
        </div>
    </div>

    <div *ngIf="!bulkMode" class="text-xs text-gray-500">
        Enable bulk mode to manage multiple subscriptions at once.
    </div>
</div>
