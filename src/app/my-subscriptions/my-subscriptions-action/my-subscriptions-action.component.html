<div class="relative overflow-visible">

    <button (click)="toggle(); $event.stopPropagation()"
        class="w-7 h-7 rounded-lg border border-gray-200 hover:bg-gray-100 flex items-center justify-center transition">
        <i-feather name="more-horizontal" style="width:14px;height:14px;" class="text-gray-500"></i-feather>
    </button>

    <div *ngIf="open" (click)="$event.stopPropagation()"
        class="absolute right-0 top-full mt-1.5 w-44 bg-white border border-gray-200 rounded-xl shadow-2xl z-[100] text-sm py-1">

        <button
            class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 transition"
            (click)="viewDetails()">
            <i-feather name="eye" style="width:13px;height:13px;" class="text-gray-400"></i-feather>
            View details
        </button>

        <button
            class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 transition"
            (click)="renew()">
            <i-feather name="refresh-cw" style="width:13px;height:13px;" class="text-gray-400"></i-feather>
            Renew
        </button>

        <div class="border-t border-gray-100 my-1"></div>

        <button
            class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 transition"
            (click)="delete()">
            <i-feather name="trash-2" style="width:13px;height:13px;"></i-feather>
            Delete
        </button>

    </div>

</div>
