<div class="relative">
    <button (click)="toggle()" class="p-1.5 rounded-full hover:bg-gray-100 text-gray-700">
        <i-feather name="more-horizontal" class="w-4 h-4"></i-feather>
    </button>

    <div *ngIf="open" class="absolute right-0 mt-2 bg-white border border-gray-200 rounded-md shadow-lg w-40 z-20">
        <button class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50" (click)="viewDetails()">
            View details
        </button>
        <button class="w-full text-left px-3 py-2 text-sm text-red-600 hover:bg-red-50" (click)="delete()">
            Delete
        </button>
        <button class="w-full text-left px-3 py-2 text-sm text-green-600 hover:bg-green-50" (click)="renew()">
            Renew
        </button>
    </div>
</div>
