<!-- Right side, in the message-popup bubble's normal bottom-6 spot. Safe
     because both buttons key off the exact same window.scrollY > 2000
     threshold (see this component's .ts and message-popup.component.ts's
     `raised`) — the instant this button can show, the bubble has already
     risen to bottom-24, vacating bottom-6 for this one. They can never
     occupy the same spot at the same time. -->
<button type="button" (click)="scrollToTop()" *ngIf="showScroll" aria-label="Scroll to top"
    class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-red-600 text-white shadow-xl flex items-center justify-center hover:bg-red-700 transition">
    <i-feather name="chevron-up" style="width:22px;height:22px;"></i-feather>
</button>
