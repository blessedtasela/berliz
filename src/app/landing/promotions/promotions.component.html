<!-- ═══════════════════════════════════════════════
     PROMOTION CARD
════════════════════════════════════════════════ -->
<div class="h-full flex flex-col bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden
            hover:border-red-600/40 hover:-translate-y-1 hover:shadow-[0_8px_32px_rgba(220,38,38,0.12)]
            transition-all duration-300 font-sans">

    <!-- Photo -->
    <div class="relative w-full h-52 bg-zinc-800 overflow-hidden">
        <img [src]="promotions.imageUrl" [alt]="promotions.title" class="w-full h-full object-cover" />
        <div class="absolute bottom-0 left-0 right-0 h-16 bg-gradient-to-t from-zinc-900 to-transparent"></div>
    </div>

    <!-- Body -->
    <div class="flex flex-col gap-3 p-5 flex-1">

        <!-- Eyebrow -->
        <span class="text-[10px] font-bold tracking-[0.2em] uppercase text-red-400">
            {{ promotions.subTitle }}
        </span>

        <!-- Title -->
        <h3 class="text-sm font-extrabold text-white uppercase tracking-tight leading-tight">
            {{ promotions.title }}
        </h3>

        <!-- Description -->
        <p class="text-xs text-zinc-400 leading-relaxed line-clamp-3">
            {{ promotions.description }}
        </p>

        <!-- Divider -->
        <div class="border-t border-zinc-800 mt-auto"></div>

        <!-- CTA -->
        <div class="flex justify-end">
            <a [routerLink]="[promotions.buttonUrl]" class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-xs font-semibold
                      hover:bg-red-700 active:scale-[0.98] transition">
                {{ promotions.button }}
            </a>
        </div>
    </div>
</div>
