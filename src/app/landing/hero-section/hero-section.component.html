<!-- ═══════════════════════════════════════════════
     LANDING HERO — cinematic rotating banner
════════════════════════════════════════════════ -->
<section class="relative w-full min-h-screen lg:h-screen overflow-hidden bg-black font-sans">

    <!-- Cinematic fire background -->
    <div class="absolute inset-0 z-0">
        <video autoplay muted loop playsinline
            class="w-full h-full object-cover opacity-20 mix-blend-screen pointer-events-none">
            <source src="assets/fire-loop.webm" type="video/webm" />
            <source src="assets/fire-loop.mp4" type="video/mp4" />
            <img src="assets/fire-fallback.jpg" alt="Cinematic fire background" class="w-full h-full object-cover" />
        </video>
    </div>

    <!-- Dark gradient overlay -->
    <div class="absolute inset-0 z-10"
        style="background: linear-gradient(135deg, rgba(0,0,0,0.88) 0%, rgba(80,0,0,0.45) 60%, rgba(0,0,0,0.85) 100%);">
    </div>

    <!-- Hero content -->
    <div class="relative z-20 max-w-6xl mx-auto h-full px-4 sm:px-6 py-24 lg:py-0
                grid lg:grid-cols-2 gap-10 items-center" *ngFor="let h of heroes; let i = index"
        [class.hidden]="i !== heroIndex">

        <!-- ── Left: copy + CTA ─────────────────────────────────────── -->
        <div class="flex flex-col gap-5 text-center lg:text-left">

            <!-- Eyebrow -->
            <span class="text-[11px] font-bold tracking-[0.2em] uppercase text-red-400">
                Train with purpose
            </span>

            <!-- Title -->
            <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-white leading-tight">
                {{ h.title }} <span class="text-red-500">Berliz</span>
            </h1>

            <!-- Red rule accent -->
            <div class="w-12 h-0.5 bg-red-600 rounded-full mx-auto lg:mx-0"></div>

            <!-- Sub -->
            <p class="text-sm sm:text-base text-zinc-300 max-w-xl leading-relaxed mx-auto lg:mx-0">
                We don't just train bodies — we ignite mindsets. Find a gym, book a certified coach, and turn
                discipline into a habit that sticks.
            </p>

            <!-- CTAs -->
            <div class="flex flex-wrap gap-3 justify-center lg:justify-start mt-1">
                <a [routerLink]="['/login']" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-red-600 text-white text-xs font-semibold
                          shadow-[0_2px_10px_rgba(220,38,38,0.35)]
                          hover:bg-red-700 hover:shadow-[0_4px_16px_rgba(220,38,38,0.5)]
                          active:scale-[0.98] transition">
                    <i-feather name="zap" style="width:13px;height:13px;"></i-feather>
                    Join Us Today
                </a>

                <a [routerLink]="['/centers']" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl border border-zinc-700 text-zinc-300
                          text-xs font-semibold hover:border-red-600 hover:text-white transition">
                    <i-feather name="map-pin" style="width:13px;height:13px;"></i-feather>
                    Browse Centers
                </a>
            </div>

            <!-- Stats -->
            <div class="flex flex-wrap gap-3 justify-center lg:justify-start pt-4">
                <div *ngFor="let s of stats" class="flex items-center gap-2.5 px-4 py-2.5 rounded-xl
                            bg-zinc-900/70 border border-zinc-800 backdrop-blur-sm
                            hover:border-red-600/40 transition">
                    <i-feather [name]="s.iconUrl" class="text-red-500 shrink-0" style="width:15px;height:15px;">
                    </i-feather>
                    <div class="flex flex-col items-start leading-none">
                        <span class="text-base font-extrabold text-white">+{{ s.counterValue }}</span>
                        <span class="text-[10px] font-semibold text-zinc-500 uppercase tracking-wide mt-0.5">
                            {{ s.name }}
                        </span>
                    </div>
                </div>
            </div>

            <!-- Slide controls -->
            <div class="flex items-center gap-3 justify-center lg:justify-start pt-2">
                <button type="button" (click)="changeHero(-1)" aria-label="Previous slide" class="w-9 h-9 rounded-xl border border-zinc-700 flex items-center justify-center
                           text-zinc-300 hover:bg-red-600 hover:border-red-600 hover:text-white transition">
                    <i-feather name="chevron-left" style="width:15px;height:15px;"></i-feather>
                </button>

                <button type="button" (click)="changeHero(1)" aria-label="Next slide" class="w-9 h-9 rounded-xl border border-zinc-700 flex items-center justify-center
                           text-zinc-300 hover:bg-red-600 hover:border-red-600 hover:text-white transition">
                    <i-feather name="chevron-right" style="width:15px;height:15px;"></i-feather>
                </button>

                <!-- Dots -->
                <div class="flex items-center gap-1.5 ml-2">
                    <span *ngFor="let dot of heroes; let d = index" class="h-1.5 rounded-full transition-all duration-300"
                        [ngClass]="d === heroIndex ? 'w-5 bg-red-600' : 'w-1.5 bg-zinc-700'"></span>
                </div>
            </div>
        </div>

        <!-- ── Right: image ─────────────────────────────────────────── -->
        <div class="relative rounded-2xl overflow-hidden border border-zinc-800 group
                    shadow-[0_8px_40px_rgba(0,0,0,0.6)]">
            <img [src]="h.image" alt="Berliz training"
                class="w-full h-[300px] lg:h-[440px] object-cover transition-transform duration-500 group-hover:scale-105" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent pointer-events-none"></div>
        </div>

    </div>
</section>
