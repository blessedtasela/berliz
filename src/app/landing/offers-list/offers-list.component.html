<!-- ═══════════════════════════════════════════════
     LANDING — WHAT BERLIZ OFFERS
════════════════════════════════════════════════ -->
<section class="w-full bg-zinc-950 px-4 py-20 font-sans">
    <div class="max-w-6xl mx-auto">

        <!-- Section header -->
        <div class="flex flex-col items-center text-center gap-3 mb-12">
            <span class="text-[11px] font-bold tracking-[0.2em] uppercase text-red-400">
                What we do
            </span>
            <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white leading-tight">
                Discover What <span class="text-red-500">Berliz</span> Offers
            </h2>
            <p class="text-sm text-zinc-400 max-w-md leading-relaxed">
                Elite fitness services designed to build discipline, strength and consistency.
            </p>
            <div class="w-12 h-0.5 bg-red-600 rounded-full mt-1"></div>
        </div>

        <!-- Empty state -->
        <div *ngIf="offersList.length === 0"
            class="flex flex-col items-center justify-center py-16 gap-6 text-center">

            <div class="w-20 h-20 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center">
                <i-feather name="package" class="text-zinc-600" style="width:32px;height:32px;"></i-feather>
            </div>

            <div class="flex flex-col gap-2">
                <h3 class="text-lg font-bold text-white">More offers coming soon</h3>
                <p class="text-sm text-zinc-500 max-w-xs">
                    We're putting together new services. Check back soon.
                </p>
            </div>
        </div>

        <!-- Offer grid -->
        <div *ngIf="offersList.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <app-offers *ngFor="let offer of offersList" [offers]="offer" class="block h-full"></app-offers>
        </div>

    </div>
</section>
