<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-amber-50 border border-amber-100 flex items-center justify-center shrink-0">
                <i-feather name="bookmark" class="text-amber-600" style="width:16px;height:16px;" fill="currentColor"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900">Saved</h1>
                <p class="text-[11px] text-gray-400">Posts and workout templates you've bookmarked</p>
            </div>
        </div>
        <button type="button" (click)="refresh()" [disabled]="loading" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center transition disabled:opacity-40" title="Refresh">
            <i-feather name="refresh-cw" [class.animate-spin]="loading" class="text-gray-500" style="width:15px;height:15px;"></i-feather>
        </button>
    </div>

    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && !posts.length && !workouts.length"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white rounded-2xl border border-gray-200">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="bookmark" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">Nothing saved yet.</p>
        <p class="text-xs text-gray-400">Tap the bookmark on a post or workout to keep it here.</p>
    </div>

    <ng-container *ngIf="!loading">

        <!-- Posts -->
        <div *ngIf="posts.length > 0" class="flex flex-col gap-2">
            <span class="text-[11px] font-bold uppercase tracking-wide text-gray-400">Posts ({{ posts.length }})</span>
            <div *ngFor="let p of posts" class="bg-white rounded-2xl border border-gray-200 p-4 flex items-start gap-3">
                <div class="min-w-0 flex-1">
                    <a [routerLink]="['/dashboard/user', p.authorId]" class="text-xs font-bold text-gray-900 hover:underline">{{ p.authorName }}</a>
                    <p class="text-sm text-gray-600 line-clamp-3 whitespace-pre-line mt-0.5">{{ p.content }}</p>
                </div>
                <button type="button" (click)="remove('POST', p.id, p)" title="Remove from saved"
                    class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-amber-500 hover:text-amber-700 hover:bg-amber-50 transition">
                    <i-feather name="bookmark" style="width:14px;height:14px;" fill="currentColor"></i-feather>
                </button>
            </div>
        </div>

        <!-- Workout templates -->
        <div *ngIf="workouts.length > 0" class="flex flex-col gap-2">
            <span class="text-[11px] font-bold uppercase tracking-wide text-gray-400">Workout templates ({{ workouts.length }})</span>
            <div *ngFor="let w of workouts" class="bg-white rounded-2xl border border-gray-200 p-4 flex items-center gap-3">
                <i-feather name="zap" class="text-orange-500 shrink-0" style="width:16px;height:16px;"></i-feather>
                <span class="text-sm font-bold text-gray-800 truncate flex-1">{{ w.name }}</span>
                <button type="button" (click)="clone(w)" [disabled]="cloningId === w.id"
                    class="shrink-0 px-3 py-1.5 rounded-lg text-xs font-semibold bg-orange-50 text-orange-700 border border-orange-100
                           hover:bg-orange-100 transition disabled:opacity-50 flex items-center gap-1.5">
                    <i-feather [name]="cloningId === w.id ? 'loader' : 'plus'" [class.animate-spin]="cloningId === w.id" style="width:12px;height:12px;"></i-feather>
                    Add to my workouts
                </button>
                <button type="button" (click)="remove('WORKOUT', w.id, w)" title="Remove from saved"
                    class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center text-amber-500 hover:text-amber-700 hover:bg-amber-50 transition">
                    <i-feather name="bookmark" style="width:14px;height:14px;" fill="currentColor"></i-feather>
                </button>
            </div>
        </div>

    </ng-container>

</section>
