<!-- ═══════════════════════════════════════════════
     CENTERS FOR THIS SERVICE (derived)
════════════════════════════════════════════════ -->
<section class="bg-zinc-900 rounded-2xl border border-zinc-800 p-5 flex flex-col gap-4 font-sans">

    <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
            <h2 class="text-sm font-bold text-white flex items-center gap-2">
                <i-feather name="home" style="width:14px;height:14px;" class="text-red-500"></i-feather>
                Centers
                <span class="text-[10px] font-semibold text-zinc-400 bg-zinc-800 px-2 py-0.5 rounded-full">
                    {{ centers.length }}
                </span>
            </h2>
            <p class="text-[11px] text-zinc-500 mt-0.5">
                Training centers offering {{ categoryName || 'this discipline' }}.
            </p>
        </div>

        <a routerLink="/centers"
            class="shrink-0 text-[11px] text-zinc-400 hover:text-red-400 transition flex items-center gap-1.5">
            All centers
            <i-feather name="arrow-right" style="width:12px;height:12px;"></i-feather>
        </a>
    </div>

    <div class="border-t border-zinc-800"></div>

    <!-- Empty -->
    <div *ngIf="centers.length === 0" class="flex flex-col items-center justify-center gap-3 py-10 text-center">
        <div class="w-14 h-14 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center">
            <i-feather name="map-pin" class="text-zinc-600" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-xs text-zinc-500 max-w-xs">
            No centers offer this service yet.
        </p>
    </div>

    <!-- Grid -->
    <div *ngIf="centers.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

        <div *ngFor="let center of centers" class="flex flex-col bg-zinc-950 rounded-xl border border-zinc-800 overflow-hidden
                    hover:border-red-600/40 transition-all duration-300">

            <div class="relative w-full h-40 bg-zinc-800 overflow-hidden">
                <img [src]="center.photoUrl | strapiUrl" [alt]="center.name" class="w-full h-full object-cover"
                    (error)="onImageError($event)" />
                <div class="absolute bottom-0 left-0 right-0 h-12 bg-gradient-to-t from-zinc-950 to-transparent"></div>
            </div>

            <div class="flex flex-col gap-2 p-4 flex-1">

                <div class="flex items-start justify-between gap-2">
                    <h3 class="text-xs font-extrabold text-white uppercase tracking-tight leading-tight truncate">
                        {{ center.name }}
                    </h3>
                    <span *ngIf="center.experience" class="shrink-0 text-[10px] font-semibold text-red-400 bg-red-950 border border-red-900
                                 px-2 py-0.5 rounded-full">
                        {{ center.experience }}+ yrs
                    </span>
                </div>

                <p *ngIf="center.motto" class="text-[11px] text-zinc-400 italic leading-relaxed line-clamp-2">
                    "{{ center.motto }}"
                </p>

                <a *ngIf="center.address" [href]="mapsUrl(center.address)" target="_blank" rel="noopener"
                    class="text-[11px] text-zinc-500 hover:text-red-400 flex items-center gap-1.5 transition w-fit">
                    <i-feather name="map-pin" style="width:11px;height:11px;" class="text-zinc-600"></i-feather>
                    <span class="truncate">{{ center.address }}</span>
                </a>

                <div class="border-t border-zinc-800 mt-auto"></div>

                <div class="flex items-center justify-between">
                    <span class="flex items-center gap-1.5 text-[11px] text-zinc-500">
                        <i-feather name="heart" style="width:11px;height:11px;"></i-feather>
                        {{ center.likes || 0 }}
                    </span>

                    <a [routerLink]="['/centers', center.id, formatUrl(center.name)]" class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-[11px] font-semibold
                              hover:bg-red-700 active:scale-[0.98] transition">
                        View center
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
