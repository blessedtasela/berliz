<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-amber-50 border border-amber-100 flex items-center justify-center shrink-0">
                <i-feather name="message-square" class="text-amber-600" style="width:16px;height:16px;"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900">My testimonials</h1>
                <p class="text-[11px] text-gray-400">What you've shared about Berliz, your trainers or centers</p>
            </div>
        </div>

        <button *ngIf="!loading" type="button" (click)="writeAnother()"
            class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 rounded-lg px-3 py-2 transition shrink-0">
            Write a testimonial
        </button>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && testimonials.length === 0"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white rounded-2xl border border-gray-200">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="message-square" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">You haven't shared a testimonial yet.</p>
        <button type="button" (click)="writeAnother()"
            class="text-xs font-semibold text-amber-600 hover:text-amber-700 transition">Write your first testimonial</button>
    </div>

    <!-- List -->
    <div *ngIf="!loading && testimonials.length > 0" class="flex flex-col gap-3">
        <div *ngFor="let t of testimonials" class="bg-white rounded-2xl border border-gray-200 p-4 flex flex-col gap-3">

            <div class="flex items-center justify-between gap-3">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="text-sm font-semibold text-gray-900 truncate">{{ targetLabel(t) }}</span>
                </div>
                <span class="text-[10px] font-semibold uppercase tracking-wide rounded-full px-2 py-1 shrink-0"
                    [ngClass]="isPending(t) ? 'bg-amber-50 text-amber-700 border border-amber-100' : 'bg-emerald-50 text-emerald-700 border border-emerald-100'">
                    {{ isPending(t) ? 'Pending review' : 'Approved' }}
                </span>
            </div>

            <!-- Read mode -->
            <p *ngIf="editingId !== t.id" class="text-sm text-gray-600 leading-relaxed">{{ t.testimonial }}</p>

            <!-- Edit mode -->
            <div *ngIf="editingId === t.id" class="flex flex-col gap-2">
                <textarea [(ngModel)]="editText" rows="4" maxlength="1000"
                    class="text-sm text-gray-700 border border-gray-200 rounded-lg p-2 resize-none focus:outline-none focus:ring-1 focus:ring-amber-400"></textarea>
                <div class="flex items-center gap-2 justify-end">
                    <button type="button" (click)="cancelEdit()" [disabled]="saving"
                        class="text-xs font-semibold text-gray-500 hover:text-gray-700 transition px-2 py-1">Cancel</button>
                    <button type="button" (click)="saveEdit(t)" [disabled]="saving || !editText.trim()"
                        class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 disabled:opacity-40 rounded-lg px-3 py-1.5 transition">
                        {{ saving ? 'Saving...' : 'Save' }}
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between text-[11px] text-gray-400">
                <span>Submitted {{ t.date | date:'mediumDate' }}</span>
                <button *ngIf="isPending(t) && editingId !== t.id" type="button" (click)="startEdit(t)"
                    class="text-xs font-semibold text-gray-500 hover:text-gray-800 transition">Edit</button>
            </div>

        </div>
    </div>

</section>
