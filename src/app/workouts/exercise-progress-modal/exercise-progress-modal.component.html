<div class="bg-white rounded-2xl font-sans flex flex-col overflow-hidden max-h-[80vh] w-[440px] max-w-[95vw]">

  <!-- ═══════════════════ HEADER ═══════════════════ -->
  <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-gray-100 shrink-0">
    <div class="min-w-0">
      <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
        <i-feather name="trending-up" style="width:13px;height:13px;" class="text-red-600"></i-feather>
        Progress
      </h2>
      <p class="text-[11px] text-gray-400 mt-0.5 truncate">{{ data.exerciseName }}</p>
    </div>
    <button type="button" (click)="close()"
      class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 shrink-0">
      <i-feather name="x" style="width:14px;height:14px;"></i-feather>
    </button>
  </div>

  <div class="flex flex-col gap-2 p-5 overflow-y-auto">

    <div *ngIf="loading" class="flex items-center justify-center py-10">
      <i-feather name="loader" class="text-gray-300 animate-spin" style="width:18px;height:18px;"></i-feather>
    </div>

    <!-- Trend chart -- oldest to newest, left to right, so it reads as "over time" the same direction as the list below reads newest-first. -->
    <svg *ngIf="!loading && hasChart" [attr.viewBox]="chartViewBox" class="w-full h-24 mb-1">
      <path [attr.d]="chartLinePath" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle *ngFor="let c of chartCoords; trackBy: trackByIndex" [attr.cx]="c.x" [attr.cy]="c.y"
        [attr.r]="c.isRecord ? 4 : 2.5" [attr.fill]="c.isRecord ? '#dc2626' : '#fca5a5'" />
    </svg>
    <p *ngIf="!loading && hasChart" class="text-[10px] text-gray-400 text-center -mt-2 mb-1">Weight over time — darker dot is your all-time best</p>

    <div *ngIf="!loading && displayPoints.length === 0"
      class="flex flex-col items-center gap-2 py-8 text-center">
      <div class="w-12 h-12 rounded-full bg-gray-100 flex items-center justify-center">
        <i-feather name="trending-up" style="width:18px;height:18px;" class="text-gray-400"></i-feather>
      </div>
      <p class="text-xs font-semibold text-gray-500">No history yet for this exercise</p>
      <p class="text-[11px] text-gray-400 max-w-[240px]">Log a session that includes it and it'll show up here.</p>
    </div>

    <div *ngFor="let point of displayPoints; trackBy: trackByWorkoutLogId"
      class="flex items-start justify-between gap-3 py-2.5 border-b border-gray-100 last:border-0">
      <div class="min-w-0">
        <p class="text-xs font-bold text-gray-900">{{ point.logDate | date:'MMM d, y' }}</p>
        <p class="text-[11px] text-gray-500 mt-0.5">{{ setsSummary(point) || 'No sets recorded' }}</p>
      </div>
      <div class="flex flex-col items-end gap-1 shrink-0">
        <span *ngIf="point.bestWeight != null" class="text-xs font-bold text-gray-900">{{ point.bestWeight }}</span>
        <span *ngIf="deltaLabel(point) as label"
          class="text-[10px] font-semibold px-2 py-0.5 rounded-full border" [ngClass]="deltaClass(point)">
          {{ label }}
        </span>
      </div>
    </div>
  </div>
</div>
