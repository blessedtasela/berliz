<div class="max-w-4xl mx-auto p-4 sm:p-6 font-sans">

  <a routerLink="/shop" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition mb-4">
    <i-feather name="arrow-left" style="width:12px;height:12px;"></i-feather>
    Back to shop
  </a>

  <div *ngIf="loading" class="grid sm:grid-cols-2 gap-6">
    <div class="aspect-square rounded-2xl bg-gray-100 dark:bg-gray-800 animate-pulse"></div>
    <div class="flex flex-col gap-3">
      <div class="h-5 w-2/3 bg-gray-100 dark:bg-gray-800 rounded animate-pulse"></div>
      <div class="h-4 w-1/3 bg-gray-100 dark:bg-gray-800 rounded animate-pulse"></div>
      <div class="h-20 w-full bg-gray-100 dark:bg-gray-800 rounded animate-pulse"></div>
    </div>
  </div>

  <div *ngIf="!loading && loadError" class="max-w-md mx-auto">
    <app-load-error [compact]="true" title="Couldn't load this listing" [message]="loadError" (retry)="retryLoad()"></app-load-error>
  </div>

  <div *ngIf="!loading && !loadError && product" class="grid sm:grid-cols-2 gap-6 sm:gap-8">

    <div class="aspect-square rounded-2xl bg-gray-50 dark:bg-gray-800 flex items-center justify-center overflow-hidden">
      <img *ngIf="product.photoUrl" [src]="product.photoUrl" class="w-full h-full object-cover" alt="{{ product.name }}" />
      <i-feather *ngIf="!product.photoUrl" name="image" class="text-gray-300 dark:text-gray-600" style="width:32px;height:32px;"></i-feather>
    </div>

    <div class="flex flex-col gap-4">
      <div>
        <span class="inline-block text-[10px] font-bold uppercase px-2 py-1 rounded-full mb-2"
          [ngClass]="product.classify === 'new' ? 'bg-green-50 dark:bg-green-950/50 text-green-700 dark:text-green-400' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400'">
          {{ product.classify }}
        </span>
        <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">{{ product.name }}</h1>
        <p *ngIf="store" class="text-xs text-gray-400 dark:text-gray-500 mt-1">Sold by {{ store.name }}</p>
        <p *ngIf="product.brandName" class="text-xs text-gray-400 dark:text-gray-500">Brand: {{ product.brandName }}</p>
      </div>

      <p class="text-2xl font-bold text-gray-900 dark:text-gray-100">{{ product.price | currency }}</p>

      <p *ngIf="product.description" class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">{{ product.description }}</p>

      <p *ngIf="maxQuantity <= 0" class="text-xs font-semibold text-red-600">Out of stock</p>
      <p *ngIf="maxQuantity > 0" class="text-xs text-gray-400 dark:text-gray-500">{{ maxQuantity }} available</p>

      <div *ngIf="maxQuantity > 0" class="flex items-center gap-3">
        <div class="flex items-center border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden">
          <button type="button" (click)="decrement()" class="w-9 h-9 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition">−</button>
          <span class="w-10 text-center text-sm font-semibold text-gray-900 dark:text-gray-100">{{ quantity }}</span>
          <button type="button" (click)="increment()" class="w-9 h-9 flex items-center justify-center text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition">+</button>
        </div>

        <button *ngIf="!added" type="button" (click)="addToCart()"
          class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center justify-center gap-2">
          <i-feather name="shopping-cart" style="width:12px;height:12px;"></i-feather>
          Add to cart
        </button>
        <button *ngIf="added" type="button" (click)="goToCart()"
          class="flex-1 px-4 py-2.5 rounded-xl text-xs font-semibold bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 transition flex items-center justify-center gap-2">
          <i-feather name="check" style="width:12px;height:12px;"></i-feather>
          View cart
        </button>
      </div>
    </div>

  </div>

</div>
