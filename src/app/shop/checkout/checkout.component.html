<div class="max-w-3xl mx-auto p-4 sm:p-6 font-sans">

  <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100 mb-5">Checkout</h1>

  <div class="grid sm:grid-cols-5 gap-6">

    <div class="sm:col-span-3 flex flex-col gap-4">
      <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-5 flex flex-col gap-4">
        <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Shipping details</h2>

        <div class="grid sm:grid-cols-2 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Full name</label>
            <input type="text" [(ngModel)]="form.name"
              class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Email</label>
            <input type="email" [(ngModel)]="form.email"
              class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Phone</label>
          <input type="tel" [(ngModel)]="form.contact"
            class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Street address</label>
          <input type="text" [(ngModel)]="form.address"
            class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
        </div>

        <div class="grid sm:grid-cols-3 gap-3">
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">City</label>
            <input type="text" [(ngModel)]="form.city"
              class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">State / province</label>
            <input type="text" [(ngModel)]="form.state"
              class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
          </div>
          <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Postal code</label>
            <input type="text" inputmode="numeric" [(ngModel)]="form.postalCode"
              class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400">Country</label>
          <input type="text" [(ngModel)]="form.country"
            class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
        </div>
      </div>
    </div>

    <div class="sm:col-span-2 flex flex-col gap-4">
      <div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 p-5 flex flex-col gap-3">
        <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Order summary</h2>

        <div *ngFor="let line of lines" class="flex items-center justify-between gap-2">
          <p class="text-xs text-gray-600 dark:text-gray-300 truncate">{{ line.product.name }} &times; {{ line.quantity }}</p>
          <p class="text-xs font-semibold text-gray-900 dark:text-gray-100 shrink-0">{{ line.product.price * line.quantity | currency }}</p>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800 pt-3 flex items-center justify-between">
          <p class="text-sm font-bold text-gray-900 dark:text-gray-100">Total</p>
          <p class="text-lg font-bold text-gray-900 dark:text-gray-100">{{ total | currency }}</p>
        </div>

        <p class="text-[10px] text-gray-400 dark:text-gray-500">You'll enter your card details on the next, secure step.</p>

        <button type="button" (click)="submit()" [disabled]="!isValid || submitting"
          class="w-full px-4 py-2.5 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition
                 flex items-center justify-center gap-2 disabled:opacity-50">
          <i-feather [name]="submitting ? 'loader' : 'credit-card'" [ngClass]="{'animate-spin': submitting}" style="width:12px;height:12px;"></i-feather>
          {{ submitting ? 'Placing order…' : 'Continue to payment' }}
        </button>
      </div>
    </div>

  </div>

</div>
