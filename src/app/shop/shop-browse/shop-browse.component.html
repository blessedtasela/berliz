<div class="max-w-6xl mx-auto p-4 sm:p-6 flex flex-col gap-5 font-sans">

  <div class="flex items-center justify-between flex-wrap gap-3">
    <div>
      <h1 class="text-xl font-bold text-gray-900 dark:text-gray-100">Shop</h1>
      <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">New and used fitness gear from the Berliz community</p>
    </div>
    <div class="flex items-center gap-2">
      <a routerLink="/shop/sell"
        class="px-3 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
        Sell on Berliz
      </a>
      <a routerLink="/shop/cart" class="relative w-10 h-10 rounded-xl border border-gray-200 dark:border-gray-700 flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-800 transition">
        <i-feather name="shopping-cart" class="text-gray-600 dark:text-gray-300" style="width:16px;height:16px;"></i-feather>
        <span *ngIf="cartCount > 0" class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-red-600 text-white text-[10px] font-bold flex items-center justify-center">
          {{ cartCount }}
        </span>
      </a>
    </div>
  </div>

  <div class="flex gap-2">
    <button type="button" (click)="setFilter('all')"
      class="px-3 py-1.5 rounded-full text-xs font-semibold border transition"
      [ngClass]="filter === 'all' ? 'bg-red-600 border-red-600 text-white' : 'bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400'">
      All
    </button>
    <button type="button" (click)="setFilter('new')"
      class="px-3 py-1.5 rounded-full text-xs font-semibold border transition"
      [ngClass]="filter === 'new' ? 'bg-red-600 border-red-600 text-white' : 'bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400'">
      New
    </button>
    <button type="button" (click)="setFilter('used')"
      class="px-3 py-1.5 rounded-full text-xs font-semibold border transition"
      [ngClass]="filter === 'used' ? 'bg-red-600 border-red-600 text-white' : 'bg-white dark:bg-gray-900 border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400'">
      Used
    </button>
  </div>

  <div *ngIf="loading" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    <div *ngFor="let i of [1,2,3,4,5,6,7,8]" class="rounded-2xl border border-gray-100 dark:border-gray-800 overflow-hidden">
      <div class="aspect-square bg-gray-100 dark:bg-gray-800 animate-pulse"></div>
      <div class="p-3 flex flex-col gap-2">
        <div class="h-3 w-3/4 bg-gray-100 dark:bg-gray-800 rounded animate-pulse"></div>
        <div class="h-3 w-1/3 bg-gray-100 dark:bg-gray-800 rounded animate-pulse"></div>
      </div>
    </div>
  </div>

  <div *ngIf="!loading && loadError" class="max-w-md mx-auto w-full">
    <app-load-error [compact]="true" title="Couldn't load the shop" [message]="loadError" (retry)="retryLoad()"></app-load-error>
  </div>

  <div *ngIf="!loading && !loadError && products.length === 0" class="rounded-2xl border border-dashed border-gray-200 dark:border-gray-700 p-12 text-center">
    <i-feather name="shopping-bag" class="text-gray-300 dark:text-gray-600 mx-auto" style="width:28px;height:28px;"></i-feather>
    <p class="text-sm text-gray-400 dark:text-gray-500 mt-3">Nothing listed here yet.</p>
  </div>

  <div *ngIf="!loading && !loadError && products.length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
    <a *ngFor="let product of products" [routerLink]="['/shop', product.id]"
      class="rounded-2xl border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 overflow-hidden hover:shadow-md transition group">
      <div class="aspect-square bg-gray-50 dark:bg-gray-800 flex items-center justify-center overflow-hidden relative">
        <img *ngIf="product.photoUrl" [src]="product.photoUrl" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="{{ product.name }}" />
        <i-feather *ngIf="!product.photoUrl" name="image" class="text-gray-300 dark:text-gray-600" style="width:24px;height:24px;"></i-feather>
        <span class="absolute top-2 left-2 text-[9px] font-bold uppercase px-1.5 py-0.5 rounded-full"
          [ngClass]="product.classify === 'new' ? 'bg-green-50 dark:bg-green-950/50 text-green-700 dark:text-green-400' : 'bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-400'">
          {{ product.classify }}
        </span>
      </div>
      <div class="p-3 flex flex-col gap-0.5">
        <p class="text-xs font-semibold text-gray-900 dark:text-gray-100 truncate">{{ product.name }}</p>
        <p class="text-[11px] text-gray-400 dark:text-gray-500 truncate">{{ product.storeName }}</p>
        <p class="text-sm font-bold text-gray-900 dark:text-gray-100 mt-1">{{ product.price | currency }}</p>
      </div>
    </a>
  </div>

</div>
