<div class="flex flex-col font-sans max-h-[90vh]">

  <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 dark:border-gray-800 shrink-0">
    <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">{{ isEdit ? 'Edit listing' : 'List an item' }}</h2>
    <button type="button" (click)="close()" class="w-8 h-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition">
      <i-feather name="x" class="text-gray-400" style="width:16px;height:16px;"></i-feather>
    </button>
  </div>

  <div class="px-5 py-4 flex flex-col gap-4 overflow-y-auto">

    <div class="flex items-center gap-3">
      <div class="w-16 h-16 rounded-xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center overflow-hidden shrink-0">
        <img *ngIf="form.photo" [src]="form.photo" class="w-full h-full object-cover" alt="Product photo" />
        <i-feather *ngIf="!form.photo" name="image" class="text-gray-300 dark:text-gray-600" style="width:20px;height:20px;"></i-feather>
      </div>
      <label class="px-3 py-1.5 rounded-lg text-[11px] font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 cursor-pointer transition">
        {{ uploadingPhoto ? 'Uploading…' : 'Upload photo' }}
        <input type="file" accept="image/*" class="hidden" [disabled]="uploadingPhoto" (change)="onPhotoSelected($event)" />
      </label>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Name</label>
      <input type="text" [(ngModel)]="form.name" maxlength="150" placeholder="e.g. Adjustable dumbbell set"
        class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Description (optional)</label>
      <textarea [(ngModel)]="form.description" rows="3" maxlength="2000" placeholder="Condition, specs, why you're selling it"
        class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition resize-none"></textarea>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Condition</label>
      <div class="flex gap-2">
        <button type="button" (click)="setClassify('new')"
          class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition"
          [ngClass]="form.classify === 'new'
            ? 'bg-red-600 border-red-600 text-white'
            : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400'">
          New
        </button>
        <button type="button" (click)="setClassify('used')"
          class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition"
          [ngClass]="form.classify === 'used'
            ? 'bg-red-600 border-red-600 text-white'
            : 'bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-500 dark:text-gray-400'">
          Used
        </button>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Price</label>
        <input type="number" min="0.01" step="0.01" [(ngModel)]="form.price" placeholder="0.00"
          class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Quantity</label>
        <input type="number" min="0" step="1" [(ngModel)]="form.quantity" placeholder="1"
          class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
      </div>
    </div>

    <div class="flex flex-col gap-1.5">
      <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Brand (optional)</label>
      <input type="text" [(ngModel)]="form.brandName" maxlength="100" placeholder="Leave blank for Unbranded"
        class="px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
    </div>

  </div>

  <div class="flex justify-end gap-2 px-5 py-4 border-t border-gray-100 dark:border-gray-800 shrink-0">
    <button type="button" (click)="close()"
      class="px-4 py-2 rounded-xl text-xs font-semibold text-gray-500 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
      Cancel
    </button>
    <button type="button" (click)="save()" [disabled]="!isValid || saving"
      class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition
             flex items-center gap-2 disabled:opacity-50">
      <i-feather [name]="saving ? 'loader' : 'check'" [ngClass]="{'animate-spin': saving}" style="width:12px;height:12px;"></i-feather>
      {{ saving ? 'Saving…' : (isEdit ? 'Save changes' : 'List item') }}
    </button>
  </div>

</div>
