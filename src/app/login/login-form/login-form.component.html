<!-- ═══════════════════════════════════════════════
     LOGIN FORM
════════════════════════════════════════════════ -->
<section class="w-full max-w-md flex flex-col gap-6 font-sans">

    <!-- Title -->
    <header class="text-center">
        <h2 class="text-lg font-bold text-gray-900">Login to Continue</h2>
        <p class="text-xs text-red-500 italic mt-0.5">Enter your details below</p>
    </header>

    <!-- Reactive Form -->
    <form [formGroup]="loginForm" class="flex flex-col gap-4">

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
                Email
            </label>
            <input formControlName="email" type="email" placeholder="you@example.com" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="loginForm.get('email')?.invalid && loginForm.get('email')?.dirty
                    ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
            <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter a valid email address
            </p>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
                Password
            </label>
            <input formControlName="password" type="password" placeholder="••••••••" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="loginForm.get('password')?.invalid && loginForm.get('password')?.dirty
                    ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
            <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Password must be at least 8 characters
            </p>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="loginForm.invalid" (click)="login()"
            [ngClass]="{ 'opacity-50 cursor-not-allowed': loginForm.invalid }" class="w-full py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold
                   hover:bg-red-700 active:scale-[0.98] transition flex items-center justify-center gap-2">
            <i-feather name="arrow-right" style="width:14px;height:14px;"></i-feather>
            Login
        </button>

        <!-- Forgot / Signup -->
        <div class="flex justify-between items-center text-xs font-semibold">
            <button type="button" (click)="openForgotPassword()" class="text-gray-500 hover:text-gray-800 transition">
                Forgot password?
            </button>
            <a [routerLink]="['/sign-up']" class="text-red-600 hover:text-red-700 transition">
                Sign up
            </a>
        </div>

        <!-- Social Logins -->
        <div class="pt-4 border-t border-gray-200 flex flex-col items-center gap-3">
            <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Or sign in with</p>

            <div class="flex justify-center gap-3">
                <!-- Google's official button must stay the real click target (required for the
                     Sign-In flow to actually fire) but its own rendered appearance can't be
                     styled to match Facebook's button exactly — so it's rendered invisible
                     (opacity-0) on top, with a pixel-matched decorative button underneath. The
                     wrapper's `group` + `group-hover` is what lets that decorative button pick up
                     hover styling even though it's not the element actually being hovered. -->
                <div class="group relative w-11 h-11">
                    <div *ngIf="googleReady" aria-hidden="true"
                        class="absolute inset-0 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center
                               pointer-events-none transition group-hover:border-red-500 group-hover:bg-white">
                        <img src="assets/icons/google.png" alt="" class="h-5 w-5" />
                    </div>
                    <div id="googleSignInButton"
                        class="absolute inset-0 overflow-hidden rounded-xl opacity-0"
                        [class.hidden]="!googleReady"></div>
                    <button *ngIf="!googleReady" type="button" (click)="loginWithGoogleFallback()"
                        aria-label="Sign in with Google" class="w-11 h-11 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center
                               hover:border-red-500 hover:bg-white transition">
                        <img src="assets/icons/google.png" alt="Google" class="h-5 w-5" />
                    </button>
                </div>

                <button type="button" (click)="loginWithFacebook()" aria-label="Sign in with Facebook" class="w-11 h-11 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center
                           hover:border-red-500 hover:bg-white transition">
                    <img src="assets/icons/facebook.png" alt="Facebook" class="h-5 w-5" />
                </button>
            </div>
        </div>
    </form>

    <!-- Activation Email Resend -->
    <div class="pt-4 border-t border-gray-200 flex flex-col gap-2">
        <p class="text-xs font-semibold text-gray-600 text-center">
            Didn't receive your activation email?
        </p>

        <form #activationForm="ngForm" (ngSubmit)="sendActivationMail(activationEmail.value)"
            class="flex flex-col gap-2">

            <div class="flex items-stretch gap-2">
                <input name="activationEmail" ngModel #activationEmail="ngModel" type="email" required email
                    placeholder="Enter your email" class="flex-1 px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900
                           placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500
                           focus:border-transparent transition" />

                <button type="submit" [disabled]="activationForm.invalid" class="px-4 py-2.5 rounded-xl bg-red-600 text-white text-xs font-semibold shrink-0
                           hover:bg-red-700 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Send
                </button>
            </div>

            <!-- Validation Errors -->
            <ng-container *ngIf="activationEmail.invalid && (activationEmail.dirty || activationEmail.touched)">
                <p *ngIf="activationEmail.errors?.['required']"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Email is required
                </p>
                <p *ngIf="activationEmail.errors?.['email']" class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Please enter a valid email address
                </p>
            </ng-container>
        </form>
    </div>

</section>
