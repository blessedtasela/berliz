<!-- ═══════════════════════════════════════════════
     LOGIN FORM
     GN-76 (Nov 21, 2026): black/white/red brand redesign.
════════════════════════════════════════════════ -->
<section class="w-full max-w-md flex flex-col gap-6 font-sans">

    <!-- Title -->
    <header class="text-center">
        <h2 class="brand-heading text-2xl">Login<span class="brand-heading-dot">.</span></h2>
        <p class="text-xs text-brand-red mt-1" role="status">{{ gateMessage || 'Enter your details below' }}</p>
    </header>

    <!-- Reactive Form -->
    <form [formGroup]="loginForm" class="flex flex-col gap-4">

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="brand-label">
                Email
            </label>
            <input aria-label="Email" autocomplete="email" formControlName="email" type="email" placeholder="you@example.com" class="brand-input"
                [ngClass]="loginForm.get('email')?.invalid && loginForm.get('email')?.dirty ? 'border-brand-red' : ''" />
            <p *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.dirty"
                class="text-brand-red text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter a valid email address
            </p>
        </div>

        <!-- Password -->
        <div class="flex flex-col gap-1">
            <label class="brand-label">
                Password
            </label>
            <input aria-label="Password" autocomplete="current-password" formControlName="password" type="password" placeholder="••••••••" class="brand-input"
                [ngClass]="loginForm.get('password')?.invalid && loginForm.get('password')?.dirty ? 'border-brand-red' : ''" />
            <p *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.dirty"
                class="text-brand-red text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Password must be at least 8 characters
            </p>
        </div>

        <!-- Login / social / passkey failures stay here until fixed or dismissed -->
        <app-inline-alert [message]="submitError" [kind]="'error'" [dismissible]="true" [dark]="true" (dismissed)="submitError = null"></app-inline-alert>
        <!-- Signed up but not activated: go straight to entering (or resending) the code, not back to a dead end. -->
        <a *ngIf="needsActivation" [routerLink]="['/login/activate-account']" [queryParams]="{ email: email?.value }" data-testid="enter-activation-code"
            class="text-xs font-bold text-brand-red hover:text-white transition">Enter your activation code or get a new one</a>

        <!-- Submit -->
        <button type="submit" [disabled]="loginForm.invalid" (click)="login()"
            [ngClass]="{ 'opacity-50 cursor-not-allowed': loginForm.invalid }" class="brand-btn-primary flex items-center justify-center gap-2">
            Login
            <i-feather name="arrow-right" style="width:14px;height:14px;"></i-feather>
        </button>

        <!-- Forgot / Signup -->
        <div class="flex justify-between items-center text-xs font-bold">
            <button type="button" (click)="openForgotPassword()" class="text-brand-muted hover:text-white transition">
                Forgot password?
            </button>
            <a [routerLink]="['/sign-up']" class="text-brand-red hover:text-white transition">
                Sign up
            </a>
        </div>

        <!-- Social Logins -->
        <div class="pt-4 border-t border-brand-border flex flex-col items-center gap-3">
            <p class="brand-label">Or sign in with</p>

            <div class="flex justify-center gap-3">
                <!-- Google's official button must stay the real click target (required for the
                     Sign-In flow to actually fire) but its own rendered appearance can't be
                     styled to match Facebook's button exactly — so it's rendered invisible
                     (opacity-0) on top, with a pixel-matched decorative button underneath. The
                     wrapper's `group` + `group-hover` is what lets that decorative button pick up
                     hover styling even though it's not the element actually being hovered. -->
                <div class="group relative w-11 h-11">
                    <div *ngIf="googleReady" aria-hidden="true"
                        class="absolute inset-0 rounded-xl border border-brand-border bg-brand-card flex items-center justify-center
                               pointer-events-none transition group-hover:border-brand-red">
                        <img src="assets/icons/google.png" alt="" class="h-5 w-5" />
                    </div>
                    <div id="googleSignInButton"
                        class="absolute inset-0 overflow-hidden rounded-xl opacity-0"
                        [class.hidden]="!googleReady"></div>
                    <button *ngIf="!googleReady" type="button" (click)="loginWithGoogleFallback()"
                        aria-label="Sign in with Google" class="w-11 h-11 rounded-xl border border-brand-border bg-brand-card flex items-center justify-center
                               hover:border-brand-red transition">
                        <img src="assets/icons/google.png" alt="Google" class="h-5 w-5" />
                    </button>
                </div>

                <button type="button" (click)="loginWithFacebook()" aria-label="Sign in with Facebook" class="w-11 h-11 rounded-xl border border-brand-border bg-brand-card flex items-center justify-center
                           hover:border-brand-red transition">
                    <img src="assets/icons/facebook.png" alt="Facebook" class="h-5 w-5" />
                </button>

                <!-- Only shown once this device confirms it actually has Face ID/Touch ID/Windows Hello available. -->
                <button *ngIf="passkeyAvailable" type="button" (click)="loginWithPasskey()" [disabled]="passkeyLoading"
                    aria-label="Sign in with a passkey" title="Sign in with Face ID, Touch ID, or Windows Hello" class="w-11 h-11 rounded-xl border border-brand-border bg-brand-card flex items-center justify-center
                           hover:border-brand-red transition disabled:opacity-60">
                    <i-feather *ngIf="!passkeyLoading" name="key" class="text-brand-muted" style="width:18px;height:18px;"></i-feather>
                    <i-feather *ngIf="passkeyLoading" name="loader" class="text-brand-muted animate-spin" style="width:18px;height:18px;"></i-feather>
                </button>
            </div>
        </div>
    </form>

    <!-- Activation Email Resend -->
    <div class="pt-4 border-t border-brand-border flex flex-col gap-2">
        <p class="text-xs font-bold text-brand-muted text-center">
            Didn't receive your activation email?
        </p>

        <form #activationForm="ngForm" (ngSubmit)="sendActivationMail(activationEmail.value)"
            class="flex flex-col gap-2">

            <div class="flex items-stretch gap-2">
                <input autocomplete="email" name="activationEmail" ngModel #activationEmail="ngModel" type="email" required email
                    placeholder="Enter your email" class="brand-input flex-1" />

                <button type="submit" [disabled]="activationForm.invalid" class="px-4 py-2.5 rounded-xl bg-brand-red text-white text-xs font-extrabold uppercase tracking-wide shrink-0
                           active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
                    Send
                </button>
            </div>

            <!-- Validation Errors -->
            <ng-container *ngIf="activationEmail.invalid && (activationEmail.dirty || activationEmail.touched)">
                <p *ngIf="activationEmail.errors?.['required']"
                    class="text-brand-red text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Email is required
                </p>
                <p *ngIf="activationEmail.errors?.['email']" class="text-brand-red text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Please enter a valid email address
                </p>
            </ng-container>

            <app-inline-alert [message]="activationError" [kind]="'error'" [dismissible]="true" [dark]="true" (dismissed)="activationError = null"></app-inline-alert>
        </form>
    </div>

    <!-- Try before signing up: only renders when the backend has demos switched on -->
    <app-demo-entry theme="dark"></app-demo-entry>

</section>
