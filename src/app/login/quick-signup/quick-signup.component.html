<!-- ═══════════════════════════════════════════════
     QUICK SIGNUP — split hero / form shell
════════════════════════════════════════════════ -->
<div class="relative min-h-screen bg-zinc-950 flex items-center justify-center px-4 py-12 overflow-hidden font-sans">

  <!-- Red glow -->
  <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-red-600/10 blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-red-600/10 blur-3xl pointer-events-none"></div>

  <div class="relative grid md:grid-cols-2 w-full max-w-5xl rounded-2xl overflow-hidden
              border border-zinc-800 shadow-[0_8px_40px_rgba(0,0,0,0.6)] bg-white">

    <!-- Hero Section -->
    <div class="hidden md:block">
      <app-login-hero></app-login-hero>
    </div>

    <!-- Form Section -->
    <div class="flex items-center justify-center p-6 md:p-10">
      <div class="w-full max-w-md flex flex-col gap-6">

        <!-- Header -->
        <header class="text-center">
          <h2 class="text-lg font-bold text-gray-900">Quick signup</h2>
          <p class="text-xs font-semibold text-red-600 mt-0.5">
            Free to join — no credit card required.
          </p>
          <p class="text-xs text-gray-500 italic mt-1">
            Enter your details below — finish your registration later
          </p>
        </header>

        <!-- Quick Signup Form -->
        <form [formGroup]="quickSignupForm" (ngSubmit)="quickSignup()" class="flex flex-col gap-4">

          <!-- Email -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
              Email
            </label>
            <input formControlName="email" type="text" placeholder="you@example.com" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="quickSignupForm.get('email')?.invalid && quickSignupForm.get('email')?.touched
                      ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
            <p *ngIf="quickSignupForm.get('email')?.invalid && quickSignupForm.get('email')?.dirty"
              class="text-red-500 text-[11px] flex items-center gap-1">
              <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
              Invalid email format
            </p>
          </div>

          <!-- Password -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
              Password
            </label>
            <input formControlName="password" type="password" placeholder="••••••••" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="quickSignupForm.get('password')?.invalid && quickSignupForm.get('password')?.touched
                      ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
            <p *ngIf="quickSignupForm.get('password')?.invalid && (quickSignupForm.get('password')?.dirty || quickSignupForm.get('password')?.touched)"
              class="text-red-500 text-[11px] flex items-center gap-1">
              <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
              Password must be at least 8 characters
            </p>
          </div>

          <!-- Confirm Password -->
          <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">
              Confirm password
            </label>
            <input formControlName="confirmPassword" type="password" placeholder="••••••••" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="quickSignupForm.get('confirmPassword')?.invalid && quickSignupForm.get('confirmPassword')?.touched
                      ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
            <p *ngIf="quickSignupForm.hasError('passwordMismatch') && quickSignupForm.get('confirmPassword')?.dirty"
              class="text-red-500 text-[11px] flex items-center gap-1">
              <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
              Passwords do not match
            </p>
          </div>

          <!-- Submit -->
          <button type="submit" [disabled]="quickSignupForm.invalid"
            [ngClass]="{ 'opacity-50 cursor-not-allowed': quickSignupForm.invalid }" class="w-full py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold
                     hover:bg-red-700 active:scale-[0.98] transition flex items-center justify-center gap-2">
            <i-feather name="user-plus" style="width:14px;height:14px;"></i-feather>
            Sign up
          </button>

          <!-- Full registration link -->
          <a [routerLink]="['/sign-up']"
            class="text-center text-xs font-semibold text-red-600 hover:text-red-700 transition">
            Complete your full registration now
          </a>
        </form>

        <!-- Social Signups -->
        <div class="pt-4 border-t border-gray-200 flex flex-col items-center gap-3">
          <p class="text-[11px] text-gray-400 uppercase tracking-wide font-semibold">Or sign up with</p>

          <div class="flex justify-center gap-3">
            <!-- Google Identity Services renders its official button into this div once
                 configured; the plain icon button underneath is the fallback shown until then. -->
            <div class="relative w-11 h-11">
              <div id="googleSignUpButton"
                class="absolute inset-0 flex items-center justify-center overflow-hidden rounded-xl"
                [class.hidden]="!googleReady"></div>
              <button *ngIf="!googleReady" type="button" (click)="loginWithGoogleFallback()"
                aria-label="Sign up with Google" class="w-11 h-11 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center
                       hover:border-red-500 hover:bg-white transition">
                <img src="assets/icons/google.png" alt="Google" class="h-5 w-5" />
              </button>
            </div>

            <button type="button" (click)="loginWithFacebook()" aria-label="Sign up with Facebook" class="w-11 h-11 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center
                       hover:border-red-500 hover:bg-white transition">
              <img src="assets/icons/facebook.png" alt="Facebook" class="h-5 w-5" />
            </button>
          </div>
        </div>

        <!-- Footer note -->
        <div class="pt-4 border-t border-gray-200 text-center">
          <p class="text-xs text-gray-500">
            Already signed up?
            <a [routerLink]="['/login']" class="font-semibold text-red-600 hover:text-red-700 transition">Log in</a>
          </p>
        </div>

      </div>
    </div>

  </div>
</div>
