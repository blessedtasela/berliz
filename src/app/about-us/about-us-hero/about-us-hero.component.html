<!-- ═══════════════════════════════════════════════
     ABOUT US HERO — animated ember/fire banner
     No stock photo (the previous one was an off-brand
     cyberpunk street scene) — a CSS-only fire effect
     that echoes the flame in the Berliz logo instead.
════════════════════════════════════════════════ -->
<section class="relative w-full h-72 sm:h-80 overflow-hidden font-sans bg-hero-fire">

  <!-- Rising embers -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <span class="ember" *ngFor="let e of embers; let i = index" [style.left.%]="e.left"
      [style.animation-duration.s]="e.duration" [style.animation-delay.s]="e.delay"
      [style.width.px]="e.size" [style.height.px]="e.size" [style.opacity]="e.opacity"></span>
  </div>

  <!-- Bottom ember glow -->
  <div class="absolute -bottom-10 left-1/2 -translate-x-1/2 w-[140%] h-40 hero-glow"></div>

  <!-- Dark gradient overlay (keeps text readable over the animation) -->
  <div class="absolute inset-0"
    style="background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 45%, rgba(0,0,0,0.75) 100%);">
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full gap-3 px-4 text-center">

    <!-- Eyebrow -->
    <span class="text-[11px] font-bold tracking-[0.2em] uppercase text-red-400">
      Our Story
    </span>

    <!-- Title -->
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
      About <span class="text-red-500">Berliz</span>
    </h1>

    <!-- Sub -->
    <p class="text-sm text-zinc-300 max-w-md leading-relaxed">
      Connecting people to world-class gyms, certified coaches and a community that shows up.
    </p>

    <!-- Red rule accent -->
    <div class="w-12 h-0.5 bg-red-600 rounded-full mt-1"></div>

  </div>
</section>
