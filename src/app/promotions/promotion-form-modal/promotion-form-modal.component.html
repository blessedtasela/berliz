<div class="font-sans p-5 w-full max-w-md flex flex-col gap-4">

    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-900">{{ isEdit ? 'Edit promotion' : 'New promotion' }}</h2>
        <button type="button" (click)="closeDialog()" class="text-gray-400 hover:text-gray-700 transition">
            <i-feather name="x" style="width:18px;height:18px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Title</label>
            <input type="text" formControlName="title" placeholder="e.g. New member special"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            <p *ngIf="invalidForm && form.get('title')?.invalid" class="text-[11px] text-red-600">A title is required.</p>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Description (optional)</label>
            <textarea formControlName="description" rows="2" placeholder="What's the offer?"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900 resize-none
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Offer type</label>
                <select formControlName="type"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition">
                    <option value="percentage">% off</option>
                    <option value="fixed">$ off</option>
                    <option value="free_session">Free session</option>
                    <option value="custom">Custom</option>
                </select>
            </div>

            <div class="flex flex-col gap-1" *ngIf="needsValue">
                <label class="text-[11px] font-semibold text-gray-500">{{ form.get('type')?.value === 'percentage' ? '% off' : '$ off' }}</label>
                <input type="number" min="0" formControlName="value"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Audience</label>
            <select formControlName="audience"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition">
                <option value="everyone">Everyone</option>
                <option value="new_members">New members only</option>
            </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Starts (optional)</label>
                <input type="date" formControlName="startDate"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Ends (optional)</label>
                <input type="date" formControlName="endDate"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Limit to first N redemptions (optional)</label>
            <input type="number" min="1" formControlName="usageLimit" placeholder="Unlimited"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Private code (optional)</label>
            <input type="text" formControlName="code" placeholder="e.g. ACMECO20"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900 uppercase
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            <p class="text-[11px] text-gray-400">Share this privately -- e.g. with a corporate or gym partner. A coded offer never shows on your public profile or the Deals feed; only someone with the code can redeem it.</p>
        </div>

        <div class="flex items-center justify-end gap-2 mt-2">
            <button type="button" (click)="closeDialog()" [disabled]="saving"
                class="text-xs font-semibold text-gray-500 hover:text-gray-700 transition px-3 py-2">Cancel</button>
            <button type="submit" [disabled]="saving"
                class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 disabled:opacity-40 rounded-lg px-4 py-2 transition">
                {{ saving ? 'Saving...' : (isEdit ? 'Save changes' : 'Create promotion') }}
            </button>
        </div>
    </form>
</div>
