<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-amber-50 border border-amber-100 flex items-center justify-center shrink-0">
            <i-feather name="tag" class="text-amber-600" style="width:16px;height:16px;"></i-feather>
        </div>
        <div>
            <h1 class="text-sm font-bold text-gray-900">Deals</h1>
            <p class="text-[11px] text-gray-400">Live offers from trainers, centers, and Berliz itself</p>
        </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty -->
    <div *ngIf="!loading && deals.length === 0"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white rounded-2xl border border-gray-200">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="tag" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">No live offers right now -- check back soon.</p>
    </div>

    <!-- List -->
    <div *ngIf="!loading && deals.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div *ngFor="let p of deals" class="bg-white rounded-2xl p-4 flex flex-col gap-2"
            [ngClass]="p.featured ? 'border-2 border-amber-300' : 'border border-gray-200'">
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] font-bold uppercase tracking-wide bg-amber-50 text-amber-700 border border-amber-100 rounded-full px-2 py-0.5">
                        {{ label(p) }}
                    </span>
                    <!-- Featured badge -- top paid subscription tier perk (guaranteed Deals-feed placement) -->
                    <span *ngIf="p.featured" class="flex items-center gap-1 text-[10px] font-bold text-amber-950 bg-amber-400 rounded-full px-2 py-0.5">
                        <i-feather name="star" style="width:9px;height:9px;"></i-feather>
                        Featured
                    </span>
                </div>
                <span class="text-[10px] font-semibold text-gray-400 uppercase">{{ p.ownerType === 'platform' ? 'Berliz' : p.ownerType }}</span>
            </div>
            <div>
                <p class="text-sm font-bold text-gray-900">{{ p.title }}</p>
                <p *ngIf="p.description" class="text-xs text-gray-500 mt-1">{{ p.description }}</p>
                <p class="text-[11px] text-gray-400 mt-2">By {{ p.ownerName }}</p>
            </div>
            <a *ngIf="profileLink(p) as link" [routerLink]="link"
                class="mt-1 text-xs font-semibold text-red-600 hover:text-red-700 transition flex items-center gap-1.5">
                View profile
                <i-feather name="arrow-right" style="width:12px;height:12px;"></i-feather>
            </a>
        </div>
    </div>

</section>
