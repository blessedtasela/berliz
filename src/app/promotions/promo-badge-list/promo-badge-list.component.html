<div *ngIf="promotions.length > 0" class="flex flex-col gap-2">
    <div *ngFor="let p of promotions"
        class="rounded-2xl p-4 sm:p-5 flex items-center gap-3 bg-gradient-to-r from-amber-500 to-red-600 text-white shadow-sm">
        <div class="w-9 h-9 rounded-xl bg-white/15 flex items-center justify-center shrink-0">
            <i-feather name="tag" style="width:16px;height:16px;"></i-feather>
        </div>
        <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
                <span class="text-[10px] font-bold uppercase tracking-wide bg-white/20 rounded-full px-2 py-0.5 shrink-0">
                    {{ label(p) }}
                </span>
                <span class="text-sm font-bold truncate">{{ p.title }}</span>
            </div>
            <p *ngIf="p.description" class="text-xs text-white/85 mt-0.5">{{ p.description }}</p>
        </div>
    </div>
</div>
