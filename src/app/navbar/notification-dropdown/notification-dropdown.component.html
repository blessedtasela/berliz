<div class="bg-white shadow-xl rounded-xl border border-gray-200 overflow-hidden dropdown-enter">

    <!-- Header -->
    <div class="flex justify-between items-center px-4 py-3 border-b border-gray-200">
        <h3 class="text-lg font-semibold text-gray-900">Notifications</h3>

        <button (click)="close.emit()" class="text-gray-500 hover:text-gray-700 transition">
            <i-feather name="x" class="w-5 h-5"></i-feather>
        </button>
    </div>

    <!-- List -->
    <div class="max-h-[70vh] overflow-y-auto px-3 py-3 space-y-3 text-sm">

        <div *ngFor="let n of notifications | slice:0:visibleCount" (click)="openNotification(n)"
            class="p-3 rounded-lg cursor-pointer transition-all duration-200 bg-white hover:bg-gray-50 shadow-sm flex items-start gap-3"
            [ngClass]="{ 'bg-red-50 shadow-md': !n.read }">

            <span class="w-2 h-2 rounded-full mt-2" [ngClass]="{ 'bg-red-600': !n.read, 'bg-gray-400': n.read }">
            </span>

            <div class="flex-1">
                <p class="text-gray-900 font-medium line-clamp-3">
                    {{ n.notification }}
                </p>

                <p class="text-gray-500 text-xs mt-1 flex items-center">
                    <i-feather name="calendar" class="w-3 h-3 mr-1"></i-feather>
                    {{ n.date | date:'mediumDate' }}
                </p>
            </div>

        </div>

        <!-- Load more -->
        <button *ngIf="visibleCount < maxVisible" (click)="loadMore()"
            class="w-full text-center text-red-600 font-semibold py-2 hover:underline">
            Load more
        </button>

    </div>

    <!-- Footer -->
    <div class="border-t border-gray-200 px-4 py-3 text-center">
        <a (click)="close.emit(); goToAllNotifications()"
            class="text-red-600 font-semibold hover:underline text-sm cursor-pointer">
            View all notifications →
        </a>
    </div>

</div>
