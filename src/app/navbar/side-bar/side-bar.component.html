<section id="sidebarView" class="font-sans">

    <!-- COLLAPSED SIDEBAR (icon rail) -->
    <div *ngIf="!openMenu" class="fixed top-14 left-0 h-[calc(100vh-3.5rem)] w-14 border-r border-gray-200 bg-gray-950
           flex flex-col items-center py-4 gap-1 z-40 transition-all duration-300">

        <!-- Expand button -->
        <button (click)="toggleSidebar(); stopPropagation($event)"
            class="w-8 h-8 rounded-xl hover:bg-gray-950 flex items-center justify-center transition mb-2">
            <i-feather name="align-justify" style="width:16px;height:16px;" class="text-white"></i-feather>
        </button>

        <div class="w-6 border-t border-gray-200 mb-1"></div>

        <app-side-bar-close [notificationLength]="notificationLength"></app-side-bar-close>

    </div>

    <!-- EXPANDED SIDEBAR -->
    <div *ngIf="openMenu" class="fixed top-14 left-0 h-[calc(100vh-3.5rem)] w-60 bg-gray-950 border-r border-gray-800
         flex flex-col z-40 transition-all duration-300">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
            <span class="text-[11px] font-bold text-white uppercase tracking-wider">Menu</span>
            <button (click)="toggleSidebar(); stopPropagation($event)"
                class="w-7 h-7 rounded-lg hover:bg-gray-950 flex items-center justify-center transition">
                <i-feather name="x" style="width:14px;height:14px;" class="text-white"></i-feather>
            </button>
        </div>

        <!-- Nav -->
        <div class="flex-1 overflow-y-auto py-3">
            <app-side-bar-open></app-side-bar-open>
        </div>

    </div>

    <!-- Mobile overlay -->
    <div *ngIf="openMenu" class="fixed inset-0 bg-black/20 z-30 md:hidden" (click)="closeDropdown()">
    </div>

</section>
