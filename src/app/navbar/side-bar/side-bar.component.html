<section id="sidebarView" class="font-sans">

    <!-- FLOATING REOPEN BUTTON
         Shown whenever there's no persistent/overlay sidebar currently on screen:
         desktop "hidden" mode, or mobile with the overlay closed (covers the mobile
         default for "collapsed"/"hidden" preferences, and a manually-dismissed
         mobile "expanded" overlay too). This button is the only thing rendered in
         those states — the sidebar itself takes zero horizontal layout space. -->
    <button *ngIf="showFloatingButton" type="button" (click)="openSidebar(); stopPropagation($event)"
        aria-label="Show sidebar"
        class="fixed top-[4.25rem] left-3 z-40 w-10 h-10 rounded-xl bg-gray-950 border border-gray-800
               shadow-lg flex items-center justify-center hover:bg-gray-900 transition">
        <i-feather name="align-justify" style="width:16px;height:16px;" class="text-white"></i-feather>
    </button>

    <!-- DESKTOP — COLLAPSED SIDEBAR (icon rail). Visual design unchanged. -->
    <div *ngIf="!isMobile && mode === 'collapsed'" class="fixed top-14 left-0 h-[calc(100vh-3.5rem)] w-14 border-r border-gray-200 bg-gray-950
           flex flex-col items-center py-4 gap-1 z-40 transition-all duration-300">

        <!-- Expand button -->
        <button (click)="setMode('expanded'); stopPropagation($event)"
            class="w-8 h-8 rounded-xl hover:bg-gray-950 flex items-center justify-center transition mb-2">
            <i-feather name="align-justify" style="width:16px;height:16px;" class="text-white"></i-feather>
        </button>

        <div class="w-6 border-t border-gray-200 mb-1"></div>

        <app-side-bar-close [notificationLength]="notificationLength"></app-side-bar-close>

    </div>

    <!-- DESKTOP — EXPANDED SIDEBAR. Visual design unchanged. -->
    <div *ngIf="!isMobile && mode === 'expanded'" class="fixed top-14 left-0 h-[calc(100vh-3.5rem)] w-60 bg-gray-950 border-r border-gray-800
         flex flex-col z-40 transition-all duration-300">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
            <span class="text-[11px] font-bold text-white uppercase tracking-wider">Menu</span>
            <button (click)="setMode('collapsed'); stopPropagation($event)"
                class="w-7 h-7 rounded-lg hover:bg-gray-950 flex items-center justify-center transition">
                <i-feather name="x" style="width:14px;height:14px;" class="text-white"></i-feather>
            </button>
        </div>

        <!-- Nav -->
        <div class="flex-1 overflow-y-auto py-3">
            <app-side-bar-open></app-side-bar-open>
        </div>

    </div>

    <!-- MOBILE — TEMPORARY OVERLAY. Always the full, labelled sidebar (a
         collapsed icon-only rail isn't useful as a dismissible mobile overlay).
         Backdrop click closes it. The centralized close-on-navigate that also
         closes this lives in SidebarStateService, not here. -->
    <ng-container *ngIf="isMobile && mobileOverlayOpen">

        <div class="fixed inset-0 bg-black/20 z-30" (click)="closeMobileOverlay()"></div>

        <div class="fixed top-14 left-0 h-[calc(100vh-3.5rem)] w-60 bg-gray-950 border-r border-gray-800
             flex flex-col z-40 transition-all duration-300">

            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-800">
                <span class="text-[11px] font-bold text-white uppercase tracking-wider">Menu</span>
                <button (click)="closeMobileOverlay(); stopPropagation($event)"
                    class="w-7 h-7 rounded-lg hover:bg-gray-950 flex items-center justify-center transition">
                    <i-feather name="x" style="width:14px;height:14px;" class="text-white"></i-feather>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto py-3">
                <app-side-bar-open></app-side-bar-open>
            </div>

        </div>

    </ng-container>

</section>
