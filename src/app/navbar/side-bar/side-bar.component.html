<section>
    <!-- Sidebar Toggle Button -->
    <div class="w-0 md:w-12">
        <div class="mt-12 left-0 transform duration-300 w-screen ease-in-out fixed transition duration-300 ease-in-out side-z"
            [ngClass]="{'hidden': openMenu, 'w-12': !openMenu}" id="sidebarView">
            <div class="bg-gradient-to-r from-gray-950 via-gray-900 to-gray-950 rounded-b-md flex items-center">
                <!-- Sidebar Toggle Icon -->
                <div class="cursor-pointer ml-2 hover:drop-shadow-2xl transition-all duration-1000 
                    ease-in-out transform hover:scale-105 -mt-3">
                    <i-feather name="align-justify" style="width: 30px;"
                        class="mt-5 ml-1 text-white font-bold drop-shadow-xl p-1" (click)="toggleSidebar()"
                        (click)="stopPropagation($event)"></i-feather>
                </div>
                <!-- Breadcrumb Navigation -->
                <div
            class="bg-gradient-to-r from-gray-950 via-gray-900 to-gray-950 rounded-b-md flex items-center">
            <div class="text-white ml-4 mt-2 side-z">
                <app-navbar-breadcrumb></app-navbar-breadcrumb>
            </div>
        </div>
            </div>
        </div>
    </div>

    <!-- Sidebar Close Button (visible when sidebar is closed) -->
    <div class="w-0 md:w-12 hidden md:block" *ngIf="!openMenu">
        <div class="mt-28 inset-y-0 left-0 transform duration-300 -translate-x-0 ease-in-out fixed 
            transition duration-300 ease-in-out side-z" id="sidebarView">
            <div class="rounded-b-md w-12 flex items-center p-1 mt-1">
                <!-- Sidebar Close Button Icon -->
                <app-side-bar-close [notificationLength]="notificationLength"> </app-side-bar-close>
            </div>
        </div>
    </div>

    <!-- Main Sidebar (visible when sidebar is open) -->
    <div class="mt-12 w-screen left-64 ml-4 transform duration-300 hidden md:block
        -translate-x-0 ease-in-out fixed transition duration-300 ease-in-out side-z"
        [ngClass]="{'block md:hidden': !openMenu}" id="sidebarView">
        <div
            class="bg-gradient-to-r from-gray-950 via-gray-900 to-gray-950 rounded-b-md flex items-center p-1">
            <div class="text-white ml-4 mt-2 side-z">
                <app-navbar-breadcrumb></app-navbar-breadcrumb>
            </div>
        </div>
    </div>

    <!-- Expanded Sidebar (visible when sidebar is close) -->
    <div class="w-0 md:w-64" *ngIf="openMenu">
        <div class="mt-10 bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 py-4 w-64
         inset-y-0 left-0 transform duration-300 -translate-x-0 ease-in-out fixed transition 
         duration-300 ease-in-out side-z" [ngClass]="{'hidden ': !openMenu,}" id="sidebarView">
            <!-- Sidebar Branding and Close Button -->
            <div class="flex justify-end">
                <!-- Close Button Icon -->
                <div class="mt-4 hover:drop-shadow-2xl transition-all duration-1000 ease-in-out transform hover:scale-105 
         rounded-md mr-4">
                    <i-feather name="x" class="min-w-[20px] text-gray-200 font-bold drop-shadow-xl cursor-pointer"
                        (click)="toggleSidebar(); stopPropagation($event)"></i-feather>
                </div>
            </div>
            <app-side-bar-open></app-side-bar-open>
        </div>
    </div>
</section>
