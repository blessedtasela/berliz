<div class="relative w-full max-w-xl">

    <!-- ── INPUT ──────────────────────────────────────────────────────── -->
    <div class="relative">

        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none flex items-center">
            <i-feather name="search" style="width:16px;height:16px;"></i-feather>
        </span>

        <!--
          text-base (16px) below md is deliberate: iOS Safari zooms the whole
          page when a focused input's font-size is under 16px. Desktop keeps the
          denser 14px.
        -->
        <input #searchInput type="text" autocomplete="off" spellcheck="false" [ngModel]="query"
            (ngModelChange)="onQueryChange($event)" (focus)="onFocus()"
            placeholder="Search trainers, centers, services, exercises…" class="w-full h-10 pl-10 pr-9 rounded-xl bg-gray-50 border border-gray-200 text-base md:text-sm
                   text-gray-900 placeholder-gray-400 transition focus:outline-none focus:bg-white
                   focus:ring-2 focus:ring-red-500 focus:border-transparent" />

        <button *ngIf="query" type="button" (click)="clear()" aria-label="Clear search" class="absolute right-2.5 top-1/2 -translate-y-1/2 w-6 h-6 rounded-lg flex items-center justify-center
                   text-gray-400 hover:text-gray-600 hover:bg-gray-200 transition">
            <i-feather name="x" style="width:13px;height:13px;"></i-feather>
        </button>

    </div>

    <!-- ── RESULTS PANEL ──────────────────────────────────────────────── -->
    <div *ngIf="open" class="absolute left-0 right-0 top-full mt-2 z-50 bg-white rounded-2xl border border-gray-200
                shadow-xl overflow-hidden">

        <!-- Loading -->
        <div *ngIf="loading" class="px-4 py-4 flex flex-col gap-3">
            <div class="flex items-center gap-2 text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                <span class="w-3 h-3 rounded-full border-2 border-gray-200 border-t-red-600 animate-spin"></span>
                Searching
            </div>
            <div class="flex flex-col gap-2">
                <div class="h-8 rounded-xl bg-gray-100 animate-pulse"></div>
                <div class="h-8 rounded-xl bg-gray-100 animate-pulse w-11/12"></div>
                <div class="h-8 rounded-xl bg-gray-100 animate-pulse w-9/12"></div>
            </div>
        </div>

        <!-- Empty -->
        <div *ngIf="!loading && groups.length === 0" class="flex flex-col items-center gap-2 py-8 px-4 text-center">
            <i-feather name="search" class="text-gray-300" style="width:26px;height:26px;"></i-feather>
            <p class="text-xs text-gray-500">
                No results for <span class="font-semibold text-gray-700">"{{ activeQuery }}"</span>
            </p>
            <p class="text-[11px] text-gray-400">Try a different name or keyword.</p>
        </div>

        <!-- Results -->
        <div *ngIf="!loading && groups.length > 0" class="max-h-[65vh] overflow-y-auto py-2">

            <div *ngFor="let group of groups; trackBy: trackByKey" class="px-2 py-1">

                <!-- Group header -->
                <div class="flex items-center gap-1.5 px-2 pt-2 pb-1">
                    <i-feather [name]="group.icon" class="text-gray-400" style="width:11px;height:11px;"></i-feather>
                    <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        {{ group.label }}
                    </span>
                    <span class="text-[11px] font-semibold text-gray-300">{{ group.items.length }}</span>
                </div>

                <!-- Rows -->
                <a *ngFor="let item of group.items | slice:0:visibleCount(group); trackBy: trackByItem"
                    [routerLink]="item.link" (click)="onSelect()" class="flex items-center gap-3 px-2.5 py-2.5 md:py-2 rounded-xl cursor-pointer transition
                           hover:bg-gray-50">

                    <span class="w-7 h-7 shrink-0 rounded-lg bg-red-50 border border-red-100 flex items-center
                                 justify-center text-red-600">
                        <i-feather [name]="group.icon" style="width:12px;height:12px;"></i-feather>
                    </span>

                    <span class="flex-1 min-w-0">
                        <span class="block text-sm md:text-xs font-semibold text-gray-900 truncate">{{ item.label
                            }}</span>
                        <span *ngIf="item.sublabel" class="block text-xs md:text-[11px] text-gray-400 truncate">
                            {{ item.sublabel }}
                        </span>
                    </span>

                    <i-feather name="chevron-right" class="text-gray-300 shrink-0"
                        style="width:13px;height:13px;"></i-feather>
                </a>

                <!-- See all -->
                <button *ngIf="hasMore(group)" type="button" (click)="expandGroup(group)" class="w-full text-left px-2.5 py-1.5 text-[11px] font-semibold text-red-600
                               hover:underline">
                    See all {{ group.items.length }} results for "{{ activeQuery }}"
                </button>

            </div>

            <!-- Footer -->
            <div class="border-t border-gray-100 mt-2 px-4 py-2.5 text-[11px] text-gray-400">
                {{ totalResults }} result{{ totalResults === 1 ? '' : 's' }} for
                <span class="font-semibold text-gray-600">"{{ activeQuery }}"</span>
            </div>

        </div>

    </div>

</div>
