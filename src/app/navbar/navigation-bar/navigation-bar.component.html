<nav class="fixed top-0 left-0 w-full z-50 bg-gray-950/95 backdrop-blur-sm border-b transition-shadow duration-300"
    [ngClass]="scrolled ? 'border-gray-800 shadow-2xl' : 'border-gray-900'">

    <div class="flex items-center justify-between px-5 lg:px-12 h-16" id="navbarView">

        <!-- LEFT: Logo -->
        <a [routerLink]="['/home']" class="flex items-center shrink-0 mr-6">
            <img src="../../../assets/side-bar-berliz.png" alt="Berliz" class="h-9 w-auto object-contain" />
        </a>

        <!-- MOBILE: hamburger -->
        <button (click)="navMenu(menuStatus ? 'x' : 'align-justify')" class="lg:hidden w-9 h-9 rounded-xl border border-gray-700 flex items-center justify-center
             text-white hover:bg-red-600 hover:border-red-600 transition">
            <i-feather [name]="menuStatus ? 'x' : 'align-justify'" style="width:16px;height:16px;">
            </i-feather>
        </button>

        <!-- NAV LINKS -->
        <ul class="absolute lg:static top-full left-0 w-full lg:w-auto
               flex flex-col lg:flex-row bg-gray-950 lg:bg-transparent border-t border-gray-800 lg:border-0
               lg:items-center lg:gap-1 py-3 lg:py-0 px-4 lg:px-0
               font-sans transition-all duration-300 ease-in-out z-40" [ngClass]="{
        'opacity-100 translate-y-0 visible': menuStatus,
        'opacity-0 -translate-y-2 invisible lg:opacity-100 lg:translate-y-0 lg:visible': !menuStatus
      }">

            <li *ngFor="let link of navLinks" class="py-0.5 lg:py-0">
                <a [routerLink]="link.path" class="relative block px-3.5 py-2 rounded-xl text-sm font-medium text-gray-400
                 hover:bg-white/5 hover:text-white transition"
                    [ngClass]="isActive(link.path.replace('/', '')) ? 'text-white' : ''">
                    {{ link.label }}
                    <span class="pointer-events-none absolute left-3.5 right-3.5 -bottom-[13px] lg:-bottom-[19px] h-[2px] rounded-full bg-red-600 transition-opacity duration-200"
                        [ngClass]="isActive(link.path.replace('/', '')) ? 'opacity-100' : 'opacity-0'"></span>
                </a>
            </li>

            <li class="py-0.5 lg:py-0 lg:ml-3">
                <a *ngIf="!getUser()" [routerLink]="['/login']" class="block px-4 py-2 rounded-xl text-sm font-semibold
                 bg-red-600 text-white shadow-[0_2px_10px_rgba(220,38,38,0.35)] hover:bg-red-700 hover:shadow-[0_4px_16px_rgba(220,38,38,0.5)] active:scale-[0.98]
                 transition whitespace-nowrap">
                    Login
                </a>
                <a *ngIf="getUser()" [routerLink]="['/dashboard']" class="block px-4 py-2 rounded-xl text-sm font-semibold
                 bg-red-600 text-white shadow-[0_2px_10px_rgba(220,38,38,0.35)] hover:bg-red-700 hover:shadow-[0_4px_16px_rgba(220,38,38,0.5)] active:scale-[0.98]
                 transition whitespace-nowrap">
                    Dashboard
                </a>
            </li>

        </ul>

    </div>

</nav>
