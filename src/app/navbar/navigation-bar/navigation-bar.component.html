<nav class="fixed top-0 left-0 w-full z-50 bg-black backdrop-blur-md shadow-md">

    <!-- NAVBAR WRAPPER -->
    <div class="flex items-center justify-between px-4 lg:px-10 h-16">


        <!-- LEFT: LOGO -->
        <a [routerLink]="['/home']" class="flex items-center h-16">
            <div class="h-10 w-32 flex items-center">
                <img src="../../../assets/side-bar-berliz.png" alt="Berliz Logo"
                    class=" h-10 w-32 object-full" />
            </div>
        </a>


        <!-- MOBILE MENU BUTTON -->
        <button (click)="navMenu(menuStatus ? 'x' : 'align-justify')"
            class="lg:hidden p-2 border border-gray-400 rounded-lg text-white hover:bg-red-600 transition-all duration-300">
            <i-feather [name]="menuStatus ? 'x' : 'align-justify'" class="text-2xl"></i-feather>
        </button>

        <!-- NAV LINKS -->
        <ul class="absolute lg:static top-full left-0 w-full lg:w-auto
               flex flex-col lg:flex-row bg-black lg:bg-transparent
               lg:items-center lg:space-x-6 py-4 lg:py-0 px-4
               text-white text-sm font-semibold transition-all duration-300 ease-in-out z-40" [ngClass]="{
          'opacity-100 translate-y-0 visible': menuStatus,
          'opacity-0 -translate-y-5 invisible lg:opacity-100 lg:translate-y-0 lg:visible': !menuStatus
        }">

            <li *ngFor="let link of navLinks" class="group py-1 lg:py-0">
                <a [routerLink]="link.path" routerLinkActive="bg-red-600 text-white"
                    [routerLinkActiveOptions]="{ exact: false }"
                    class="px-4 py-2 rounded-md transition duration-300 hover:bg-red-600 hover:text-white">
                    {{ link.label }}
                </a>
            </li>

            <li *ngIf="!getUser()" class="py-4 lg:py-0">
                <a [routerLink]="['/login']"
                    class="bg-white text-red-600 px-4 py-2 rounded-md hover:bg-red-700 hover:text-white transition duration-300 whitespace-nowrap inline-block">
                    Login
                </a>
            </li>

            <li *ngIf="getUser()" class="py-4 lg:py-0">
                <a [routerLink]="['/dashboard']"
                    class="bg-white text-red-600 px-4 py-2 rounded-md hover:bg-red-700 hover:text-white transition duration-300 whitespace-nowrap inline-block">
                    Dashboard
                </a>
            </li>

            <!-- <li class="py-4 lg:py-0">
                <a [routerLink]="['/shop']"
                    class="bg-white text-red-600 px-4 py-2 rounded-md hover:bg-red-700 hover:text-white transition duration-300 whitespace-nowrap inline-flex items-center gap-2">
                    <i-feather name="shopping-cart"></i-feather>
                    Shop
                </a>
            </li> -->

        </ul>
    
    </div>

</nav>
