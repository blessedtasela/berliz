<!-- Top Navigation Bar -->
<div class="bg-white fixed top-0 left-0 w-full shadow-md z-50">

    <div class="h-14 flex items-center justify-between px-4">

        <!-- LEFT: Logo + Notifications -->
        <div class="flex items-center gap-4">

            <!-- Logo -->
            <a [routerLink]="['/home']" class="flex items-center">
                <img src="../../../assets/landing/logo.png" class="w-8 block md:hidden">
                <img src="../../../assets/landing/berliz.png" class="w-28 hidden md:block">
            </a>

            <!-- Notifications -->
            <div class="relative">
                <div (click)="toggleNotificationDropdown()" class="cursor-pointer relative">
                    <i-feather name="bell" class="text-gray-700" style="width: 22px;"></i-feather>

                    <span *ngIf="notificationLength > 0"
                        class="absolute -top-1 -right-3 bg-red-600 text-white text-[8px] 
                        px-1.5 py-[1px] rounded-full font-bold badge-pulse">
                        {{ notificationLength }}
                    </span>
                </div>

                <!-- Backdrop blur -->
                <div *ngIf="notificationDropdown" class="fixed inset-0 bg-black/10 backdrop-blur-sm z-40"
                    (click)="closeNotificationDropdown()">
                </div>

                <!-- DROPDOWN -->
                <div *ngIf="notificationDropdown" class="absolute  mt-3 w-96 z-50">
                    <notification-dropdown-component (close)="closeNotificationDropdown()">
                    </notification-dropdown-component>
                </div>
            </div>

        </div>

        <!-- CENTER: Search -->
        <div class="flex-1 flex justify-center px-4">
            <app-search (categoriesResults)="handleCategorySearchResults($event)"
                (exerciseResults)="handleExerciseSearchResults($event)"
                (contactUsResults)="handleContactUsSearchResults($event)"
                (muscleGroupResults)="handleMuscleGroupSearchResults($event)"
                (trainersResults)="handleTrainerSearchResults($event)" (usersResults)="handleUserSearchResults($event)"
                (partnersResults)="handlePartnerSearchResults($event)"
                (centerssResults)="handleCenterSearchResults($event)"
                (newslettersResult)="handleNewsletterSearchResults($event)"
                (tagsResults)="handleTagSearchResults($event)" (myTodoResults)="handleMyTodoSearchResults($event)"
                (todoListResults)="handleTodoListSearchResults($event)"
                (clientssResults)="handleClientSearchResults($event)"
                (membersResult)="handleMemberSearchResults($event)"
                (paymentsResults)="handlePaymentSearchResults($event)"
                (subscriptionsResults)="handleSubscriptionSearchResults($event)"
                (subTasksResults)="handlesubTaskSearchResults($event)" (tasksResults)="handleTaskSearchResults($event)"
                (testimonialsResults)="handleTestimonialSearchResults($event)" [searchComponent]="searchComponent">
            </app-search>
        </div>

        <!-- RIGHT: Home + Profile -->
        <div class="flex items-center gap-4 rounded-full px-4 bg-white shadow-lg transition-all whitespace-nowrap">

            <!-- Home Icon Circle -->
            <div class="w-9 h-9 flex items-center justify-center rounded-full bg-white border border-gray-300 shadow-sm cursor-pointer hover:shadow-md transition-all"
                [routerLink]="['/home']">
                <feather-icon name="home" class="text-gray-800" style="width: 20px;"></feather-icon>
            </div>

            <!-- Profile -->
            <app-profile [search]="isSearch" [userData]="userData"></app-profile>
        </div>

    </div>
</div>
