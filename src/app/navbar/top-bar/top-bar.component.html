<div class="bg-white/95 backdrop-blur-sm fixed top-0 left-0 w-full border-b border-gray-200 shadow-sm z-50">
    <div class="h-14 flex items-center justify-between px-5 gap-4">

        <!-- LEFT: Logo + Bell -->
        <div class="flex items-center gap-4 shrink-0">

            <a [routerLink]="['/home']" class="flex items-center">
                <img src="../../../assets/landing/logo.png" class="w-7 h-7 object-contain block md:hidden" />
                <img src="../../../assets/landing/berliz.png" class="h-7 w-auto object-contain hidden md:block" />
            </a>

            <!-- Breadcrumb — hidden on mobile, shows on md+ -->
            <div class="flex flex-wrap items-center max-w-full">
                <span class="text-gray-300 mx-2">|</span>
                <app-navbar-breadcrumb></app-navbar-breadcrumb>
            </div>


            <!-- Bell -->
            <div class="relative">
                <button (click)="toggleNotificationDropdown()" class="w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md hover:border-gray-300
                 flex items-center justify-center transition relative">
                    <i-feather name="bell" class="text-gray-700" style="width:16px;height:16px;"></i-feather>
                    <span *ngIf="notificationLength > 0" class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px]
                   px-1.5 py-px rounded-full font-bold leading-none badge-pulse">
                        {{ notificationLength }}
                    </span>
                </button>

                <div *ngIf="notificationDropdown" class="fixed inset-0 bg-black/10 backdrop-blur-sm z-40"
                    (click)="closeNotificationDropdown()">
                </div>

                <div *ngIf="notificationDropdown" class="fixed top-16 left-1/2 -translate-x-1/2 w-[90vw] max-w-sm z-50">
                    <notification-dropdown-component
                        (close)="closeNotificationDropdown()"></notification-dropdown-component>
                </div>


            </div>

        </div>

        <!-- CENTER: Search -->
        <div class="flex-1 flex justify-center min-w-0">
            <app-search (categoriesResults)="handleCategorySearchResults($event)"
                (exerciseResults)="handleExerciseSearchResults($event)"
                (contactUsResults)="handleContactUsSearchResults($event)"
                (muscleGroupResults)="handleMuscleGroupSearchResults($event)"
                (trainersResults)="handleTrainerSearchResults($event)" (usersResults)="handleUserSearchResults($event)"
                (partnersResults)="handlePartnerSearchResults($event)"
                (centerssResults)="handleCenterSearchResults($event)"
                (newslettersResult)="handleNewsletterSearchResults($event)"
                (tagsResults)="handleTagSearchResults($event)" (myTodoResults)="handleMyTodoSearchResults($event)"
                (todoListResults)="handleTodoListSearchResults($event)"
                (clientssResults)="handleClientSearchResults($event)"
                (membersResult)="handleMemberSearchResults($event)"
                (paymentsResults)="handlePaymentSearchResults($event)"
                (subscriptionsResults)="handleSubscriptionSearchResults($event)"
                (subTasksResults)="handlesubTaskSearchResults($event)" 
                (tasksResults)="handleTaskSearchResults($event)"
                (testimonialsResults)="handleTestimonialSearchResults($event)" [searchComponent]="searchComponent">
            </app-search>
        </div>

        <!-- RIGHT: Home + Profile -->
        <div class="flex items-center gap-3 shrink-0">
            <button [routerLink]="['/home']" class="w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md hover:border-gray-300
               flex items-center justify-center transition">
                <feather-icon name="home" class="text-gray-700"
                    style="width:16px;height:16px;width:16px;"></feather-icon>
            </button>

            <div class="w-px h-6 bg-gray-200"></div>

            <app-profile [search]="isSearch" [userData]="userData"></app-profile>
        </div>

    </div>
</div>
