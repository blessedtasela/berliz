<div [ngClass]="navbarStyle.bgClasses" class="fixed top-0 left-0 w-full border-b border-gray-200 shadow-sm z-50">
    <div class="h-14 flex items-center justify-between px-5 gap-4">

        <!--
          LEFT: Logo + Bell.
          Below md this whole block steps aside while mobile search mode is on;
          `md:flex` re-asserts it from the md breakpoint up, so desktop never
          sees the mode at all.
        -->
        <div class="items-center gap-4 shrink-0" [ngClass]="isMobileSearchOpen ? 'hidden md:flex' : 'flex'">

            <!-- Sidebar reopen toggle — only rendered when there's no persistent/overlay
                 sidebar currently on screen (desktop "hidden" mode, or mobile with the
                 overlay closed). Lives here in the fixed top bar, not as a separately
                 floating element, so it can never overlap page-specific content. -->
            <button *ngIf="sidebarState.showFloatingButton$ | async" type="button"
                (click)="sidebarState.openSidebar()" aria-label="Show sidebar"
                class="group relative shrink-0 w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md hover:border-gray-300
                       flex items-center justify-center transition">
                <i-feather name="align-justify" class="text-gray-700" style="width:16px;height:16px;"></i-feather>

                <!-- Tooltip -->
                <span class="absolute top-full mt-2 left-0 px-2 py-1 rounded-lg bg-gray-900 text-white text-xs
                             font-medium whitespace-nowrap opacity-0 group-hover:opacity-100
                             pointer-events-none transition-opacity duration-150 z-50">
                    Change this anytime in Settings
                </span>
            </button>

            <a [routerLink]="['/dashboard']" class="flex items-center">
                <img src="../../../assets/berliz-files/SVG/logo.svg" class="w-7 h-7 object-contain block md:hidden" />
                <img src="../../../assets/berliz-files/SVG/standard.svg" class="h-7 w-auto object-contain hidden md:block" />
            </a>

            <!--
              Breadcrumb — hidden below `sm` (no room next to the search bar
              and profile controls on a phone); from `sm` up it's capped to a
              max-width and truncates internally so a long/deep trail can
              never push the search bar, bell, home or profile out of view.
            -->
            <div class="hidden sm:flex items-center min-w-0 overflow-hidden max-w-[140px] md:max-w-[170px] lg:max-w-[260px] xl:max-w-xs">
                <span class="text-gray-300 mx-2 shrink-0">|</span>
                <app-navbar-breadcrumb></app-navbar-breadcrumb>
            </div>


            <!-- Bell -->
            <div class="relative">
                <button (click)="toggleNotificationDropdown()" class="w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md hover:border-gray-300
                 flex items-center justify-center transition relative">
                    <i-feather name="bell" class="text-gray-700" style="width:16px;height:16px;"></i-feather>
                    <span *ngIf="notificationLength > 0" class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px]
                   px-1.5 py-px rounded-full font-bold leading-none badge-pulse">
                        {{ notificationLength }}
                    </span>
                </button>

                <div *ngIf="notificationDropdown" class="fixed inset-0 bg-black/10 backdrop-blur-sm z-40"
                    (click)="closeNotificationDropdown()">
                </div>

                <div *ngIf="notificationDropdown" class="fixed top-16 left-1/2 -translate-x-1/2 w-[90vw] max-w-sm z-50">
                    <notification-dropdown-component
                        (close)="closeNotificationDropdown()"></notification-dropdown-component>
                </div>


            </div>

        </div>

        <!-- CENTER: Global search — one search bar for the whole app -->
        <div class="flex-1 flex items-center justify-end md:justify-center gap-2 min-w-0">

            <!-- Compact trigger — mobile only, swaps the bar into search mode -->
            <button *ngIf="!isMobileSearchOpen" type="button" (click)="openMobileSearch()" aria-label="Open search"
                class="md:hidden shrink-0 w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm
                       hover:shadow-md hover:border-gray-300 flex items-center justify-center transition">
                <i-feather name="search" class="text-gray-700" style="width:16px;height:16px;"></i-feather>
            </button>

            <!-- The search itself: full width in mobile search mode, always on from md up -->
            <div class="w-full max-w-xl min-w-0" [ngClass]="isMobileSearchOpen ? 'block' : 'hidden md:block'">
                <app-global-search #globalSearch (activated)="openMobileSearch()"
                    (dismissed)="closeMobileSearch()"></app-global-search>
            </div>

            <button *ngIf="isMobileSearchOpen" type="button" (click)="closeMobileSearch()" aria-label="Close search"
                class="md:hidden shrink-0 h-9 px-1 text-sm font-semibold text-gray-500 hover:text-gray-800
                       rounded-lg transition">
                Cancel
            </button>

        </div>

        <!-- RIGHT: Home + Profile -->
        <div class="items-center gap-3 shrink-0" [ngClass]="isMobileSearchOpen ? 'hidden md:flex' : 'flex'">
            <button [routerLink]="['/dashboard']" title="Dashboard" class="w-9 h-9 rounded-xl border border-gray-200 bg-white shadow-sm hover:shadow-md hover:border-gray-300
               flex items-center justify-center transition">
                <feather-icon name="home" class="text-gray-700"
                    style="width:16px;height:16px;width:16px;"></feather-icon>
            </button>

            <div class="w-px h-6 bg-gray-200"></div>

            <app-profile [search]="isSearch" [userData]="userData"></app-profile>
        </div>

    </div>
</div>
