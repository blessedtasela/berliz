<nav class="flex flex-col gap-1 px-3 font-sans">

  <ng-container *ngFor="let item of [
    {name:'Dashboard', icon:'package', route:'/dashboard', exact:true},
    {name:'Tasks', icon:'activity', route:'/dashboard/my-tasks'},
    {name:'Notifications', icon:'inbox', route:'/dashboard/my-notifications'},
    {name:'Messages', icon:'message-circle', route:'/dashboard/messages'},
    {name:'Connections', icon:'users', route:'/dashboard/connections'},
    {name:'Hub', icon:'globe', route:'/dashboard/hub'},
    {name:'Profile', icon:'user', route:'/dashboard/profile'},
    {separator:true},
    {name:'Workouts', icon:'zap', route:'/dashboard/workouts'},
    {name:'My Progress', icon:'trending-up', route:'/dashboard/my-progress'},
    {name:'Exercises & Gear', icon:'layers', route:'/dashboard/exercises'},
    {name:'To-do list', icon:'calendar', route:'/dashboard/my-todos'},
    {name:'Subscriptions', icon:'airplay', route:'/dashboard/my-subscriptions'},
    {name:'Find a Trainer', icon:'search', route:'/dashboard/find-trainers'},
    {name:'Find a Center', icon:'map-pin', route:'/dashboard/find-centers'},
    {name:'My Bookings', icon:'clock', route:'/dashboard/my-bookings'},
    {name:'FAQs', icon:'message-square', route:'/dashboard/my-faqs'},
    {name:'Settings', icon:'settings', route:'/dashboard/settings'}
  ]">

    <!-- Separator -->
    <div *ngIf="item.separator" class="border-t border-gray-800 my-1 mx-1"></div>

    <!-- Nav item -->
    <a *ngIf="!item.separator" [routerLink]="item.route"  (click)="closeMobileSidebar()"
      class="flex items-center gap-2.5 px-3 h-10 rounded-lg text-[12.5px] font-medium transition"
      [ngClass]="isActive(item.route || '', item.exact)
        ? 'bg-red-600/20 border border-red-600/30 text-red-400'
        : 'text-white hover:bg-gray-800 hover:text-white'">

      <feather-icon [name]="item.icon || ''" style="width:15px;height:15px;" class="shrink-0 flex items-center justify-center"
        [ngClass]="isActive(item.route || '', item.exact) ? 'text-red-400' : 'text-white'">
      </feather-icon>

      <span class="flex-1 leading-none">{{ item.name }}</span>

      <span *ngIf="item.name === 'Notifications' && notificationLength > 0"
        class="bg-red-600 text-white text-[9px] px-1.5 py-px rounded-full font-bold badge-pulse">
        {{ notificationLength }}
      </span>

      <span *ngIf="item.name === 'Connections' && incomingRequestCount > 0"
        class="bg-red-600 text-white text-[9px] px-1.5 py-px rounded-full font-bold badge-pulse">
        {{ incomingRequestCount }}
      </span>

    </a>

  </ng-container>

  <!-- Logout -->
  <button (click)="logout()"
    class="flex items-center gap-2.5 px-3 h-10 rounded-lg text-[12.5px] font-medium
           text-white hover:bg-red-600/10 hover:text-red-400 transition mt-1 w-full text-left">
    <feather-icon name="log-out" style="width:15px;height:15px;" class="text-white shrink-0 flex items-center justify-center"></feather-icon>
    <span class="leading-none">Log out</span>
  </button>

</nav>
