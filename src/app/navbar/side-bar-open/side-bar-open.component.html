<!-- Sidebar Navigation -->
<nav class="font-sans text-white bg-gradient-to-b from-gray-950 via-gray-900 to-gray-950 py-4">

    <!-- MENU ITEM TEMPLATE -->
    <ng-container *ngFor="let item of [
      {name:'Dashboard', icon:'package', route:'/dashboard', exact:true},
      {name:'Tasks', icon:'activity', route:'/dashboard/my-tasks'},
      {name:'Notifications', icon:'inbox', route:'/dashboard/my-notifications'},
      {name:'Hub', icon:'globe', route:'/dashboard/hub'},
      {name:'Profile', icon:'user', route:'/dashboard/profile'},
      {separator:true,icon:'', route:''},
      {name:'To-do list', icon:'calendar', route:'/dashboard/my-todos'},
      {name:'Subscriptions', icon:'airplay', route:'/dashboard/my-subscriptions'},
      {name:'FAQs', icon:'message-square', route:'/dashboard/my-faqs'},
      {name:'Settings', icon:'settings', route:'/dashboard/settings'}
    ]">
        <!-- SEPARATOR -->
        <ng-container *ngIf="item.separator">
            <hr class="border-gray-700 my-4 mx-6" />
        </ng-container>


        <!-- MENU ITEM -->
        <div *ngIf="!item.separator"
            class="flex items-center px-6 py-3 cursor-pointer transition-all duration-200 rounded-md" [ngClass]="{
          'bg-gray-800 border-l-4 border-red-600': isActive(item.route, item.exact),
          'hover:bg-gray-800': !isActive(item.route, item.exact)
        }">

            <!-- ICON -->
            <feather-icon [name]="item.icon" class="text-white" style="width: 24px;">
            </feather-icon>

            <!-- LABEL -->
            <a [routerLink]="item.route" class="ml-4 text-sm font-medium tracking-wide">
                {{ item.name }}
            </a>

            <!-- NOTIFICATION BADGE -->
            <span *ngIf="item.name === 'Notifications'"
                class="ml-3 bg-red-600 text-white text-[10px] px-2 py-[1px] rounded-full font-bold badge-pulse">
                {{ notificationLength }}
            </span>

        </div>

    </ng-container>

    <!-- LOGOUT -->
    <div class="flex items-center px-6 py-3 mt-10 cursor-pointer hover:bg-gray-800 transition-all duration-200 rounded-md"
        (click)="logout()">

        <feather-icon name="log-out" class="text-white" style="width: 22px;"></feather-icon>

        <span class="ml-4 text-sm font-medium tracking-wide">
            Log out
        </span>
    </div>

</nav>
