<nav class="flex flex-col gap-0.5 px-3 font-sans">

  <ng-container *ngFor="let item of [
    {name:'Dashboard', icon:'package', route:'/dashboard', exact:true},
    {name:'Tasks', icon:'activity', route:'/dashboard/my-tasks'},
    {name:'Notifications', icon:'inbox', route:'/dashboard/my-notifications'},
    {name:'Hub', icon:'globe', route:'/dashboard/hub'},
    {name:'Profile', icon:'user', route:'/dashboard/profile'},
    {separator:true},
    {name:'Workouts', icon:'zap', route:'/dashboard/workouts'},
    {name:'Exercises', icon:'layers', route:'/dashboard/exercises'},
    {name:'Assigned to me', icon:'check-square', route:'/dashboard/my-assigned-workouts'},
    {name:'To-do list', icon:'calendar', route:'/dashboard/my-todos'},
    {name:'Subscriptions', icon:'airplay', route:'/dashboard/my-subscriptions'},
    {name:'FAQs', icon:'message-square', route:'/dashboard/my-faqs'},
    {name:'Settings', icon:'settings', route:'/dashboard/settings'}
  ]">

    <!-- Separator -->
    <div *ngIf="item.separator" class="border-t border-gray-800 my-2 mx-1"></div>

    <!-- Nav item -->
    <a *ngIf="!item.separator" [routerLink]="item.route"
      class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition"
      [ngClass]="isActive(item.route || '', item.exact)
        ? 'bg-red-600/20 border border-red-600/30 text-red-400'
        : 'text-white hover:bg-gray-800 hover:text-white'">

      <feather-icon [name]="item.icon || ''" style="width:17px;"
        [ngClass]="isActive(item.route || '', item.exact) ? 'text-red-400' : 'text-white'">
      </feather-icon>

      <span class="flex-1">{{ item.name }}</span>

      <span *ngIf="item.name === 'Notifications' && notificationLength > 0"
        class="bg-red-600 text-white text-[9px] px-1.5 py-px rounded-full font-bold badge-pulse">
        {{ notificationLength }}
      </span>

    </a>

  </ng-container>

  <!-- Logout -->
  <button (click)="logout()"
    class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium
           text-white hover:bg-red-600/10 hover:text-red-400 transition mt-2 w-full text-left">
    <feather-icon name="log-out" style="width:17px;" class="text-white"></feather-icon>
    Log out
  </button>

</nav>
