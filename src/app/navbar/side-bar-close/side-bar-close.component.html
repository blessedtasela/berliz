<nav class="mt-2 font-sans space-y-3">

    <!-- MENU ITEMS -->
    <ng-container *ngFor="let item of [
      {name:'Dashboard', icon:'package', route:'/dashboard', exact:true},
      {name:'Tasks', icon:'activity', route:'/dashboard/my-tasks'},
      {name:'Notifications', icon:'inbox', route:'/dashboard/my-notifications'},
      {name:'Workspace', icon:'globe', route:'/dashboard/workspace'},
      {name:'Profile', icon:'user', route:'/dashboard/profile'},
      {name:'Todos', icon:'calendar', route:'/dashboard/my-todos'},
      {name:'Subscriptions', icon:'airplay', route:'/dashboard/my-subscriptions'},
      {name:'Faqs', icon:'message-square', route:'/dashboard/my-faqs'},
      {name:'Settings', icon:'settings', route:'/dashboard/settings'}
    ]">
  
      <div
        class="relative flex flex-col items-center justify-center cursor-pointer group w-12 py-2 rounded-md 
        transform transition-all duration-600 hover:scale-105 hover:bg-white hover:border hover:border-gray-200 
        hover:shadow-md hover:rounded-md"
        [ngClass]="{'bg-white border border-gray-200 rounded-md shadow-md': isActive(item.route, item.exact)}"
        (mouseover)="setRouterName(item.name)" (mouseout)="clearRouterName()">
  
        <!-- LABEL TOOLTIP -->
        <span
          *ngIf="currentRouteName === item.name"
          class="absolute z-50 text-xs font-bold text-gray-900 bg-white border border-gray-200 rounded-md shadow-md whitespace-nowrap px-2 py-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
          style="top: 50%; transform: translateY(-50%); left: 100%;">
          {{ item.name }}
        </span>
  
        <!-- ICON LINK -->
        <a [routerLink]="item.route" class="relative flex items-center justify-center w-full">
          <feather-icon
            [name]="item.icon"
            class="text-gray-950 group-hover:text-black transition-all duration-200"
            style="width: 26px;">
          </feather-icon>
  
          <!-- NOTIFICATION BADGE -->
          <span *ngIf="item.name === 'Notifications' && notificationLength > 0"
            class="absolute -top-1 -right-2 bg-red-600 text-white text-[8px] px-1.5 py-[1px] rounded-full font-bold">
            {{ notificationLength }}
          </span>
        </a>
  
      </div>
  
    </ng-container>
  
    <!-- LOGOUT BUTTON -->
    <div
    class="relative flex flex-col items-center justify-center cursor-pointer group w-12 py-2 rounded-md 
    transform transition-all duration-600 hover:scale-105 hover:bg-white hover:border hover:border-gray-200 
    hover:shadow-md hover:rounded-md"
      (click)="logout()" (mouseover)="setRouterName('Logout')" (mouseout)="clearRouterName()">
  
      <!-- TOOLTIP -->
      <span
        class="absolute z-50 text-xs font-bold text-gray-900 bg-white border border-gray-200 rounded-md px-2 py-1 shadow-md whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity duration-200"
        style="top: 50%; transform: translateY(-50%); left: 100%;">
        Logout
      </span>
  
      <!-- ICON -->
      <feather-icon
        name="log-out"
        class="text-gray-900 group-hover:text-black transition-all duration-200"
        style="width: 26px;">
      </feather-icon>
  
    </div>
  
  </nav>
