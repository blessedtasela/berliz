<nav class="flex flex-col items-center gap-1 w-full">

  <ng-container *ngFor="let item of [
    {name:'Dashboard', icon:'package', route:'/dashboard', exact:true},
    {name:'Tasks', icon:'activity', route:'/dashboard/my-tasks'},
    {name:'Notifications', icon:'inbox', route:'/dashboard/my-notifications'},
    {name:'Hub', icon:'globe', route:'/dashboard/hub'},
    {name:'Profile', icon:'user', route:'/dashboard/profile'},
    {separator:true},
    {name:'Workouts', icon:'zap', route:'/dashboard/workouts'},
    {name:'Exercises & Gear', icon:'layers', route:'/dashboard/exercises'},
    {name:'Todos', icon:'calendar', route:'/dashboard/my-todos'},
    {name:'Subscriptions', icon:'airplay', route:'/dashboard/my-subscriptions'},
    {name:'My Bookings', icon:'clock', route:'/dashboard/my-bookings'},
    {name:'FAQs', icon:'message-square', route:'/dashboard/my-faqs'},
    {name:'Settings', icon:'settings', route:'/dashboard/settings'}
  ]">

    <!-- Separator -->
    <div *ngIf="item.separator" class="w-6 border-t border-gray-800 my-1"></div>

    <a *ngIf="!item.separator" [routerLink]="item.route || ''" class="relative group w-10 h-10 rounded-xl flex items-center justify-center transition"
      [ngClass]="isActive(item.route || '', item.exact)
        ? 'bg-red-600/20 border border-red-600/30'
        : 'hover:bg-gray-800'">

      <feather-icon [name]="item.icon || ''" style="width:18px;height:18px;" class="shrink-0 flex items-center justify-center"
        [ngClass]="isActive(item.route || '', item.exact) ? 'text-red-400' : 'text-white'">
      </feather-icon>

      <!-- Notification badge -->
      <span *ngIf="item.name === 'Notifications' && notificationLength > 0" class="absolute -top-1 -right-1 bg-red-600 text-white text-[8px]
               px-1.5 py-px rounded-full font-bold leading-none badge-pulse">
        {{ notificationLength }}
      </span>

      <!-- Tooltip -->
      <span class="absolute left-full ml-2 px-2 py-1 rounded-lg bg-white text-gray-950 font-bold shadow-lg text-xs
                   font-medium whitespace-nowrap opacity-0 group-hover:opacity-100 border border-gray-200
                   pointer-events-none transition-opacity duration-150 z-50">
        {{ item.name }}
      </span>

    </a>

  </ng-container>

  <!-- Divider -->
  <div class="w-6 border-t border-gray-200 my-1"></div>

  <!-- Logout -->
  <button (click)="logout()" class="group relative w-10 h-10 rounded-xl flex items-center justify-center
           hover:bg-red-50 transition">
    <feather-icon name="log-out" style="width:18px;height:18px;" class="text-white group-hover:text-red-600 transition shrink-0 flex items-center justify-center">
    </feather-icon>
    <span class="absolute left-full ml-2 px-2 py-1 rounded-lg bg-gray-900 text-white text-xs
                 font-medium whitespace-nowrap opacity-0 group-hover:opacity-100
                 pointer-events-none transition-opacity duration-150 z-50">
      Logout
    </span>
  </button>

</nav>
