<!-- Cropper modal -->
<div *ngIf="showCropper" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
    <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl flex flex-col gap-4">
        <div class="flex items-center justify-between">
            <h2 class="text-sm font-bold text-gray-900">Crop photo</h2>
            <button (click)="cancelUpload()"
                class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400">
                <i-feather name="x" style="width:14px;height:14px;"></i-feather>
            </button>
        </div>
        <image-cropper [imageChangedEvent]="imageChangedEvent" (imageCropped)="imageCropped($event)"
            [maintainAspectRatio]="true" [aspectRatio]="1/1" [resizeToWidth]="256"
            class="rounded-xl overflow-hidden border border-gray-200">
        </image-cropper>
        <div class="flex justify-end gap-2 pt-1 border-t border-gray-100">
            <button (click)="cancelUpload()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </button>
            <button (click)="updatePhoto()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition">
                Upload
            </button>
        </div>
    </div>
</div>

<!-- Profile trigger -->
<div *ngIf="userData" class="relative font-sans">

    <div class="flex items-center gap-2 cursor-pointer" (click)="toggleProfile()" (click)="stopPropagation($event)">

        <img [src]="'data:image/*;base64,' + userData.profilePhoto"
            class="w-8 h-8 rounded-full object-cover border border-gray-200"
            onerror="this.src='../../../assets/icons/user.png';" />

        <div class="hidden md:flex flex-col leading-tight">
            <span class="text-xs font-semibold text-gray-900 capitalize">
                {{ userData.firstname }} {{ userData.lastname }}
            </span>
            <span class="text-[10px] text-gray-400 capitalize">{{ userData.role }}</span>
        </div>

        <i-feather [name]="profileOpen ? 'chevron-up' : 'chevron-down'" style="width:14px;height:14px;"
            class="text-gray-400">
        </i-feather>

    </div>

    <!-- Dropdown -->
    <div *ngIf="profileOpen" id="profileDropdown" class="absolute top-full mt-2 w-56 bg-white 
    border border-gray-200 rounded-2xl shadow-2xl z-[100] overflow-hidden -right-4">

        <!-- User info -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-100">
            <img [src]="'data:image/*;base64,' + userData.profilePhoto"
                class="w-10 h-10 rounded-full object-cover border border-gray-200 shrink-0"
                onerror="this.src='../../../assets/icons/user.png';" />
            <div class="min-w-0">
                <p class="text-xs font-bold text-gray-900 capitalize truncate">
                    {{ userData.firstname }} {{ userData.lastname }}
                </p>
                <p class="text-[10px] text-gray-400 capitalize">{{ userData.role }}</p>
            </div>
        </div>

        <!-- Menu items -->
        <div class="py-1">

            <a routerLink="/dashboard/profile" (click)="closeDropdown()"
                class="flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-gray-50 transition">
                <i-feather name="user" style="width:14px;height:14px;" class="text-gray-400"></i-feather>
                Account information
            </a>

            <a routerLink="/dashboard/settings" (click)="closeDropdown()"
                class="flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-gray-50 transition">
                <i-feather name="settings" style="width:14px;height:14px;" class="text-gray-400"></i-feather>
                Account settings
            </a>

            <a routerLink="/dashboard/partnership" (click)="closeDropdown()"
                class="flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-gray-50 transition">
                <i-feather name="briefcase" style="width:14px;height:14px;" class="text-gray-400"></i-feather>
                Partnership
            </a>

            <button (click)="openChangePassword()"
                class="w-full flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-gray-700 hover:bg-gray-50 transition text-left">
                <i-feather name="lock" style="width:14px;height:14px;" class="text-gray-400"></i-feather>
                Change password
            </button>

        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Logout -->
        <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-xs font-medium text-red-600
             hover:bg-red-50 transition text-left">
            <i-feather name="log-out" style="width:14px;height:14px;" class="text-red-500"></i-feather>
            Log out
        </button>

    </div>

</div>
