<div class="relative p-3 border border-gray-200 rounded-xl bg-white flex items-start justify-between gap-3 hover:shadow-sm hover:-translate-y-0.5 transition">
    <div class="w-2 h-2 rounded-full mt-1.5 shrink-0" [ngClass]="dotClasses"></div>

    <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-2">
            <p class="text-sm font-semibold text-gray-900 truncate">{{ counterpartyName }}</p>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0" [ngClass]="statusClasses">
                {{ booking.status | titlecase }}
            </span>
        </div>

        <p class="text-[10px] text-gray-400 mt-0.5">{{ counterpartySubtitle }}</p>

        <div class="flex items-center gap-3 mt-1.5 text-[11px] text-gray-500">
            <span class="flex items-center gap-1">
                <i-feather name="calendar" style="width:11px;height:11px;"></i-feather>
                {{ booking.scheduledAt | date:'mediumDate' }}
            </span>
            <span class="flex items-center gap-1">
                <i-feather name="clock" style="width:11px;height:11px;"></i-feather>
                {{ booking.scheduledAt | date:'shortTime' }} &middot; {{ booking.durationMinutes }}m
            </span>
        </div>

        <p *ngIf="booking.notes" class="text-[11px] text-gray-500 italic mt-1.5 truncate">
            "{{ booking.notes }}"
        </p>

        <div class="flex items-center gap-1.5 mt-2 flex-wrap">
            <button *ngIf="canClientCancel" type="button" (click)="cancel()"
                class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </button>

            <button *ngIf="canProviderConfirm" type="button" (click)="setStatus('confirmed')"
                class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-gray-800 text-white hover:bg-gray-700 transition">
                Confirm
            </button>
            <button *ngIf="canProviderComplete" type="button" (click)="setStatus('completed')"
                class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-green-600 text-white hover:bg-green-700 transition">
                Mark completed
            </button>
            <button *ngIf="canProviderCancel" type="button" (click)="setStatus('cancelled')"
                class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </button>
            <button *ngIf="canStartIntake" type="button" (click)="startIntake()"
                class="px-2.5 py-1 rounded-lg text-[11px] font-semibold border border-red-200 text-red-600 hover:bg-red-50 transition flex items-center gap-1">
                <i-feather name="file-text" style="width:11px;height:11px;"></i-feather>
                Start Intake
            </button>
        </div>
    </div>
</div>
