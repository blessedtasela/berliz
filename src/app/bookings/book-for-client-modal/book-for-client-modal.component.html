<div class="font-sans flex flex-col gap-4 p-1 max-w-sm w-full">

    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Book for a client</h2>
        <button type="button" (click)="close()" class="w-8 h-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center" aria-label="Close">
            <i-feather name="x" style="width:16px;height:16px;"></i-feather>
        </button>
    </div>

    <p class="text-[11px] text-gray-400 dark:text-gray-500 -mt-2">
        Creates the booking already confirmed — no approval step, since you're creating it yourself.
    </p>

    <div class="flex flex-col gap-1">
        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Client</label>

        <div *ngIf="clientsLoading" class="flex items-center gap-2 text-gray-400 py-2">
            <i-feather name="loader" class="animate-spin" style="width:14px;height:14px;"></i-feather>
            <span class="text-xs">Loading your clients...</span>
        </div>

        <p *ngIf="!clientsLoading && clients.length === 0" class="text-xs text-gray-400 py-1">
            No clients yet — a client shows up here once they've booked with you at least once.
        </p>

        <div *ngIf="!clientsLoading && clients.length > 0" class="flex flex-col gap-1.5 max-h-40 overflow-y-auto">
            <button *ngFor="let c of clients" type="button" (click)="selectedClientId = c.userId"
                class="flex items-center gap-2.5 px-2.5 py-2 rounded-xl border text-left transition"
                [ngClass]="selectedClientId === c.userId
                    ? 'border-red-300 bg-red-50 dark:bg-red-950/20 dark:border-red-800'
                    : 'border-gray-200 dark:border-gray-700 hover:border-gray-300 dark:hover:border-gray-600'">
                <img [src]="clientPhotoSrc(c)" onerror="this.src='../../../assets/icons/user.png';"
                    class="w-7 h-7 rounded-full object-cover object-top border border-gray-200 dark:border-gray-700 shrink-0" alt="" />
                <div class="min-w-0 flex-1">
                    <p class="text-xs font-semibold text-gray-900 dark:text-gray-100 truncate">{{ c.name || c.email }}</p>
                    <p class="text-[10px] text-gray-400 dark:text-gray-500 truncate">{{ c.bookingCount }} session{{ c.bookingCount === 1 ? '' : 's' }} together</p>
                </div>
                <i-feather *ngIf="selectedClientId === c.userId" name="check-circle" class="text-red-600 shrink-0" style="width:14px;height:14px;"></i-feather>
            </button>
        </div>
    </div>

    <div class="flex flex-col gap-1">
        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Date</label>
        <app-date-strip [selectedDate]="date" (dateSelected)="date = $event"></app-date-strip>
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Time</label>
        <app-time-picker [ngModel]="time" (ngModelChange)="time = $event" placeholder="Select a time"></app-time-picker>
    </div>
    <div class="flex flex-col gap-1">
        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Duration</label>
        <select [(ngModel)]="durationMinutes" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
            <option *ngFor="let d of durationOptions" [ngValue]="d">{{ d }} minutes</option>
        </select>
    </div>
    <app-booking-location-picker *ngIf="myTrainer" [trainer]="myTrainer"
        (selectionChange)="locationSelection = $event"></app-booking-location-picker>
    <div class="flex flex-col gap-1">
        <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Notes <span class="normal-case text-gray-300">(optional)</span></label>
        <textarea [(ngModel)]="notes" rows="2" placeholder="Anything worth noting about this session."
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 resize-none
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"></textarea>
    </div>

    <div class="border-t border-gray-100 dark:border-gray-800 pt-3 flex items-center justify-end gap-2">
        <button type="button" (click)="close()"
            class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 transition">
            Cancel
        </button>
        <button type="button" (click)="submit()" [disabled]="!canSubmit"
            class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
            <i-feather [name]="submitting ? 'loader' : 'calendar'" [ngClass]="{'animate-spin': submitting}" style="width:13px;height:13px;"></i-feather>
            {{ submitting ? 'Creating…' : 'Create & confirm' }}
        </button>
    </div>

</div>
