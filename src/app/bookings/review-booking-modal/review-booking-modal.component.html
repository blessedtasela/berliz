<div class="font-sans flex flex-col gap-4 p-1 max-w-sm w-full">

    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-900">Booking request</h2>
        <button type="button" (click)="close()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center">
            <i-feather name="x" style="width:16px;height:16px;"></i-feather>
        </button>
    </div>

    <div class="flex items-center gap-3">
        <img [src]="clientPhotoSrc" onerror="this.src='../../../assets/icons/user.png';"
            class="w-14 h-14 rounded-full object-cover object-top border border-gray-200 shrink-0" alt="Client photo" />
        <div class="min-w-0">
            <p class="text-sm font-semibold text-gray-900 truncate">{{ clientName }}</p>
            <p class="text-[11px] text-gray-400 truncate">{{ booking.clientEmail }}</p>
            <a *ngIf="clientProfileUrl" [href]="clientProfileUrl" target="_blank" rel="noopener"
                class="text-[11px] font-semibold text-red-600 hover:text-red-700 inline-flex items-center gap-1 mt-0.5">
                View profile
                <i-feather name="arrow-up-right" style="width:10px;height:10px;"></i-feather>
            </a>
        </div>
    </div>

    <div class="border-t border-gray-100 pt-3 flex flex-col gap-2 text-[11px] text-gray-600">
        <div class="flex items-center gap-1.5">
            <i-feather name="calendar" style="width:12px;height:12px;" class="text-gray-400"></i-feather>
            {{ booking.scheduledAt | date:'fullDate' }}
        </div>
        <div class="flex items-center gap-1.5">
            <i-feather name="clock" style="width:12px;height:12px;" class="text-gray-400"></i-feather>
            {{ booking.scheduledAt | date:'shortTime' }} &middot; {{ booking.durationMinutes }} minutes
        </div>
        <div *ngIf="booking.notes" class="flex items-start gap-1.5">
            <i-feather name="file-text" style="width:12px;height:12px;" class="text-gray-400 mt-0.5"></i-feather>
            <span class="italic">"{{ booking.notes }}"</span>
        </div>
    </div>

    <div class="border-t border-gray-100 pt-3 flex items-center justify-end gap-2">
        <button type="button" (click)="decline()"
            class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
            Decline
        </button>
        <button type="button" (click)="confirm()"
            class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold hover:bg-red-700 active:scale-[0.98] transition">
            Confirm booking
        </button>
    </div>

</div>
