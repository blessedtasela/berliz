<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
            <i-feather name="heart" class="text-red-600" style="width:16px;height:16px;"></i-feather>
        </div>
        <div>
            <h1 class="text-sm font-bold text-gray-900 dark:text-gray-100">Liked trainers</h1>
            <p class="text-[11px] text-gray-400 dark:text-gray-500">Trainers you've liked — not every trainer on Berliz</p>
        </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 dark:text-gray-600 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && likes.length === 0"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800">
        <div class="w-14 h-14 rounded-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center">
            <i-feather name="heart" class="text-gray-300 dark:text-gray-600" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400 dark:text-gray-500">You haven't liked any trainers yet.</p>
        <a [routerLink]="['/dashboard/find-providers']"
            class="text-xs font-semibold text-red-600 hover:text-red-700 transition">Browse trainers</a>
    </div>

    <!-- List -->
    <div *ngIf="!loading && likes.length > 0" class="flex flex-col bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 divide-y divide-gray-100 dark:divide-gray-800 overflow-hidden">
        <div *ngFor="let like of likes" class="flex items-center gap-3 px-4 py-3 transition-opacity"
            [class.opacity-40]="removingId === like.trainerId">

            <a [routerLink]="['/dashboard/find-trainers', slugFor(like.trainerName)]" class="shrink-0">
                <img [src]="photoUrl(like)" [alt]="like.trainerName" (error)="$any($event.target).src = 'assets/avatar.png'"
                    class="w-9 h-9 rounded-full object-cover object-top border border-gray-200 dark:border-gray-700" />
            </a>

            <div class="min-w-0 flex-1">
                <a [routerLink]="['/dashboard/find-trainers', slugFor(like.trainerName)]"
                    class="text-sm font-semibold text-gray-900 dark:text-gray-100 hover:text-red-600 transition truncate block">
                    {{ like.trainerName }}
                </a>
                <p class="text-[11px] text-gray-400 dark:text-gray-500">Liked {{ like.date | date:'mediumDate' }}</p>
            </div>

            <button type="button" (click)="unlike(like.trainerId)" [disabled]="removingId === like.trainerId"
                title="Unlike"
                class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition shrink-0 disabled:cursor-not-allowed">
                <i-feather name="heart" class="text-red-600 fill-current" style="width:15px;height:15px;"></i-feather>
            </button>
        </div>
    </div>

</section>
