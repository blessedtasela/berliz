<!-- Hidden entirely until there's somewhere in-app to go back to, and entirely
     off when the user has chosen 'off' in Settings -> In-app navigation. -->
<ng-container *ngIf="canGoBack && style !== 'off'">

    <!-- ═══════════ BUTTON STYLE — collapsed peek tab (docked) ═══════════
         Dragged to a screen edge and left there. Tap to bring the full pill
         back — no drag-to-reposition on the tab itself, on purpose: it's a
         tiny target, so "tap to restore, then drag the full pill" is more
         reliable than expecting a precise drag out of the corner. -->
    <button *ngIf="style === 'button' && docked" type="button" (click)="onDockedTabClick()"
        [style.top.px]="dockY" [ngClass]="docked === 'left' ? 'left-0 rounded-r-full pl-1 pr-2' : 'right-0 rounded-l-full pr-1 pl-2'"
        title="Show navigation button" aria-label="Show in-app navigation button"
        class="fixed z-40 py-3 bg-white/70 backdrop-blur-md border border-gray-200/70 shadow-lg
               flex items-center justify-center text-gray-400 hover:text-red-600 hover:bg-white/90 transition">
        <i-feather [name]="docked === 'left' ? 'chevron-right' : 'chevron-left'" style="width:14px;height:14px;"></i-feather>
    </button>

    <!-- ═══════════ BUTTON STYLE — full pill ═══════════
         Frosted glass, not a solid fill, so it never fully hides whatever it's
         sitting on top of. Anchored bottom-left; cdkDrag's free-position offset
         (persisted per-device) is what actually places it, so a user can drag
         it anywhere and it'll stay there next time. A thin center bar reads as
         a grab handle, same visual language as an iOS control-center pill.
         mousedown/touchstart start the long-press timer alongside (not instead
         of) cdkDrag's own listeners on the same element. -->
    <div *ngIf="style === 'button' && !docked" cdkDrag cdkDragBoundary="body" [cdkDragFreeDragPosition]="dragPosition"
        (mousedown)="onPressStart()" (touchstart)="onPressStart()" (mouseup)="onPressEnd()" (touchend)="onPressEnd()"
        (cdkDragStarted)="onDragStarted($event)" (cdkDragMoved)="onDragMoved($event)" (cdkDragEnded)="onDragEnded($event)"
        [ngClass]="[pillClasses, dismissArmed ? 'ring-2 ring-red-400 scale-95' : '']"
        class="fixed z-40 left-4 bottom-6 flex items-center gap-1 px-1.5 py-1.5 rounded-full
               shadow-lg cursor-grab active:cursor-grabbing select-none transition-transform">

        <button type="button" (click)="goBack()" title="Back" aria-label="Go back" class="w-9 h-9 rounded-full flex items-center justify-center text-red-600
                   hover:bg-red-50/70 active:scale-90 transition">
            <i-feather name="chevron-left" style="width:18px;height:18px;"></i-feather>
        </button>

        <div class="w-6 h-1 rounded-full bg-gray-300/70 shrink-0"></div>

        <!-- Forward has nothing to do until back has actually been used once. -->
        <button *ngIf="hasGoneBack" type="button" (click)="goForward()" title="Forward" aria-label="Go forward" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-500
                   hover:bg-gray-100/70 active:scale-90 transition">
            <i-feather name="chevron-right" style="width:18px;height:18px;"></i-feather>
        </button>
    </div>

    <!-- Drag-to-dismiss target -- only rendered while a long-press has armed it,
         mid-drag. Brightens/scales up once the pointer is close enough that
         releasing here would actually hide the control (see onDragMoved). -->
    <div *ngIf="style === 'button' && dismissArmed" #dismissTarget
        class="fixed z-40 left-1/2 bottom-24 -translate-x-1/2 w-16 h-16 rounded-full border-2 border-white shadow-xl
               flex items-center justify-center transition-all pointer-events-none"
        [ngClass]="dismissHover ? 'bg-red-600 scale-110' : 'bg-red-500/80 scale-100'">
        <i-feather name="x" class="text-white" style="width:26px;height:26px;"></i-feather>
    </div>

    <!-- 'swipe' style has no visible element at all — see the component's
         window:touchstart/touchend listeners for the edge-swipe gesture.
         'off' renders nothing, matched by the *ngIf on the outer ng-container. -->
</ng-container>
