<!-- Hidden entirely until there's somewhere in-app to go back to -- not a
     permanent fixture. Same floating-circle language as the scroll-to-top
     and message-popup buttons (solid red-600, white icon, shadow-xl)
     instead of a generic pill, so it actually reads as part of this app. -->
<div *ngIf="canGoBack" class="fixed top-20 left-3 z-40 flex items-center gap-2">

    <button type="button" (click)="goBack()" title="Back" aria-label="Go back"
        class="w-10 h-10 rounded-full bg-red-600 text-white shadow-xl flex items-center justify-center hover:bg-red-700 active:scale-95 transition">
        <i-feather name="chevron-left" style="width:18px;height:18px;"></i-feather>
    </button>

    <!-- Forward has nothing to do until back has actually been used once. -->
    <button *ngIf="hasGoneBack" type="button" (click)="goForward()" title="Forward" aria-label="Go forward"
        class="w-10 h-10 rounded-full bg-white text-red-600 border border-gray-200 shadow-xl flex items-center justify-center hover:bg-gray-50 active:scale-95 transition">
        <i-feather name="chevron-right" style="width:18px;height:18px;"></i-feather>
    </button>

</div>
