<div class="p-6 w-full max-w-2xl mx-auto flex flex-col gap-5 font-sans">

    <h1 class="text-xl font-bold text-gray-900">Legal & Policies</h1>
    <p class="text-sm text-gray-500">Review Berliz’s terms, policies, and community standards.</p>

    <div class="flex flex-col gap-3">

        <!-- Terms of Service -->
        <button
            class="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition"
            (click)="open('terms')">

            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center">
                    <i-feather name="file-text" class="text-red-600" style="width:18px;height:18px;"></i-feather>
                </div>

                <div class="text-left">
                    <p class="text-sm font-semibold text-gray-800">Terms of Service</p>
                    <p class="text-[11px] text-gray-400">Your agreement with Berliz</p>
                </div>
            </div>

            <i-feather name="chevron-right" class="text-gray-400" style="width:16px;height:16px;"></i-feather>
        </button>

        <!-- Community Guidelines -->
        <button
            class="w-full flex items-center justify-between px-4 py-3 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 transition"
            (click)="open('guidelines')">

            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center">
                    <i-feather name="shield" class="text-red-600" style="width:18px;height:18px;"></i-feather>
                </div>

                <div class="text-left">
                    <p class="text-sm font-semibold text-gray-800">Community Guidelines</p>
                    <p class="text-[11px] text-gray-400">Rules for safe participation</p>
                </div>
            </div>

            <i-feather name="chevron-right" class="text-gray-400" style="width:16px;height:16px;"></i-feather>
        </button>

    </div>

    <!-- Child component -->
    <app-legal-details *ngIf="activeSection" [section]="activeSection" (close)="activeSection = null">
    </app-legal-details>

</div>
