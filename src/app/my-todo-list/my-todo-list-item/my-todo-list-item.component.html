<div class="p-3 border border-gray-200 rounded-xl bg-white
         hover:shadow-sm hover:-translate-y-0.5 transition
         cursor-pointer flex flex-col gap-2" (click)="open.emit(todo)">

    <!-- Top row: task + menu -->
    <div class="flex justify-between items-start gap-3">

        <div class="flex-1">
            <div class="text-gray-900 font-medium text-sm md:text-base leading-snug break-all hyphens-auto"
                [innerHTML]="highlight(todo.task)">
            </div>

            <div class="mt-1 text-xs text-gray-500 flex flex-wrap gap-2 items-center">
                <span>Created by {{ todo.user.firstname }} {{ todo.user.lastname }}</span>
                <span>•</span>
                <span>Created {{ todo.date | date:'mediumDate' }}</span>
                <span>•</span>
                <span>Updated {{ todo.lastUpdate | date:'mediumDate' }}</span>
            </div>
        </div>

        <!-- Right: status + menu -->
        <div class="flex flex-col items-end gap-2">

            <!-- Status pill -->
            <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold" [ngClass]="{
          'bg-green-100 text-green-700': todo.status === 'completed',
          'bg-blue-100 text-blue-700': todo.status === 'in-progress',
          'bg-red-100 text-red-700': todo.status === 'pending',
          'bg-gray-200 text-gray-700': todo.status === 'cancelled'
        }">
                {{ todo.status }}
            </span>

            <!-- Menu -->
            <div class="relative">
                <i-feather name="more-horizontal" class="cursor-pointer text-gray-600 hover:text-gray-900"
                    (click)="toggleMenu($event); ">
                </i-feather>

                <div *ngIf="menuOpen" (click)="$event.stopPropagation()"
                    class="absolute right-0 mt-2 w-40 bg-white border border-gray-200 rounded-lg shadow-lg z-20 text-sm py-1">

                    <button class="w-full text-left px-3 py-1.5 hover:bg-gray-50" (click)="onEdit($event)">
                        Edit
                    </button>

                    <button class="w-full text-left px-3 py-1.5 hover:bg-gray-50" (click)="onMarkComplete($event)">
                        Mark as completed
                    </button>

                    <button class="w-full text-left px-3 py-1.5 text-red-600 hover:bg-red-50"
                        (click)="onDelete($event)">
                        Delete
                    </button>

                </div>
            </div>

        </div>
    </div>

    <!-- Bottom row: due + priority -->
    <div class="flex justify-between items-center mt-1 text-xs text-gray-500">

        <div>
            Due {{ todo.dueDate | date:'mediumDate' }}
        </div>

        <!-- Priority badge (Berliz theme) -->
        <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold" [ngClass]="{
        'bg-emerald-100 text-emerald-700': todo.priority === 'low',
        'bg-sky-100 text-sky-700': todo.priority === 'normal',
        'bg-red-100 text-red-700 border border-red-300': todo.priority === 'high'
      }">
            {{ todo.priority | titlecase }}
        </span>

    </div>

</div>
