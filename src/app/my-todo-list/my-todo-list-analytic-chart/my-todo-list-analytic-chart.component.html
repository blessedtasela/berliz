<!-- chart -->
<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-2xl p-4 font-sans flex flex-col max-h-[350px] gap-3 h-full">

    <!-- Header -->
    <div class="flex justify-between items-center">
        <h3 class="text-sm font-semibold text-gray-800 dark:text-gray-200">Task breakdown</h3>
        <span class="text-[10px] text-gray-400 dark:text-gray-500 font-medium">{{ todos.length }} total</span>
    </div>

    <!-- Legend pills -->
    <div class="flex flex-wrap gap-2">

        <span
            class="flex items-center gap-1 text-[10px] font-semibold text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-950/30 border border-green-100 dark:border-green-900 px-2 py-0.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span>
            Completed
        </span>

        <span
            class="flex items-center gap-1 text-[10px] font-semibold text-blue-700 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900 px-2 py-0.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-blue-500 inline-block"></span>
            In Progress
        </span>

        <span
            class="flex items-center gap-1 text-[10px] font-semibold text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900 px-2 py-0.5 rounded-full">
            <span class="w-2 h-2 rounded-full bg-red-500 inline-block"></span>
            Pending
        </span>

    </div>

    <!-- Chart -->
    <div class="relative flex-1 min-h-[160px]">
        <canvas #todoChart></canvas>
    </div>

</div>
