<div class="bg-white border rounded-2xl p-4">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-3">
        <button (click)="prevMonth()">←</button>

        <h3 class="text-sm font-semibold">
            {{ currentDate | date:'MMMM yyyy' }} 🔥
        </h3>

        <button (click)="nextMonth()">→</button>
    </div>

    <!-- DAYS LABEL -->
    <div class="grid grid-cols-7 text-[10px] text-gray-500 mb-1">
        <div>Su</div>
        <div>Mo</div>
        <div>Tu</div>
        <div>We</div>
        <div>Th</div>
        <div>Fr</div>
        <div>Sa</div>
    </div>

    <!-- GRID -->
    <div class="grid grid-cols-7 gap-1">

        <ng-container *ngFor="let week of weeks">

            <ng-container *ngFor="let day of week">

                <div class="w-7 h-7 rounded-md flex items-center justify-center text-[9px] font-bold cursor-pointer"
                    [ngClass]="day.intensity" [title]="day.label" [class.opacity-30]="!day.inMonth">

                    <span *ngIf="day.isStreak">🔥</span>

                    <span *ngIf="!day.isStreak && day.count > 0">
                        {{ day.count }}
                    </span>

                </div>

            </ng-container>

        </ng-container>

    </div>
</div>
