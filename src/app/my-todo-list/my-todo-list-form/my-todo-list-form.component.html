<section class="bg-white border border-gray-200 rounded-2xl shadow-sm p-6 font-sans">

    <header class="text-center mb-6">
        <h1 class="text-2xl font-extrabold text-gray-900">Add a New Task</h1>
        <p class="text-sm text-red-600 italic">Stay disciplined. Stay consistent.</p>
    </header>

    <form [formGroup]="addTodoForm" (ngSubmit)="addTodo()" class="space-y-5">

        <!-- Task -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Task</label>
            <input formControlName="task" type="text" placeholder="e.g. 50 pushups daily for 30 days" class="w-full px-4 py-2 rounded-lg border text-sm
               focus:ring-1 focus:ring-red-500 focus:border-red-500
               transition-all" [ngClass]="{
    'border-red-500': isInvalid('task'),
    'border-gray-300': !isInvalid('task')
  }" />
            <p *ngIf="addTodoForm.get('task')?.invalid && addTodoForm.get('task')?.dirty"
                class="text-red-500 text-xs mt-1">
                Must be at least 20 characters
            </p>
        </div>

        <!-- Due Date -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Due Date</label>
            <input formControlName="dueDate" type="date" class="w-full px-4 py-2 rounded-lg border text-sm
               focus:ring-1 focus:ring-red-500 focus:border-red-500
               transition-all" [ngClass]="{
    'border-red-500': isInvalid('dueDate'),
    'border-gray-300': !isInvalid('dueDate')
  }" />
            <p *ngIf="addTodoForm.get('dueDate')?.invalid && addTodoForm.get('dueDate')?.dirty"
                class="text-red-500 text-xs mt-1">
                Please select a due date
            </p>
        </div>

        <!-- Priority -->
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">
                Priority
            </label>

            <div class="flex gap-2">

                <button type="button" (click)="setPriority('low')"
                    class="px-3 py-1 rounded-full text-xs font-semibold border transition" [ngClass]="{
                'bg-green-100 text-green-700 border-green-300': addTodoForm.value.priority === 'low',
                'bg-white text-gray-600 border-gray-300': addTodoForm.value.priority !== 'low' 
                
            }">
                    Low
                </button>

                <button type="button" (click)="setPriority('normal')"
                    class="px-3 py-1 rounded-full text-xs font-semibold border transition" [ngClass]="{
                'bg-gray-100 text-gray-800 border-gray-300': addTodoForm.value.priority === 'normal',
                'bg-white text-gray-600 border-gray-300': addTodoForm.value.priority !== 'normal'
            }">
                    Normal
                </button>

                <button type="button" (click)="setPriority('high')"
                    class="px-3 py-1 rounded-full text-xs font-semibold border transition" [ngClass]="{
                'bg-red-100 text-red-700 border-red-300': addTodoForm.value.priority === 'high',
                'bg-white text-gray-600 border-gray-300': addTodoForm.value.priority !== 'high'
            }">
                    High 🔥
                </button>

            </div>
            <div *ngIf="isInvalid('priority') || addTodoForm.get('priority')?.dirty" class="text-red-500 text-xs mt-1">
                Please select a priority
            </div>
        </div>

        <!-- Submit -->
        <button type="submit"
            class="w-full bg-red-600 hover:bg-red-700 text-white py-2.5 rounded-lg font-semibold text-sm transition-all">
            Add Task
        </button>

    </form>

</section>
