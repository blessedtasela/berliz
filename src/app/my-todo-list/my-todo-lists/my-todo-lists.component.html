<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 font-sans">

  <app-my-todo-list-header [startIndex]="startIndex" [endIndex]="endIndex" [total]="total" [selectAll]="selectAll"
    (toggleSelectAll)="toggleSelectAll.emit()" (bulkAction)="bulkAction.emit($event)" (prev)="prev.emit()"
    [selectionMode]="selectionMode" (next)="next.emit()">
  </app-my-todo-list-header>

  <!-- ONLY ONE SOURCE OF RENDERING -->
  <app-my-todo-list-section *ngFor="let section of sections" [label]="section.label" [items]="section.items"
    [searchQuery]="searchQuery" [selectionMode]="selectionMode" (openTodo)="openTodo.emit($event)"
    (toggleTodo)="toggleTodo.emit($event)" (editTodo)="editTodo.emit($event)" (deleteTodo)="deleteTodo.emit($event)"
    (quickAction)="quickAction.emit($event)">
  </app-my-todo-list-section>


  <!-- 🔥 CLEAN PAGINATION (CENTERED BETWEEN END + FOOTER SPACE) -->
  <div class="sticky bottom-0 z-20 bg-white border-t border-gray-200 px-4 py-3">

    <div class="flex items-center justify-center gap-6 text-xs text-gray-600">

      <button class="px-3 py-1 border rounded-md hover:bg-gray-50 disabled:opacity-40" (click)="prev.emit()"
        [disabled]="startIndex === 1">
        Prev
      </button>

      <div class="font-medium text-gray-700">
        {{ startIndex }} - {{ endIndex }} of {{ total }}
      </div>

      <button class="px-3 py-1 border rounded-md hover:bg-gray-50 disabled:opacity-40" (click)="next.emit()"
        [disabled]="endIndex === total">
        Next
      </button>

    </div>

  </div>
