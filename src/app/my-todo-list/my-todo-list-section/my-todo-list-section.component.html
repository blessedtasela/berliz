<div class="mb-4">

  <!-- HEADER -->
  <div class="text-xs font-semibold text-gray-500 uppercase mb-2">
    {{ label }}
  </div>

  <!-- ITEMS -->
  <div class="flex flex-col gap-2">

    <app-my-todo-list-item
      *ngFor="let todo of items"
      [todo]="todo"
      [searchQuery]="searchQuery"
      (open)="openTodo.emit($event)"
      (toggle)="toggleTodo.emit($event)"
      (edit)="editTodo.emit($event)"
      (delete)="deleteTodo.emit($event)"
      (quickAction)="quickAction.emit($event)"
      [selectionMode]="selectionMode">
    </app-my-todo-list-item>

  </div>

</div>
