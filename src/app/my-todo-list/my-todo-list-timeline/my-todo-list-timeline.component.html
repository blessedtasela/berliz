<div class="bg-white border rounded-2xl p-4 font-sans">

    <h3 class="text-sm font-semibold mb-3">Timeline</h3>

    <!-- scroll container -->
    <div class="relative max-h-[180px] overflow-y-auto pr-2">

        <div class="absolute left-3 top-0 bottom-0 w-px bg-gray-200"></div>

        <div *ngFor="let t of sortedTodos.slice(0, 10)" class="relative pl-8 pb-4">

            <div class="absolute left-2 top-2 w-2 h-2 rounded-full bg-red-600"></div>

            <p class="font-medium text-sm break-all">{{ t.task }}</p>
            <p class="text-xs text-gray-500">{{ t.date | date:'medium' }}</p>

        </div>

    </div>

</div>
