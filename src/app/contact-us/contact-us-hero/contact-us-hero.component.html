<!-- ═══════════════════════════════════════════════
     CONTACT US HERO — full-width cinematic banner
     Dark overlay on a background image, red accent
════════════════════════════════════════════════ -->
<section class="relative w-full h-72 sm:h-80 overflow-hidden font-sans">

    <!-- Background image -->
    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
        style="background-image: url('assets/landing/hero-bg-4.jpg');">
    </div>

    <!-- Dark gradient overlay -->
    <div class="absolute inset-0"
        style="background: linear-gradient(135deg, rgba(0,0,0,0.82) 0%, rgba(80,0,0,0.55) 60%, rgba(0,0,0,0.75) 100%);">
    </div>

    <!-- Content -->
    <div class="relative z-10 flex flex-col items-center justify-center h-full gap-3 px-4 text-center">

        <!-- Eyebrow -->
        <span class="text-[11px] font-bold tracking-[0.2em] uppercase text-red-400">
            We're listening
        </span>

        <!-- Title -->
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
            Contact <span class="text-red-500">Us</span>
        </h1>

        <!-- Sub -->
        <p class="text-sm text-zinc-300 max-w-md leading-relaxed">
            Questions, feedback or partnership ideas — send them our way and we'll get back to you.
        </p>

        <!-- Red rule accent -->
        <div class="w-12 h-0.5 bg-red-600 rounded-full mt-1"></div>

    </div>
</section>
