<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div class="text-xs font-semibold text-gray-500">
        Showing <span class="text-gray-900">{{ totalMembers }}</span> of <span class="text-gray-900">{{ membersLength }}</span> results
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1.5">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Sort</span>
            <select [(ngModel)]="selectedSortOption" (change)="onSortOptionChange($event)"
                class="px-3 py-1.5 rounded-xl border border-gray-200 bg-gray-50 text-xs text-gray-700
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
                <option value="date">Date added</option>
                <option value="name">Name</option>
                <option value="id">Category id</option>
                <option value="tag">Tag</option>
                <option value="lastUpdate">Last update</option>
            </select>
        </div>
        <button type="button" (click)="openAddCategory()"
            class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold
                   hover:bg-red-700 active:scale-[0.98] transition">
            <i-feather name="plus" style="width:13px;height:13px;"></i-feather>
            Add member
        </button>
    </div>
</div>
