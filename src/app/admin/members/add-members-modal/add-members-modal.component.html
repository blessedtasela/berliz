<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
                <i-feather name="user-plus" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Add a member</h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Set up a member profile for an existing user.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addMemberForm" class="flex flex-col gap-4">

        <p *ngIf="addMemberForm.invalid && invalidForm"
            class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all required fields
        </p>

        <!-- User -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">User</label>
            <select formControlName="userId" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addMemberForm.get('userId')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'">
                <option value="" selected hidden>Select a user</option>
                <option *ngFor="let user of users" [value]="user.id">{{ user.firstname }} {{ user.lastname }} — {{ user.email }}</option>
            </select>
            <p *ngIf="addMemberForm.get('userId')?.invalid && invalidForm"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select a user
            </p>
        </div>

        <!-- Height / Weight / Target weight -->
        <div class="grid grid-cols-3 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Height (cm)</label>
                <input formControlName="height" type="number" min="1" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="addMemberForm.get('height')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Weight (kg)</label>
                <input formControlName="weight" type="number" min="1" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="addMemberForm.get('weight')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Target (kg)</label>
                <input formControlName="targetWeight" type="number" min="1" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="addMemberForm.get('targetWeight')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'">
            </div>
        </div>

        <!-- Motivation -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Motivation</label>
            <textarea formControlName="motivation" rows="3" placeholder="What are they working toward?" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addMemberForm.get('motivation')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'"></textarea>
            <p *ngIf="addMemberForm.get('motivation')?.invalid && invalidForm"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Write at least 10 characters
            </p>
        </div>

        <!-- Medical conditions -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Medical conditions</label>
            <input formControlName="medicalConditions" type="text" placeholder="None" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
        </div>

        <!-- Categories -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Categories of interest</label>
            <div class="flex flex-wrap gap-2">
                <label *ngFor="let category of categories" class="cursor-pointer">
                    <input type="checkbox" (change)="onCategoryToggle(category.id, $event)" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                               bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                               peer-checked:bg-red-50 dark:peer-checked:bg-red-950/20 peer-checked:border-red-200 dark:peer-checked:border-red-900 peer-checked:text-red-600 dark:peer-checked:text-red-400">
                        {{ category.name }}
                    </span>
                </label>
            </div>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300
                       hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" [disabled]="submitting" (click)="addMember()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                       disabled:opacity-50 disabled:cursor-not-allowed">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                {{ submitting ? 'Adding…' : 'Add member' }}
            </button>
        </div>

    </form>

</div>
