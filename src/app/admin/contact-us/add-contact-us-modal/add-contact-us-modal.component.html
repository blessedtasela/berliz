<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
                <i-feather name="message-square" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">We want to hear from you</h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Technical concerns, feedback or questions about our plans.
                </p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="contactUsForm" class="flex flex-col gap-4">

        <!-- Form-level banner -->
        <p *ngIf="contactUsForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 text-[11px] flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all sections
        </p>
        <p *ngIf="!contactUsForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-green-50 dark:bg-green-950/30 border border-green-200 dark:border-green-900 text-green-700 dark:text-green-400 text-[11px] flex items-center gap-1.5">
            <i-feather name="check" style="width:12px;height:12px;"></i-feather>
            Everything looks good
        </p>

        <!-- Name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Full name</label>
            <input formControlName="name" placeholder="Full name" type="text" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20': contactUsForm.get('name')?.invalid && contactUsForm.get('name')?.touched,
                    'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(contactUsForm.get('name')?.invalid && contactUsForm.get('name')?.touched)
                  }">
            <p *ngIf="contactUsForm.get('name')?.invalid && contactUsForm.get('name')?.dirty"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter your full name
            </p>
        </div>

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Email</label>
            <input formControlName="email" placeholder="example@gmail.com" type="email" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20': contactUsForm.get('email')?.invalid && contactUsForm.get('email')?.touched,
                    'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(contactUsForm.get('email')?.invalid && contactUsForm.get('email')?.touched)
                  }">
            <p *ngIf="contactUsForm.get('email')?.invalid && contactUsForm.get('email')?.dirty"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Invalid email
            </p>
        </div>

        <!-- Message -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Message</label>
            <textarea formControlName="message" placeholder="Leave your message here" rows="5" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20': contactUsForm.get('message')?.invalid && contactUsForm.get('message')?.touched,
                    'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(contactUsForm.get('message')?.invalid && contactUsForm.get('message')?.touched)
                  }"></textarea>
            <p *ngIf="contactUsForm.get('message')?.invalid && contactUsForm.get('message')?.dirty"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Message must be at least 20 characters
            </p>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" (click)="submitForm()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Send Message
            </button>
        </div>

    </form>

</div>
