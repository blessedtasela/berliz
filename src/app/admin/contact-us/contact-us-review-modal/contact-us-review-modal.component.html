<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
                <i-feather name="message-square" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Review message</h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Reply to this enquiry as an admin.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <!-- Original submission (read-only) -->
    <div class="flex flex-col gap-2" *ngIf="contactUs">
        <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Original message</span>
        <div class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl divide-y divide-gray-100 dark:divide-gray-800">
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">From</span>
                <span class="text-xs font-medium text-gray-900 dark:text-gray-100 text-right">{{ contactUs.name }}</span>
            </div>
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Email</span>
                <a href="mailto:{{ contactUs.email }}"
                    class="text-xs font-medium text-red-600 hover:text-red-700 transition text-right">{{ contactUs.email
                    }}</a>
            </div>
            <div class="px-4 py-3">
                <p class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed">{{ contactUs.message }}</p>
            </div>
        </div>
    </div>

    <div class="border-t border-gray-100 dark:border-gray-800"></div>

    <form [formGroup]="reviewContactUsForm" class="flex flex-col gap-4">

        <!-- Form-level banner -->
        <p *ngIf="reviewContactUsForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-red-50 dark:bg-red-950/20 border border-red-200 dark:border-red-900 text-red-600 dark:text-red-400 text-[11px] flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all sections
        </p>
        <p *ngIf="!reviewContactUsForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-green-50 dark:bg-green-950/30 border border-green-200 dark:border-green-900 text-green-700 dark:text-green-400 text-[11px] flex items-center gap-1.5">
            <i-feather name="check" style="width:12px;height:12px;"></i-feather>
            Everything looks good
        </p>

        <!-- Saved subject -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Saved subject</label>
            <select formControlName="savedSubject" [(ngModel)]="selectedSubject" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option selected hidden>You can select a message subject</option>
                <option *ngFor="let message of savedMessages">{{ message.subject }}</option>
            </select>
        </div>

        <!-- Subject -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Subject</label>
            <input formControlName="subject" [(ngModel)]="selectedSubject" placeholder="Email subject" type="text" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20': reviewContactUsForm.get('subject')?.invalid && reviewContactUsForm.get('subject')?.touched,
                    'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(reviewContactUsForm.get('subject')?.invalid && reviewContactUsForm.get('subject')?.touched)
                  }">
            <p *ngIf="reviewContactUsForm.get('subject')?.invalid && reviewContactUsForm.get('subject')?.dirty"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Subject must be at least 12 characters
            </p>
        </div>

        <!-- Saved body -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Saved reply</label>
            <select formControlName="savedBody" [(ngModel)]="selectedMessage" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option selected hidden>You can select a saved message</option>
                <option *ngFor="let message of savedMessages">{{ message.message }}</option>
            </select>
        </div>

        <!-- Body -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Reply</label>
            <textarea formControlName="body" [(ngModel)]="selectedMessage"
                placeholder="Greetings and headers are added for you — go straight to composing the reply" rows="6"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20': reviewContactUsForm.get('body')?.invalid && reviewContactUsForm.get('body')?.touched,
                    'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(reviewContactUsForm.get('body')?.invalid && reviewContactUsForm.get('body')?.touched)
                  }"></textarea>
            <p *ngIf="reviewContactUsForm.get('body')?.invalid && reviewContactUsForm.get('body')?.dirty"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Reply must be at least 50 characters
            </p>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" (click)="reviewContactUs()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Send Reply
            </button>
        </div>

    </form>

</div>
