<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div class="text-xs font-semibold text-gray-500 dark:text-gray-400">
        Showing <span class="text-gray-900 dark:text-gray-100">{{ totalExercises }}</span> of <span class="text-gray-900 dark:text-gray-100">{{ exercisesLength }}</span> results
    </div>
    <div class="flex items-center gap-2 flex-wrap">
        <div class="flex items-center gap-1.5">
            <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Sort</span>
            <select [(ngModel)]="selectedSortOption" (change)="onSortOptionChange($event)"
                class="px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-xs text-gray-700 dark:text-gray-300
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
                <option value="date">Date added</option>
                <option value="name">Name</option>
                <option value="bodyPart">Body part</option>
                <option value="id">Category id</option>
                <option value="exercise">Exercise</option>
                <option value="lastUpdate">Last update</option>
            </select>
        </div>
        <a routerLink="/dashboard/hub/exercise-suggestions"
            class="relative flex items-center gap-1.5 px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 text-xs font-semibold
                   hover:bg-gray-50 dark:hover:bg-gray-800 transition">
            <i-feather name="git-pull-request" style="width:13px;height:13px;"></i-feather>
            Suggestions
            <span *ngIf="whatsNew.isNew('exercise-suggestions')"
                class="absolute -top-1.5 -right-1.5 bg-red-600 text-white text-[8px] font-bold px-1.5 py-0.5 rounded-full border-2 border-white dark:border-gray-900 leading-none">
                NEW
            </span>
        </a>
        <button type="button" (click)="openAddExercise()"
            class="flex items-center gap-1.5 px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold
                   hover:bg-red-700 active:scale-[0.98] transition">
            <i-feather name="plus" style="width:13px;height:13px;"></i-feather>
            Add Exercise
        </button>
    </div>
</div>
