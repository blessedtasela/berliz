<div class="max-w-2xl w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="activity" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Add a new exercise</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Provide the exercise details, demo and its categories.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addExerciseForm" class="flex flex-col gap-4">

        <!-- Form-level banner -->
        <p *ngIf="addExerciseForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-red-50 border border-red-200 text-red-600 text-[11px] flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all sections
        </p>
        <p *ngIf="!addExerciseForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-green-50 border border-green-200 text-green-700 text-[11px] flex items-center gap-1.5">
            <i-feather name="check" style="width:12px;height:12px;"></i-feather>
            Everything looks good
        </p>

        <!-- Name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Exercise name</label>
            <input formControlName="name" placeholder="Exercise name" type="text" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': addExerciseForm.get('name')?.invalid && (addExerciseForm.get('name')?.touched || invalidForm),
                    'border-gray-200 bg-gray-50': !(addExerciseForm.get('name')?.invalid && (addExerciseForm.get('name')?.touched || invalidForm))
                  }">
            <p *ngIf="addExerciseForm.get('name')?.invalid && (addExerciseForm.get('name')?.dirty || invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Exercise name is required
            </p>
        </div>

        <!-- Demo video -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Demo video</label>
            <div class="flex items-center gap-3">
                <div
                    class="w-16 h-16 rounded-xl border border-gray-200 bg-gray-50 flex items-center justify-center shrink-0 text-gray-400">
                    <i-feather name="video" style="width:18px;height:18px;"></i-feather>
                </div>
                <input formControlName="demo" (change)="onVideoSelected($event)" type="file" accept="video/*" class="block w-full text-xs text-gray-500 cursor-pointer
                           file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold
                           file:bg-red-50 file:text-red-600 hover:file:bg-red-100 file:cursor-pointer transition">
            </div>
            <p *ngIf="addExerciseForm.get('demo')?.invalid && (addExerciseForm.get('demo')?.dirty || invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                A demo video is required
            </p>
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Description</label>
            <textarea formControlName="description" placeholder="Describe how the exercise is performed" rows="4" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': addExerciseForm.get('description')?.invalid && (addExerciseForm.get('description')?.touched || invalidForm),
                    'border-gray-200 bg-gray-50': !(addExerciseForm.get('description')?.invalid && (addExerciseForm.get('description')?.touched || invalidForm))
                  }"></textarea>
            <p *ngIf="addExerciseForm.get('description')?.invalid && (addExerciseForm.get('description')?.dirty || invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Description is required
            </p>
        </div>

        <!-- Muscle groups -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Muscle groups</label>
            <div class="flex flex-wrap gap-1.5">
                <label *ngFor="let muscleGroup of muscleGroups; let i = index" class="cursor-pointer">
                    <input formArrayName="muscleGroupIds" (change)="onMuscleGroupCheckboxChanged($event)"
                        type="checkbox" [value]="muscleGroup.id" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                                 bg-gray-50 border-gray-200 text-gray-600
                                 peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        {{ muscleGroup.name }}
                    </span>
                </label>
            </div>
            <p *ngIf="addExerciseForm.get('muscleGroupIds')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select at least one muscle group
            </p>
        </div>

        <!-- Categories -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Categories</label>
            <div class="flex flex-wrap gap-1.5">
                <label *ngFor="let category of categories; let i = index" class="cursor-pointer">
                    <input formArrayName="categoryIds" (change)="onCategoryCheckboxChanged($event)" type="checkbox"
                        [value]="category.id" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                                 bg-gray-50 border-gray-200 text-gray-600
                                 peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        {{ category.name }}
                    </span>
                </label>
            </div>
            <p *ngIf="addExerciseForm.get('categoryIds')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select at least one category
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" (click)="addExercise()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Add Exercise
            </button>
        </div>

    </form>

</div>
