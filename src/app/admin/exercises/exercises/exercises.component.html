<app-page-header icon="activity" title="Exercises" subtitle="The exercise library"></app-page-header>
<app-admin-search [selector]="selectExercises" [fields]="exerciseSearchFields"
    placeholder="Search exercises..." (results)="handleSearchResults($event)"></app-admin-search>
<app-load-error *ngIf="!loading && loadError && exercisesData.length === 0" title="Couldn't load exercises" [message]="loadError" (retry)="retryLoad()"></app-load-error>
<ng-container *ngIf="exercisesData.length > 0 || (!loading && !loadError)">
<app-exercises-header [exercisesData]="exercisesData" [totalExercises]="totalExercises"
    [exercisesLength]="exercisesLength"></app-exercises-header>
<app-exercises-list [exercisesData]="exercisesData" [totalExercises]="totalExercises"></app-exercises-list>
</ng-container>
