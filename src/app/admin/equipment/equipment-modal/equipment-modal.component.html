<div class="font-sans flex flex-col gap-4 p-1">

    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-900">{{ isEdit ? 'Update equipment' : 'Add equipment' }}</h2>
        <button type="button" (click)="closeDialog()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center">
            <i-feather name="x" style="width:16px;height:16px;"></i-feather>
        </button>
    </div>

    <form *ngIf="form" [formGroup]="form" (ngSubmit)="save()" class="flex flex-col gap-3">

        <div *ngIf="invalidForm && form.invalid"
            class="text-[11px] text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all required fields.
        </div>

        <!-- Owner picker (add only) -->
        <div *ngIf="!isEdit" class="flex flex-col gap-2">
            <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Belongs to</label>
            <div class="flex gap-2">
                <button type="button" (click)="setOwnerType('center')"
                    class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition"
                    [ngClass]="form.value.ownerType === 'center' ? 'border-blue-400 bg-blue-50 text-blue-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                    A center
                </button>
                <button type="button" (click)="setOwnerType('trainer')"
                    class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition"
                    [ngClass]="form.value.ownerType === 'trainer' ? 'border-purple-400 bg-purple-50 text-purple-700' : 'border-gray-200 text-gray-600 hover:bg-gray-50'">
                    A trainer
                </button>
            </div>

            <select *ngIf="form.value.ownerType === 'center'" formControlName="centerId"
                class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition">
                <option [ngValue]="null" disabled>Select a center…</option>
                <option *ngFor="let c of centers" [ngValue]="c.id">{{ c.name }}</option>
            </select>

            <select *ngIf="form.value.ownerType === 'trainer'" formControlName="trainerId"
                class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition">
                <option [ngValue]="null" disabled>Select a trainer…</option>
                <option *ngFor="let t of trainers" [ngValue]="t.id">{{ t.name }}</option>
            </select>
        </div>

        <div *ngIf="isEdit" class="text-[11px] text-gray-400 bg-gray-50 border border-gray-100 rounded-xl px-3 py-2">
            Owner can't be changed after creation.
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Name</label>
                <input type="text" formControlName="name" placeholder="Leg press machine"
                    class="w-full px-3 py-2 rounded-xl bg-white border text-sm text-gray-900
                           focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition
                           placeholder:text-gray-400"
                    [ngClass]="form.get('name')?.invalid && (invalidForm || form.get('name')?.dirty) ? 'border-red-300' : 'border-gray-200'" />
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Stock number</label>
                <input type="number" formControlName="stockNumber" placeholder="4"
                    class="w-full px-3 py-2 rounded-xl bg-white border text-sm text-gray-900
                           focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition
                           placeholder:text-gray-400"
                    [ngClass]="form.get('stockNumber')?.invalid && (invalidForm || form.get('stockNumber')?.dirty) ? 'border-red-300' : 'border-gray-200'" />
            </div>

            <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Description</label>
                <textarea formControlName="description" rows="3" placeholder="What this equipment is used for, and who it suits."
                    class="w-full px-3 py-2 rounded-xl bg-white border text-sm text-gray-900 resize-none
                           focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition
                           placeholder:text-gray-400"
                    [ngClass]="form.get('description')?.invalid && (invalidForm || form.get('description')?.dirty) ? 'border-red-300' : 'border-gray-200'"></textarea>
            </div>

            <!-- Image uploads: main (required) + 3 optional angle shots, each uploads to Strapi on select -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:col-span-2">
                <div *ngFor="let field of imageFields" class="flex flex-col gap-1">
                    <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">
                        {{ field === 'imageUrl' ? 'Main photo' : field === 'frontViewUrl' ? 'Front view' : field === 'sideViewUrl' ? 'Side view' : 'Rear view' }}
                    </label>

                    <div class="relative aspect-square rounded-xl border-2 border-dashed overflow-hidden bg-gray-50 flex items-center justify-center"
                        [ngClass]="uploadError[field] ? 'border-red-300' : 'border-gray-200'">

                        <img *ngIf="form.get(field)?.value && !uploading[field]" [src]="form.get(field)?.value | strapiUrl"
                            class="absolute inset-0 w-full h-full object-cover" />

                        <div *ngIf="uploading[field]" class="flex flex-col items-center gap-1 text-gray-400">
                            <i-feather name="loader" class="animate-spin" style="width:16px;height:16px;"></i-feather>
                        </div>

                        <label *ngIf="!form.get(field)?.value && !uploading[field]"
                            class="flex flex-col items-center gap-1 text-gray-400 cursor-pointer w-full h-full justify-center hover:text-gray-500 transition">
                            <i-feather name="upload" style="width:16px;height:16px;"></i-feather>
                            <span class="text-[10px]">Upload</span>
                            <input type="file" accept="image/jpeg,image/png,image/jpg,image/webp" class="hidden"
                                (change)="onFileSelected($event, field)" />
                        </label>

                        <button *ngIf="form.get(field)?.value && !uploading[field]" type="button" (click)="removeImage(field)"
                            title="Remove"
                            class="absolute top-1 right-1 w-5 h-5 rounded-full bg-black/60 hover:bg-black/80 flex items-center justify-center transition">
                            <i-feather name="x" class="text-white" style="width:10px;height:10px;"></i-feather>
                        </button>
                    </div>

                    <p *ngIf="uploadError[field]" class="text-red-500 text-[10px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:10px;height:10px;"></i-feather>
                        {{ uploadError[field] }}
                    </p>
                </div>
            </div>

        </div>

        <div class="border-t border-gray-100 pt-3 flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </button>
            <button type="submit" [disabled]="saving"
                class="px-4 py-2 bg-gray-900 text-white rounded-xl text-xs font-semibold
                       hover:bg-gray-800 active:scale-[0.98] transition flex items-center gap-2 disabled:opacity-40">
                <i-feather name="save" style="width:13px;height:13px;"></i-feather>
                {{ saving ? 'Saving...' : (isEdit ? 'Save changes' : 'Add equipment') }}
            </button>
        </div>

    </form>

</div>
