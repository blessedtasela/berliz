<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="activity" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Update muscle group</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">ID {{ muscleGroupData.id }} &middot; {{
                    muscleGroupData.name }}</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="updateMuscleGroupForm" class="flex flex-col gap-4">

        <input formControlName="id" [value]="muscleGroupData.id" type="number" hidden>

        <p *ngIf="(updateMuscleGroupForm.get('name')?.invalid ||
                updateMuscleGroupForm.get('description')?.invalid ||
                updateMuscleGroupForm.get('bodyPart')?.invalid) && invalidForm"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all sections
        </p>

        <img [src]="'data:image/*;base64,' + muscleGroupData.image"
            class="w-full h-40 object-cover object-top rounded-xl border border-gray-200"
            onerror="this.src='../../../assets/icons/user.png';" />

        <!-- Muscle group name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Muscle group name</label>
            <input formControlName="name" [value]="muscleGroupData.name" type="text" placeholder="Muscle group name"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (updateMuscleGroupForm.get('name')?.invalid && updateMuscleGroupForm.get('name')?.touched) || (updateMuscleGroupForm.get('name')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((updateMuscleGroupForm.get('name')?.invalid && updateMuscleGroupForm.get('name')?.touched) || (updateMuscleGroupForm.get('name')?.invalid && invalidForm))
                      }">
            <p *ngIf="(updateMuscleGroupForm.get('name')?.invalid && updateMuscleGroupForm.get('name')?.dirty) || (updateMuscleGroupForm.get('name')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Muscle group name is required
            </p>
        </div>

        <!-- Body part -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Body part</label>
            <select formControlName="bodyPart" [value]="muscleGroupData.bodyPart" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (updateMuscleGroupForm.get('bodyPart')?.invalid && updateMuscleGroupForm.get('bodyPart')?.touched) || (updateMuscleGroupForm.get('bodyPart')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((updateMuscleGroupForm.get('bodyPart')?.invalid && updateMuscleGroupForm.get('bodyPart')?.touched) || (updateMuscleGroupForm.get('bodyPart')?.invalid && invalidForm))
                      }">
                <option selected hidden>{{ muscleGroupData.bodyPart }}</option>
                <option *ngFor="let bodyPart of bodyParts">{{ bodyPart.name }}</option>
            </select>
            <p *ngIf="(updateMuscleGroupForm.get('bodyPart')?.invalid && updateMuscleGroupForm.get('bodyPart')?.dirty) || (updateMuscleGroupForm.get('bodyPart')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select a body part
            </p>
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Description</label>
            <textarea formControlName="description" [value]="muscleGroupData.description" rows="4"
                placeholder="Description" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (updateMuscleGroupForm.get('description')?.invalid && updateMuscleGroupForm.get('description')?.touched) || (updateMuscleGroupForm.get('description')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((updateMuscleGroupForm.get('description')?.invalid && updateMuscleGroupForm.get('description')?.touched) || (updateMuscleGroupForm.get('description')?.invalid && invalidForm))
                      }"></textarea>
            <p *ngIf="(updateMuscleGroupForm.get('description')?.invalid && updateMuscleGroupForm.get('description')?.dirty) || (updateMuscleGroupForm.get('description')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Description is required
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" (click)="updateMuscleGroup()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Update muscle group
            </button>
        </div>

    </form>

</div>
