<app-admin-search [selector]="selectMuscleGroups" [fields]="muscleGroupSearchFields"
    placeholder="Search muscle groups..." (results)="handleSearchResults($event)"></app-admin-search>
<app-load-error *ngIf="loadError && muscleGroupsData.length === 0" title="Couldn't load muscle groups" [message]="loadError" (retry)="retryLoad()"></app-load-error>
<ng-container *ngIf="!(loadError && muscleGroupsData.length === 0)">
<app-muscle-groups-header [muscleGroupsData]="muscleGroupsData" [totalMuscleGroups]="totalMuscleGroups"
    [muscleGroupsLength]="muscleGroupsLength"></app-muscle-groups-header>
<app-muscle-groups-list [muscleGroupsData]="muscleGroupsData"
    [totalMuscleGroups]="totalMuscleGroups"></app-muscle-groups-list>
</ng-container>
