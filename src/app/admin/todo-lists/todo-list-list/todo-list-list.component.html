<div class="rounded-2xl border border-gray-200 bg-white overflow-hidden">
    <!-- Mobile: card rows (matches admin/categories pattern) -->
    <div class="sm:hidden divide-y divide-gray-100">
        <div *ngFor="let todo of todoListData" class="flex items-center gap-3 px-4 py-3 active:bg-gray-50 transition-colors">
            <div class="min-w-0 flex-1" (click)="openTodoDetails(todo.id)">
                <div class="flex items-center gap-2 flex-wrap">
                    <p class="font-semibold text-gray-900 truncate">{{ todo.userEmail }}</p>
                    <span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold"
                          [ngClass]="{
                            'bg-green-50 text-green-700 border border-green-200': todo.status === 'completed',
                            'bg-amber-50 text-amber-700 border border-amber-200': todo.status === 'in-progress',
                            'bg-red-50 text-red-700 border border-red-200': todo.status === 'cancelled',
                            'bg-gray-100 text-gray-500 border border-gray-200': todo.status === 'pending' || todo.status === 'paused'
                          }">
                        {{ todo.status }}
                    </span>
                </div>
                <p class="text-xs text-gray-400 mt-0.5 truncate break-words">{{ todo.task }}</p>
                <p class="text-[10px] text-gray-400 mt-0.5">{{ formatDate(todo.date) }}</p>
            </div>
            <div class="flex items-center gap-0.5 shrink-0">
                <button class="w-9 h-9 rounded-lg active:bg-gray-100 flex items-center justify-center"
                    (click)="openUpdateTodo(todo.id)" title="Edit">
                    <i-feather name="edit-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
                <button class="w-9 h-9 rounded-lg active:bg-red-50 flex items-center justify-center"
                    (click)="deleteTodo(todo.id)" title="Delete">
                    <i-feather name="trash-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
            </div>
        </div>
    </div>

    <div class="hidden sm:block overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">SN</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Email</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Task</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Date</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">ID</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Status</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Last update</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let todo of todoListData; let i = index" class="hover:bg-gray-50 transition-colors">
                    <td class="px-4 py-3 text-gray-500">{{ i + 1 }}</td>
                    <td class="px-4 py-3">
                        <a href="mailto:{{ todo.userEmail }}"
                            class="font-semibold text-gray-900 hover:text-red-600 transition-colors">{{ todo.userEmail }}</a>
                    </td>
                    <td class="px-4 py-3 text-gray-600 max-w-xs truncate" [title]="todo.task">{{ todo.task }}</td>
                    <td class="px-4 py-3 text-gray-600">{{ formatDate(todo.date) }}</td>
                    <td class="px-4 py-3 font-semibold text-gray-900">{{ todo.id }}</td>
                    <td class="px-4 py-3">
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold"
                              [ngClass]="{
                                'bg-green-50 text-green-700 border border-green-200': todo.status === 'completed',
                                'bg-amber-50 text-amber-700 border border-amber-200': todo.status === 'in-progress',
                                'bg-red-50 text-red-700 border border-red-200': todo.status === 'cancelled',
                                'bg-gray-100 text-gray-500 border border-gray-200': todo.status === 'pending' || todo.status === 'paused'
                              }">
                            {{ todo.status }}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-gray-600">{{ formatDate(todo.lastUpdate) }}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-end gap-1">
                            <button class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center transition"
                                (click)="openTodoDetails(todo.id)" title="View">
                                <i-feather name="eye" class="text-gray-500" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="openUpdateTodo(todo.id)" title="Edit">
                                <i-feather name="edit-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition"
                                [ngClass]="todo.status === 'pending' || todo.status === 'in-progress'
                                    ? 'bg-red-600 text-white hover:bg-red-700'
                                    : 'bg-gray-800 text-white hover:bg-gray-700'"
                                (click)="updateTodoStatus(todo.id)">
                                {{ todo.status }}
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="deleteTodo(todo.id)" title="Delete">
                                <i-feather name="trash-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="todoListData.length === 0" class="flex flex-col items-center justify-center py-16 gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="inbox" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">No todos yet.</p>
    </div>
</div>
