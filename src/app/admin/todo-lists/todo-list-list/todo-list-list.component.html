<div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 overflow-hidden">
    <!-- Mobile: card rows (matches admin/categories pattern) -->
    <div class="sm:hidden divide-y divide-gray-100 dark:divide-gray-800">
        <div *ngFor="let todo of todoListData" class="flex items-center gap-3 px-4 py-3 active:bg-gray-50 dark:active:bg-gray-800 transition-colors">
            <div class="min-w-0 flex-1" (click)="openTodoDetails(todo.id)">
                <div class="flex items-center gap-2 flex-wrap">
                    <p class="font-semibold text-gray-900 dark:text-gray-100 truncate">{{ todo.userEmail }}</p>
                    <span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold"
                          [ngClass]="{
                            'bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-900': todo.status === 'completed',
                            'bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-900': todo.status === 'in-progress',
                            'bg-red-50 dark:bg-red-950/20 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-900': todo.status === 'cancelled',
                            'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 border border-gray-200 dark:border-gray-600': todo.status === 'pending' || todo.status === 'paused'
                          }">
                        {{ todo.status }}
                    </span>
                </div>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5 truncate break-words">{{ todo.task }}</p>
                <p class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5">{{ formatDate(todo.date) }}</p>
            </div>
            <div class="flex items-center gap-0.5 shrink-0">
                <button class="w-9 h-9 rounded-lg active:bg-gray-100 dark:active:bg-gray-700 flex items-center justify-center"
                    (click)="openUpdateTodo(todo.id)" title="Edit">
                    <i-feather name="edit-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
                <button *ngIf="todo.status === 'pending' || todo.status === 'in-progress' || todo.status === 'completed'"
                    class="w-9 h-9 rounded-lg active:bg-gray-100 dark:active:bg-gray-700 flex items-center justify-center"
                    (click)="updateTodoStatus(todo.id)"
                    [title]="todo.status === 'pending' ? 'Begin task' : todo.status === 'in-progress' ? 'Mark completed' : 'Restart task'">
                    <i-feather name="arrow-right-circle" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
                <button class="w-9 h-9 rounded-lg active:bg-red-50 dark:active:bg-red-950/20 flex items-center justify-center"
                    (click)="deleteTodo(todo.id)" title="Delete">
                    <i-feather name="trash-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
            </div>
        </div>
    </div>

    <div class="hidden sm:block overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">SN</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Email</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Task</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Date</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">ID</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Status</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Last update</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                <tr *ngFor="let todo of todoListData; let i = index" class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <td class="px-4 py-3 text-gray-500 dark:text-gray-400">{{ i + 1 }}</td>
                    <td class="px-4 py-3">
                        <a href="mailto:{{ todo.userEmail }}"
                            class="font-semibold text-gray-900 dark:text-gray-100 hover:text-red-600 transition-colors">{{ todo.userEmail }}</a>
                    </td>
                    <td class="px-4 py-3 text-gray-600 dark:text-gray-400 max-w-xs truncate" [title]="todo.task">{{ todo.task }}</td>
                    <td class="px-4 py-3 text-gray-600 dark:text-gray-400">{{ formatDate(todo.date) }}</td>
                    <td class="px-4 py-3 font-semibold text-gray-900 dark:text-gray-100">{{ todo.id }}</td>
                    <td class="px-4 py-3">
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold"
                              [ngClass]="{
                                'bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-900': todo.status === 'completed',
                                'bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 border border-amber-200 dark:border-amber-900': todo.status === 'in-progress',
                                'bg-red-50 dark:bg-red-950/20 text-red-700 dark:text-red-400 border border-red-200 dark:border-red-900': todo.status === 'cancelled',
                                'bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 border border-gray-200 dark:border-gray-600': todo.status === 'pending' || todo.status === 'paused'
                              }">
                            {{ todo.status }}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-gray-600 dark:text-gray-400">{{ formatDate(todo.lastUpdate) }}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-end gap-1">
                            <button class="w-8 h-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center transition"
                                (click)="openTodoDetails(todo.id)" title="View">
                                <i-feather name="eye" class="text-gray-500 dark:text-gray-400" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition"
                                (click)="openUpdateTodo(todo.id)" title="Edit">
                                <i-feather name="edit-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition"
                                [ngClass]="todo.status === 'pending' || todo.status === 'in-progress'
                                    ? 'bg-red-600 text-white hover:bg-red-700'
                                    : 'bg-gray-800 dark:bg-gray-700 text-white hover:bg-gray-700 dark:hover:bg-gray-600'"
                                (click)="updateTodoStatus(todo.id)">
                                {{ todo.status }}
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition"
                                (click)="deleteTodo(todo.id)" title="Delete">
                                <i-feather name="trash-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="todoListData.length === 0" class="flex flex-col items-center justify-center py-16 gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center">
            <i-feather name="inbox" class="text-gray-300 dark:text-gray-600" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400 dark:text-gray-500">No todos yet.</p>
    </div>
</div>
