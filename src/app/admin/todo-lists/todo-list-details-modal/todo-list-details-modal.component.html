<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="check-square" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 line-clamp-1">{{ todoData.task }}</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">ID {{ todoData.id }} &middot; Created {{
                    formatDate(todoData.date) }}</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <span class="w-fit px-2.5 py-1 rounded-full text-[11px] font-semibold"
        [ngClass]="{
            'bg-green-50 text-green-700 border border-green-200': todoData.status === 'completed',
            'bg-amber-50 text-amber-700 border border-amber-200': todoData.status === 'in-progress',
            'bg-red-50 text-red-700 border border-red-200': todoData.status === 'cancelled',
            'bg-gray-100 text-gray-500 border border-gray-200': todoData.status === 'pending' || todoData.status === 'paused'
        }">
        {{ todoData.status }}
    </span>

    <p class="text-xs text-gray-600 leading-relaxed bg-gray-50 border border-gray-100 rounded-xl px-4 py-3">
        {{ todoData.task }}
    </p>

    <div class="bg-gray-50 border border-gray-100 rounded-xl divide-y divide-gray-100">
        <div class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Assigned to</span>
            <app-user-hover-card [userId]="todoData.userId" [firstname]="todoData.userFirstname"
                [lastname]="todoData.userLastname" [email]="todoData.userEmail" [label]="todoData.userEmail">
            </app-user-hover-card>
        </div>
        <div class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Priority</span>
            <span class="text-xs font-medium text-gray-900 text-right capitalize">{{ todoData.priority }}</span>
        </div>
        <div class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Due date</span>
            <span class="text-xs font-medium text-gray-900 text-right">{{ formatDate(todoData.dueDate) }}</span>
        </div>
        <div class="flex items-center justify-between px-4 py-2.5">
            <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Last update</span>
            <span class="text-xs font-medium text-gray-900 text-right">{{ formatDate(todoData.lastUpdate) }}</span>
        </div>
    </div>

    <div class="border-t border-gray-100"></div>
    <div class="flex items-center justify-end gap-2">
        <button type="button" (click)="closeDialog()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                   hover:bg-gray-50 active:scale-[0.98] transition">
            Close
        </button>
    </div>

</div>
