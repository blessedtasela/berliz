<app-admin-search [selector]="selectCenters" [fields]="centerSearchFields"
    placeholder="Search centers..." (results)="handleSearchResults($event)"></app-admin-search>
<app-load-error *ngIf="loadError && centersData.length === 0" title="Couldn't load centers" [message]="loadError" (retry)="retryLoad()"></app-load-error>
<ng-container *ngIf="!(loadError && centersData.length === 0)">
<app-center-header [centersData]="centersData" [totalCenters]="totalCenters"
    [centersLength]="centersLength"></app-center-header>
<app-center-list [centerData]="centersData" [totalCenters]="totalCenters" (emitEvent)="emitData()"></app-center-list>
</ng-container>
