<div class="relative bg-white rounded-2xl border border-gray-200 shadow-sm p-6 font-sans max-w-3xl mx-auto">
    <div class="text-red-600 absolute top-4 right-4">
        <i-feather name="x-circle" (click)="closeDialog()" class="cursor-pointer" style="width:20px;height:20px;"></i-feather>
    </div>
    <form [formGroup]="updateCenterForm">
        <header class="mb-6">
            <h1 class="text-base font-bold text-gray-900">Update Center Details</h1>
            <p class="text-xs text-red-500 italic mt-0.5">Center ID: {{ center.id }}</p>
        </header>

        <div class="mb-4" *ngIf="invalidForm">
            <span *ngIf="updateCenterForm.invalid" class="text-xs font-semibold text-red-600 flex items-center gap-1">
                <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
                Please complete all sections
            </span>
            <span *ngIf="!updateCenterForm.invalid" class="text-xs font-semibold text-gray-500">
                Everything looks good
            </span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="flex flex-col gap-4">
                <div>
                    <img [src]="center.photoUrl" class="w-full h-40 object-cover rounded-xl border border-gray-200"
                        onerror="this.src='../../../assets/icons/user.png';">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Categories</label>
                    <div class="flex flex-wrap gap-2">
                        <label *ngFor="let cat of categories; let i = index"
                            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold border cursor-pointer transition"
                            [ngClass]="selectedCategoriesId.includes(cat.id)
                                ? 'bg-red-100 text-red-700 border-red-300 ring-2 ring-red-200'
                                : 'bg-white text-gray-500 border-gray-200 hover:bg-gray-50'">
                            <input formArrayName="categoryIds" (change)="onCheckboxChanged($event)"
                                [checked]="selectedCategoriesId.includes(cat.id)" type="checkbox" [value]="cat.id" class="hidden">
                            {{ cat.name }}
                        </label>
                    </div>
                    <p *ngIf="updateCenterForm.get('categoryIds')?.invalid && invalidForm"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        Select at least one category
                    </p>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Center Name</label>
                    <input formControlName="name" [value]="center.name" type="text"
                        placeholder="Display name e.g. Team Berliz"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty)
                        }">
                    <p *ngIf="updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        Center name is required
                    </p>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Experience</label>
                    <input formControlName="experience" [value]="center.experience" type="number"
                        placeholder="experience"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty)
                        }">
                    <p *ngIf="updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        Experience is required
                    </p>
                </div>

                <div class="flex flex-col gap-1" *ngIf="user?.role === 'admin'">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Likes</label>
                    <input formControlName="likes" [value]="center.likes" type="number" placeholder="likes"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty)
                        }">
                    <p *ngIf="updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        Experience is required
                    </p>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Motto</label>
                    <textarea formControlName="motto" [value]="center.motto" rows="3"
                        placeholder="Write a short bio about discipline or motto"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty)
                        }"></textarea>
                    <p *ngIf="updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        At least 30 characters
                    </p>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Location</label>
                    <textarea formControlName="location" [value]="center.location" rows="3"
                        placeholder="Google maps url"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty)
                        }"></textarea>
                    <p *ngIf="updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        Location cannot be null
                    </p>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Address</label>
                    <textarea formControlName="address" [value]="center.address" rows="3"
                        placeholder="Write your street address or location here"
                        class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                        [ngClass]="{
                            'border-red-400 bg-red-50': updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty,
                            'border-gray-200 bg-gray-50': !(updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty)
                        }"></textarea>
                    <p *ngIf="updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty"
                        class="text-red-500 text-[11px] flex items-center gap-1">
                        <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                        At least 10 characters
                    </p>
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="button" (click)="clear()"
                        class="flex-1 border border-gray-200 hover:bg-gray-50 text-gray-700 py-2.5 rounded-xl font-semibold text-sm transition">
                        Clear
                    </button>
                    <button type="submit" (click)="updateCenter()"
                        class="flex-1 bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white py-2.5 rounded-xl font-semibold text-sm transition-all">
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </form>
</div>
