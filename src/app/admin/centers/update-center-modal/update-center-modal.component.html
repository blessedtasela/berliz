<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="home" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Update center details</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">ID {{ center.id }} &middot; {{ center.name }}</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="updateCenterForm" class="flex flex-col gap-4">

        <p *ngIf="updateCenterForm.invalid && invalidForm"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all sections
        </p>

        <img [src]="center.photoUrl" class="w-full h-40 object-cover rounded-xl border border-gray-200"
            onerror="this.src='../../../assets/icons/user.png';" />

        <!-- Categories -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Categories</label>
            <div class="flex flex-wrap gap-2">
                <label *ngFor="let cat of categories; let i = index" class="cursor-pointer">
                    <input formArrayName="categoryIds" (change)="onCheckboxChanged($event)"
                        [checked]="selectedCategoriesId.includes(cat.id)" type="checkbox" [value]="cat.id"
                        class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                               bg-gray-50 border-gray-200 text-gray-600
                               peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        {{ cat.name }}
                    </span>
                </label>
            </div>
            <p *ngIf="updateCenterForm.get('categoryIds')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select at least one category
            </p>
        </div>

        <!-- Center name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Center name</label>
            <input formControlName="name" [value]="center.name" type="text" placeholder="Display name e.g. Team Berliz"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty)
                      }">
            <p *ngIf="updateCenterForm.get('name')?.invalid && updateCenterForm.get('name')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Center name is required
            </p>
        </div>

        <!-- Experience -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Experience</label>
            <input formControlName="experience" [value]="center.experience" type="number" placeholder="Experience"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty)
                      }">
            <p *ngIf="updateCenterForm.get('experience')?.invalid && updateCenterForm.get('experience')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Experience is required
            </p>
        </div>

        <!-- Likes -->
        <div class="flex flex-col gap-1" *ngIf="user?.role === 'admin'">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Likes</label>
            <input formControlName="likes" [value]="center.likes" type="number" placeholder="Likes" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty)
                      }">
            <p *ngIf="updateCenterForm.get('likes')?.invalid && updateCenterForm.get('likes')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Likes is required
            </p>
        </div>

        <!-- Motto -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Motto</label>
            <textarea formControlName="motto" [value]="center.motto" rows="3"
                placeholder="Write a short bio about discipline or motto" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty)
                      }"></textarea>
            <p *ngIf="updateCenterForm.get('motto')?.invalid && updateCenterForm.get('motto')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                At least 10 characters
            </p>
        </div>

        <!-- Location -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Location</label>
            <textarea formControlName="location" [value]="center.location" rows="3" placeholder="Google maps url" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty)
                      }"></textarea>
            <p *ngIf="updateCenterForm.get('location')?.invalid && updateCenterForm.get('location')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Location cannot be null
            </p>
        </div>

        <!-- Address -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Address</label>
            <textarea formControlName="address" [value]="center.address" rows="3"
                placeholder="Write your street address or location here" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty,
                        'border-gray-200 bg-gray-50': !(updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty)
                      }"></textarea>
            <p *ngIf="updateCenterForm.get('address')?.invalid && updateCenterForm.get('address')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                At least 10 characters
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" (click)="updateCenter()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Update center
            </button>
        </div>

    </form>

</div>
