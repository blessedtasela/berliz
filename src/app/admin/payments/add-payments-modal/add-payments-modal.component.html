<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="credit-card" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Add a new payment</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Provide the payment details and select the users.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addPaymentForm" class="flex flex-col gap-4">

        <p *ngIf="(addPaymentForm.get('name')?.invalid ||
                addPaymentForm.get('likes')?.invalid ||
                addPaymentForm.get('description')?.invalid ||
                addPaymentForm.get('photo')?.invalid ||
                addPaymentForm.get('tagIds')?.invalid) && invalidForm"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all sections
        </p>

        <!-- Users -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Users</label>
            <div class="flex flex-wrap gap-2">
                <label *ngFor="let tag of users; let i = index" class="cursor-pointer">
                    <input formArrayName="tagIds" (change)="onCheckboxChanged($event)" type="checkbox" [value]="tag.id"
                        class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                               bg-gray-50 border-gray-200 text-gray-600
                               peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        {{ tag.email }}
                    </span>
                </label>
            </div>
            <p *ngIf="addPaymentForm.get('tagIds')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select at least one user
            </p>
        </div>

        <!-- Icon -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Icon</label>
            <div class="flex items-center gap-3">
                <img [src]="selectedPhoto" class="w-16 h-16 object-cover rounded-xl border border-gray-200 shrink-0"
                    onerror="this.style.visibility='hidden';" />
                <select formControlName="photo" [(ngModel)]="selectedPhoto" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="{
                            'border-red-400 bg-red-50': (addPaymentForm.get('photo')?.invalid && addPaymentForm.get('photo')?.touched) || (addPaymentForm.get('photo')?.invalid && invalidForm),
                            'border-gray-200 bg-gray-50': !((addPaymentForm.get('photo')?.invalid && addPaymentForm.get('photo')?.touched) || (addPaymentForm.get('photo')?.invalid && invalidForm))
                          }">
                    <option selected hidden>Select an icon name</option>
                    <option *ngFor="let photo of users">{{ photo.email }}</option>
                </select>
            </div>
            <p *ngIf="(addPaymentForm.get('photo')?.invalid && addPaymentForm.get('photo')?.dirty) || (addPaymentForm.get('photo')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select an icon name
            </p>
        </div>

        <!-- Name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Name</label>
            <input formControlName="name" type="text" placeholder="Name" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (addPaymentForm.get('name')?.invalid && addPaymentForm.get('name')?.touched) || (addPaymentForm.get('name')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((addPaymentForm.get('name')?.invalid && addPaymentForm.get('name')?.touched) || (addPaymentForm.get('name')?.invalid && invalidForm))
                      }">
            <p *ngIf="(addPaymentForm.get('name')?.invalid && addPaymentForm.get('name')?.dirty) || (addPaymentForm.get('name')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Name is required
            </p>
        </div>

        <!-- Likes -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Likes</label>
            <input formControlName="likes" type="number" min="0" placeholder="Likes" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (addPaymentForm.get('likes')?.invalid && addPaymentForm.get('likes')?.touched) || (addPaymentForm.get('likes')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((addPaymentForm.get('likes')?.invalid && addPaymentForm.get('likes')?.touched) || (addPaymentForm.get('likes')?.invalid && invalidForm))
                      }">
            <p *ngIf="(addPaymentForm.get('likes')?.invalid && addPaymentForm.get('likes')?.dirty) || (addPaymentForm.get('likes')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Check the number of likes
            </p>
        </div>

        <!-- Description -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Description</label>
            <textarea formControlName="description" rows="4" placeholder="Description" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                        'border-red-400 bg-red-50': (addPaymentForm.get('description')?.invalid && addPaymentForm.get('description')?.touched) || (addPaymentForm.get('description')?.invalid && invalidForm),
                        'border-gray-200 bg-gray-50': !((addPaymentForm.get('description')?.invalid && addPaymentForm.get('description')?.touched) || (addPaymentForm.get('description')?.invalid && invalidForm))
                      }"></textarea>
            <p *ngIf="(addPaymentForm.get('description')?.invalid && addPaymentForm.get('description')?.dirty) || (addPaymentForm.get('description')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Description is required
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" (click)="addCategory()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Add payment
            </button>
        </div>

    </form>

</div>
