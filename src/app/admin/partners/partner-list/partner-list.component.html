<div class="rounded-2xl border border-gray-200 bg-white overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">SN</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Email</th>
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Partner ID</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Role</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Status</th>
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">CV</th>
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Certificate</th>
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Date</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-right text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let partner of partnersData; let i = index" class="hover:bg-gray-50 transition-colors">
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-gray-500">{{ i + 1 }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3 font-semibold text-gray-900">{{ partner.email }}</td>
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-gray-500 tabular-nums">{{ partner.id }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3 text-gray-600">{{ partner.role }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3">
                        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold"
                            [ngClass]="partner.status === 'true' ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-gray-100 text-gray-500 border border-gray-200'">
                            {{ partner.status === 'true' ? 'Active' : 'Inactive' }}
                        </span>
                    </td>
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3">
                        <button type="button" (click)="openViewCV(partner.id)"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-50 border border-gray-200
                                   text-[11px] font-semibold text-gray-600 hover:border-red-300 hover:text-red-600 transition">
                            <i-feather name="file-text" style="width:12px;height:12px;"></i-feather>
                            View CV
                        </button>
                    </td>
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3">
                        <button type="button" (click)="openViewCertificate(partner.id)"
                            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-gray-50 border border-gray-200
                                   text-[11px] font-semibold text-gray-600 hover:border-red-300 hover:text-red-600 transition">
                            <i-feather name="award" style="width:12px;height:12px;"></i-feather>
                            View certificate
                        </button>
                    </td>
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-gray-500">{{ formatDate(partner.date) }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3">
                        <div class="flex items-center justify-end gap-1">
                            <button class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center transition"
                                (click)="openPartnerDetails(partner.id)" title="View">
                                <i-feather name="eye" class="text-gray-500" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="openUpdatePartner(partner.id)" title="Edit">
                                <i-feather name="edit-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition"
                                [ngClass]="partner.status === 'true' ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-red-600 text-white hover:bg-red-700'"
                                (click)="updatePartnerStatus(partner.id)">
                                {{ partner.status === 'false' ? 'Activate' : 'Deactivate' }}
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="deletePartner(partner.id)" title="Delete">
                                <i-feather name="trash-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="partnersData.length === 0" class="flex flex-col items-center justify-center py-16 gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="inbox" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">No partners yet.</p>
    </div>
</div>
