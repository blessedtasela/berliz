<!--
  Page-scoped admin search: selects the full partner list from the store, filters
  locally, and emits to `handleSearchResults()` which rewrites partnersData /
  totalPartners. This page previously had no working search — `search-partner`
  was an unfinished CLI stub that was never even embedded here.
-->
<app-admin-search [selector]="selectPartners" [fields]="partnerSearchFields"
  placeholder="Search partners..." (results)="handleSearchResults($event)"></app-admin-search>
<app-load-error *ngIf="loadError && partnersData.length === 0" title="Couldn't load partners" [message]="loadError" (retry)="retryLoad()"></app-load-error>
<ng-container *ngIf="!(loadError && partnersData.length === 0)">
<app-partner-header [partnersData]="partnersData" [totalPartners]="totalPartners"
    [partnersLength]="partnersLength"></app-partner-header>
<app-partner-list [partnersData]="partnersData" [totalPartners]="totalPartners"></app-partner-list>
</ng-container>
