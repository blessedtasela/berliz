<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div class="flex items-center gap-2 flex-wrap">
        <div class="text-xs font-semibold text-gray-500">
            Showing <span class="text-gray-900">{{ totalBookings }}</span> of <span class="text-gray-900">{{ bookingsLength }}</span> results
        </div>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-100">
            {{ pendingCount }} pending
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-blue-50 text-blue-700 border border-blue-100">
            {{ confirmedCount }} confirmed
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-green-50 text-green-700 border border-green-100">
            {{ completedCount }} completed
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-gray-100 text-gray-500 border border-gray-200">
            {{ cancelledCount }} cancelled
        </span>
    </div>
    <div class="flex items-center gap-1.5">
        <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Sort</span>
        <select [(ngModel)]="selectedSortOption" (change)="onSortOptionChange($event)"
            class="px-3 py-1.5 rounded-xl border border-gray-200 bg-gray-50 text-xs text-gray-700
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
            <option value="date">Scheduled date</option>
            <option value="client">Client email</option>
            <option value="status">Status</option>
            <option value="id">Booking id</option>
        </select>
    </div>
</div>
