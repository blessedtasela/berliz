<div class="flex items-center justify-between flex-wrap gap-3 mb-4">
    <div class="flex items-center gap-2 flex-wrap">
        <div class="text-xs font-semibold text-gray-500 dark:text-gray-400">
            Showing <span class="text-gray-900 dark:text-gray-100">{{ totalBookings }}</span> of <span class="text-gray-900 dark:text-gray-100">{{ bookingsLength }}</span> results
        </div>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 border border-amber-100 dark:border-amber-900">
            {{ pendingCount }} pending
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-blue-50 dark:bg-blue-950/20 text-blue-700 dark:text-blue-400 border border-blue-100 dark:border-blue-900">
            {{ confirmedCount }} confirmed
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-green-50 dark:bg-green-950/20 text-green-700 dark:text-green-400 border border-green-100 dark:border-green-900">
            {{ completedCount }} completed
        </span>
        <span class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-300 border border-gray-200 dark:border-gray-600">
            {{ cancelledCount }} cancelled
        </span>
    </div>
    <div class="flex items-center gap-1.5">
        <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Sort</span>
        <select [(ngModel)]="selectedSortOption" (change)="onSortOptionChange($event)"
            class="px-3 py-1.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-xs text-gray-700 dark:text-gray-300
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
            <option value="date">Scheduled date</option>
            <option value="client">Client email</option>
            <option value="status">Status</option>
            <option value="id">Booking id</option>
        </select>
    </div>
</div>
