<div class="flex justify-between items-center flex-wrap gap-2">
    <div class="flex justify-start font-bold text-gray-700">
        <div class="flex justify-center items-center">
            showing {{ totalCategories }} of {{ categoriesLength }} results
        </div>
    </div>
    <div class="flex justify-end items-center gap-4 mb-5">
        <div class="flex justify-center items-center">
            <div class="text-sm font-bold text-red-600 p-1 px-4 rounded-xl
                transition-all duration-200 transform hover:scale-105 focus:scale-105 font-bold">
                Sort by:
                <select [(ngModel)]="selectedSortOption" (change)="onSortOptionChange($event)"
                    class="mt-2 cursor-pointer border border-gray-200 rounded-xl px-2 py-1 focus:outline-none text-gray-700">
                    <option class="text-gray-500" value="date">Date added</option>
                    <option class="text-gray-500" value="name">Name</option>
                    <option class="text-gray-500" value="id">Category id</option>
                    <option class="text-gray-500" value="tag">Tag</option>
                    <option class="text-gray-500" value="lastUpdate">Last update</option>
                </select>
            </div>
        </div>
        <button type="button" (click)="openAddCategory()"
            class="flex items-center gap-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold
                rounded-xl px-4 py-2 transition-all duration-200 transform hover:scale-105 focus:scale-105">
            <i-feather name="plus" class="w-4 h-4"></i-feather>
            Add category
        </button>
    </div>
</div>
