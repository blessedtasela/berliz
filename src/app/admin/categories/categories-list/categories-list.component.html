<div class="justify-center items-center mt-4 overflow-x-auto">
    <div class="min-w-[300px] rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <table class="w-full border-collapse bg-white text-gray-950 font-sans">
            <thead>
                <tr class="cursor-pointer bg-gray-50">
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">SN</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Photo</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Name</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Status</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Date</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Category ID</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Likes</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Last update</th>
                    <th class="border-b border-gray-200 px-4 py-3 text-left text-sm font-bold text-gray-700">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let category of categoriesData; let i = index"
                    class="bg-white hover:bg-gray-50 transition-colors">
                    <td class="border-b border-gray-200 px-4 py-3">{{ i + 1 }}</td>
                    <td class="border-b border-gray-200 px-4 py-3">
                        <img [src]="category.photoUrl || '../../../assets/icons/user.png'"
                            onerror="this.src='../../../assets/icons/user.png';"
                            class="w-10 h-10 rounded-xl object-cover border border-gray-200">
                    </td>
                    <td class="border-b border-gray-200 px-4 py-3 font-semibold">{{ category.name }}</td>
                    <td class="border-b border-gray-200 px-4 py-3">
                        <span class="inline-flex items-center px-2 py-1 rounded-xl text-xs font-bold"
                            [ngClass]="category.status === 'true' ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-600'">
                            {{ category.status === 'true' ? 'active' : 'inactive' }}
                        </span>
                    </td>
                    <td class="border-b border-gray-200 px-4 py-3">{{ formatDate(category.date) }}</td>
                    <td class="border-b border-gray-200 px-4 py-3 font-bold">{{ category.id }}</td>
                    <td class="border-b border-gray-200 px-4 py-3">{{ category.likes }}</td>
                    <td class="border-b border-gray-200 px-4 py-3">{{ formatDate(category.lastUpdate) }}</td>
                    <td class="border-b border-gray-200 px-4 py-3">
                        <div class="flex items-center gap-3">
                            <button
                                class="text-sm rounded-xl font-sans transition-all duration-200 transform hover:scale-105 focus:scale-105 hover:text-gray-950 font-bold"
                                (click)="openCategoryDetails(category.id)">
                                <i-feather name="eye" class="text-gray-500 w-5"></i-feather>
                            </button>
                            <button
                                class="text-sm rounded-xl font-sans transition-all duration-200 transform hover:scale-105 focus:scale-105 font-bold"
                                (click)="openUpdateCategory(category.id)">
                                <i-feather name="edit" class="text-red-600 w-5"></i-feather>
                            </button>
                            <button
                                class="text-xs bg-gray-800 text-white py-1.5 px-3 hover:bg-gray-700 rounded-xl font-sans
                                transition-all duration-200 transform hover:scale-105 focus:scale-105 font-bold"
                                [ngClass]="{'bg-red-600 hover:bg-red-700': category.status == 'true'}"
                                (click)="updateCategoryStatus(category.id)">
                                {{ category.status == 'false' ? 'activate' : 'deactivate'}}
                            </button>
                            <button
                                class="text-sm rounded-xl font-sans transition-all duration-200 transform hover:scale-105 focus:scale-105 font-bold"
                                (click)="deleteCategory(category.id)">
                                <i-feather name="trash-2" class="text-red-600 w-5"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
