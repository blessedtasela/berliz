<div class="max-w-2xl w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="check-square" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Add a new task</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Provide the task details and assign it to users.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addTaskForm" class="flex flex-col gap-4">

        <!-- Form-level banner -->
        <p *ngIf="addTaskForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-red-50 border border-red-200 text-red-600 text-[11px] flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all sections
        </p>
        <p *ngIf="!addTaskForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-green-50 border border-green-200 text-green-700 text-[11px] flex items-center gap-1.5">
            <i-feather name="check" style="width:12px;height:12px;"></i-feather>
            Everything looks good
        </p>

        <!-- Icon preview -->
        <div class="flex items-center gap-3">
            <img [src]="'../../../../../assets/icons/'+ selectedIcon + '.png'"
                class="w-16 h-16 object-cover object-top rounded-xl border border-gray-200 bg-gray-50">
            <p class="text-[11px] text-gray-400">Preview of the selected icon.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

            <!-- Icon -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Icon</label>
                <select formControlName="photo" [(ngModel)]="selectedIcon" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="{
                        'border-red-400 bg-red-50': addTaskForm.get('photo')?.invalid && (addTaskForm.get('photo')?.touched || invalidForm),
                        'border-gray-200 bg-gray-50': !(addTaskForm.get('photo')?.invalid && (addTaskForm.get('photo')?.touched || invalidForm))
                      }">
                    <option selected hidden>Select icon name</option>
                    <option *ngFor="let photo of subTasks">{{ photo.name }}</option>
                </select>
                <p *ngIf="addTaskForm.get('photo')?.invalid && (addTaskForm.get('photo')?.dirty || invalidForm)"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Select an icon name
                </p>
            </div>

            <!-- Name -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Name</label>
                <input formControlName="name" placeholder="Task name" type="text" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="{
                        'border-red-400 bg-red-50': addTaskForm.get('name')?.invalid && (addTaskForm.get('name')?.touched || invalidForm),
                        'border-gray-200 bg-gray-50': !(addTaskForm.get('name')?.invalid && (addTaskForm.get('name')?.touched || invalidForm))
                      }">
                <p *ngIf="addTaskForm.get('name')?.invalid && (addTaskForm.get('name')?.dirty || invalidForm)"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Name is required
                </p>
            </div>

            <!-- Likes -->
            <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Likes</label>
                <input formControlName="likes" placeholder="0" type="number" min="0" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="{
                        'border-red-400 bg-red-50': addTaskForm.get('likes')?.invalid && (addTaskForm.get('likes')?.touched || invalidForm),
                        'border-gray-200 bg-gray-50': !(addTaskForm.get('likes')?.invalid && (addTaskForm.get('likes')?.touched || invalidForm))
                      }">
                <p *ngIf="addTaskForm.get('likes')?.invalid && (addTaskForm.get('likes')?.dirty || invalidForm)"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Check the number of likes
                </p>
            </div>

            <!-- Description -->
            <div class="flex flex-col gap-1 md:col-span-2">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Description</label>
                <textarea formControlName="description" placeholder="Describe the task" rows="4" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                    [ngClass]="{
                        'border-red-400 bg-red-50': addTaskForm.get('description')?.invalid && (addTaskForm.get('description')?.touched || invalidForm),
                        'border-gray-200 bg-gray-50': !(addTaskForm.get('description')?.invalid && (addTaskForm.get('description')?.touched || invalidForm))
                      }"></textarea>
                <p *ngIf="addTaskForm.get('description')?.invalid && (addTaskForm.get('description')?.dirty || invalidForm)"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Description is required
                </p>
            </div>

            <!-- Assigned users -->
            <div class="flex flex-col gap-1.5 md:col-span-2">
                <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Assign users</label>
                <div class="flex flex-wrap gap-1.5">
                    <label *ngFor="let tag of users; let i = index" class="cursor-pointer">
                        <input formArrayName="tagIds" (change)="onCheckboxChanged($event)" type="checkbox"
                            [value]="tag.id" class="peer sr-only">
                        <span class="inline-block rounded-full border px-3 py-1 text-xs font-medium transition
                                     bg-gray-50 border-gray-200 text-gray-600
                                     peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                            {{ tag.email }}
                        </span>
                    </label>
                </div>
                <p *ngIf="addTaskForm.get('tagIds')?.invalid && invalidForm"
                    class="text-red-500 text-[11px] flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                    Select at least one user
                </p>
            </div>

        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" (click)="addCategory()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Add Task
            </button>
        </div>

    </form>

</div>
