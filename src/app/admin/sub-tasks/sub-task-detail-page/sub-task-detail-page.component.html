<div class="max-w-2xl w-full mx-auto p-4 sm:p-6 flex flex-col gap-5 font-sans">

    <a routerLink="/dashboard/sub-tasks"
        class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-500 hover:text-gray-800 transition w-fit">
        <i-feather name="arrow-left" style="width:14px;height:14px;"></i-feather>
        Back to Sub Tasks
    </a>

    <div *ngIf="loading" class="rounded-2xl border border-gray-200 bg-white flex items-center justify-center py-24">
        <div class="w-10 h-10 rounded-full border-2 border-gray-200 border-t-red-600 animate-spin"></div>
    </div>

    <div *ngIf="!loading && !subTaskData"
        class="rounded-2xl border border-gray-200 bg-white p-10 flex flex-col items-center gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="alert-circle" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">Sub-task not found.</p>
    </div>

    <div *ngIf="!loading && subTaskData" class="rounded-2xl border border-gray-200 bg-white p-6 flex flex-col gap-5">

        <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                    <i-feather name="check-square" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                </div>
                <div>
                    <h1 class="text-sm font-bold text-gray-900">{{ subTaskData.name }}</h1>
                    <p class="text-[11px] text-gray-400 mt-0.5">ID {{ subTaskData.id }} &middot; Created {{
                        formatDate(subTaskData.date) }}</p>
                </div>
            </div>
        </div>

        <div class="bg-gray-50 border border-gray-100 rounded-xl divide-y divide-gray-100">
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Name</span>
                <span class="text-xs font-medium text-gray-900 text-right">{{ subTaskData.name }}</span>
            </div>
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Exercise</span>
                <span class="text-xs font-medium text-gray-900 text-right">{{ subTaskData.exerciseName }}</span>
            </div>
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Task ID</span>
                <span class="text-xs font-medium text-gray-900 text-right">{{ subTaskData.taskId }}</span>
            </div>
            <div class="flex items-center justify-between px-4 py-2.5">
                <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Date</span>
                <span class="text-xs font-medium text-gray-900 text-right">{{ formatDate(subTaskData.date) }}</span>
            </div>
        </div>

    </div>

</div>
