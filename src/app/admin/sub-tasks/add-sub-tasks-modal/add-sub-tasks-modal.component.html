<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="list" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Add a sub-task</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">A single step within an existing task.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addSubTaskForm" class="flex flex-col gap-4">

        <p *ngIf="addSubTaskForm.invalid && invalidForm"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all required fields
        </p>

        <!-- Task -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Task</label>
            <select formControlName="taskId" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addSubTaskForm.get('taskId')?.invalid && invalidForm ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'">
                <option value="" selected hidden>Select a task</option>
                <option *ngFor="let task of tasks" [value]="task.id">{{ task.userFirstname }} {{ task.userLastname }} — {{ task.description }}</option>
            </select>
            <p *ngIf="addSubTaskForm.get('taskId')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select a task
            </p>
        </div>

        <!-- Name -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Step name</label>
            <input formControlName="name" type="text" placeholder="e.g. 3x12 Bench Press" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addSubTaskForm.get('name')?.invalid && invalidForm ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'">
            <p *ngIf="addSubTaskForm.get('name')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Name is required
            </p>
        </div>

        <!-- Exercise -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Exercise</label>
            <select formControlName="exerciseId" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addSubTaskForm.get('exerciseId')?.invalid && invalidForm ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'">
                <option value="" selected hidden>Select an exercise</option>
                <option *ngFor="let exercise of exercises" [value]="exercise.id">{{ exercise.name }}</option>
            </select>
            <p *ngIf="addSubTaskForm.get('exerciseId')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select an exercise
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" [disabled]="submitting" (click)="addSubTask()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                       disabled:opacity-50 disabled:cursor-not-allowed">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                {{ submitting ? 'Adding…' : 'Add sub-task' }}
            </button>
        </div>

    </form>

</div>
