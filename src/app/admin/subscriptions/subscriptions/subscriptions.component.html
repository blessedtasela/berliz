<app-page-header icon="layers" title="Subscriptions" subtitle="Plans and packages members have bought"></app-page-header>
<app-admin-search [selector]="selectSubscriptions" [fields]="subscriptionSearchFields"
    placeholder="Search subscriptions..." (results)="handleSearchResults($event)"></app-admin-search>
<app-load-error *ngIf="!loading && loadError && subscriptionsData.length === 0" title="Couldn't load subscriptions" [message]="loadError" (retry)="retryLoad()"></app-load-error>
<ng-container *ngIf="subscriptionsData.length > 0 || (!loading && !loadError)">
<app-subscriptions-header [subscriptionsData]="subscriptionsData" [totalSubscriptions]="totalSubscriptions"
    [subscriptionsLength]="subscriptionsLength"></app-subscriptions-header>
<app-subscriptions-list [subscriptionsData]="subscriptionsData"
    [totalSubscriptions]="totalSubscriptions"></app-subscriptions-list>
</ng-container>
