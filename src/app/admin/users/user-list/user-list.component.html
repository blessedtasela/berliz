<div *ngIf="showCropper"
    class="fixed p-4 md:p-1 inset-0 flex justify-center items-center bg-gray-900 bg-opacity-50 z-50">
    <div class="bg-white dark:bg-gray-900 p-4 rounded-2xl w-full max-w-md image-cropper-container">
        <image-cropper class="image-cropper" [imageChangedEvent]="imageChangedEvent"
            (imageCropped)="imageCropped($event)" (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()" [maintainAspectRatio]="true" [aspectRatio]="1/1"
            [resizeToWidth]="256">
        </image-cropper>

        <div class="mt-4 flex justify-center gap-2 text-sm">
            <button
                class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold hover:bg-red-700 active:scale-[0.98] transition"
                (click)="updatePhoto()">Upload</button>
            <button
                class="px-4 py-2 rounded-xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-300 text-xs font-semibold hover:bg-gray-50 dark:hover:bg-gray-700 active:scale-[0.98] transition"
                (click)="cancelUpload()">Cancel</button>
        </div>
    </div>
</div>

<div class="rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 overflow-hidden">
    <!-- Mobile: card rows (matches admin/categories pattern) -->
    <div class="sm:hidden divide-y divide-gray-100 dark:divide-gray-800">
        <div *ngFor="let user of usersData" class="flex items-center gap-3 px-4 py-3 active:bg-gray-50 dark:active:bg-gray-800 transition-colors">
            <div class="relative shrink-0">
                <button type="button" (click)="goToProfile(user.id)" title="View profile">
                    <img [src]="photoSrc(user)"
                        onerror="this.src='../../../assets/icons/user.png';"
                        class="w-12 h-12 rounded-xl object-cover object-top border border-gray-200 dark:border-gray-700">
                </button>
                <label [attr.for]="'fileInput-m-' + user.id" title="Change photo"
                    class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 flex items-center justify-center cursor-pointer">
                    <i-feather name="camera" class="text-red-600" style="width:11px;height:11px;"></i-feather>
                </label>
                <input accept="image/*" type="file" id="fileInput-m-{{user.id}}" style="display: none;"
                    (change)="onImgSelected($event, user.id)">
            </div>

            <div class="min-w-0 flex-1" (click)="openUserDetails(user.id)">
                <div class="flex items-center gap-2">
                    <p class="font-semibold text-gray-900 dark:text-gray-100 truncate">{{ user.firstname }} {{ user.lastname }}</p>
                    <span class="shrink-0 inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600">
                        {{ user.role }}
                    </span>
                </div>
                <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5 truncate">{{ user.email }}</p>
            </div>

            <div class="flex items-center gap-0.5 shrink-0">
                <button class="w-9 h-9 rounded-lg active:bg-gray-100 dark:active:bg-gray-700 flex items-center justify-center"
                    (click)="openUpdateUser(user.id)" title="Edit">
                    <i-feather name="edit-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
                <button class="w-9 h-9 rounded-lg active:bg-gray-100 dark:active:bg-gray-700 flex items-center justify-center"
                    (click)="updateUserStatus(user.id)"
                    [title]="user.status === 'false' ? 'Activate' : 'Deactivate'">
                    <i-feather [name]="user.status === 'false' ? 'check-circle' : 'x-circle'" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
                <button class="w-9 h-9 rounded-lg active:bg-red-50 dark:active:bg-red-950/20 flex items-center justify-center"
                    (click)="deleteUser(user.id)" title="Delete">
                    <i-feather name="trash-2" class="text-red-600" style="width:16px;height:16px;"></i-feather>
                </button>
            </div>
        </div>
    </div>

    <div class="hidden sm:block overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700">
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">SN</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Photo</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">First Name</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Last Name</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Email - username</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">userId</th>
                    <th class="px-4 py-3 text-left text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Role</th>
                    <th class="px-4 py-3 text-right text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-gray-800">
                <tr *ngFor="let user of usersData; let i = index" class="hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <td class="px-4 py-3 text-gray-500 dark:text-gray-400">{{ i + 1 }}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-2">
                            <div class="relative">
                                <!-- Default image -- click goes to the public profile; hover previews it larger. -->
                                <button type="button" (click)="goToProfile(user.id)"
                                    (mouseenter)="onPhotoEnter($event, user.id)" (mouseleave)="onPhotoLeave()"
                                    title="View profile">
                                    <img [src]="photoSrc(user)"
                                        onerror="this.src='../../../assets/icons/user.png';"
                                        class="w-10 h-10 rounded-xl object-cover object-top border border-gray-200 dark:border-gray-700 hover:opacity-80 transition">
                                </button>
                                <!-- Preview, positioned above the thumbnail rather than screen-center so the
                                     mouse can actually reach it; stays open while hovering the preview itself. -->
                                <div *ngIf="hoveredPhotoUserId === user.id" (mouseenter)="onPhotoEnter($event, user.id)"
                                    (mouseleave)="onPhotoLeave()" (click)="goToProfile(user.id)"
                                    class="fixed z-50 rounded-2xl border border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-900 p-2 shadow-2xl cursor-pointer"
                                    [style.top.px]="photoPreviewTop" [style.left.px]="photoPreviewLeft">
                                    <img [src]="photoSrc(user)"
                                        onerror="this.src='../../../assets/icons/user.png';"
                                        class="w-56 h-56 rounded-xl object-cover object-top">
                                </div>
                            </div>
                            <label [attr.for]="'fileInput-' + user.id" title="Change photo"
                                class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition cursor-pointer">
                                <i-feather name="camera" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </label>
                            <input accept="image/*" type="file" id="fileInput-{{user.id}}" style="display: none;"
                                (change)="onImgSelected($event, user.id)">
                            <button type="button" (click)="removePhoto(user.id)" title="Remove photo"
                                class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition">
                                <i-feather name="x" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                    <td class="px-4 py-3 font-semibold text-gray-900 dark:text-gray-100">{{ user.firstname }}</td>
                    <td class="px-4 py-3 font-semibold text-gray-900 dark:text-gray-100">{{ user.lastname }}</td>
                    <td class="px-4 py-3 text-gray-600 dark:text-gray-400">{{ user.email }}</td>
                    <td class="px-4 py-3 font-semibold text-gray-900 dark:text-gray-100">{{ user.id }}</td>
                    <td class="px-4 py-3">
                        <div class="flex items-center gap-1">
                            <span
                                class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-600">
                                {{ user.role }}
                            </span>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition"
                                (click)="openUpdateUserRole(user.id)" title="Edit role">
                                <i-feather name="edit-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                    <td class="px-4 py-3">
                        <div class="flex items-center justify-end gap-1">
                            <button class="w-8 h-8 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 flex items-center justify-center transition"
                                (click)="openUserDetails(user.id)" title="View">
                                <i-feather name="eye" class="text-gray-500 dark:text-gray-400" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition"
                                (click)="openUpdateUser(user.id)" title="Edit">
                                <i-feather name="edit-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition"
                                [ngClass]="user.status === 'true' ? 'bg-gray-800 dark:bg-gray-700 text-white hover:bg-gray-700 dark:hover:bg-gray-600' : 'bg-red-600 text-white hover:bg-red-700'"
                                (click)="updateUserStatus(user.id)">
                                {{ user.status === 'false' ? 'Activate' : 'Deactivate' }}
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 dark:hover:bg-red-950/20 flex items-center justify-center transition"
                                (click)="deleteUser(user.id)" title="Delete">
                                <i-feather name="trash-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="usersData.length === 0" class="flex flex-col items-center justify-center py-16 gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center">
            <i-feather name="inbox" class="text-gray-300 dark:text-gray-600" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400 dark:text-gray-500">No users yet.</p>
    </div>
</div>
