<div *ngIf="showCropper"
    class="fixed p-4 md:p-1 inset-0 flex justify-center items-center bg-gray-900 bg-opacity-50 z-50">
    <div class="bg-white p-4 rounded-2xl w-full max-w-md image-cropper-container">
        <image-cropper class="image-cropper" [imageChangedEvent]="imageChangedEvent"
            (imageCropped)="imageCropped($event)" (imageLoaded)="imageLoaded()" (cropperReady)="cropperReady()"
            (loadImageFailed)="loadImageFailed()" [maintainAspectRatio]="true" [aspectRatio]="1/1"
            [resizeToWidth]="256">
        </image-cropper>

        <div class="mt-4 flex justify-center gap-2 text-sm">
            <button
                class="px-4 py-2 rounded-xl bg-red-600 text-white text-xs font-semibold hover:bg-red-700 active:scale-[0.98] transition"
                (click)="updatePhoto()">Upload</button>
            <button
                class="px-4 py-2 rounded-xl border border-gray-200 bg-white text-gray-700 text-xs font-semibold hover:bg-gray-50 active:scale-[0.98] transition"
                (click)="cancelUpload()">Cancel</button>
        </div>
    </div>
</div>

<div class="rounded-2xl border border-gray-200 bg-white overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200">
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">SN
                    </th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        Photo</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        First Name</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        Last Name</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        Email - username</th>
                    <th class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        userId</th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-left text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Role
                    </th>
                    <th class="px-3 py-2.5 sm:px-4 sm:py-3 text-right text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                        Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                <tr *ngFor="let user of usersData; let i = index" class="hover:bg-gray-50 transition-colors">
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 text-gray-500">{{ i + 1 }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3">
                        <div class="flex items-center gap-2">
                            <div class="group relative">
                                <!-- Default image -->
                                <img [src]="'data:image/*;base64,' + user.profilePhoto"
                                    onerror="this.src='../../../assets/icons/user.png';"
                                    class="w-10 h-10 rounded-xl object-cover border border-gray-200">
                                <!-- Image preview on mouseover -->
                                <div class="hidden group-hover:block fixed top-1/2 left-1/2 z-50 transform -translate-x-1/2
                                    -translate-y-1/2 rounded-2xl border border-gray-200 bg-white p-2 shadow-2xl">
                                    <img [src]="'data:image/*;base64,' + user.profilePhoto"
                                        onerror="this.src='../../../assets/icons/user.png';"
                                        class="w-96 h-96 rounded-xl object-cover">
                                </div>
                            </div>
                            <label [attr.for]="'fileInput-' + user.id" title="Change photo"
                                class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition cursor-pointer">
                                <i-feather name="camera" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </label>
                            <input accept="image/*" type="file" id="fileInput-{{user.id}}" style="display: none;"
                                (change)="onImgSelected($event, user.id)">
                            <button type="button" (click)="removePhoto(user.id)" title="Remove photo"
                                class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition">
                                <i-feather name="x" class="text-red-600" style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3 font-semibold text-gray-900">{{ user.firstname }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3 font-semibold text-gray-900">{{ user.lastname }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3 text-gray-600">{{ user.email }}</td>
                    <td class="hidden sm:table-cell px-3 py-2.5 sm:px-4 sm:py-3 font-semibold text-gray-900">{{ user.id }}</td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3">
                        <div class="flex items-center gap-1">
                            <span
                                class="inline-flex items-center px-2 py-1 rounded-full text-[11px] font-semibold bg-gray-100 text-gray-600 border border-gray-200">
                                {{ user.role }}
                            </span>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="openUpdateUserRole(user.id)" title="Edit role">
                                <i-feather name="edit-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                    <td class="px-3 py-2.5 sm:px-4 sm:py-3">
                        <div class="flex items-center justify-end gap-1">
                            <button class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center transition"
                                (click)="openUserDetails(user.id)" title="View">
                                <i-feather name="eye" class="text-gray-500" style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="openUpdateUser(user.id)" title="Edit">
                                <i-feather name="edit-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                            <button class="px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition"
                                [ngClass]="user.status === 'true' ? 'bg-gray-800 text-white hover:bg-gray-700' : 'bg-red-600 text-white hover:bg-red-700'"
                                (click)="updateUserStatus(user.id)">
                                {{ user.status === 'false' ? 'Activate' : 'Deactivate' }}
                            </button>
                            <button class="w-8 h-8 rounded-lg hover:bg-red-50 flex items-center justify-center transition"
                                (click)="deleteUser(user.id)" title="Delete">
                                <i-feather name="trash-2" class="text-red-600"
                                    style="width:15px;height:15px;"></i-feather>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    <div *ngIf="usersData.length === 0" class="flex flex-col items-center justify-center py-16 gap-3 text-center">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="inbox" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">No users yet.</p>
    </div>
</div>
