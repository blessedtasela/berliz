<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="edit-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Update FAQ</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">FAQ #{{ faqData.id }}</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="updateFaqForm" class="flex flex-col gap-4">

        <p *ngIf="updateFaqForm.invalid && invalidForm" class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all required fields
        </p>

        <!-- Category -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Category</label>
            <input formControlName="category" type="text" placeholder="e.g. General, Billing, Trainers, Centers"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': (updateFaqForm.get('category')?.invalid && updateFaqForm.get('category')?.touched) || (updateFaqForm.get('category')?.invalid && invalidForm),
                    'border-gray-200 bg-gray-50': !((updateFaqForm.get('category')?.invalid && updateFaqForm.get('category')?.touched) || (updateFaqForm.get('category')?.invalid && invalidForm))
                }">
            <p *ngIf="(updateFaqForm.get('category')?.invalid && updateFaqForm.get('category')?.dirty) || (updateFaqForm.get('category')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Category is required
            </p>
        </div>

        <!-- Question -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Question</label>
            <input formControlName="question" type="text" placeholder="Question"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': (updateFaqForm.get('question')?.invalid && updateFaqForm.get('question')?.touched) || (updateFaqForm.get('question')?.invalid && invalidForm),
                    'border-gray-200 bg-gray-50': !((updateFaqForm.get('question')?.invalid && updateFaqForm.get('question')?.touched) || (updateFaqForm.get('question')?.invalid && invalidForm))
                }">
            <p *ngIf="(updateFaqForm.get('question')?.invalid && updateFaqForm.get('question')?.dirty) || (updateFaqForm.get('question')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Question is required (min. 5 characters)
            </p>
        </div>

        <!-- Answer -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Answer</label>
            <textarea formControlName="answer" rows="4" placeholder="Answer"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': (updateFaqForm.get('answer')?.invalid && updateFaqForm.get('answer')?.touched) || (updateFaqForm.get('answer')?.invalid && invalidForm),
                    'border-gray-200 bg-gray-50': !((updateFaqForm.get('answer')?.invalid && updateFaqForm.get('answer')?.touched) || (updateFaqForm.get('answer')?.invalid && invalidForm))
                }"></textarea>
            <p *ngIf="(updateFaqForm.get('answer')?.invalid && updateFaqForm.get('answer')?.dirty) || (updateFaqForm.get('answer')?.invalid && invalidForm)"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Answer is required (min. 10 characters)
            </p>
        </div>

        <!-- Display order -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Display order</label>
            <input formControlName="displayOrder" type="number" min="0" placeholder="0"
                class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
            <p class="text-[11px] text-gray-400">Lower numbers appear first within the category.</p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Reset
            </button>
            <button type="submit" (click)="updateFaq()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Save changes
            </button>
        </div>

    </form>

</div>
