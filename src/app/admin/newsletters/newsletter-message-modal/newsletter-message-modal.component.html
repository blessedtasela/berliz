<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="mail" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Send newsletter</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Compose a message for {{ newsletterData.email }}.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="newsletterMessageForm" class="flex flex-col gap-4">

        <!-- Form-level banner -->
        <p *ngIf="newsletterMessageForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-red-50 border border-red-200 text-red-600 text-[11px] flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all sections
        </p>
        <p *ngIf="!newsletterMessageForm.invalid && invalidForm"
            class="px-3 py-2 rounded-xl bg-green-50 border border-green-200 text-green-700 text-[11px] flex items-center gap-1.5">
            <i-feather name="check" style="width:12px;height:12px;"></i-feather>
            Everything looks good
        </p>

        <!-- Saved subject -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Saved subject</label>
            <select formControlName="savedSubject" [(ngModel)]="selectedSubject" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option selected hidden>You can select a message subject</option>
                <option *ngFor="let message of savedMessages">{{ message.subject }}</option>
            </select>
        </div>

        <!-- Subject -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Subject</label>
            <input formControlName="subject" [(ngModel)]="selectedSubject" placeholder="Email subject" type="text" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': newsletterMessageForm.get('subject')?.invalid && newsletterMessageForm.get('subject')?.touched,
                    'border-gray-200 bg-gray-50': !(newsletterMessageForm.get('subject')?.invalid && newsletterMessageForm.get('subject')?.touched)
                  }">
            <p *ngIf="newsletterMessageForm.get('subject')?.invalid && newsletterMessageForm.get('subject')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Subject must be at least 12 characters
            </p>
        </div>

        <!-- Recipient -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Recipient</label>
            <input formControlName="email" [value]="newsletterData.email" readonly placeholder="example@gmail.com"
                type="email"
                class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-100 text-sm text-gray-500 focus:outline-none transition">
            <p *ngIf="newsletterMessageForm.get('email')?.invalid && newsletterMessageForm.get('email')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Invalid email
            </p>
        </div>

        <!-- Saved body -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Saved message</label>
            <select formControlName="savedBody" [(ngModel)]="selectedMessage" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option selected hidden>You can select a saved message</option>
                <option *ngFor="let message of savedMessages">{{ message.message }}</option>
            </select>
        </div>

        <!-- Body -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Message body</label>
            <textarea formControlName="body" [(ngModel)]="selectedMessage" placeholder="Enter email body here" rows="6"
                class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="{
                    'border-red-400 bg-red-50': newsletterMessageForm.get('body')?.invalid && newsletterMessageForm.get('body')?.touched,
                    'border-gray-200 bg-gray-50': !(newsletterMessageForm.get('body')?.invalid && newsletterMessageForm.get('body')?.touched)
                  }"></textarea>
            <p *ngIf="newsletterMessageForm.get('body')?.invalid && newsletterMessageForm.get('body')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Body must be at least 50 characters
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" (click)="sendNewsletterMessage()"
                class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                Send Newsletter
            </button>
        </div>

    </form>

</div>
