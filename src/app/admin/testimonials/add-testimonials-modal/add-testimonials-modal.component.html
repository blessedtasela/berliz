<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="star" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Add a testimonial</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">On behalf of a client, about Berliz, a center or a trainer.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="addTestimonialForm" class="flex flex-col gap-4">

        <p *ngIf="addTestimonialForm.invalid && invalidForm"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all required fields
        </p>

        <!-- Client -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Client</label>
            <select formControlName="clientId" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addTestimonialForm.get('clientId')?.invalid && invalidForm ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'">
                <option value="" selected hidden>Select a client</option>
                <option *ngFor="let client of clients" [value]="client.id">
                    {{ client.user?.firstname }} {{ client.user?.lastname }} — {{ client.user?.email }}
                </option>
            </select>
            <p *ngIf="addTestimonialForm.get('clientId')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Select a client
            </p>
        </div>

        <!-- Target -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">About</label>
            <div class="flex gap-2">
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="general" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 border-gray-200 text-gray-600
                               peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        Berliz (general)
                    </span>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="center" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 border-gray-200 text-gray-600
                               peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        A center
                    </span>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="trainer" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 border-gray-200 text-gray-600
                               peer-checked:bg-red-50 peer-checked:border-red-200 peer-checked:text-red-600">
                        A trainer
                    </span>
                </label>
            </div>
        </div>

        <!-- Center picker -->
        <div class="flex flex-col gap-1" *ngIf="addTestimonialForm.get('target')?.value === 'center'">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Center</label>
            <select formControlName="centerId" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="" selected hidden>Select a center</option>
                <option *ngFor="let center of centers" [value]="center.id">{{ center.name }}</option>
            </select>
        </div>

        <!-- Trainer picker -->
        <div class="flex flex-col gap-1" *ngIf="addTestimonialForm.get('target')?.value === 'trainer'">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Trainer</label>
            <select formControlName="trainerId" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="" selected hidden>Select a trainer</option>
                <option *ngFor="let trainer of trainers" [value]="trainer.id">{{ trainer.name }}</option>
            </select>
        </div>

        <!-- Testimonial text -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">Testimonial</label>
            <textarea formControlName="testimonial" rows="4" placeholder="What did they say?" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
                [ngClass]="addTestimonialForm.get('testimonial')?.invalid && invalidForm ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'"></textarea>
            <p *ngIf="addTestimonialForm.get('testimonial')?.invalid && invalidForm"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Write at least 10 characters
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="clear()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Clear
            </button>
            <button type="submit" [disabled]="submitting" (click)="addTestimonial()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                       disabled:opacity-50 disabled:cursor-not-allowed">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                {{ submitting ? 'Adding…' : 'Add testimonial' }}
            </button>
        </div>

    </form>

</div>
