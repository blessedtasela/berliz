<div class="max-w-lg w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
                <i-feather name="edit-2" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Edit testimonial</h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">{{ testimonialData.userFirstname }} {{ testimonialData.userLastname }}</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <div *ngIf="isActive" class="rounded-xl border border-amber-200 dark:border-amber-900 bg-amber-50 dark:bg-amber-950/20 px-4 py-3 flex items-start gap-2">
        <i-feather name="alert-triangle" class="text-amber-500 shrink-0" style="width:14px;height:14px;margin-top:1px;"></i-feather>
        <p class="text-xs text-amber-700 dark:text-amber-400">This testimonial is already active and can no longer be edited.</p>
    </div>

    <form [formGroup]="updateTestimonialForm" class="flex flex-col gap-4">

        <p *ngIf="updateTestimonialForm.invalid && invalidForm"
            class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Please complete all required fields
        </p>

        <!-- Target -->
        <div class="flex flex-col gap-1.5">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">About</label>
            <div class="flex gap-2">
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="general" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                               peer-checked:bg-red-50 dark:peer-checked:bg-red-950/20 peer-checked:border-red-200 dark:peer-checked:border-red-900 peer-checked:text-red-600 dark:peer-checked:text-red-400">
                        Berliz (general)
                    </span>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="center" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                               peer-checked:bg-red-50 dark:peer-checked:bg-red-950/20 peer-checked:border-red-200 dark:peer-checked:border-red-900 peer-checked:text-red-600 dark:peer-checked:text-red-400">
                        A center
                    </span>
                </label>
                <label class="cursor-pointer">
                    <input type="radio" formControlName="target" value="trainer" class="peer sr-only">
                    <span class="inline-block rounded-full border px-3 py-1.5 text-xs font-medium transition
                               bg-gray-50 dark:bg-gray-800 border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                               peer-checked:bg-red-50 dark:peer-checked:bg-red-950/20 peer-checked:border-red-200 dark:peer-checked:border-red-900 peer-checked:text-red-600 dark:peer-checked:text-red-400">
                        A trainer
                    </span>
                </label>
            </div>
        </div>

        <!-- Center picker -->
        <div class="flex flex-col gap-1" *ngIf="updateTestimonialForm.get('target')?.value === 'center'">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Center</label>
            <select formControlName="centerId" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="" selected hidden>Select a center</option>
                <option *ngFor="let center of centers" [value]="center.id">{{ center.name }}</option>
            </select>
        </div>

        <!-- Trainer picker -->
        <div class="flex flex-col gap-1" *ngIf="updateTestimonialForm.get('target')?.value === 'trainer'">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Trainer</label>
            <select formControlName="trainerId" class="w-full px-3 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-sm text-gray-900 dark:text-gray-100
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option value="" selected hidden>Select a trainer</option>
                <option *ngFor="let trainer of trainers" [value]="trainer.id">{{ trainer.name }}</option>
            </select>
        </div>

        <!-- Testimonial text -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">Testimonial</label>
            <textarea formControlName="testimonial" rows="4" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition disabled:bg-gray-100 dark:disabled:bg-gray-700 disabled:text-gray-400 dark:disabled:text-gray-500"
                [ngClass]="updateTestimonialForm.get('testimonial')?.invalid && invalidForm ? 'border-red-400 dark:border-red-700 bg-red-50 dark:bg-red-950/20' : 'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800'"></textarea>
            <p *ngIf="updateTestimonialForm.get('testimonial')?.invalid && invalidForm"
                class="text-red-500 dark:text-red-400 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Write at least 10 characters
            </p>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                       hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" [disabled]="submitting || isActive" (click)="updateTestimonial()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                       disabled:opacity-50 disabled:cursor-not-allowed">
                <i-feather name="check" style="width:13px;height:13px;"></i-feather>
                {{ submitting ? 'Saving…' : 'Save changes' }}
            </button>
        </div>

    </form>

</div>
