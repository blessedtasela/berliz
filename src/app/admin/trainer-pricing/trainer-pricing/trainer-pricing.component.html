<app-page-header icon="dollar-sign" title="Trainer pricing" subtitle="What each trainer charges for its plans"></app-page-header>
<app-admin-search [selector]="selectTrainerPricing" [fields]="trainerPricingSearchFields"
    placeholder="Search trainer pricing..." (results)="handleSearchResults($event)"></app-admin-search>
<app-trainer-pricing-header [trainerPricingData]="trainerPricingData" [totalTrainerPricing]="totalTrainerPricing"
    [trainerPricingLength]="trainerPricingLength"></app-trainer-pricing-header>
<app-trainer-pricing-list [trainerPricingData]="trainerPricingData"
    [totalTrainerPricing]="totalTrainerPricing"></app-trainer-pricing-list>
