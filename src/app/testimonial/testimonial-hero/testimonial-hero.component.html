<!-- ═══════════════════════════════════════════════
     TESTIMONIALS HERO — full-width cinematic banner
     Dark overlay on a background image, red accent
════════════════════════════════════════════════ -->
<section class="relative w-full h-80 sm:h-96 overflow-hidden font-sans">

  <!-- Background image -->
  <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
    style="background-image: url('assets/trainers/t10.jpg');">
  </div>

  <!-- Dark gradient overlay -->
  <div class="absolute inset-0"
    style="background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(80,0,0,0.55) 60%, rgba(0,0,0,0.78) 100%);">
  </div>

  <!-- Content -->
  <div class="relative z-10 flex flex-col items-center justify-center h-full gap-3 px-4 text-center">

    <!-- Eyebrow -->
    <span class="text-[11px] font-bold tracking-[0.2em] uppercase text-red-400">
      From the community
    </span>

    <!-- Title -->
    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white leading-tight">
      Real Stories. <span class="text-red-500">Real Results.</span>
    </h1>

    <!-- Sub -->
    <p class="text-sm text-zinc-300 max-w-md leading-relaxed">
      Hear from the people training with Berliz centers and coaches every day.
    </p>

    <!-- Red rule accent -->
    <div class="w-12 h-0.5 bg-red-600 rounded-full mt-1"></div>

    <!-- CTA -->
    <button type="button" (click)="openTestimonialForm()" class="mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-red-600 text-white text-sm
             font-semibold hover:bg-red-700 active:scale-[0.98] transition">
      <i-feather name="edit-3" style="width:13px;height:13px;"></i-feather>
      Leave a testimonial
    </button>

  </div>
</section>
