<section class="font-sans flex flex-col gap-4 mt-4">

    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
            <i-feather name="file-text" class="text-red-600" style="width:16px;height:16px;"></i-feather>
        </div>
        <div>
            <h1 class="text-sm font-bold text-gray-900 dark:text-gray-100">Client Intakes</h1>
            <p class="text-[11px] text-gray-400 dark:text-gray-500">Intake records you've started for your clients</p>
        </div>
    </div>

    <div *ngIf="intakes.length === 0" class="rounded-2xl border border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900 p-6 text-center">
        <p class="text-xs text-gray-400 dark:text-gray-500">You haven't started any client intakes yet.</p>
    </div>

    <div *ngIf="intakes.length > 0" class="flex flex-col gap-2">
        <a *ngFor="let intake of intakes" [routerLink]="['/dashboard/client-intake', intake.id]"
            class="p-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-900 flex items-center justify-between gap-3 hover:shadow-sm hover:-translate-y-0.5 transition">
            <div class="min-w-0">
                <p class="text-sm font-semibold text-gray-900 dark:text-gray-100 truncate">{{ clientName(intake) }}</p>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">{{ intake.submittedAt | date:'mediumDate' }}</p>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0"
                [ngClass]="intake.consentAcknowledgedAt ? 'bg-green-50 dark:bg-green-950/30 text-green-700 dark:text-green-400 border border-green-100 dark:border-green-900' : 'bg-amber-50 dark:bg-amber-950/20 text-amber-700 dark:text-amber-400 border border-amber-100 dark:border-amber-900'">
                {{ intake.consentAcknowledgedAt ? 'Consent confirmed' : 'Awaiting consent' }}
            </span>
        </a>
    </div>

</section>
