<section class="font-sans flex flex-col gap-4 mt-4">

    <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
            <i-feather name="file-text" class="text-red-600" style="width:16px;height:16px;"></i-feather>
        </div>
        <div>
            <h1 class="text-sm font-bold text-gray-900">Client Intakes</h1>
            <p class="text-[11px] text-gray-400">Intake records you've started for your clients</p>
        </div>
    </div>

    <div *ngIf="intakes.length === 0" class="rounded-2xl border border-gray-100 bg-white p-6 text-center">
        <p class="text-xs text-gray-400">You haven't started any client intakes yet.</p>
    </div>

    <div *ngIf="intakes.length > 0" class="flex flex-col gap-2">
        <a *ngFor="let intake of intakes" [routerLink]="['/client-intake', intake.id]"
            class="p-3 border border-gray-200 rounded-xl bg-white flex items-center justify-between gap-3 hover:shadow-sm hover:-translate-y-0.5 transition">
            <div class="min-w-0">
                <p class="text-sm font-semibold text-gray-900 truncate">{{ clientName(intake) }}</p>
                <p class="text-[11px] text-gray-400 mt-0.5">{{ intake.submittedAt | date:'mediumDate' }}</p>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0"
                [ngClass]="intake.consentAcknowledgedAt ? 'bg-green-50 text-green-700 border border-green-100' : 'bg-amber-50 text-amber-700 border border-amber-100'">
                {{ intake.consentAcknowledgedAt ? 'Consent confirmed' : 'Awaiting consent' }}
            </span>
        </a>
    </div>

</section>
