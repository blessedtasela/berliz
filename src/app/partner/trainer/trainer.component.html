<div *ngIf="trainerData" class="flex flex-col gap-4 font-sans">

    <!-- Cropper modal -->
    <div *ngIf="showCropper"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-gray-900">Crop cover photo</h2>
                <button (click)="cancelUpload()"
                    class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400">
                    <i-feather name="x" style="width:14px;height:14px;"></i-feather>
                </button>
            </div>
            <image-cropper [imageChangedEvent]="imageChangedEvent" (imageCropped)="imageCropped($event)"
                [maintainAspectRatio]="true" [aspectRatio]="1/1" [resizeToWidth]="256"
                class="rounded-xl overflow-hidden border border-gray-200">
            </image-cropper>
            <div class="flex justify-end gap-2 pt-1 border-t border-gray-100">
                <button (click)="cancelUpload()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                    Cancel
                </button>
                <button (click)="updatePhoto()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition">
                    Upload
                </button>
            </div>
        </div>
    </div>

    <!-- Profile card -->
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">

        <div class="w-full h-32 overflow-hidden">
            <img src="../../../../assets/landing/hero-bg-4.jpg" class="w-full h-full object-cover" />
        </div>

        <div class="flex flex-col items-center -mt-10 pb-5 px-4 gap-2">

            <!-- Avatar + camera -->
            <div class="relative">
                <img [src]="previewUrl" (click)="openImagePreview()" onerror="this.src='assets/avatar.png';"
                    class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md cursor-pointer" />

                <label for="trainerFileInput" class="absolute bottom-0 right-0 w-7 h-7 bg-red-600 rounded-full flex items-center justify-center
                 shadow cursor-pointer hover:bg-red-700 transition border-2 border-white">
                    <i-feather name="camera" style="width:12px;height:12px;" class="text-white"></i-feather>
                </label>

                <form [formGroup]="updateTrainerPhotoForm">
                    <input accept="image/*" type="file" formControlName="photo" id="trainerFileInput" class="hidden"
                        (change)="onImgSelected($event)" />
                </form>
            </div>

            <p class="text-sm font-bold text-gray-900">{{ user?.firstname }} {{ user?.lastname }}</p>

            <p class="text-[11px] flex items-center gap-1.5"
                [ngClass]="trainerData.status === 'true' ? 'text-green-600' : 'text-yellow-600'">
                <span class="w-1.5 h-1.5 rounded-full"
                    [ngClass]="trainerData.status === 'true' ? 'bg-green-500' : 'bg-yellow-400'">
                </span>
                <span class="italic capitalize">
                    {{ trainerData.status === 'true' ? 'Active trainer' : 'Action required' }}
                </span>
            </p>

            <!-- Stats -->
            <div
                class="flex items-center gap-4 border border-gray-200 rounded-xl px-4 py-2 text-xs font-semibold text-gray-500">
                <span>{{ trainerData.likes }} <span class="font-normal text-gray-400">Likes</span></span>
                <div class="h-4 w-px bg-gray-200"></div>
                <span>0 <span class="font-normal text-gray-400">Clients</span></span>
                <div class="h-4 w-px bg-gray-200"></div>
                <span>0 <span class="font-normal text-gray-400">Centers</span></span>
            </div>

            <p class="text-xs text-gray-500 italic text-center max-w-sm">{{ trainerData.motto }}</p>

            <a [routerLink]="['/dashboard/partnership/trainer-details']" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-700
               hover:bg-gray-50 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="edit" style="width:13px;height:13px;"></i-feather>
                Update trainer details
            </a>

        </div>
    </div>

    <!-- Trainer data form -->
    <app-trainer-data [trainer]="trainerData"></app-trainer-data>

</div>

<!-- Image Preview Modal -->
<div *ngIf="showImageModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50"
    (click)="closeImagePreview()">

    <div class="bg-white rounded-xl p-4 shadow-xl max-w-[90%] max-h-[90%] flex flex-col gap-3"
        (click)="$event.stopPropagation()">
        <img [src]="previewUrl" class="max-h-[70vh] max-w-full object-contain rounded-lg" />

        <button (click)="closeImagePreview()"
            class="px-4 py-2 bg-red-600 text-white rounded-lg text-xs font-semibold hover:bg-red-700 transition">
            Close
        </button>
    </div>

</div>
