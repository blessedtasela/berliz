<div class="bg-white border border-gray-200 rounded-xl font-sans">

    <form [formGroup]="updateTrainerForm">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <div>
                <h2 class="text-sm font-bold text-gray-900">Trainer profile</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">
                    Registered: <span class="text-gray-600 font-medium">{{ formatDate(trainer?.date) }}</span>
                </p>
            </div>
        </div>

        <!-- Validation -->
        <div *ngIf="invalidForm" class="px-4 pt-3">
            <p *ngIf="updateTrainerForm.invalid"
                class="text-[11px] text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-1.5">
                <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
                Please complete all required fields.
            </p>
        </div>

        <!-- Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 px-4 py-4">

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Display name</label>
                <input formControlName="name" type="text" placeholder="Team Berliz" class="w-full px-3 py-2 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="updateTrainerForm.get('name')?.invalid && updateTrainerForm.get('name')?.dirty
            ? 'border-red-300' : 'border-gray-200'" />
                <p *ngIf="updateTrainerForm.get('name')?.invalid && updateTrainerForm.get('name')?.dirty"
                    class="text-[11px] text-red-500 flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:10px;height:10px;"></i-feather>
                    Display name is required
                </p>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Experience
                    (years)</label>
                <input formControlName="experience" type="number" placeholder="5" class="w-full px-3 py-2 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="updateTrainerForm.get('experience')?.invalid && updateTrainerForm.get('experience')?.dirty
            ? 'border-red-300' : 'border-gray-200'" />
            </div>

            <div *ngIf="user?.role === 'admin'" class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Likes</label>
                <input formControlName="likes" type="number" readonly class="w-full px-3 py-2 rounded-xl bg-gray-100 border border-gray-200 text-sm text-gray-500
                 focus:outline-none cursor-not-allowed" />
            </div>

            <div class="md:col-span-2 flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Motto</label>
                <textarea formControlName="motto" rows="4" placeholder="Write your discipline or motto" class="w-full px-3 py-2.5 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                 resize-none transition placeholder:text-gray-400" [ngClass]="updateTrainerForm.get('motto')?.invalid && updateTrainerForm.get('motto')?.dirty
            ? 'border-red-300' : 'border-gray-200'">
        </textarea>
            </div>

            <div class="md:col-span-2 flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Address</label>
                <textarea formControlName="address" rows="4" placeholder="Street address or location" class="w-full px-3 py-2.5 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                 resize-none transition placeholder:text-gray-400" [ngClass]="updateTrainerForm.get('address')?.invalid && updateTrainerForm.get('address')?.dirty
            ? 'border-red-300' : 'border-gray-200'">
        </textarea>
            </div>

            <!-- Categories -->
            <div class="md:col-span-2 flex flex-col gap-2">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Categories</label>
                <div class="flex flex-wrap gap-2">
                    <label *ngFor="let cat of categories"
                        class="flex items-center gap-2 px-3 py-1.5 rounded-xl border cursor-pointer transition text-xs font-medium"
                        [ngClass]="selectedCategoriesId.includes(cat.id)
              ? 'bg-red-50 border-red-200 text-red-700'
              : 'bg-white border-gray-200 text-gray-600 hover:bg-gray-50'">
                        <input formArrayName="categoryIds" type="checkbox"
                            [checked]="selectedCategoriesId.includes(cat.id)" [value]="cat.id"
                            (change)="onCheckboxChanged($event)" class="accent-red-600 w-3 h-3" />
                        {{ cat.name }}
                    </label>
                </div>
                <p *ngIf="updateTrainerForm.get('categoryIds')?.invalid && invalidForm"
                    class="text-[11px] text-red-500 flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:10px;height:10px;"></i-feather>
                    Select at least one category
                </p>
            </div>

        </div>

        <!-- Save -->
        <div class="px-4 py-2 flex items-center justify-between">
            <div class="flex">
                <span *ngIf="hasChanges()" class="text-xs text-blue-600 font-semibold">
                    Unsaved changes
                </span>

                <span *ngIf="!hasChanges()" class="text-xs text-gray-400">
                    No changes made
                </span>
            </div>
            <div class="flex">
                <button type="button" (click)="updateTrainer()" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold
                hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2"
                    [disabled]="!hasChanges() || updateTrainerForm.invalid" [ngClass]="{
                    'opacity-40 cursor-not-allowed': !hasChanges() || updateTrainerForm.invalid
                 }">
                    <i-feather name="save" style="width:13px;height:13px;"></i-feather>
                    Save changes
                </button>

            </div>
        </div>

    </form>

</div>
