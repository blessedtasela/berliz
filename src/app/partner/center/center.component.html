<div *ngIf="centerData" class="flex flex-col gap-4 font-sans">

    <!-- Cropper modal -->
    <div *ngIf="showCropper"
        class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-5 shadow-xl flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-bold text-gray-900">Crop cover photo</h2>
                <button (click)="cancelUpload()"
                    class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400">
                    <i-feather name="x" style="width:14px;height:14px;"></i-feather>
                </button>
            </div>
            <image-cropper [imageChangedEvent]="imageChangedEvent" (imageCropped)="imageCropped($event)"
                [maintainAspectRatio]="true" [aspectRatio]="1/1" [resizeToWidth]="256"
                class="rounded-xl overflow-hidden border border-gray-200">
            </image-cropper>
            <div class="flex justify-end gap-2 pt-1 border-t border-gray-100">
                <button (click)="cancelUpload()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                    Cancel
                </button>
                <button (click)="updatePhoto()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition">
                    Upload
                </button>
            </div>
        </div>
    </div>

    <!-- Profile card -->
    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden">

        <div class="w-full h-32 overflow-hidden">
            <img src="../../../../assets/landing/hero-bg-4.jpg" class="w-full h-full object-cover" />
        </div>

        <div class="flex flex-col items-center -mt-10 pb-5 px-4 gap-2">

            <!-- Avatar + camera -->
            <div class="relative">
                <img [src]="centerData.photoUrl"
                    onerror="this.src='../../../assets/icons/user.png';"
                    class="w-20 h-20 rounded-full object-cover border-4 border-white shadow-md" />

                <label for="centerFileInput" class="absolute bottom-0 right-0 w-7 h-7 bg-red-600 rounded-full flex items-center justify-center
                 shadow cursor-pointer hover:bg-red-700 transition border-2 border-white">
                    <i-feather name="camera" style="width:12px;height:12px;" class="text-white"></i-feather>
                </label>

                <form [formGroup]="updateCenterPhotoForm">
                    <input accept="image/*" type="file" formControlName="photo" id="centerFileInput" class="hidden"
                        (change)="onImgSelected($event)" />
                </form>
            </div>

            <p class="text-sm font-bold text-gray-900">{{ centerData.name }}</p>

            <p class="text-[11px] text-gray-400 italic capitalize">
                center partner
            </p>

            <!-- Stats -->
            <div
                class="flex items-center gap-4 border border-gray-200 rounded-xl px-4 py-2 text-xs font-semibold text-gray-500">
                <span>{{ centerData.likes }} <span class="font-normal text-gray-400">Likes</span></span>
                <div class="h-4 w-px bg-gray-200"></div>
                <span>0 <span class="font-normal text-gray-400">Members</span></span>
                <div class="h-4 w-px bg-gray-200"></div>
                <span>0 <span class="font-normal text-gray-400">Trainers</span></span>
            </div>

            <p class="text-xs text-gray-500 italic text-center max-w-sm">{{ centerData.motto }}</p>

            <button (click)="openUpdateCenter()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-700
               hover:bg-gray-50 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="edit" style="width:13px;height:13px;"></i-feather>
                Quick update
            </button>

        </div>
    </div>

    <!-- Center data form -->
    <app-center-data [center]="centerData" (emitEvent)="emitData()"></app-center-data>

</div>
