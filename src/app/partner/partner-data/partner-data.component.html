<div *ngIf="partnerData" class="bg-white border border-gray-200 rounded-xl font-sans">

    <form [formGroup]="updatePartnerForm">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
            <div>
                <h2 class="text-sm font-bold text-gray-900">Partnership application</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">
                    Registered: <span class="text-gray-600 font-medium">{{ formatDate(partnerData.date) }}</span>
                </p>
            </div>
            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full" [ngClass]="partnerData.status === 'true'
          ? 'bg-green-50 text-green-700 border border-green-100'
          : 'bg-yellow-50 text-yellow-700 border border-yellow-100'">
                {{ partnerData.status === 'true' ? 'Approved' : 'Pending' }}
            </span>
        </div>

        <!-- Validation -->
        <div *ngIf="invalidForm" class="px-4 pt-3">
            <p *ngIf="updatePartnerForm.invalid"
                class="text-[11px] text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-1.5">
                <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
                Please complete all required fields.
            </p>
        </div>

        <!-- Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 px-4 py-4">

            <!-- Email (readonly) -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Email</label>
                <input [value]="partnerData.user.email" type="text" readonly class="w-full px-3 py-2 rounded-xl bg-gray-100 border border-gray-200 text-sm text-gray-500
                 focus:outline-none cursor-not-allowed" />
            </div>

            <!-- Role -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Partnership role</label>
                <select formControlName="role" class="w-full px-3 py-2 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="updatePartnerForm.get('role')?.invalid && updatePartnerForm.get('role')?.touched
            ? 'border-red-300' : 'border-gray-200'">
                    <option [value]="partnerData.role">{{ partnerData.role }}</option>
                    <ng-container *ngIf="partnerData.status === 'true'">
                        <option *ngFor="let role of roles">{{ role.role }}</option>
                    </ng-container>
                </select>
                <p *ngIf="updatePartnerForm.get('role')?.invalid && updatePartnerForm.get('role')?.touched"
                    class="text-[11px] text-red-500 flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:10px;height:10px;"></i-feather>
                    Select a role
                </p>
            </div>

            <!-- Facebook -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Facebook URL</label>
                <input formControlName="facebookUrl" type="text" placeholder="https://www.facebook.com/my-profile/"
                    [readOnly]="partnerData.status === 'true'" class="w-full px-3 py-2 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="updatePartnerForm.get('facebookUrl')?.invalid && updatePartnerForm.get('facebookUrl')?.touched
            ? 'border-red-300' : 'border-gray-200'" />
            </div>

            <!-- Instagram -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Instagram URL</label>
                <input formControlName="instagramUrl" type="text" placeholder="https://www.instagram.com/my-profile/"
                    [readOnly]="partnerData.status === 'true'" class="w-full px-3 py-2 rounded-xl bg-gray-50 border text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="updatePartnerForm.get('instagramUrl')?.invalid && updatePartnerForm.get('instagramUrl')?.touched
            ? 'border-red-300' : 'border-gray-200'" />
            </div>

            <!-- YouTube -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">
                    YouTube URL <span class="normal-case font-normal text-gray-400">(optional)</span>
                </label>
                <input formControlName="youtubeUrl" type="text" placeholder="https://www.youtube.com/my-profile/"
                    [readOnly]="partnerData.status === 'true'" class="w-full px-3 py-2 rounded-xl bg-gray-50 border border-gray-200 text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
            </div>

            <!-- Motivation -->
            <div class="md:col-span-2 flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Motivation</label>
                <textarea formControlName="motivation" rows="5" [readOnly]="partnerData.status === 'true'"
                    placeholder="Motivation here" class="w-full px-3 py-2.5 rounded-xl bg-gray-50 border border-gray-200 text-sm text-gray-900
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                 resize-none transition placeholder:text-gray-400">
        </textarea>
            </div>

        </div>

        <!-- Documents + actions -->
        <div class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 border-t border-gray-100">

            <div class="flex gap-2">
                <button *ngIf="partnerData.cv" type="button" (click)="openViewCV()" class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-gray-200 text-gray-700
                 hover:bg-gray-50 transition flex items-center gap-1.5">
                    <i-feather name="file-text" style="width:12px;height:12px;"></i-feather>
                    View CV
                </button>

                <button *ngIf="partnerData.certificate" type="button" (click)="openViewCertificate()" class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-gray-200 text-gray-700
                 hover:bg-gray-50 transition flex items-center gap-1.5">
                    <i-feather name="award" style="width:12px;height:12px;"></i-feather>
                    View certificate
                </button>

                <button *ngIf="partnerData.status === 'false'" type="button" (click)="openUpdateFile()" class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-gray-200 text-gray-700
                 hover:bg-gray-50 transition flex items-center gap-1.5">
                    <i-feather name="upload" style="width:12px;height:12px;"></i-feather>
                    Update files
                </button>
            </div>

            <button *ngIf="partnerData.status === 'false'" type="button" (click)="updatePartner()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
               hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2">
                <i-feather name="save" style="width:13px;height:13px;"></i-feather>
                Save changes
            </button>

        </div>

    </form>

</div>
