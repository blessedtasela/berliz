<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl font-sans mt-4">

    <form *ngIf="updateCenterPricingForm" [formGroup]="updateCenterPricingForm" (ngSubmit)="updateCenterPricing()">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-800">
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100 flex items-center gap-2">
                    Pricing
                    <span *ngIf="!centerPricing?.id"
                        class="text-[10px] font-semibold text-red-600 bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900 px-2 py-0.5 rounded-full">
                        Action required
                    </span>
                </h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">
                    {{ centerPricing?.date
                    ? 'Registered on ' + formatDate(centerPricing?.date)
                    : 'No pricing information found' }}
                </p>
            </div>
        </div>

        <div *ngIf="invalidForm && updateCenterPricingForm.invalid" class="px-4 pt-3">
            <p
                class="text-[11px] text-red-600 bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900 rounded-xl px-3 py-2 flex items-center gap-1.5">
                <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
                Please complete all required fields.
            </p>
        </div>

        <div *ngIf="!invalidForm && updateCenterPricingForm.valid && hasChanges()" class="px-4 pt-3">
            <p
                class="text-[11px] text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-950/30 border border-green-100 dark:border-green-900 rounded-xl px-3 py-2 flex items-center gap-1.5">
                <i-feather name="check-circle" style="width:12px;height:12px;"></i-feather>
                Everything looks good.
            </p>
        </div>

        <!-- Fields -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 px-4 py-4">

            <div *ngFor="let field of pricingFields" class="flex flex-col gap-1">

                <label [for]="'centerPricing' + field.name"
                    class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
                    {{ field.label }}
                </label>

                <input [formControlName]="field.name" [id]="'centerPricing' + field.name" type="number"
                    [placeholder]="field.placeholder" class="w-full px-3 py-2 rounded-xl bg-gray-50 dark:bg-gray-800 border text-sm text-gray-900 dark:text-gray-100
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
                           transition placeholder:text-gray-400 dark:placeholder:text-gray-500" [ngClass]="updateCenterPricingForm.get(field.name)?.invalid &&
                             (invalidForm || updateCenterPricingForm.get(field.name)?.dirty)
                        ? 'border-red-300 dark:border-red-800' : 'border-gray-200 dark:border-gray-700'" />

                <p *ngIf="updateCenterPricingForm.get(field.name)?.invalid &&
                          (invalidForm || updateCenterPricingForm.get(field.name)?.dirty)"
                    class="text-[11px] text-red-500 dark:text-red-400 flex items-center gap-1">
                    <i-feather name="alert-circle" style="width:10px;height:10px;"></i-feather>
                    {{ field.label }} is required
                </p>

            </div>

        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <!-- Save -->
        <div class="py-2 px-4 flex items-center justify-between">
            <span *ngIf="hasChanges()" class="text-xs text-blue-600 font-semibold">Unsaved changes</span>
            <span *ngIf="!hasChanges()" class="text-xs text-gray-400 dark:text-gray-500">No changes made</span>

            <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2"
                [disabled]="!hasChanges() || updateCenterPricingForm.invalid"
                [ngClass]="{ 'opacity-40 cursor-not-allowed': !hasChanges() || updateCenterPricingForm.invalid }">
                <i-feather name="save" style="width:13px;height:13px;"></i-feather>
                Save changes
            </button>
        </div>

    </form>

</div>
