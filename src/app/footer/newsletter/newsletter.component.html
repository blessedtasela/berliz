<form [formGroup]="newsletterForm">
    <div class="grid grid-cols-1 font-sans">
        <h2 class="brand-heading text-base">Stay <span class="brand-accent-word">Connected</span></h2>
        <div class="w-full font-sans text-sm mt-2 text-brand-muted normal-case">
            <p>Get Berliz news, new trainers and centers, and member offers by email. Sign up to hear first.</p>
        </div>
        <div *ngIf="!newsletterForm.invalid && newsletterForm.touched" class="flex text-sm text-emerald-400 mt-2">
            Everything looks good
        </div>
        <div *ngIf="newsletterForm.get('email')?.invalid && newsletterForm.get('email')?.dirty" class="text-sm text-brand-red mt-2">
            invalid email
        </div>
        <div class="flex w-full mt-4">
        <input id="email" autocomplete="email"
            class="flex-1 min-w-0 border border-brand-border bg-brand-card text-brand-text placeholder-brand-muted
                   hover:border-brand-red/60 focus:border-brand-red focus:outline-none rounded-l-xl p-2.5 text-sm"
            placeholder="example@gmail.com" type="email" formControlName="email">
        <button class="text-sm font-bold bg-brand-red text-white py-1 px-4 hover:bg-red-700 rounded-r-xl font-sans whitespace-nowrap transition"
            type="submit" (click)="addNewsletter()">
            Sign up
        </button>
    </div>
    <app-inline-alert [message]="submitError" [kind]="'error'" [dismissible]="true" [dark]="true" (dismissed)="submitError = null"></app-inline-alert>
</div>
</form>
