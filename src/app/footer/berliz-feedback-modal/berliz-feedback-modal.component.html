<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="message-circle" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">Give feedback</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">Tell us what's working, or what isn't.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <div *ngIf="!isLoggedIn" class="flex flex-col items-center gap-3 text-center py-4">
        <p class="text-xs text-gray-500">Please log in to leave feedback about Berliz.</p>
        <button type="button" (click)="goToLogin()"
            class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white hover:bg-red-700 transition">
            Log in
        </button>
    </div>

    <form *ngIf="isLoggedIn" [formGroup]="feedbackForm" (ngSubmit)="submit()" class="flex flex-col gap-3">
        <textarea formControlName="message" rows="4" placeholder="What's on your mind?"
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition resize-none"></textarea>

        <p *ngIf="feedbackForm.get('message')?.invalid && feedbackForm.get('message')?.touched"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Write at least 10 characters
        </p>

        <button type="submit" [disabled]="feedbackForm.invalid || submitting"
            class="self-end px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                   hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
            <i-feather [name]="submitting ? 'loader' : 'send'" [ngClass]="{'animate-spin': submitting}" style="width:13px;height:13px;"></i-feather>
            {{ submitting ? 'Sending…' : 'Send feedback' }}
        </button>
    </form>

</div>
