<ngx-ui-loader></ngx-ui-loader>

<ng-container [ngSwitch]="activeLayout" class="break-all">

    <!-- LOGIN LAYOUT -->
    <ng-container *ngSwitchCase="'login'">
        <router-outlet></router-outlet>
    </ng-container>

    <!-- TOPBAR LAYOUT -->
    <ng-container *ngSwitchCase="'topbar'">
        <div class="bg-black">
            <app-navigation-bar></app-navigation-bar>
            <!-- app-navigation-bar is `fixed`, so it's removed from normal flow and
                 would otherwise sit on top of (clipping) whatever renders first —
                 pt-16 matches its h-16 height exactly. -->
            <div class="pt-16">
                <router-outlet></router-outlet>
            </div>
            <app-footer></app-footer>
        </div>
    </ng-container>

    <!-- SIDEBAR LAYOUT -->
    <ng-container *ngSwitchCase="'sidebar'">
        <div class="relative min-h-screen bg-gray-50">

            <app-top-bar></app-top-bar>
            <app-side-bar></app-side-bar>
            <app-message-popup></app-message-popup>

            <!--
              'collapsed' has a persistent icon rail on every viewport size (mobile
              included — see app-side-bar), so it reserves the same 56px of space
              everywhere. 'expanded' and 'hidden' are both overlay/toggle-based on
              mobile (no reserved space there, full width instead) and only push
              content across from `md` up.
            -->
            <div class="pt-14 transition-all duration-300 min-w-0"
                [ngClass]="{
                    'pl-14': sidebarMode === 'collapsed',
                    'md:pl-60': sidebarMode === 'expanded',
                    'md:pl-0': sidebarMode === 'hidden'
                }">
                <div class="p-4 min-w-0">
                    <router-outlet></router-outlet>
                    <app-footer></app-footer>
                </div>
            </div>

        </div>
    </ng-container>

</ng-container>

<div *ngIf="isBlurred$ | async" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[999] transition-all duration-300">
</div>
