<div class="bg-white font-sans rounded-xl border border-gray-200 p-4 flex flex-col gap-4 mt-4">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-sm font-bold text-gray-900">Center Affiliations</h2>
            <p class="text-[11px] text-gray-400 mt-0.5">
                Gyms and centers you're linked to
            </p>
        </div>
        <span class="text-[10px] font-semibold text-gray-400 bg-gray-50 border border-gray-100
                 px-2 py-0.5 rounded-full">
            {{ centerTrainers.length }} center{{ centerTrainers.length !== 1 ? 's' : '' }}
        </span>
    </div>

    <div class="border-t border-gray-100"></div>

    <!-- Empty state -->
    <div *ngIf="centerTrainers.length === 0"
        class="flex flex-col items-center justify-center py-10 gap-2 text-gray-400">
        <i-feather name="home" style="width:28px;height:28px;"></i-feather>
        <p class="text-xs italic">Not linked to any center yet.</p>
    </div>

    <!-- Center list -->
    <div *ngIf="centerTrainers.length > 0" class="flex flex-col gap-2">

        <div *ngFor="let ct of centerTrainers"
            class="flex items-center justify-between gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3">

            <div class="flex items-center gap-3 min-w-0">
                <img *ngIf="ct.photoResponse?.photoUrl as src; else centerFallbackIcon"
                    [src]="src | strapiUrl" alt="" class="w-9 h-9 rounded-xl object-cover object-top border border-gray-200 shrink-0" />
                <ng-template #centerFallbackIcon>
                    <div class="w-9 h-9 rounded-xl bg-white border border-gray-200 flex items-center justify-center shrink-0">
                        <i-feather name="home" style="width:15px;height:15px;" class="text-gray-500"></i-feather>
                    </div>
                </ng-template>
                <div class="min-w-0">
                    <p class="text-xs font-semibold text-gray-900 truncate">{{ ct.centerName }}</p>
                    <p class="text-[11px] text-gray-400">Linked since {{ formatDate(ct.date) }}</p>
                </div>
            </div>

            <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full border shrink-0" [ngClass]="isActive(ct.status)
                    ? 'bg-green-50 text-green-700 border-green-100'
                    : 'bg-yellow-50 text-yellow-700 border-yellow-100'">
                {{ isActive(ct.status) ? 'Active' : 'Pending' }}
            </span>

        </div>

    </div>

</div>
