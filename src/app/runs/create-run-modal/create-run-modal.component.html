<div class="bg-white rounded-2xl font-sans flex flex-col overflow-hidden max-h-[90vh] w-[460px] max-w-[95vw]">

  <!-- ═══════════════════ HEADER ═══════════════════ -->
  <div class="flex items-start justify-between gap-3 px-5 py-4 border-b border-gray-100 shrink-0">
    <div class="min-w-0">
      <h2 class="text-sm font-bold text-gray-900 flex items-center gap-2">
        <i-feather name="wind" style="width:13px;height:13px;" class="text-red-600"></i-feather>
        {{ isEdit ? 'Edit run' : 'Schedule a run' }}
      </h2>
      <p class="text-[11px] text-gray-400 mt-0.5">Solo for yourself, or a group run others can join.</p>
    </div>
    <button type="button" (click)="close()"
      class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 shrink-0">
      <i-feather name="x" style="width:14px;height:14px;"></i-feather>
    </button>
  </div>

  <div class="flex flex-col gap-4 p-5 overflow-y-auto">

    <!-- Solo / Group toggle -->
    <div class="flex items-center gap-2">
      <button type="button" (click)="solo = true" class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1.5"
        [ngClass]="solo ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-500 border-gray-200'">
        <i-feather name="user" style="width:12px;height:12px;"></i-feather>
        Solo
      </button>
      <button type="button" (click)="solo = false" class="flex-1 px-3 py-2 rounded-xl text-xs font-semibold border transition flex items-center justify-center gap-1.5"
        [ngClass]="!solo ? 'bg-red-600 text-white border-red-600' : 'bg-white text-gray-500 border-gray-200'">
        <i-feather name="users" style="width:12px;height:12px;"></i-feather>
        Group
      </button>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">Title (optional)</label>
      <input type="text" [(ngModel)]="title" placeholder="e.g. Saturday morning 5k" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-gray-900 text-xs
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition placeholder:text-gray-400" />
    </div>

    <!-- Date/time and City are each their own full-width row, not a shared
         grid column — a native datetime-local picker squeezed into a half
         column can render its date/time segments overlapping on some
         browsers, so it always gets the modal's full width. -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">Date &amp; time</label>
      <input type="datetime-local" [(ngModel)]="scheduledAt" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-gray-900 text-xs
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
    </div>
    <div *ngIf="!solo" class="flex flex-col gap-1">
      <label class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">City</label>
      <input type="text" [(ngModel)]="city" placeholder="e.g. Vancouver" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-gray-900 text-xs
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition placeholder:text-gray-400" />
    </div>

    <ng-container *ngIf="!solo">
      <label class="flex items-center justify-between gap-3 px-3 py-2.5 rounded-xl border border-gray-200">
        <span class="text-xs font-semibold text-gray-700">Open for anyone to request to join</span>
        <input type="checkbox" [(ngModel)]="isPublic" class="rounded" />
      </label>
      <p class="text-[10px] text-gray-400 -mt-2">
        {{ isPublic ? 'Runners browsing this city can see it and ask to join — you approve each request.' : 'Invite-only — you\'ll invite specific connections from My Runs after creating it.' }}
      </p>

      <div class="flex flex-col gap-1">
        <label class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">Max runners (optional)</label>
        <input type="number" min="1" [(ngModel)]="maxParticipants" placeholder="No limit" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-gray-900 text-xs
                 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition placeholder:text-gray-400" />
      </div>
    </ng-container>

    <div class="flex flex-col gap-1">
      <label class="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">Notes (optional)</label>
      <textarea [(ngModel)]="notes" rows="2" placeholder="Meeting point, pace, anything else to know" class="w-full px-3 py-2 bg-white border border-gray-200 rounded-xl text-gray-900 text-xs resize-none
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition placeholder:text-gray-400"></textarea>
    </div>

    <p *ngIf="error"
      class="text-[11px] text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-1.5">
      <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
      {{ error }}
    </p>
  </div>

  <!-- ═══════════════════ FOOTER ═══════════════════ -->
  <div class="flex items-center justify-between gap-2 px-5 py-4 border-t border-gray-100 shrink-0">
    <button type="button" (click)="close()"
      class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
      Cancel
    </button>
    <button type="button" (click)="save()" [disabled]="!canSubmit"
      class="px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center gap-2" [ngClass]="canSubmit
        ? 'bg-red-600 text-white hover:bg-red-700 active:scale-[0.98]'
        : 'bg-gray-100 text-gray-400 cursor-not-allowed'">
      <i-feather *ngIf="!submitting" name="save" style="width:13px;height:13px;"></i-feather>
      <i-feather *ngIf="submitting" name="loader" style="width:13px;height:13px;" class="animate-spin"></i-feather>
      {{ isEdit ? 'Save changes' : (solo ? 'Schedule run' : 'Create run') }}
    </button>
  </div>
</div>
