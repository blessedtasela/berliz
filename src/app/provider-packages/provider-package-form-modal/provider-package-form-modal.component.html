<div class="font-sans p-5 w-full max-w-md flex flex-col gap-4">

    <div class="flex items-center justify-between">
        <h2 class="text-sm font-bold text-gray-900">{{ isEdit ? 'Edit package' : 'New package' }}</h2>
        <button type="button" (click)="closeDialog()" class="text-gray-400 hover:text-gray-700 transition">
            <i-feather name="x" style="width:18px;height:18px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Package name</label>
            <input type="text" formControlName="name" placeholder="e.g. 5-Session Pack, Monthly Unlimited"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            <p *ngIf="invalidForm && form.get('name')?.invalid" class="text-[11px] text-red-600">A package name is required.</p>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Description (optional)</label>
            <textarea formControlName="description" rows="2" placeholder="What's included?"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900 resize-none
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition"></textarea>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" formControlName="isBundle" id="isBundle" class="rounded border-gray-300 text-red-600 focus:ring-red-400" />
            <label for="isBundle" class="text-xs text-gray-700">Fixed number of sessions (uncheck for a time-based/unlimited membership)</label>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1" *ngIf="isBundle">
                <label class="text-[11px] font-semibold text-gray-500">Sessions included</label>
                <input type="number" min="1" formControlName="sessionCount"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Price</label>
                <input type="number" min="0.01" step="0.01" formControlName="price" placeholder="200.00"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
                <p *ngIf="invalidForm && form.get('price')?.invalid" class="text-[11px] text-red-600">A price greater than $0 is required.</p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Group size</label>
                <input type="number" min="1" formControlName="groupSize"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
                <p class="text-[11px] text-gray-400">1 = private 1:1. Higher runs this as a group class -- set your Availability's capacity to match.</p>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Valid for (days, optional)</label>
                <input type="number" min="1" formControlName="durationDays" placeholder="Never expires"
                    class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition" />
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Billing</label>
            <select formControlName="billingType"
                class="px-3 py-2 rounded-lg bg-gray-50 border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-1 focus:ring-red-400 focus:bg-white transition">
                <option value="ONE_TIME">One-time purchase</option>
                <option value="RECURRING">Recurring (auto-renews)</option>
            </select>
        </div>

        <div class="flex items-center gap-2">
            <input type="checkbox" formControlName="isActive" id="isActive" class="rounded border-gray-300 text-red-600 focus:ring-red-400" />
            <label for="isActive" class="text-xs text-gray-700">Active (visible to clients)</label>
        </div>

        <div class="flex items-center justify-end gap-2 mt-2">
            <button type="button" (click)="closeDialog()" [disabled]="saving"
                class="text-xs font-semibold text-gray-500 hover:text-gray-700 transition px-3 py-2">Cancel</button>
            <button type="submit" [disabled]="saving"
                class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 disabled:opacity-40 rounded-lg px-4 py-2 transition">
                {{ saving ? 'Saving...' : (isEdit ? 'Save changes' : 'Create package') }}
            </button>
        </div>
    </form>
</div>
