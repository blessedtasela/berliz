<!-- GN-76 (Nov 21, 2026): black/white/red brand redesign. bg-brand-bg fills the Material dialog
     panel behind this content, since that panel's own default theme is a hardcoded-light surface. -->
<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans bg-brand-bg rounded-2xl">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-brand-red/10 border border-brand-red flex items-center justify-center shrink-0">
                <i-feather name="key" class="text-brand-red" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="brand-heading text-base">Forgot password</h2>
                <p class="text-[11px] text-brand-muted normal-case mt-0.5">We'll email you a reset link if this address is on file.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-brand-card flex items-center justify-center transition text-brand-muted hover:text-white shrink-0" aria-label="Close">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submitForm()" class="flex flex-col gap-4">

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="brand-label">
                Email address
            </label>
            <input aria-label="Email address" autocomplete="email" formControlName="email" type="email" placeholder="you@example.com" class="brand-input"
                [ngClass]="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched ? 'border-brand-red' : ''">
            <p *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.dirty"
                class="text-brand-red text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter a valid email address
            </p>
        </div>

        <div class="border-t border-brand-border"></div>

        <app-inline-alert [message]="submitError" [kind]="'error'" [dismissible]="true" [dark]="true" (dismissed)="submitError = null"></app-inline-alert>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()" class="px-4 py-2.5 rounded-xl text-xs font-bold uppercase tracking-wide border border-brand-border text-brand-muted
                       hover:border-brand-red hover:text-white active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" [disabled]="forgotPasswordForm.invalid" class="px-4 py-2.5 rounded-xl text-xs font-extrabold uppercase tracking-wide bg-brand-red text-white
                       active:scale-[0.98] transition flex items-center gap-2 disabled:opacity-50 disabled:pointer-events-none">
                <i-feather name="send" style="width:13px;height:13px;"></i-feather>
                Send reset link
            </button>
        </div>

    </form>

</div>
