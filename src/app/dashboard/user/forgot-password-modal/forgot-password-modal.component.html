<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/30 border border-red-100 dark:border-red-900/50 flex items-center justify-center shrink-0">
                <i-feather name="key" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Forgot password</h2>
                <p class="text-[11px] text-gray-400 mt-0.5">We'll email you a reset link if this address is on file.</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0" aria-label="Close">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="forgotPasswordForm" (ngSubmit)="submitForm()" class="flex flex-col gap-4">

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                Email address
            </label>
            <input aria-label="Email address" autocomplete="email" formControlName="email" type="email" placeholder="you@example.com" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="{
                        'border-red-400 bg-red-50 dark:bg-red-950/30': forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched,
                        'border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800': !(forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched)
                      }">
            <p *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter a valid email address
            </p>
        </div>

        <div class="border-t border-gray-100 dark:border-gray-800"></div>

        <app-inline-alert [message]="submitError" [kind]="'error'" [dismissible]="true" (dismissed)="submitError = null"></app-inline-alert>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                       hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
                Cancel
            </button>
            <button type="submit" [disabled]="forgotPasswordForm.invalid" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2 disabled:opacity-50 disabled:pointer-events-none">
                <i-feather name="send" style="width:13px;height:13px;"></i-feather>
                Send reset link
            </button>
        </div>

    </form>

</div>
