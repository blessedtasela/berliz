<!-- GN-76 (Nov 21, 2026): black/white/red brand redesign. bg-brand-bg fills the Material dialog
     panel behind this content, since that panel's own default theme is a hardcoded-light surface. -->
<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans bg-brand-bg rounded-2xl">

    <!-- Header -->
    <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-brand-red/10 border border-brand-red flex items-center justify-center shrink-0">
            <i-feather name="lock" class="text-brand-red" style="width:15px;height:15px;"></i-feather>
        </div>
        <div>
            <h2 class="brand-heading text-base">Reset password</h2>
            <p class="text-[11px] text-brand-muted normal-case mt-0.5">Set a new password for your account.</p>
        </div>
    </div>

    <form [formGroup]="resetPasswordForm" class="flex flex-col gap-4">

        <!-- New password -->
        <div class="flex flex-col gap-1">
            <label class="brand-label">
                New password
            </label>
            <input aria-label="New password" autocomplete="new-password" formControlName="password" type="password" placeholder="Enter a new password" class="brand-input"
                [ngClass]="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched ? 'border-brand-red' : ''">
            <p *ngIf="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.dirty"
                class="text-brand-red text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Must be at least 8 characters
            </p>
        </div>

        <!-- Confirm password -->
        <div class="flex flex-col gap-1">
            <label class="brand-label">
                Confirm password
            </label>
            <input aria-label="Confirm password" autocomplete="new-password" formControlName="confirmPassword" type="password" placeholder="Re-type password" class="brand-input"
                [ngClass]="resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched ? 'border-brand-red' : ''">
            <p *ngIf="resetPasswordForm.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.dirty"
                class="text-brand-red text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Passwords do not match
            </p>
        </div>

        <div class="border-t border-brand-border"></div>

        <app-inline-alert [message]="submitError" [kind]="'error'" [dismissible]="true" [dark]="true" (dismissed)="submitError = null"></app-inline-alert>

        <button type="submit" (click)="submitForm()" class="brand-btn-primary flex items-center justify-center gap-2">
            <i-feather name="check-circle" style="width:15px;height:15px;"></i-feather>
            Reset password
        </button>

    </form>

</div>
