<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
            <i-feather name="lock" class="text-red-600" style="width:15px;height:15px;"></i-feather>
        </div>
        <div>
            <h2 class="text-sm font-bold text-gray-900">Reset password</h2>
            <p class="text-[11px] text-gray-400 mt-0.5">Set a new password for your account.</p>
        </div>
    </div>

    <form [formGroup]="resetPasswordForm" class="flex flex-col gap-4">

        <!-- New password -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                New password
            </label>
            <input formControlName="password" type="password" placeholder="Enter a new password" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="{
                        'border-red-400 bg-red-50': resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched,
                        'border-gray-200 bg-gray-50': !(resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.touched)
                      }">
            <p *ngIf="resetPasswordForm.get('password')?.invalid && resetPasswordForm.get('password')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Must be at least 8 characters
            </p>
        </div>

        <!-- Confirm password -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                Confirm password
            </label>
            <input formControlName="confirmPassword" type="password" placeholder="Re-type password" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="{
                        'border-red-400 bg-red-50': resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched,
                        'border-gray-200 bg-gray-50': !(resetPasswordForm.get('confirmPassword')?.invalid && resetPasswordForm.get('confirmPassword')?.touched)
                      }">
            <p *ngIf="resetPasswordForm.hasError('passwordMismatch') && resetPasswordForm.get('confirmPassword')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Passwords do not match
            </p>
        </div>

        <div class="border-t border-gray-100"></div>

        <button type="submit" (click)="submitForm()" class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white py-2.5 rounded-xl
                   font-semibold text-sm transition-all flex items-center justify-center gap-2">
            <i-feather name="check-circle" style="width:15px;height:15px;"></i-feather>
            Reset password
        </button>

    </form>

</div>
