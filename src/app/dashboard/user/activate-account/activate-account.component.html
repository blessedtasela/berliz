<!-- ═══════════════════════════════════════════════
     ACTIVATE ACCOUNT — code entry from the signup email
════════════════════════════════════════════════ -->
<div class="bg-black font-sans">

  <div class="relative min-h-screen bg-zinc-950 flex items-center justify-center px-4 py-12 overflow-hidden">

    <!-- Red glow -->
    <div class="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-red-600/10 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-80 h-80 rounded-full bg-red-600/10 blur-3xl pointer-events-none"></div>

    <div class="relative w-full max-w-md rounded-2xl border border-zinc-800 bg-white
                shadow-[0_8px_40px_rgba(0,0,0,0.6)] p-7 sm:p-9 flex flex-col gap-6">

      <!-- Header -->
      <header class="flex flex-col items-center text-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-red-50 border border-red-100 flex items-center justify-center">
          <i-feather name="mail" class="text-red-600" style="width:20px;height:20px;"></i-feather>
        </div>
        <div>
          <h1 class="text-lg font-bold text-gray-900">Activate your account</h1>
          <p class="text-xs text-gray-500 mt-1">
            Enter the activation code we emailed you when you signed up.
          </p>
        </div>
      </header>

      <!-- Code form -->
      <form [formGroup]="activateAccountForm" (ngSubmit)="submitForm()" class="flex flex-col gap-4">
        <div class="flex flex-col gap-1">
          <label class="text-xs font-semibold text-gray-600 uppercase tracking-wide">Activation code</label>
          <input formControlName="token" type="text" inputmode="text" autocomplete="one-time-code"
            placeholder="Paste your code" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400 tracking-wide
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"
            [ngClass]="tokenControl?.invalid && tokenControl?.touched
                        ? 'border-red-400 bg-red-50' : 'border-gray-200 bg-gray-50'" />
          <p *ngIf="tokenControl?.invalid && tokenControl?.touched"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Enter the full code from the email (at least 8 characters).
          </p>
        </div>

        <button type="submit" [disabled]="activateAccountForm.invalid || submitting"
          class="w-full py-2.5 rounded-xl bg-red-600 text-white text-sm font-semibold
                 hover:bg-red-700 active:scale-[0.98] transition flex items-center justify-center gap-2
                 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
          <i-feather name="check-circle" style="width:14px;height:14px;"></i-feather>
          {{ submitting ? 'Activating…' : 'Activate account' }}
        </button>
      </form>

      <!-- Resend -->
      <div class="border-t border-gray-100 pt-5 flex flex-col gap-2">
        <p class="text-xs font-semibold text-gray-600">Didn't get a code?</p>
        <form [formGroup]="resendForm" (ngSubmit)="resend()" class="flex items-start gap-2">
          <div class="flex-1 flex flex-col gap-1">
            <input formControlName="email" type="email" autocomplete="email" placeholder="you@example.com"
              class="w-full px-3 py-2 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900 placeholder-gray-400
                     focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
            <p *ngIf="resendForm.get('email')?.invalid && resendForm.get('email')?.touched"
              class="text-red-500 text-[11px]">Enter a valid email.</p>
            <p *ngIf="resent" class="text-green-600 text-[11px] flex items-center gap-1">
              <i-feather name="check" style="width:11px;height:11px;"></i-feather>
              Sent — check your inbox (and spam).
            </p>
          </div>
          <button type="submit" [disabled]="resending"
            class="shrink-0 px-4 py-2 rounded-xl border border-gray-200 text-gray-700 text-xs font-semibold
                   hover:bg-gray-50 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
            {{ resending ? 'Sending…' : 'Resend' }}
          </button>
        </form>
      </div>

      <!-- Back to login -->
      <div class="text-center">
        <a routerLink="/login" class="text-xs font-semibold text-gray-500 hover:text-gray-800 transition inline-flex items-center gap-1">
          <i-feather name="arrow-left" style="width:12px;height:12px;"></i-feather>
          Back to login
        </a>
      </div>

    </div>
  </div>

  <app-footer></app-footer>
</div>
