<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 font-sans flex flex-col gap-4">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i-feather name="zap" class="text-red-600 shrink-0" style="width:16px;height:16px;"></i-feather>
      <h2 class="text-gray-800 text-base font-bold">Trending exercises</h2>
    </div>
    <a routerLink="/dashboard/exercises" class="text-red-600 text-xs font-semibold hover:underline">
      View all
    </a>
  </div>

  <!-- Category filter pills -->
  <div class="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">

    <button type="button" (click)="selectCategory(null)"
      class="shrink-0 text-[11px] font-semibold px-3 py-1.5 rounded-full border transition whitespace-nowrap"
      [ngClass]="activeCategoryId === null
        ? 'bg-red-600 text-white border-red-600'
        : 'bg-white text-gray-600 border-gray-200 hover:border-red-300 hover:text-red-600'">
      All
    </button>

    <button *ngFor="let category of categories" type="button" (click)="selectCategory(category.id)"
      class="shrink-0 text-[11px] font-semibold px-3 py-1.5 rounded-full border transition whitespace-nowrap"
      [ngClass]="activeCategoryId === category.id
        ? 'bg-red-600 text-white border-red-600'
        : 'bg-white text-gray-600 border-gray-200 hover:border-red-300 hover:text-red-600'">
      {{ category.name }}
    </button>

  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="flex items-center justify-center py-10 gap-2">
    <i-feather name="loader" class="text-gray-300 animate-spin" style="width:20px;height:20px;"></i-feather>
    <span class="text-xs text-gray-400">Loading trending exercises…</span>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && exercises.length === 0" class="flex flex-col items-center text-center py-10 gap-2">
    <i-feather name="activity" class="text-gray-300" style="width:32px;height:32px;"></i-feather>
    <p class="text-gray-500 text-sm italic">Nothing trending here yet</p>
    <p class="text-gray-400 text-[11px]">Like an exercise to help it show up.</p>
  </div>

  <!-- Cards -->
  <div *ngIf="!loading && exercises.length > 0"
    class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">

    <div *ngFor="let exercise of exercises; trackBy: trackById"
      class="border border-gray-200 rounded-xl p-3 flex flex-col gap-2 hover:border-red-300 transition">

      <!-- Name + like -->
      <div class="flex items-start justify-between gap-2">
        <p class="text-xs font-semibold text-gray-900 leading-snug line-clamp-2 flex-1">
          {{ exercise.name }}
        </p>

        <button type="button" (click)="likeExercise(exercise)"
          class="shrink-0 flex items-center gap-1 text-[10px] font-semibold transition"
          [ngClass]="isLiked(exercise) ? 'text-red-600' : 'text-gray-400 hover:text-red-400'"
          [attr.aria-label]="isLiked(exercise) ? 'Unlike ' + exercise.name : 'Like ' + exercise.name">
          <!-- Solid heart when liked (Feather's is outline-only) -->
          <svg *ngIf="isLiked(exercise)" viewBox="0 0 24 24" fill="currentColor"
            style="width:12px;height:12px;">
            <path
              d="M12 21s-6.716-4.35-9.428-8.06C.657 10.42 1.1 6.9 3.76 5.24c2.29-1.43 5.02-.8 6.6 1.1L12 8l1.64-1.66c1.58-1.9 4.31-2.53 6.6-1.1 2.66 1.66 3.1 5.18 1.19 7.7C18.716 16.65 12 21 12 21z" />
          </svg>
          <i-feather *ngIf="!isLiked(exercise)" name="heart" style="width:12px;height:12px;"></i-feather>
          {{ likeCount(exercise) }}
        </button>
      </div>

      <!-- Description -->
      <p *ngIf="exercise.description" class="text-[10px] text-gray-400 leading-snug line-clamp-2">
        {{ exercise.description }}
      </p>

      <!-- Category chips -->
      <div class="flex flex-wrap gap-1 mt-auto pt-1">
        <span *ngFor="let name of categoryNames(exercise)"
          class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-gray-50 text-gray-600 border border-gray-200">
          {{ name }}
        </span>
        <span *ngIf="extraCategoryCount(exercise) > 0"
          class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-gray-50 text-gray-400 border border-gray-200">
          +{{ extraCategoryCount(exercise) }}
        </span>
      </div>

    </div>

  </div>

</div>
