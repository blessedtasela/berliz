<div class="bg-white rounded-2xl border border-gray-200 shadow-sm p-4 font-sans flex flex-col gap-5">

  <!-- Header -->
  <div class="flex justify-between items-center">
    <div class="flex items-center gap-2">
      <i-feather name="star" class="text-red-600 shrink-0" style="width:16px;height:16px;"></i-feather>
      <h2 class="text-gray-800 text-base font-bold">Suggested for you</h2>
    </div>
  </div>

  <!-- ── Suggested programs ─────────────────────────────────────────────── -->
  <div class="flex flex-col gap-2">

    <div class="flex items-center justify-between">
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Popular programs</h3>
      <a routerLink="/dashboard/find-providers" class="text-red-600 text-xs font-semibold hover:underline">Browse all</a>
    </div>

    <div *ngIf="programs.length === 0" class="flex flex-col items-center text-center py-6 gap-2">
      <i-feather name="grid" class="text-gray-300" style="width:26px;height:26px;"></i-feather>
      <p class="text-xs text-gray-400 italic">No programs yet</p>
    </div>

    <div *ngIf="programs.length > 0" class="grid grid-cols-1 sm:grid-cols-2 gap-2">
      <a *ngFor="let program of programs; trackBy: trackById"
        [routerLink]="['/dashboard/find-providers/category', program.id, formatStringToUrl(program.name)]"
        class="border border-gray-200 rounded-xl p-3 flex flex-col gap-1.5 hover:border-red-300 hover:bg-red-50/40 transition">

        <div class="flex items-start justify-between gap-2">
          <p class="text-xs font-semibold text-gray-900 leading-snug line-clamp-1 flex-1">
            {{ program.name }}
          </p>
          <span class="shrink-0 flex items-center gap-1 text-[10px] font-semibold text-red-600">
            <!-- Solid heart (Feather's is outline-only) — read-only count, not a toggle -->
            <svg viewBox="0 0 24 24" fill="currentColor" style="width:11px;height:11px;">
              <path
                d="M12 21s-6.716-4.35-9.428-8.06C.657 10.42 1.1 6.9 3.76 5.24c2.29-1.43 5.02-.8 6.6 1.1L12 8l1.64-1.66c1.58-1.9 4.31-2.53 6.6-1.1 2.66 1.66 3.1 5.18 1.19 7.7C18.716 16.65 12 21 12 21z" />
            </svg>
            {{ program.likes }}
          </span>
        </div>

        <p *ngIf="program.description" class="text-[10px] text-gray-400 leading-snug line-clamp-2">
          {{ program.description }}
        </p>
      </a>
    </div>

  </div>

  <!-- ── Suggested workouts ─────────────────────────────────────────────── -->
  <div class="flex flex-col gap-2 pt-1 border-t border-gray-100">

    <div class="flex items-center justify-between pt-3">
      <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Popular workouts</h3>
      <a routerLink="/dashboard/my-workouts" class="text-red-600 text-xs font-semibold hover:underline">
        My workouts
      </a>
    </div>

    <div *ngIf="templates.length === 0" class="flex flex-col items-center text-center py-6 gap-2">
      <i-feather name="layers" class="text-gray-300" style="width:26px;height:26px;"></i-feather>
      <p class="text-xs text-gray-400 italic">No workout templates yet</p>
    </div>

    <div *ngIf="templates.length > 0" class="flex flex-col gap-2">
      <div *ngFor="let template of templates; trackBy: trackById"
        class="border border-gray-200 rounded-xl p-3 flex items-start gap-3 hover:border-red-300 transition">

        <div class="flex-1 min-w-0 flex flex-col gap-1.5">

          <div class="flex items-center gap-2">
            <p class="text-xs font-semibold text-gray-900 leading-snug line-clamp-1">
              {{ template.name }}
            </p>
            <span *ngIf="template.cloneCount > 0"
              class="shrink-0 text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-red-50 text-red-600 border border-red-100">
              {{ template.cloneCount }} added
            </span>
          </div>

          <!-- Exercise chips -->
          <div class="flex flex-wrap gap-1">
            <span *ngFor="let name of templateExerciseNames(template)"
              class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-gray-50 text-gray-600 border border-gray-200">
              {{ name }}
            </span>
            <span *ngIf="extraTemplateExerciseCount(template) > 0"
              class="text-[9px] font-semibold px-1.5 py-0.5 rounded-full bg-gray-50 text-gray-400 border border-gray-200">
              +{{ extraTemplateExerciseCount(template) }}
            </span>
          </div>

        </div>

        <button type="button" (click)="quickAddTemplate(template)"
          [disabled]="cloningTemplateId === template.id"
          class="shrink-0 flex items-center gap-1 px-2.5 py-1.5 rounded-lg bg-red-600 text-white text-[10px] font-semibold
                 hover:bg-red-700 transition disabled:opacity-50 disabled:cursor-not-allowed">
          <i-feather [name]="cloningTemplateId === template.id ? 'loader' : 'plus'"
            [ngClass]="{ 'animate-spin': cloningTemplateId === template.id }"
            style="width:11px;height:11px;">
          </i-feather>
          {{ cloningTemplateId === template.id ? 'Adding…' : 'Quick add' }}
        </button>

      </div>
    </div>

  </div>

</div>
