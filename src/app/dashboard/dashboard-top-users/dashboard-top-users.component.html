<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl font-sans">

  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-gray-800">
    <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Users</h2>
    <span class="text-[11px] text-gray-400 dark:text-gray-500">{{ users.length }} total</span>
  </div>

  <!-- Empty -->
  <div *ngIf="users.length === 0" class="flex flex-col items-center py-10 gap-2 text-center">
    <i-feather name="users" class="text-gray-300 dark:text-gray-600" style="width:28px;height:28px;"></i-feather>
    <p class="text-xs text-gray-400 dark:text-gray-500 italic">No users yet</p>
  </div>

  <!-- List -->
  <div *ngIf="users.length > 0" class="divide-y divide-gray-100 dark:divide-gray-800">
    <div *ngFor="let user of users | slice:0:10; let i = index"
      class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 dark:hover:bg-gray-800 transition">

      <span class="text-[11px] text-gray-400 dark:text-gray-500 font-medium w-5 shrink-0">{{ i + 1 }}</span>

      <button type="button" (click)="goToProfile(user)" title="View profile" class="shrink-0">
        <img [src]="photoSrc(user)" [alt]="user.firstname"
          class="w-8 h-8 rounded-full object-cover object-top border border-gray-200 dark:border-gray-700 hover:opacity-80 transition" />
      </button>

      <div class="flex-1 min-w-0">
        <app-user-hover-card [userId]="user.id" [firstname]="user.firstname" [lastname]="user.lastname"
          [photo]="user.profilePhoto" [role]="user.role" [email]="user.email" [label]="user.email">
        </app-user-hover-card>
        <p class="text-[10px] text-gray-400 dark:text-gray-500 flex items-center gap-1 mt-0.5">
          <i-feather name="calendar" style="width:10px;height:10px;"></i-feather>
          {{ formatDate(user.date) }}
        </p>
      </div>

      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0" [ngClass]="user.status === 'true'
          ? 'bg-green-50 dark:bg-green-950/20 text-green-700 dark:text-green-400 border border-green-100 dark:border-green-900'
          : 'bg-gray-100 dark:bg-gray-800 text-gray-500 dark:text-gray-400 border border-gray-200 dark:border-gray-700'">
        {{ user.status === 'true' ? 'Active' : 'Inactive' }}
      </span>

    </div>

    <!-- Show more card -->
    <a *ngIf="users.length > 10" routerLink="/dashboard/users"
      class="flex items-center justify-center gap-2 px-4 py-3 text-xs font-semibold text-gray-700 dark:text-gray-300
             hover:bg-red-50 dark:hover:bg-red-950/20 transition">
      +{{ users.length - 10 }} more
      <span class="text-red-600">View all users</span>
      <i-feather name="arrow-right" class="text-red-600" style="width:12px;height:12px;"></i-feather>
    </a>
  </div>

</div>
