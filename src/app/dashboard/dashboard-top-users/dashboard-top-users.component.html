<div class="bg-white border border-gray-200 rounded-xl font-sans">

  <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
    <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Users</h2>
    <span class="text-[11px] text-gray-400">{{ users.length }} total</span>
  </div>

  <!-- Empty -->
  <div *ngIf="users.length === 0" class="flex flex-col items-center py-10 gap-2 text-center">
    <i-feather name="users" class="text-gray-300" style="width:28px;height:28px;"></i-feather>
    <p class="text-xs text-gray-400 italic">No users yet</p>
  </div>

  <!-- List -->
  <div *ngIf="users.length > 0" class="divide-y divide-gray-100">
    <div *ngFor="let user of users | slice:0:10; let i = index"
      class="flex items-center gap-3 px-4 py-3 hover:bg-gray-50 transition">

      <span class="text-[11px] text-gray-400 font-medium w-5 shrink-0">{{ i + 1 }}</span>

      <div class="w-8 h-8 rounded-full bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
        <span class="text-xs font-bold text-red-600">
          {{ user.email.charAt(0).toUpperCase() }}
        </span>
      </div>

      <div class="flex-1 min-w-0">
        <p class="text-xs font-semibold text-gray-900 truncate">{{ user.email }}</p>
        <p class="text-[10px] text-gray-400 flex items-center gap-1 mt-0.5">
          <i-feather name="calendar" style="width:10px;height:10px;"></i-feather>
          {{ formatDate(user.date) }}
        </p>
      </div>

      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full shrink-0" [ngClass]="user.status === 'true'
          ? 'bg-green-50 text-green-700 border border-green-100'
          : 'bg-gray-100 text-gray-500 border border-gray-200'">
        {{ user.status === 'true' ? 'Active' : 'Inactive' }}
      </span>

    </div>

    <!-- Show more card -->
    <a *ngIf="users.length > 10" routerLink="/dashboard/users"
      class="flex items-center justify-center gap-2 px-4 py-3 text-xs font-semibold text-gray-700
             hover:bg-red-50 transition">
      +{{ users.length - 10 }} more
      <span class="text-red-600">View all users</span>
      <i-feather name="arrow-right" class="text-red-600" style="width:12px;height:12px;"></i-feather>
    </a>
  </div>

</div>
