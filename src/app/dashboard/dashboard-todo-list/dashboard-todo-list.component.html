<!-- Empty State -->
<div *ngIf="todoData.length === 0" class="flex flex-col items-center text-center p-6">
    <h1 class="text-gray-500 italic font-sans text-lg">
        Your Todo Tasks will appear here
    </h1>
    <p class="text-gray-500 italic font-sans text-sm mt-1">
        You currently have no tasks. Click
        <a routerLink="/dashboard/my-todos"
            class="text-red-600 font-bold hover:underline hover:text-red-700 transition">
            here
        </a>
        to add one now.
    </p>
</div>

<!-- Header -->
<div *ngIf="todoData.length > 0" class="flex justify-between items-center mb-3">
    <h1 class="text-gray-800 text-xl font-bold font-sans">My Todos</h1>
    <a routerLink="/dashboard/my-todos" class="text-red-600 text-sm font-semibold hover:underline">
        View All
    </a>
</div>

<!-- Todo List -->
<div *ngFor="let todo of todoData" (click)="openTodoDetails(todo)"
    class="p-4 bg-white rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition cursor-pointer flex flex-col gap-2">

    <!-- Task -->
    <div class="text-gray-900 font-semibold text-sm leading-snug">
        {{ todo.task }}
    </div>

    <!-- Created Date -->
    <div class="flex items-center text-xs text-gray-400">
        <i-feather name="calendar" class="text-red-600 mr-1" style="width: 14px; height: 14px;"></i-feather>
        {{ todo.date | timeAgo }}
    </div>

    <!-- Bottom Row -->
    <div class="flex justify-between items-center mt-1">

        <!-- Due Label -->
        <div class="text-xs font-bold" [ngClass]="getDueColor(todo)">
            {{ getDueLabel(todo) }}
        </div>

        <!-- Status Badge -->
        <span *ngIf="todo.status === 'completed'"
            class="px-2 py-1 text-xs font-bold rounded-md bg-green-100 text-green-600">
            Completed
        </span>

        <span *ngIf="todo.status === 'pending'"
            class="px-2 py-1 text-xs font-bold rounded-md bg-gray-100 text-gray-800">
            Not Started
        </span>

        <span *ngIf="todo.status === 'in-progress'"
            class="px-2 py-1 text-xs font-bold rounded-md bg-blue-100 text-blue-700">
            In Progress
        </span>

        <span *ngIf="todo.status === 'cancelled'"
            class="px-2 py-1 text-xs font-bold rounded-md bg-gray-300 text-gray-700">
            Cancelled
        </span>

    </div>

</div>
