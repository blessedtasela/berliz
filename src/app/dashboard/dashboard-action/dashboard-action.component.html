<div class="bg-white border border-gray-200 rounded-xl font-sans">

    <!-- Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Overview</h2>
        <span class="text-[11px] text-gray-400">{{ (data | keyvalue)?.length }} modules</span>
    </div>

    <!-- Scrollable cards -->
    <div class="overflow-x-auto px-4 py-4">
        <div class="flex gap-3" style="min-width: max-content;">

            <a *ngFor="let item of data | keyvalue" [routerLink]="['/dashboard/' + formatUrl(item.key)]" class="w-44 flex flex-col gap-3 p-4 border border-gray-200 rounded-xl bg-white
               hover:shadow-sm hover:-translate-y-0.5 transition cursor-pointer shrink-0">

                <!-- Dot -->
                <div class="flex justify-end">
                    <span class="w-2 h-2 bg-red-600 rounded-full"></span>
                </div>

                <!-- Label + value -->
                <div class="flex flex-col gap-0.5">
                    <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wide truncate">
                        {{ item.key }}
                    </span>
                    <span class="text-2xl font-bold text-gray-900 leading-none">
                        {{ item.value }}
                    </span>
                </div>

                <!-- CTA -->
                <span class="text-[11px] font-semibold text-red-600 flex items-center gap-1 mt-auto">
                    View details
                    <i-feather name="arrow-right" style="width:11px;height:11px;"></i-feather>
                </span>

            </a>

        </div>
    </div>

</div>
