<section class="mt-2 bg-white text-gray-950 font-sans container rounded-lg">
    <div class="overflow-x-scroll">
        <div class="flex">

            <div class="flex justify-between items-center z-0
               transition-all duration-300 hover:scale-105 hover:drop-shadow-xl" *ngFor="let item of data | keyvalue">
                <div class="w-56 h-56 bg-white rounded-lg p-4 m-4 border border-gray-200 shadow-sm
                    flex flex-col justify-between">

                    <!-- Badge -->
                    <div class="flex justify-end">
                        <span class="w-3 h-3 bg-red-600 rounded-full border border-red border-2 shadow"></span>
                    </div>


                    <!-- Title + Value -->
                    <div class="flex flex-col items-center text-center">
                        <p class="text-lg font-bold text-red-600 uppercase tracking-wide mt-2">
                            {{ item.key }}
                        </p>
                        <p class="text-gray-800 font-bold text-md mt-1">
                            {{ item.value }}
                        </p>
                    </div>

                    <!-- Button -->
                    <button class="text-sm bg-red-600 text-white py-1 px-3 rounded-md font-semibold
                   transition-all duration-300 hover:bg-red-700 hover:scale-105 mx-auto">
                        <a [routerLink]="['/dashboard/' + formatUrl(item.key)]">
                            view details
                        </a>
                    </button>

                </div>
            </div>

        </div>
    </div>
</section>
