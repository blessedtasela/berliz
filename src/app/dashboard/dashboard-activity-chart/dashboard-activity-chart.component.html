<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col gap-3 h-full">
  <div class="flex items-center justify-between">
    <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Todo activity · last 7 days</h2>
    <span class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">{{ scopeLabel }}</span>
  </div>
  <div class="relative flex-1 min-h-[260px]">
    <canvas #activityCanvas></canvas>

    <div *ngIf="!ready"
      class="absolute inset-0 flex items-center justify-center bg-white/70 dark:bg-gray-900/70 rounded-xl">
      <span class="text-xs text-gray-400 dark:text-gray-500">Loading…</span>
    </div>

    <div *ngIf="ready && total === 0"
      class="absolute inset-0 flex items-center justify-center">
      <span class="text-xs text-gray-400 dark:text-gray-500">No todos created in the last 7 days.</span>
    </div>
  </div>
</div>
