<div class="bg-white border border-gray-200 rounded-xl p-4 flex flex-col gap-4 h-full">

    <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-gray-500 uppercase tracking-wide">Subscription analytics</h2>
        <span class="text-[10px] font-semibold text-gray-400 uppercase tracking-wide">{{ scopeLabel }}</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-gray-50 border border-gray-100 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wide">Total</span>
            <span class="text-xl font-bold text-gray-900">{{ ready ? total : '—' }}</span>
        </div>
        <div class="bg-green-50 border border-green-100 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-green-500 font-semibold uppercase tracking-wide">Active</span>
            <span class="text-xl font-bold text-green-700">{{ ready ? active : '—' }}</span>
        </div>
        <div class="bg-yellow-50 border border-yellow-100 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-yellow-500 font-semibold uppercase tracking-wide">Expiring</span>
            <span class="text-xl font-bold text-yellow-600">{{ ready ? expiringSoon : '—' }}</span>
        </div>
        <div class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-gray-400 font-semibold uppercase tracking-wide">Expired</span>
            <span class="text-xl font-bold text-gray-500">{{ ready ? expired : '—' }}</span>
        </div>
    </div>

    <!-- Chart -->
    <div class="relative flex-1 min-h-[200px]">
        <canvas #analyticsCanvas></canvas>

        <div *ngIf="!ready"
            class="absolute inset-0 flex items-center justify-center bg-white/70 rounded-xl">
            <span class="text-xs text-gray-400">Loading…</span>
        </div>

        <div *ngIf="ready && total === 0"
            class="absolute inset-0 flex items-center justify-center">
            <span class="text-xs text-gray-400">No subscriptions yet.</span>
        </div>
    </div>

</div>
