<div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 flex flex-col gap-4 h-full">

    <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wide">Subscription analytics</h2>
        <span class="text-[10px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide">{{ scopeLabel }}</span>
    </div>

    <!-- Stats -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Total</span>
            <span class="text-xl font-bold text-gray-900 dark:text-gray-100">{{ ready ? total : '—' }}</span>
        </div>
        <div class="bg-green-50 dark:bg-green-950/20 border border-green-100 dark:border-green-900 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-green-500 dark:text-green-400 font-semibold uppercase tracking-wide">Active</span>
            <span class="text-xl font-bold text-green-700 dark:text-green-400">{{ ready ? active : '—' }}</span>
        </div>
        <div class="bg-yellow-50 dark:bg-yellow-950/20 border border-yellow-100 dark:border-yellow-900 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-yellow-500 dark:text-yellow-400 font-semibold uppercase tracking-wide">Expiring</span>
            <span class="text-xl font-bold text-yellow-600 dark:text-yellow-400">{{ ready ? expiringSoon : '—' }}</span>
        </div>
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2.5 flex flex-col gap-0.5">
            <span class="text-[10px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Expired</span>
            <span class="text-xl font-bold text-gray-500 dark:text-gray-400">{{ ready ? expired : '—' }}</span>
        </div>
    </div>

    <!-- Chart -->
    <div class="relative flex-1 min-h-[200px]">
        <canvas #analyticsCanvas></canvas>

        <div *ngIf="!ready"
            class="absolute inset-0 flex items-center justify-center bg-white/70 dark:bg-gray-900/70 rounded-xl">
            <span class="text-xs text-gray-400 dark:text-gray-500">Loading…</span>
        </div>

        <div *ngIf="ready && total === 0"
            class="absolute inset-0 flex items-center justify-center">
            <span class="text-xs text-gray-400 dark:text-gray-500">No subscriptions yet.</span>
        </div>
    </div>

</div>
