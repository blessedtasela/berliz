<!-- Header -->
<div class="flex justify-between items-center mb-3">
  <h1 class="text-gray-800 text-xl font-bold font-sans">Subscription Analytics</h1>
</div>

<!-- Chart -->
<div class="w-full h-[300px] md:h-[350px] lg:h-[400px] mt-6 bg-white border border-gray-200 rounded-2xl p-4">
    <canvas #analyticsCanvas></canvas>
</div>

<!-- Stats -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-white border border-gray-200 rounded-2xl p-4 mt-4">
    <div class="flex flex-col">
        <span class="text-xs text-gray-500 uppercase">Total</span>
        <span class="text-xl font-bold text-gray-900">{{ total }}</span>
    </div>
    <div class="flex flex-col">
        <span class="text-xs text-gray-500 uppercase">Active</span>
        <span class="text-xl font-bold text-green-600">{{ active }}</span>
    </div>
    <div class="flex flex-col">
        <span class="text-xs text-gray-500 uppercase">Expiring soon</span>
        <span class="text-xl font-bold text-yellow-500">{{ expiringSoon }}</span>
    </div>
    <div class="flex flex-col">
        <span class="text-xs text-gray-500 uppercase">Expired</span>
        <span class="text-xl font-bold text-gray-500">{{ expired }}</span>
    </div>
</div>
