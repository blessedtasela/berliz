<div class="flex flex-col gap-6 font-sans">

    <!-- Greeting hero -->
    <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-gray-900 via-gray-900 to-red-950 px-5 py-6 sm:px-7 sm:py-7">
        <div class="pointer-events-none absolute -top-16 -right-16 w-56 h-56 rounded-full bg-red-600/20 blur-3xl"></div>
        <div class="pointer-events-none absolute -bottom-20 -left-10 w-48 h-48 rounded-full bg-red-600/10 blur-3xl"></div>
        <div class="relative flex flex-col gap-1">
            <span class="text-[10px] font-bold tracking-[0.2em] uppercase text-red-400">Berliz</span>
            <h1 class="text-lg sm:text-xl font-extrabold text-white">
                {{ greeting }}{{ userData?.firstname ? ', ' + userData?.firstname : '' }} 👋
            </h1>
            <p class="text-xs text-zinc-400">Here's what's happening with your training today.</p>
        </div>
    </div>

    <!-- Success message -->
    <div *ngIf="successMessage"
        class="flex items-center gap-3 px-4 py-3 bg-green-50 border border-green-100 rounded-xl text-xs">
        <i-feather name="check-circle" class="text-green-600 shrink-0" style="width:14px;height:14px;"></i-feather>
        <span class="text-green-700 font-medium">Todo added successfully.</span>
        <a routerLink="/dashboard/my-todos"
            class="ml-auto text-red-600 font-semibold hover:underline whitespace-nowrap">
            View all →
        </a>
    </div>

    <!-- Action cards -->
    <app-dashboard-action [data]="data"></app-dashboard-action>

    <!-- Analytics + Login chart -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-dashboard-app-analytics [data]="data"></app-dashboard-app-analytics>
        <app-dashboard-login-chart [data]="data"></app-dashboard-login-chart>
    </div>

    <!-- Notifications + Todos -->
    <div class="grid grid-cols-1 gap-4 items-start">
        <app-dashboard-notification></app-dashboard-notification>
        <app-dashboard-todo-list [todoData]="myTodo"></app-dashboard-todo-list>
    </div>

    <!-- Messages, Connections, Timeline, Members, Progress, FAQs -->
    <app-dashboard-quick-links></app-dashboard-quick-links>

    <!-- Timeline teaser -->
    <app-dashboard-timeline-preview></app-dashboard-timeline-preview>

    <!-- Admin only -->
    <ng-container *ngIf="userData?.role === 'admin'">
        <app-dashboard-top-users></app-dashboard-top-users>
    </ng-container>

    <!-- Activity + Subscription -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-dashboard-activity-chart [data]="data"></app-dashboard-activity-chart>
        <app-dashboard-subscription-analytics [subscriptions]="mySubscriptions">
        </app-dashboard-subscription-analytics>
    </div>

    <!-- Discovery -->
    <app-dashboard-trending-exercises></app-dashboard-trending-exercises>
    <app-dashboard-suggested></app-dashboard-suggested>

</div>
