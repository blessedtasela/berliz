<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="message-circle" class="text-red-600" style="width:16px;height:16px;"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900">Messages</h1>
                <p class="text-[11px] text-gray-400">Direct messages with your trainers and connections</p>
            </div>
        </div>
        <app-refresh-button [loading]="loading" (refresh)="refresh()"></app-refresh-button>
    </div>

    <div class="bg-white rounded-2xl border border-gray-200 grid grid-cols-1 md:grid-cols-[300px_1fr] overflow-hidden" style="min-height: 520px;">

        <!-- Conversation list -->
        <div class="border-b md:border-b-0 md:border-r border-gray-100 flex flex-col">

            <div *ngIf="loading" class="flex items-center justify-center py-10">
                <i-feather name="loader" class="text-gray-300 animate-spin" style="width:18px;height:18px;"></i-feather>
            </div>

            <div *ngIf="!loading" class="flex flex-col divide-y divide-gray-100 overflow-y-auto" style="max-height: 480px;">
                <button *ngFor="let c of conversations" type="button" (click)="openConversation(c.otherUserId)"
                    class="text-left px-4 py-3 hover:bg-gray-50 transition flex items-start gap-2.5"
                    [class.bg-gray-50]="activeUserId === c.otherUserId">
                    <img *ngIf="photoSrc(c) as src" [src]="src" alt="" (click)="lightbox.open(src); $event.stopPropagation()"
                        class="w-8 h-8 rounded-full object-cover border border-gray-200 shrink-0" />
                    <div *ngIf="!photoSrc(c)" class="w-8 h-8 rounded-full bg-sky-50 border border-sky-100 flex items-center justify-center shrink-0">
                        <i-feather name="user" class="text-sky-600" style="width:14px;height:14px;"></i-feather>
                    </div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between gap-2">
                            <span class="text-xs font-bold text-gray-900 truncate">{{ c.otherUserName }}</span>
                            <span *ngIf="c.unreadCount > 0" class="text-[10px] font-bold text-white bg-sky-600 rounded-full px-1.5 py-0.5 shrink-0">{{ c.unreadCount }}</span>
                        </div>
                        <p class="text-[11px] text-gray-400 truncate">{{ c.lastMessage }}</p>
                    </div>
                </button>
            <div *ngIf="!loading" class="flex flex-col divide-y divide-gray-100 overflow-y-auto" style="max-height: 520px;">

                <app-conversation-row *ngFor="let c of conversations"
                    [row]="{ userId: c.otherUserId, name: c.otherUserName, photo: c.otherUserPhoto, preview: c.lastMessage, unreadCount: c.unreadCount }"
                    [active]="activeUserId === c.otherUserId"
                    (open)="openConversation($event)">
                </app-conversation-row>

                <!-- Start a new conversation -->
                <div *ngIf="startableContacts.length > 0" class="pt-1">
                    <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wide px-4 pt-3 pb-1">Start a conversation</p>
                    <app-conversation-row *ngFor="let contact of startableContacts"
                        [row]="contact" [active]="activeUserId === contact.userId"
                        (open)="startConversation(contact)">
                    </app-conversation-row>
                </div>

                <div *ngIf="conversations.length === 0 && startableContacts.length === 0" class="px-4 py-10 text-center">
                    <p class="text-xs text-gray-400">No conversations yet.</p>
                </div>
            </div>
        </div>

        <!-- Thread. min-h-0 on this grid item AND on the scrolling messages
             div below is required — grid/flex items default to min-height:
             auto, so without it a long thread grows past the grid track
             instead of scrolling internally, pushing the compose box below
             out of view. -->
        <div class="flex flex-col min-h-0" style="max-height: 520px;">

            <div *ngIf="activeUserId == null" class="flex-1 flex flex-col items-center justify-center py-16 gap-2">
                <i-feather name="message-circle" class="text-gray-200" style="width:32px;height:32px;"></i-feather>
                <p class="text-xs text-gray-400">Select a conversation to view messages.</p>
            </div>

            <ng-container *ngIf="activeUserId != null">

                <div class="border-b border-gray-100 px-4 py-3 flex items-center gap-2.5 shrink-0">
                    <app-chat-thread-header
                        [userId]="activeContact.userId" [name]="activeContact.name" [photo]="activeContact.photo"
                        [role]="activeContact.role" [typing]="activePartyTyping">
                    </app-chat-thread-header>
                </div>

                <div *ngIf="loadingConversation" class="flex-1 flex items-center justify-center">
                    <i-feather name="loader" class="text-gray-300 animate-spin" style="width:18px;height:18px;"></i-feather>
                </div>

                <div *ngIf="!loadingConversation" class="flex-1 min-h-0 overflow-y-auto p-4 flex flex-col gap-3">
                    <div *ngIf="activeMessages.length === 0" class="flex-1 flex items-center justify-center">
                        <p class="text-xs text-gray-400">No messages yet — say hello.</p>
                    </div>
                    <app-message-bubble *ngFor="let m of activeMessages"
                        [message]="m" [mine]="isMine(m)" [isLastMine]="isMine(m) && m.id === lastMineMessageId"
                        (unsend)="unsend($event)">
                    </app-message-bubble>
                </div>

                <app-message-composer (send)="send($event)" (typing)="setTyping($event)"></app-message-composer>
            </ng-container>
        </div>
    </div>

</section>
