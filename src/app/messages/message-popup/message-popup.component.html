<ng-container *ngIf="popupEnabled && !onMessagesPage">

    <!-- Panel -->
    <div *ngIf="open"
        class="fixed right-6 z-50 w-96 max-w-[calc(100vw-3rem)] h-[36rem] max-h-[calc(100vh-8rem)] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden font-sans transition-[bottom] duration-200"
        [ngClass]="raised ? 'bottom-40' : 'bottom-24'">

        <!-- List header -->
        <div *ngIf="view === 'list'" class="flex items-center justify-between px-4 py-3 bg-gray-900 text-white shrink-0">
            <h3 class="text-sm font-bold">Messages</h3>
            <div class="flex items-center gap-3 shrink-0">
                <button type="button" (click)="goToFullPage()" aria-label="Open full messaging center" title="Open full page">
                    <i-feather name="arrow-up-right" style="width:14px;height:14px;"></i-feather>
                </button>
                <button type="button" (click)="closePopup()" aria-label="Close messages popup">
                    <i-feather name="x" style="width:16px;height:16px;"></i-feather>
                </button>
            </div>
        </div>

        <!-- Thread header -->
        <div *ngIf="view === 'thread'" class="flex items-center justify-between px-3 py-2.5 bg-gray-900 text-white shrink-0">
            <app-chat-thread-header
                [userId]="activeContact.userId" [name]="activeContact.name" [photo]="activeContact.photo"
                [role]="activeContact.role" [typing]="activePartyTyping"
                [showBack]="true" [showClose]="true"
                (back)="backToList()" (close)="closePopup()">
            </app-chat-thread-header>
        </div>

        <!-- LIST VIEW -->
        <div *ngIf="view === 'list'" class="flex-1 overflow-y-auto">

            <div *ngIf="!conversations.length && !startableContacts.length" class="p-4 text-xs text-gray-400 text-center">
                No conversations yet.
            </div>

            <app-conversation-row *ngFor="let c of conversations"
                [row]="{ userId: c.otherUserId, name: c.otherUserName, photo: c.otherUserPhoto, preview: c.lastMessage, unreadCount: c.unreadCount }"
                [active]="activeUserId === c.otherUserId"
                (open)="openConversation($event)">
            </app-conversation-row>

            <ng-container *ngIf="startableContacts.length">
                <p class="px-4 pt-3 pb-1 text-[10px] font-bold text-gray-400 uppercase tracking-wide">Start a conversation</p>
                <app-conversation-row *ngFor="let contact of startableContacts"
                    [row]="contact" [active]="activeUserId === contact.userId"
                    (open)="startConversation(contact)">
                </app-conversation-row>
            </ng-container>
        </div>

        <!-- THREAD VIEW -->
        <div *ngIf="view === 'thread'" class="flex-1 flex flex-col min-h-0">

            <div class="flex-1 overflow-y-auto px-3 py-3 space-y-3">
                <div *ngIf="loadingConversation" class="text-[11px] text-gray-400 text-center py-4">Loading…</div>

                <div *ngIf="!loadingConversation && activeMessages.length === 0" class="text-xs text-gray-400 text-center py-8">
                    Say hello 👋
                </div>

                <app-message-bubble *ngFor="let m of activeMessages"
                    [message]="m" [mine]="isMine(m)" [isLastMine]="isMine(m) && m.id === lastMineMessageId"
                    (unsend)="unsend($event)">
                </app-message-bubble>
            </div>

            <app-message-composer (send)="send($event)" (typing)="setTyping($event)"></app-message-composer>
        </div>
    </div>

    <!-- Bubble -->
    <button type="button" (click)="togglePopup()" [attr.aria-label]="open ? 'Close messages' : 'Open messages'"
        class="fixed right-6 z-50 w-14 h-14 rounded-full bg-red-600 text-white shadow-xl flex items-center justify-center hover:bg-red-700 transition-[bottom,background-color] duration-200"
        [ngClass]="raised ? 'bottom-24' : 'bottom-6'">
        <i-feather [name]="open ? 'x' : 'message-circle'" style="width:22px;height:22px;"></i-feather>
        <span *ngIf="!open && unreadCount > 0"
            class="absolute -top-1 -right-1 bg-gray-900 text-white text-[10px] font-bold rounded-full min-w-[18px] h-[18px] px-1 flex items-center justify-center border-2 border-white">
            {{ unreadCount > 9 ? '9+' : unreadCount }}
        </span>
    </button>

</ng-container>
