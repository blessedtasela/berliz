<!-- The whole row is one click target that opens the thread -- like every
     other messenger's inbox. The avatar used to be a separate <a routerLink>
     to the user's profile, which meant clicking the left ~40px of a row
     silently navigated away instead of opening the chat ("clicking a chat
     doesn't open it"). Profile access lives in the open thread's header. -->
<button type="button" (click)="open.emit(row.userId)"
    class="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-gray-50 transition" [class.bg-red-50]="active">
    <app-avatar [photo]="row.photo" [name]="row.name" [size]="36"
        borderClass="border-red-100 bg-red-50 text-red-600" class="shrink-0"></app-avatar>

    <span class="flex-1 min-w-0 block">
        <span class="flex items-center justify-between gap-2">
            <span class="text-sm font-semibold text-gray-900 truncate">{{ row.name }}</span>
            <span *ngIf="row.unreadCount" class="text-[10px] font-bold text-white bg-red-600 rounded-full px-1.5 py-0.5 shrink-0">
                {{ row.unreadCount }}
            </span>
        </span>
        <span class="block text-xs text-gray-400 truncate">{{ row.preview || 'Tap to start chatting' }}</span>
    </span>
</button>
