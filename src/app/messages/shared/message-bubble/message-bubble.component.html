<div class="flex flex-col group" [ngClass]="mine ? 'items-end' : 'items-start'">

    <div class="flex items-center gap-1.5" [ngClass]="mine ? 'flex-row-reverse' : 'flex-row'">
        <div class="max-w-[85%] rounded-2xl px-3 py-2"
            [ngClass]="message.deleted
                ? 'bg-gray-50 dark:bg-gray-800 border border-dashed border-gray-200 dark:border-gray-700 text-gray-400 dark:text-gray-500 italic'
                : (mine ? 'bg-red-600 text-white' : 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-200')">

            <!-- Quoted reply preview -->
            <div *ngIf="!message.deleted && message.replyToMessageId" class="mb-1.5 pl-2 py-0.5 border-l-2 rounded-r"
                [ngClass]="mine ? 'border-white/50 bg-white/10' : 'border-gray-400 dark:border-gray-600 bg-gray-200/50 dark:bg-gray-700/50'">
                <p class="text-[10px] font-bold truncate" [ngClass]="mine ? 'text-white/80' : 'text-gray-600 dark:text-gray-300'">
                    {{ message.replyToSenderName }}
                </p>
                <p class="text-[10px] truncate" [ngClass]="mine ? 'text-white/70' : 'text-gray-500 dark:text-gray-400'">
                    {{ message.replyToDeleted ? 'Message unsent' : message.replyToBody }}
                </p>
            </div>

            <!-- Attachment -- an inline zoomable thumbnail for an image, a download card for anything else. -->
            <a *ngIf="!message.deleted && message.attachmentUrl && isImageAttachment" [href]="message.attachmentUrl"
                target="_blank" rel="noopener" class="block mb-1.5 -mx-1">
                <img [src]="message.attachmentUrl" [alt]="message.attachmentName || 'Attachment'"
                    class="max-w-full max-h-60 rounded-lg object-cover" />
            </a>
            <a *ngIf="!message.deleted && message.attachmentUrl && !isImageAttachment" [href]="message.attachmentUrl"
                target="_blank" rel="noopener" class="flex items-center gap-2 mb-1.5 px-2.5 py-2 rounded-lg border"
                [ngClass]="mine ? 'border-white/30 bg-white/10 hover:bg-white/20' : 'border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600'">
                <i-feather name="file" style="width:16px;height:16px;" class="shrink-0"></i-feather>
                <span class="text-xs truncate flex-1 min-w-0">{{ message.attachmentName || 'Attachment' }}</span>
                <span class="text-[10px] opacity-70 shrink-0">{{ formattedAttachmentSize }}</span>
            </a>

            <p *ngIf="!message.deleted && message.body" class="text-sm whitespace-pre-wrap break-words">{{ message.body }}</p>
            <p *ngIf="message.deleted" class="text-xs flex items-center gap-1">
                <i-feather name="x-circle" style="width:11px;height:11px;"></i-feather>
                Message unsent
            </p>

            <p *ngIf="!message.deleted" class="text-[10px] mt-0.5 flex items-center gap-1"
                [ngClass]="mine ? 'text-red-100' : 'text-gray-400 dark:text-gray-500'">
                {{ message.date | date:'shortTime' }}
                <span *ngIf="message.editedAt">&middot; edited</span>
            </p>
        </div>

        <!-- Actions -- own messages get up to 3, everyone else just Reply -- revealed on hover so the thread doesn't clutter with controls. -->
        <div class="opacity-0 group-hover:opacity-100 transition shrink-0 flex items-center gap-1.5">
            <button *ngIf="canReply" type="button" (click)="reply.emit(message)" aria-label="Reply" title="Reply"
                class="text-gray-300 dark:text-gray-600 hover:text-gray-600 dark:hover:text-gray-300">
                <i-feather name="corner-up-left" style="width:12px;height:12px;"></i-feather>
            </button>
            <button *ngIf="canEdit" type="button" (click)="edit.emit(message)" aria-label="Edit" title="Edit"
                class="text-gray-300 dark:text-gray-600 hover:text-gray-600 dark:hover:text-gray-300">
                <i-feather name="edit-2" style="width:12px;height:12px;"></i-feather>
            </button>
            <button *ngIf="canUnsend" type="button" (click)="unsend.emit(message.id)" aria-label="Unsend message" title="Unsend"
                class="text-gray-300 dark:text-gray-600 hover:text-red-600">
                <i-feather name="trash-2" style="width:12px;height:12px;"></i-feather>
            </button>
        </div>
    </div>

    <p *ngIf="isLastMine && message.isRead && !message.deleted" class="text-[10px] text-gray-400 dark:text-gray-500 mt-0.5 mr-0.5 flex items-center gap-1">
        <i-feather name="check-circle" style="width:10px;height:10px;"></i-feather>
        Seen
    </p>

</div>
