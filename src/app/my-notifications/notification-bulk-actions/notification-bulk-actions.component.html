<!-- Bulk Actions -->
<div class="relative flex items-center gap-2">

    <!-- Right: select all + bulk menu trigger -->
    <div class="flex items-center gap-4">

        <!-- Select all control -->
        <button type="button" class="flex items-center gap-2 text-xs text-gray-700 hover:text-gray-900"
            (click)="toggleSelectAll.emit()">

            <span class="w-4 h-4 rounded-full border border-gray-400 flex items-center justify-center">
                <span *ngIf="selectAll" class="w-2 h-2 rounded-full bg-red-600"></span>
            </span>

        </button>

        <!-- Bulk Menu -->

        <div class="relative flex items-center gap-2">
            <!-- Bulk menu trigger -->
            <i-feather name="more-horizontal" class="cursor-pointer text-gray-600 hover:text-gray-900"
                (click)="toggleMenu($event)">
            </i-feather>

            <div *ngIf="menuOpen" (click)="$event.stopPropagation()"
                class="absolute right-0 mt-2 w-44 bg-white border border-gray-200 rounded-lg shadow-lg z-20 text-sm py-1">

                <div class="px-3 py-1.5 text-gray-700">
                    With Selected:
                </div>

                <button class="w-full text-left px-3 py-1.5 hover:bg-gray-50" (click)="onBulk('read')">
                    Mark as read
                </button>
                <button class="w-full text-left px-3 py-1.5 hover:bg-gray-50" (click)="onBulk('unread')">
                    Mark as unread

                </button>

                <button class="w-full text-left px-3 py-1.5 text-red-600 hover:bg-red-50" (click)="onBulk('delete')">
                    Delete notifications
                </button>
            </div>

        </div>

    </div>
