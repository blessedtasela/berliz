<div class="flex flex-col gap-4 font-sans">

   <!-- Header -->
   <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
         <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">Notifications</h1>
         <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
            <ng-container *ngIf="rawNotifications.length > 0; else noneYet">
               <span *ngIf="unreadCount > 0" class="font-semibold text-red-600 dark:text-red-400">{{ unreadCount }} unread</span>
               <span *ngIf="unreadCount === 0">You're all caught up</span>
               · {{ rawNotifications.length }} in total
            </ng-container>
            <ng-template #noneYet>Everything that needs your attention shows up here.</ng-template>
         </p>
      </div>
      <button type="button" *ngIf="unreadCount > 0" (click)="markAllRead()" [disabled]="markingAll"
         class="shrink-0 px-3 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-800 transition flex items-center gap-1.5 disabled:opacity-60">
         <i-feather [name]="markingAll ? 'loader' : 'check-circle'" [class.animate-spin]="markingAll" style="width:13px;height:13px;"></i-feather>
         Mark all as read
      </button>
   </div>

   <!-- A link to a notification that's gone -->
   <app-inline-alert kind="info" [message]="linkNotice" (dismissed)="dismissLinkNotice()"></app-inline-alert>

   <ng-container *ngIf="!(loadError && rawNotifications.length === 0)">

      <!-- View tabs: All / Unread / Read -->
      <div role="tablist" aria-label="Notification view" class="inline-flex self-start p-1 rounded-xl bg-gray-100 dark:bg-gray-800">
         <button type="button" role="tab" *ngFor="let v of views" (click)="setView(v.key)" [attr.aria-selected]="view === v.key"
            class="px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5"
            [ngClass]="view === v.key
               ? 'bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 shadow-sm'
               : 'text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200'">
            {{ v.label }}
            <span *ngIf="v.key === 'unread' && unreadCount > 0"
               class="text-[10px] font-bold bg-red-600 dark:bg-red-500 text-white px-1.5 py-px rounded-full">{{ unreadCount }}</span>
         </button>
      </div>

      <!-- Category chips (only categories you actually have notifications in) -->
      <div *ngIf="categoryCounts.length > 1 || category !== 'all'" class="flex items-center gap-2 overflow-x-auto pb-1 -mb-1" role="group" aria-label="Filter by category">
         <button type="button" (click)="setCategory('all')" [attr.aria-pressed]="category === 'all'"
            class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition"
            [ngClass]="category === 'all'
               ? 'bg-red-600 border-red-600 text-white'
               : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800'">
            All
         </button>
         <button type="button" *ngFor="let c of categoryCounts" (click)="setCategory(c.category.key)" [attr.aria-pressed]="category === c.category.key"
            class="shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition flex items-center gap-1.5"
            [ngClass]="category === c.category.key
               ? 'bg-red-600 border-red-600 text-white'
               : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800'">
            <i-feather [name]="c.category.icon" style="width:11px;height:11px;"></i-feather>
            {{ c.category.label }}
            <span class="opacity-70">{{ c.count }}</span>
         </button>
      </div>

      <app-search-panel [sortOptions]="sortOptions" placeholder="Search notifications..."
         [searchQuery]="query" (searchQueryChange)="onSearchQueryChange($event)" (stateChange)="onFilterStateChange($event)">
      </app-search-panel>

   </ng-container>

   <app-load-error *ngIf="loadError && rawNotifications.length === 0" title="Couldn't load your notifications"
      [message]="loadError" (retry)="retryLoad()"></app-load-error>

   <app-my-notifications *ngIf="!(loadError && rawNotifications.length === 0)" [notificationData]="notificationData" [totalNotifications]="totalNotifications"
      [highlightId]="highlightId" [filtered]="view !== 'all' || category !== 'all' || !!query"
      [refreshing]="refreshing" (refresh)="onRefresh()">
   </app-my-notifications>


</div>
