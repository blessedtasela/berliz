<!-- EMPTY STATE -->
<div *ngIf="notificationData.length === 0" class="flex flex-col items-center justify-center py-10 text-center">
    <h1 class="text-gray-500 italic font-sans text-lg">
        Notifications will appear here
    </h1>
</div>

<!-- HEADER BAR -->
<div *ngIf="notificationData.length > 0"
    class="flex justify-between items-center px-4 py-3 bg-white sticky top-0 z-10 border-b">

    <!-- Pagination -->
    <div class="flex items-center gap-2 text-gray-600 text-sm font-sans">
        <span>{{ startIndex }}–{{ endIndex }} of {{ notificationsLength }}</span>

        <button class="p-1 rounded hover:bg-gray-200" (click)="prevPage()">
            <i-feather name="chevron-left" style="width: 16px;"></i-feather>
        </button>

        <button class="p-1 rounded hover:bg-gray-200" (click)="nextPage()">
            <i-feather name="chevron-right" style="width: 16px;"></i-feather>
        </button>
    </div>

    <!-- Bulk Actions -->
    <div class="relative flex items-center gap-2">

        <input type="checkbox" [checked]="isSelectAllChecked()" (change)="toggleSelectAll($event)"
            class="cursor-pointer">

        <i-feather name="more-horizontal" (click)="toggleBulkAction(); stopPropagation($event)"
            class="cursor-pointer text-gray-700 hover:text-black transition" style="width: 18px;">
        </i-feather>

        <!-- Bulk Menu -->
        <div *ngIf="showBulkAction"
            class="absolute right-0 mt-10 bg-white border border-gray-300 rounded-lg shadow-lg w-40 text-sm z-20">

            <p class="px-3 py-2 font-semibold text-gray-700 border-b">
                With selected:
            </p>

            <p (click)="submitBulkAction('read')" class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
                Mark as read
            </p>

            <p (click)="submitBulkAction('unread')" class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
                Mark as unread
            </p>

            <p (click)="submitBulkAction('delete')" class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-red-600">
                Delete
            </p>
        </div>
    </div>
</div>

<!-- NOTIFICATION LIST (Instagram x Berliz style) -->
<div class="flex flex-col gap-3 px-3 py-3">

    <div *ngFor="let n of notificationData; let i = index"
        class="bg-white border border-gray-200 rounded-xl shadow-sm p-4 flex items-start gap-3 cursor-pointer hover:shadow-md transition"
        (click)="readNotification(n.id)">

        <!-- LEFT: Icon bubble -->
        <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
            <i-feather name="bell" class="text-gray-600" style="width: 18px;">
            </i-feather>
        </div>

        <!-- MIDDLE: Text -->
        <div class="flex flex-col flex-1">
            <span class="font-semibold text-gray-900 text-sm leading-tight" [ngClass]="{ 'font-bold': !n.read }">
                {{ n.notification.length > 100 ? n.notification.slice(0, 100) + '…' : n.notification }}
            </span>

            <span class="text-xs text-gray-400 mt-1">
                {{ formatDate(n.date) }}
            </span>
        </div>

        <!-- RIGHT: Actions -->
        <div class="flex flex-col items-center gap-2">

            <input type="checkbox" [checked]="n.checked" (click)="toggleSelect($event, n)" class="cursor-pointer">

            <i-feather name="more-horizontal" (click)="openMenu(i); stopPropagation($event)"
                class="cursor-pointer text-gray-700 hover:text-black transition" style="width: 18px;">
            </i-feather>

            <!-- Row Menu -->
            <div *ngIf="menuOpen[i]"
                class="absolute right-4 mt-12 bg-white border border-gray-300 rounded-lg shadow-lg w-32 text-sm z-20">

                <p (click)="deleteNotification(n.id)" class="px-3 py-2 hover:bg-gray-100 cursor-pointer text-red-600">
                    Delete
                </p>

                <p (click)="readNotification(n.id)" class="px-3 py-2 hover:bg-gray-100 cursor-pointer">
                    Mark as read
                </p>
            </div>
        </div>
    </div>
</div>

<!-- SCROLL TO BOTTOM ARROW -->
<div *ngIf="showScrollArrow"
    class="fixed bottom-6 right-6 bg-red-600 text-white p-3 rounded-full shadow-lg cursor-pointer hover:bg-red-700 transition"
    (click)="scrollToBottom()">
    <i-feather name="arrow-down" style="width: 20px;"></i-feather>
</div>
