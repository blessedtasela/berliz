<div class="relative flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition" [ngClass]="{
    'border-red-200 bg-red-50 shadow-sm': item.checked,
    'border-gray-200 bg-white hover:shadow-sm hover:-translate-y-0.5': !item.checked,
    'opacity-60': item.read && !item.checked,
    'z-50': menuOpen,
    'z-0': !menuOpen
  }" style="overflow: visible;" (click)="onItemClick($event)" (mousedown)="startPress($event)"
    (mouseup)="cancelPress()" (mouseleave)="cancelPress()">

    <!-- Checkbox -->
    <button (click)="onToggleClick($event)" class="mt-0.5 w-4 h-4 rounded-full border border-gray-300 hover:border-red-400
           flex items-center justify-center shrink-0 transition">
        <div *ngIf="item.checked" class="w-2 h-2 bg-red-600 rounded-full"></div>
    </button>

    <!-- Icon -->
    <i-feather [name]="meta.icon" [ngClass]="meta.color" style="width:15px;height:15px;" class="mt-0.5 shrink-0">
    </i-feather>

    <!-- Content -->
    <div class="flex-1 min-w-0">

        <p class="text-gray-900 text-xs font-medium leading-snug break-words line-clamp-3"
            [innerHTML]="highlight(item.notification, searchQuery)">
        </p>

        <p class="text-gray-400 text-[10px] mt-1.5 flex items-center gap-1">
            <i-feather name="clock" style="width:10px;height:10px;"></i-feather>
            {{ item.date | date:'short' }}
        </p>

    </div>

    <!-- Right: unread dot + menu -->
    <div class="flex flex-col items-end gap-2 shrink-0">

        <!-- Unread dot -->
        <div *ngIf="!item.read" class="w-2 h-2 bg-red-600 rounded-full mt-0.5">
        </div>
        <div *ngIf="item.read" class="w-2 h-2 rounded-full mt-0.5">
        </div>

        <!-- Menu trigger -->
        <div class="relative overflow-visible">

            <button (click)="toggleMenu($event)"
                class="w-6 h-6 rounded-md hover:bg-gray-100 flex items-center justify-center transition"
                [class.pointer-events-none]="selectionMode" [class.opacity-30]="selectionMode">
                <i-feather name="more-horizontal" style="width:13px;height:13px;" class="text-gray-500"></i-feather>
            </button>

            <!-- Dropdown -->
            <div *ngIf="menuOpen && !selectionMode" (click)="$event.stopPropagation()"
                class="absolute right-0 top-full mt-1.5 w-44 bg-white border border-gray-200 rounded-xl shadow-2xl z-[100] text-sm py-1">

                <button
                    class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 transition"
                    (click)="markAsRead($event)">
                    <i-feather name="check-circle" style="width:13px;height:13px;" class="text-gray-400"></i-feather>
                    Mark as read
                </button>

                <button
                    class="w-full text-left px-4 py-2 text-xs text-gray-700 hover:bg-gray-50 flex items-center gap-2 transition"
                    (click)="markAsUnread($event)">
                    <i-feather name="circle" style="width:13px;height:13px;" class="text-gray-400"></i-feather>
                    Mark as unread
                </button>

                <div class="border-t border-gray-100 my-1"></div>

                <button
                    class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 flex items-center gap-2 transition"
                    (click)="delete($event)">
                    <i-feather name="trash-2" style="width:13px;height:13px;"></i-feather>
                    Delete
                </button>

            </div>

        </div>

    </div>

</div>
