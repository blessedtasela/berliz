<div class="relative flex items-start gap-3 p-3 rounded-xl border cursor-pointer transition" [ngClass]="{
    'border-red-200 dark:border-red-900 bg-red-50 dark:bg-red-950/20 shadow-sm dark:shadow-none': item.checked,
    'border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 hover:shadow-sm dark:hover:shadow-none hover:border-gray-300 dark:hover:border-gray-700 hover:-translate-y-0.5': !item.checked,
    'opacity-70': item.read && !item.checked,
    'z-50': menuOpen,
    'z-0': !menuOpen
  }" style="overflow: visible;" (click)="onItemClick($event)" (mousedown)="startPress($event)"
    (mouseup)="cancelPress()" (mouseleave)="cancelPress()">

    <!-- Unread accent -->
    <div *ngIf="!item.read" class="absolute left-0 top-0 h-full w-1 bg-red-600 dark:bg-red-500 rounded-l-xl"></div>

    <!-- Checkbox -->
    <button (click)="onToggleClick($event)" class="mt-0.5 w-4 h-4 rounded-full border border-gray-300 dark:border-gray-600 hover:border-red-400 dark:hover:border-red-500
           flex items-center justify-center shrink-0 transition">
        <div *ngIf="item.checked" class="w-2 h-2 bg-red-600 dark:bg-red-500 rounded-full"></div>
    </button>

    <!-- Icon chip -->
    <div class="w-8 h-8 rounded-xl border flex items-center justify-center shrink-0" [ngClass]="meta.bg">
        <i-feather [name]="meta.icon" [ngClass]="meta.color" style="width:14px;height:14px;"></i-feather>
    </div>

    <!-- Content -->
    <div class="flex-1 min-w-0">

        <p class="text-xs leading-snug break-words line-clamp-3" [ngClass]="item.read ? 'font-medium text-gray-600 dark:text-gray-400' : 'font-semibold text-gray-900 dark:text-gray-100'"
            [innerHTML]="highlight(item.notification, searchQuery)">
        </p>

        <p class="text-gray-400 dark:text-gray-500 text-[10px] mt-1.5 flex items-center gap-1">
            <i-feather name="clock" style="width:10px;height:10px;"></i-feather>
            {{ item.date | date:'short' }}
            <span *ngIf="hasDeepLink" class="ml-0.5 font-semibold text-red-600 dark:text-red-400 flex items-center gap-0.5">
                &middot; View
                <i-feather name="arrow-right" style="width:9px;height:9px;"></i-feather>
            </span>
        </p>

    </div>

    <!-- Right: unread badge + menu -->
    <div class="flex flex-col items-end gap-2 shrink-0">

        <!-- Unread badge -->
        <span *ngIf="!item.read" class="text-[9px] font-bold bg-red-600 dark:bg-red-500 text-white px-1.5 py-px rounded-full leading-tight">
            New
        </span>

        <!-- Menu trigger -->
        <div class="relative overflow-visible">

            <button (click)="toggleMenu($event)"
                class="w-6 h-6 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition"
                [class.pointer-events-none]="selectionMode" [class.opacity-30]="selectionMode">
                <i-feather name="more-horizontal" style="width:13px;height:13px;" class="text-gray-500 dark:text-gray-400"></i-feather>
            </button>

            <!-- Dropdown -->
            <div *ngIf="menuOpen && !selectionMode" (click)="$event.stopPropagation()"
                class="absolute right-0 top-full mt-1.5 w-44 bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl shadow-2xl z-[100] text-sm py-1">

                <button
                    class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center gap-2 transition"
                    (click)="markAsRead($event)">
                    <i-feather name="check-circle" style="width:13px;height:13px;" class="text-gray-400 dark:text-gray-500"></i-feather>
                    Mark as read
                </button>

                <button
                    class="w-full text-left px-4 py-2 text-xs text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800 flex items-center gap-2 transition"
                    (click)="markAsUnread($event)">
                    <i-feather name="circle" style="width:13px;height:13px;" class="text-gray-400 dark:text-gray-500"></i-feather>
                    Mark as unread
                </button>

                <div class="border-t border-gray-100 dark:border-gray-800 my-1"></div>

                <button
                    class="w-full text-left px-4 py-2 text-xs text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 flex items-center gap-2 transition"
                    (click)="delete($event)">
                    <i-feather name="trash-2" style="width:13px;height:13px;"></i-feather>
                    Delete
                </button>

            </div>

        </div>

    </div>

</div>
