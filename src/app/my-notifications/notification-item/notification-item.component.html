<!-- notification-item.component.html -->
<div class="flex items-start gap-3 p-3 rounded-lg hover:bg-gray-50 cursor-pointer" (click)="open.emit(item)">

    <div class="flex items-center justify-center w-full gap-4">
        <!-- Checkbox -->
        <button (click)="toggle.emit(item); $event.stopPropagation()"
            class="mt-1 w-4 h-4 border rounded-full flex items-center justify-center">
            <div *ngIf="item.checked" class="w-2 h-2 bg-red-600 rounded"></div>
        </button>

        <!-- Icon + content -->
        <div class="flex-1 flex gap-2">
            <i-feather [name]="meta.icon" [ngClass]="meta.color" class="w-4 h-4 mt-1"></i-feather>

            <div class="flex-1">
                <p class="text-gray-900 text-sm" [innerHTML]="highlight(item.notification, searchQuery)">
                    
                </p>

                <p class="text-gray-500 text-xs mt-1">
                    {{ item.date | date:'short' }}
                </p>
            </div>
        </div>

        <!-- Unread dot -->
        <div *ngIf="!item.read" class="w-2 h-2 bg-red-600 rounded-full mt-2"></div>
    </div>
</div>
