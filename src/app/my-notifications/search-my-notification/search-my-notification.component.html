<div class="w-full px-3 py-3 flex flex-col gap-3">

    <!-- SEARCH BAR -->
    <div class="flex items-center">
        <div class="w-full flex items-center gap-3 bg-white border border-gray-200 rounded-full px-4 py-2
             shadow-sm hover:shadow-md transition-all duration-150">

            <i-feather name="search" class="text-red-600" style="width: 20px; height: 20px;">
            </i-feather>

            <input [(ngModel)]="searchQuery" type="text" placeholder="Search notifications..." class="w-full bg-transparent text-gray-900 placeholder:text-gray-400
               focus:outline-none focus:ring-0 font-medium" />

            <!-- CLEAR BUTTON -->
            <button *ngIf="searchQuery" (click)="clearSearch()" class="text-gray-400 hover:text-gray-600 transition">
                <i-feather name="x" style="width: 18px; height: 18px;"></i-feather>
            </button>

        </div>
    </div>

    <!-- SORTING BAR -->
    <div class="flex items-center gap-2 overflow-x-auto">

        <button *ngFor="let option of sortOptions" (click)="setSort(option.key)" [ngClass]="{
        'bg-red-600 text-white shadow-md': sortBy === option.key,
        'bg-gray-100 text-gray-700': sortBy !== option.key
      }" class="px-4 py-1 rounded-full text-sm font-semibold transition-all whitespace-nowrap">
            {{ option.label }}
        </button>

        <!-- DATE RANGE PICKER -->
        <div class="flex items-center gap-2 ml-2">
            <input type="date" [(ngModel)]="startDate" class="border border-gray-300 rounded-lg px-2 py-1 text-sm" />

            <input type="date" [(ngModel)]="endDate" class="border border-gray-300 rounded-lg px-2 py-1 text-sm" />

            <button (click)="applyDateRange()"
                class="px-3 py-1 bg-black text-white rounded-lg text-sm font-semibold hover:bg-gray-800 transition">
                Apply
            </button>
        </div>

    </div>

</div>
