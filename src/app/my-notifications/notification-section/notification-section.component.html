<!-- notification-section.component.html -->
<div class="flex flex-col gap-2">

    <h3 class="text-sm font-semibold text-gray-500 px-2">
        {{ title }}
    </h3>
    <hr>
    <notification-item *ngFor="let item of items" [item]="item" (open)="open.emit(item)" (toggle)="toggle.emit(item)"
        [searchQuery]="searchQuery">
    </notification-item>

</div>
