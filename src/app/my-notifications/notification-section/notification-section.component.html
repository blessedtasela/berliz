<!-- notification-section.component.html -->
<div class="flex flex-col gap-2">

    <div class="flex items-center gap-2 px-0.5">
        <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
            {{ title }}
        </span>
        <span class="h-px flex-1 bg-gray-100"></span>
    </div>

    <notification-item *ngFor="let item of items" [item]="item" [searchQuery]="searchQuery" (open)="open.emit($event)"
        (toggle)="toggle.emit($event)" (markRead)="markRead.emit(item)" (markUnread)="markUnread.emit(item)"
        (deleteItem)="deleteItem.emit(item)" [selectionMode]="selectionMode">
    </notification-item>

    
</div>
