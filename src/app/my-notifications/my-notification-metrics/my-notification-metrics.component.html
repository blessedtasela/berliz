<div class="flex flex-col gap-3">

    <!-- Top metrics row -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

        <!-- Total -->
        <div class="bg-gray-50 border border-gray-100 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-gray-400 font-semibold uppercase tracking-wide">Total</span>
            <span class="text-2xl font-bold text-gray-800">{{ total }}</span>
            <span class="text-[10px] text-gray-400">all notifications</span>
        </div>

        <!-- Read -->
        <div class="bg-blue-50 border border-blue-100 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-blue-400 font-semibold uppercase tracking-wide">Read</span>
            <span class="text-2xl font-bold text-blue-700">{{ read }}</span>
            <span class="text-[10px] text-blue-400">already viewed</span>
        </div>

        <!-- Unread -->
        <div class="bg-yellow-50 border border-yellow-100 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-yellow-400 font-semibold uppercase tracking-wide">Unread</span>
            <span class="text-2xl font-bold text-yellow-700">{{ unread }}</span>
            <span class="text-[10px] text-yellow-400">new notifications</span>
        </div>

        <!-- Recent -->
        <div class="bg-green-50 border border-green-100 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-green-400 font-semibold uppercase tracking-wide">Recent</span>
            <span class="text-2xl font-bold text-green-700">{{ recent }}</span>
            <span class="text-[10px] text-green-400">last 7 days</span>
        </div>

    </div>

    <!-- Bottom metrics row -->

</div>
