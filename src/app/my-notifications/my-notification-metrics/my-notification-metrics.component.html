<div class="flex flex-col gap-3">

    <!-- Top metrics row -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">

        <!-- Total -->
        <div class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-wide">Total</span>
            <span class="text-2xl font-bold text-gray-800 dark:text-gray-100">{{ total }}</span>
            <span class="text-[10px] text-gray-400 dark:text-gray-500">all notifications</span>
        </div>

        <!-- Read -->
        <div class="bg-blue-50 dark:bg-blue-950/30 border border-blue-100 dark:border-blue-900 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-blue-400 dark:text-blue-400/80 font-semibold uppercase tracking-wide">Read</span>
            <span class="text-2xl font-bold text-blue-700 dark:text-blue-400">{{ read }}</span>
            <span class="text-[10px] text-blue-400 dark:text-blue-400/80">already viewed</span>
        </div>

        <!-- Unread -->
        <div class="bg-yellow-50 dark:bg-amber-950/30 border border-yellow-100 dark:border-amber-900 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-yellow-400 dark:text-amber-400/80 font-semibold uppercase tracking-wide">Unread</span>
            <span class="text-2xl font-bold text-yellow-700 dark:text-amber-400">{{ unread }}</span>
            <span class="text-[10px] text-yellow-400 dark:text-amber-400/80">new notifications</span>
        </div>

        <!-- Recent -->
        <div class="bg-green-50 dark:bg-green-950/30 border border-green-100 dark:border-green-900 rounded-xl px-4 py-3 flex flex-col gap-1">
            <span class="text-[11px] text-green-400 dark:text-green-400/80 font-semibold uppercase tracking-wide">Recent</span>
            <span class="text-2xl font-bold text-green-700 dark:text-green-400">{{ recent }}</span>
            <span class="text-[10px] text-green-400 dark:text-green-400/80">last 7 days</span>
        </div>

    </div>

    <!-- Bottom metrics row -->

</div>
