<div class="max-w-2xl w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/20 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
                <i-feather name="file-text" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">CV</h2>
                <p class="text-[11px] text-gray-400 dark:text-gray-500 mt-0.5">Partner résumé document</p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 shrink-0" aria-label="Close">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <div *ngIf="cv" class="rounded-xl border border-gray-200 dark:border-gray-700 overflow-hidden">
        <ngx-extended-pdf-viewer [src]="cv" onerror="this.src='../../../assets/icons/file.png';" [textLayer]="true">
        </ngx-extended-pdf-viewer>
    </div>

    <p *ngIf="!cv" class="text-xs text-gray-600 dark:text-gray-400 leading-relaxed bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-4 py-3">
        No CV file found for this partner.
    </p>

    <div class="border-t border-gray-100 dark:border-gray-800"></div>
    <div class="flex items-center justify-end gap-2">
        <button type="button" (click)="closeDialog()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400
                   hover:bg-gray-50 dark:hover:bg-gray-800 active:scale-[0.98] transition">
            Close
        </button>
    </div>

</div>
