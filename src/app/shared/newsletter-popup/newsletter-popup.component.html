<div class="max-w-md w-full p-6 mx-auto flex flex-col gap-5 font-sans">

    <!-- Header -->
    <div class="flex items-start justify-between gap-3">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
                <i-feather name="mail" class="text-red-600" style="width:15px;height:15px;"></i-feather>
            </div>
            <div>
                <h2 class="text-sm font-bold text-gray-900">
                    Sign up today and <span class="text-red-600 font-extrabold">WIN</span>
                </h2>
                <p class="text-[11px] text-gray-400 mt-0.5">
                    Exclusive insights, inspiring stories and member-only offers.
                </p>
            </div>
        </div>
        <button type="button" (click)="closeDialog()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 flex items-center justify-center transition text-gray-400 hover:text-gray-600 shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <form [formGroup]="newsletterForm" (ngSubmit)="addNewsletter()" class="flex flex-col gap-4">

        <!-- Email -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide">
                Email address
            </label>
            <input formControlName="email" type="email" placeholder="you@example.com" class="w-full px-3 py-2.5 rounded-xl border text-sm text-gray-900 placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" [ngClass]="{
                        'border-red-400 bg-red-50': newsletterForm.get('email')?.invalid && newsletterForm.get('email')?.touched,
                        'border-gray-200 bg-gray-50': !(newsletterForm.get('email')?.invalid && newsletterForm.get('email')?.touched)
                      }">
            <p *ngIf="newsletterForm.get('email')?.invalid && newsletterForm.get('email')?.dirty"
                class="text-red-500 text-[11px] flex items-center gap-1">
                <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
                Please enter a valid email address
            </p>
            <p *ngIf="newsletterForm.get('email')?.valid && newsletterForm.get('email')?.dirty"
                class="text-emerald-600 text-[11px] flex items-center gap-1">
                <i-feather name="check-circle" style="width:11px;height:11px;"></i-feather>
                Everything looks good
            </p>
        </div>

        <p class="text-[11px] text-gray-400 leading-relaxed">
            No spam. Unsubscribe any time.
        </p>

        <div class="border-t border-gray-100"></div>

        <!-- Actions -->
        <div class="flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600
                       hover:bg-gray-50 active:scale-[0.98] transition">
                Not now
            </button>
            <button type="submit" [disabled]="submitting" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                       disabled:opacity-60 disabled:cursor-not-allowed disabled:active:scale-100">
                <i-feather name="send" style="width:13px;height:13px;"></i-feather>
                {{ submitting ? 'Subscribing...' : 'Subscribe' }}
            </button>
        </div>

    </form>

</div>
