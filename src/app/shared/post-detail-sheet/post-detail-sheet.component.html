<div class="fixed inset-0 z-[1000] flex flex-col justify-end" role="dialog" aria-modal="true">

    <div class="backdrop absolute inset-0 bg-black/70 backdrop-blur-sm" (click)="close()"></div>

    <div class="sheet relative w-full max-w-2xl mx-auto bg-zinc-950 text-zinc-100 rounded-t-2xl shadow-2xl
                flex flex-col overflow-hidden"
        [class.is-dragging]="dragging"
        [class.is-reduced]="reducedMotion"
        [style.height.px]="fullPx"
        [style.transform]="'translateY(' + translate + 'px)'">

        <!-- Grabber + header = the only draggable surface -->
        <div class="shrink-0 select-none cursor-grab active:cursor-grabbing border-b border-zinc-800"
            (pointerdown)="onDragStart($event)" (pointermove)="onDragMove($event)"
            (pointerup)="onDragEnd()" (pointercancel)="onDragEnd()"
            (dblclick)="toggleSnap()">
            <div class="flex justify-center pt-2 pb-1">
                <span class="w-9 h-1 rounded-full bg-zinc-700"></span>
            </div>
            <div class="flex items-center justify-between px-4 pb-2">
                <span class="text-xs font-semibold text-zinc-300 truncate">{{ post.authorName }}</span>
                <button type="button" (click)="close()" class="p-1.5 rounded-full hover:bg-white/10 transition" aria-label="Close">
                    <i-feather name="x" style="width:18px;height:18px;"></i-feather>
                </button>
            </div>
        </div>

        <!-- Media -->
        <div *ngIf="mediaUrl" class="shrink-0 bg-black flex items-center justify-center" style="max-height: 45%;">
            <video *ngIf="isVideo; else imgTpl" [src]="mediaUrl | strapiUrl"
                class="max-h-full max-w-full" controls autoplay playsinline
                (pointerdown)="$event.stopPropagation()"></video>
            <ng-template #imgTpl>
                <img [src]="mediaUrl | strapiUrl" alt="" class="max-h-full max-w-full object-contain select-none" />
            </ng-template>
        </div>

        <!-- Post text + comments -->
        <div class="flex-1 min-h-0 overflow-y-auto px-4 py-3">
            <p *ngIf="post.content" class="text-sm text-zinc-200 leading-relaxed whitespace-pre-line mb-3">{{ post.content }}</p>
            <app-post-comments [post]="post" [open]="true" [dark]="true" [profileRoutePrefix]="profileRoutePrefix"></app-post-comments>
        </div>
    </div>
</div>
