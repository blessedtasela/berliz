<div class="flex flex-col gap-1.5">

    <div class="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1" [ngClass]="{ 'ring-2 ring-red-200 rounded-xl': invalid }">

        <button type="button" *ngIf="selectedDateOutsideStrip" (click)="toggleCustom()"
            class="shrink-0 w-14 py-2 rounded-xl border text-center transition flex flex-col items-center gap-0.5 bg-red-600 border-red-600 text-white">
            <span class="text-[9px] font-semibold uppercase tracking-wide text-red-100">{{ formatChipLabel(selectedDate!) }}</span>
            <span class="text-sm font-bold leading-none">Picked</span>
        </button>

        <button type="button" *ngFor="let day of days" (click)="select(day)"
            class="shrink-0 w-12 py-2 rounded-xl border text-center transition flex flex-col items-center gap-0.5"
            [ngClass]="selectedDate === day.value
                ? 'bg-red-600 border-red-600 text-white'
                : 'bg-gray-50 border-gray-200 text-gray-600 hover:border-red-200'">
            <span class="text-[9px] font-semibold uppercase tracking-wide"
                [ngClass]="selectedDate === day.value ? 'text-red-100' : 'text-gray-400'">
                {{ day.isToday ? 'Today' : day.dayLabel }}
            </span>
            <span class="text-sm font-bold leading-none">{{ day.dateLabel }}</span>
        </button>

        <button type="button" *ngIf="canLoadMore" (click)="loadMore()"
            class="shrink-0 w-12 py-2 rounded-xl border border-dashed border-gray-200 text-gray-400 hover:border-red-300 hover:text-red-500 transition flex flex-col items-center justify-center gap-0.5">
            <i-feather name="chevron-right" style="width:14px;height:14px;"></i-feather>
            <span class="text-[9px] font-semibold uppercase tracking-wide">More</span>
        </button>

        <button type="button" (click)="toggleCustom()"
            class="shrink-0 w-12 py-2 rounded-xl border transition flex flex-col items-center justify-center gap-0.5"
            [ngClass]="showCustom ? 'bg-red-50 border-red-200 text-red-600' : 'border-gray-200 text-gray-400 hover:border-red-300 hover:text-red-500'">
            <i-feather name="calendar" style="width:14px;height:14px;"></i-feather>
            <span class="text-[9px] font-semibold uppercase tracking-wide">Pick</span>
        </button>

    </div>

    <div *ngIf="showCustom" class="flex items-center gap-2">
        <input type="date" [min]="minDate" [ngModel]="customDateValue" (ngModelChange)="onCustomDateChange($event)"
            class="w-full min-w-0 px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
        <span class="text-[11px] text-gray-400 shrink-0">Any future date</span>
    </div>

</div>
