<div class="relative w-full">

    <button type="button" (click)="toggle()" [disabled]="disabled"
        class="w-full flex items-center justify-between gap-2 px-3 py-2 rounded-xl border text-sm transition text-left
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent disabled:opacity-50 disabled:cursor-not-allowed"
        [ngClass]="invalid
            ? 'border-red-400 bg-red-50'
            : (open ? 'border-red-400 bg-white' : 'border-gray-200 bg-white hover:border-gray-300')">
        <span class="flex items-center gap-1.5 truncate" [ngClass]="value ? 'text-gray-900' : 'text-gray-400'">
            <i-feather name="clock" class="shrink-0 text-gray-400" style="width:14px;height:14px;"></i-feather>
            <span class="truncate">{{ label }}</span>
        </span>
        <i-feather name="chevron-down" class="shrink-0 text-gray-400 transition-transform" [ngClass]="{ 'rotate-180': open }"
            style="width:14px;height:14px;"></i-feather>
    </button>

    <div *ngIf="open"
        class="absolute z-30 mt-1 w-full max-h-56 overflow-y-auto rounded-xl border border-gray-200 bg-white shadow-lg py-1">
        <button *ngFor="let option of options" type="button" (click)="select(option)" [attr.data-selected]="option.value === value"
            class="w-full text-left px-3 py-1.5 text-sm transition"
            [ngClass]="option.value === value
                ? 'bg-red-50 text-red-600 font-semibold'
                : 'text-gray-700 hover:bg-gray-50'">
            {{ option.label }}
        </button>
    </div>

</div>
