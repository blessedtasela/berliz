<div class="flex items-center gap-2 flex-wrap mb-4">

    <div class="flex items-center gap-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl px-3 py-2 max-[767px]:py-3 flex-1 min-w-[220px]
                focus-within:ring-2 focus-within:ring-red-500 focus-within:border-transparent transition">

        <i-feather name="search" class="text-red-600 shrink-0" style="width:16px;height:16px;"></i-feather>

        <input type="text" [ngModel]="query" (ngModelChange)="onQueryChange($event)" [placeholder]="placeholder"
            class="w-full bg-transparent text-sm text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:outline-none" />

        <button *ngIf="query" type="button" (click)="clear()"
            class="text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 transition shrink-0">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>

    </div>

    <select *ngIf="fields.length > 1" [ngModel]="selectedField" (change)="onFieldChange($event)"
        class="px-3 py-2 max-[767px]:py-3 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 text-xs text-gray-700 dark:text-gray-300
               focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition cursor-pointer">
        <option *ngFor="let field of fields" [value]="field.value">{{ field.label }}</option>
    </select>

</div>
