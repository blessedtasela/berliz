<div *ngIf="disciplines.length" class="rounded-2xl border p-4 flex flex-col gap-3"
    [ngClass]="dark ? 'bg-zinc-900 border-zinc-800' : 'bg-white border-gray-200'">

  <div class="flex items-center gap-2">
    <span class="text-lg leading-none">🥋</span>
    <h2 class="text-xs font-bold uppercase tracking-wide" [class.text-gray-900]="!dark" [class.text-white]="dark">Ranks</h2>
  </div>

  <div *ngFor="let d of disciplines" class="rounded-xl border"
      [ngClass]="dark ? 'border-zinc-800' : 'border-gray-100'">
    <button type="button" (click)="toggle(d.discipline)"
        class="w-full flex items-center justify-between gap-3 px-3 py-2.5 text-left">
      <div class="min-w-0">
        <p class="text-xs font-bold truncate" [class.text-gray-900]="!dark" [class.text-white]="dark">{{ d.discipline }}</p>
        <p class="text-[11px]" [class.text-gray-500]="!dark" [class.text-zinc-400]="dark">
          {{ d.currentRank }} · since {{ d.since | date:'mediumDate' }}
        </p>
      </div>
      <i-feather [name]="expanded.has(d.discipline) ? 'chevron-up' : 'chevron-down'"
        class="shrink-0" [class.text-gray-300]="!dark" [class.text-zinc-600]="dark" style="width:14px;height:14px;"></i-feather>
    </button>

    <div *ngIf="expanded.has(d.discipline)" class="px-3 pb-3 flex flex-col gap-1.5 border-t"
        [ngClass]="dark ? 'border-zinc-800' : 'border-gray-100'">
      <div *ngFor="let h of d.history" class="flex items-start gap-2 pt-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-400 mt-1.5 shrink-0"></span>
        <div class="min-w-0">
          <p class="text-[11px] font-semibold" [class.text-gray-800]="!dark" [class.text-zinc-200]="dark">{{ h.rank }}</p>
          <p class="text-[10px]" [class.text-gray-400]="!dark" [class.text-zinc-500]="dark">
            {{ h.awardedAt | date:'mediumDate' }}<span *ngIf="h.awardedByName"> · by {{ h.awardedByName }}</span>
          </p>
          <p *ngIf="h.note" class="text-[10px] italic" [class.text-gray-400]="!dark" [class.text-zinc-500]="dark">"{{ h.note }}"</p>
        </div>
      </div>
    </div>
  </div>
</div>
