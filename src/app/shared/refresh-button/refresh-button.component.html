<button type="button" (click)="onClick()" [disabled]="loading" [title]="title"
    class="w-8 h-8 rounded-lg border border-gray-200 bg-white hover:bg-gray-50 flex items-center justify-center
           transition shrink-0 disabled:cursor-not-allowed disabled:opacity-60">
    <i-feather name="refresh-cw" class="text-gray-500" [class.animate-spin]="loading" style="width:14px;height:14px;"></i-feather>
</button>
