<div *ngIf="open" class="border-t pt-3 flex flex-col gap-3" [class.border-gray-100]="!dark" [class.border-zinc-800]="dark">

    <div *ngIf="loading" class="flex items-center justify-center py-4">
        <i-feather name="loader" class="animate-spin" [class.text-gray-300]="!dark" [class.text-zinc-600]="dark" style="width:16px;height:16px;"></i-feather>
    </div>

    <div *ngIf="!loading && comments.length === 0" class="text-center py-2">
        <p class="text-xs" [class.text-gray-400]="!dark" [class.text-zinc-500]="dark">No comments yet — be the first to reply.</p>
    </div>

    <button *ngIf="!loading && hasMore" type="button" (click)="loadMore()" [disabled]="loadingMore"
        class="self-center text-[11px] font-semibold flex items-center gap-1.5 py-1 transition disabled:opacity-60"
        [class.text-sky-600]="!dark" [class.hover:text-sky-700]="!dark"
        [class.text-sky-500]="dark" [class.hover:text-sky-400]="dark">
        <i-feather *ngIf="loadingMore" name="loader" class="animate-spin" style="width:11px;height:11px;"></i-feather>
        {{ loadingMore ? 'Loading…' : 'Load earlier comments' }}
    </button>

    <div *ngFor="let comment of comments; trackBy: trackByCommentId" class="flex items-start gap-2.5">
        <a [routerLink]="[profileRoutePrefix, comment.authorUsername || comment.authorId]" class="shrink-0">
            <img *ngIf="commentPhotoSrc(comment) as src" [src]="src" alt="" class="w-7 h-7 rounded-full object-cover border"
                [class.border-gray-200]="!dark" [class.border-zinc-700]="dark" />
            <div *ngIf="!commentPhotoSrc(comment)" class="w-7 h-7 rounded-full flex items-center justify-center border"
                [ngClass]="dark ? 'bg-sky-500/10 border-sky-900' : 'bg-sky-50 border-sky-100'">
                <i-feather name="user" class="text-sky-500" style="width:12px;height:12px;"></i-feather>
            </div>
        </a>
        <div class="flex-1 min-w-0 rounded-xl px-3 py-2" [ngClass]="dark ? 'bg-zinc-800/60' : 'bg-gray-50'">

            <!-- READ MODE -->
            <ng-container *ngIf="editingCommentId !== comment.id">
                <div class="flex items-center justify-between gap-2">
                    <a [routerLink]="[profileRoutePrefix, comment.authorUsername || comment.authorId]"
                        class="text-xs font-bold hover:text-sky-500 transition truncate"
                        [class.text-gray-900]="!dark" [class.text-white]="dark">{{ comment.authorName }}</a>
                    <div class="flex items-center gap-2 shrink-0">
                        <button *ngIf="comment.canEdit" type="button" (click)="startEdit(comment)"
                            class="hover:text-sky-500 transition p-0.5"
                            [class.text-gray-300]="!dark" [class.text-zinc-600]="dark">
                            <i-feather name="edit-2" style="width:11px;height:11px;"></i-feather>
                        </button>
                        <button *ngIf="comment.canDelete" type="button" (click)="remove(comment)"
                            class="hover:text-red-500 transition p-0.5"
                            [class.text-gray-300]="!dark" [class.text-zinc-600]="dark">
                            <i-feather name="trash-2" style="width:11px;height:11px;"></i-feather>
                        </button>
                    </div>
                </div>
                <p class="text-xs leading-relaxed whitespace-pre-line break-words" [class.text-gray-700]="!dark" [class.text-zinc-300]="dark">
                    <span *ngFor="let part of parseMentions(comment.content)">
                        <a *ngIf="part.mention" [routerLink]="[profileRoutePrefix, part.mention]"
                            class="text-sky-500 font-semibold hover:underline">{{ part.text }}</a>
                        <ng-container *ngIf="!part.mention">{{ part.text }}</ng-container>
                    </span>
                </p>
                <span class="text-[10px] mt-0.5 block" [class.text-gray-400]="!dark" [class.text-zinc-500]="dark">
                    {{ comment.date | date:'medium' }}<span *ngIf="comment.lastUpdate !== comment.date"> · edited</span>
                </span>
            </ng-container>

            <!-- EDIT MODE -->
            <div *ngIf="editingCommentId === comment.id" class="flex flex-col gap-1.5">
                <div class="relative">
                    <input #editInput type="text" [(ngModel)]="editDraft" (input)="onEditInput(editInput)"
                        (keydown.enter)="saveEdit(comment)" (keydown.escape)="cancelEdit()"
                        class="w-full text-xs rounded-lg px-3 py-2 border focus:outline-none focus:ring-1 transition"
                        [ngClass]="dark
                            ? 'bg-zinc-900 border-zinc-700 text-zinc-200 focus:border-sky-500 focus:ring-sky-500/30'
                            : 'bg-white border-gray-200 text-gray-700 focus:border-sky-400 focus:ring-sky-400/30'" />

                    <div *ngIf="mentionActiveField === 'edit' && mentionSuggestions.length > 0"
                        class="absolute z-10 top-full left-0 right-0 mt-1 rounded-lg border shadow-lg overflow-hidden"
                        [ngClass]="dark ? 'bg-zinc-900 border-zinc-700' : 'bg-white border-gray-200'">
                        <button *ngFor="let s of mentionSuggestions; trackBy: trackBySuggestionId" type="button"
                            (click)="selectMention(s)"
                            class="w-full flex items-center gap-2 px-2.5 py-1.5 text-left transition"
                            [ngClass]="dark ? 'hover:bg-zinc-800' : 'hover:bg-gray-50'">
                            <img *ngIf="suggestionPhotoSrc(s) as src" [src]="src" alt="" class="w-6 h-6 rounded-full object-cover shrink-0" />
                            <div *ngIf="!suggestionPhotoSrc(s)" class="w-6 h-6 rounded-full bg-sky-500/10 flex items-center justify-center shrink-0">
                                <i-feather name="user" class="text-sky-500" style="width:11px;height:11px;"></i-feather>
                            </div>
                            <div class="min-w-0">
                                <p class="text-[11px] font-semibold truncate" [class.text-gray-900]="!dark" [class.text-white]="dark">{{ s.firstname }} {{ s.lastname }}</p>
                                <p class="text-[10px] text-sky-500 truncate">&#64;{{ s.username }}</p>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 justify-end">
                    <button type="button" (click)="cancelEdit()"
                        class="px-2.5 py-1 rounded-lg text-[11px] font-semibold transition"
                        [class.text-gray-500]="!dark" [class.hover:bg-gray-100]="!dark"
                        [class.text-zinc-400]="dark" [class.hover:bg-zinc-800]="dark">
                        Cancel
                    </button>
                    <button type="button" (click)="saveEdit(comment)"
                        [disabled]="!editDraft || !editDraft.trim() || savingEdit"
                        class="px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-sky-600 hover:bg-sky-700 text-white transition disabled:opacity-40 disabled:cursor-not-allowed">
                        Save
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add a comment -->
    <div class="flex items-center gap-2">
        <img [src]="myPhotoSrc" alt="" class="w-7 h-7 rounded-full object-cover border shrink-0"
            [class.border-gray-200]="!dark" [class.border-zinc-700]="dark" />
        <div class="flex-1 relative">
            <input #draftInput type="text" [(ngModel)]="draft" (input)="onDraftInput(draftInput)" (keydown.enter)="submit()"
                placeholder="Write a comment… use @username to mention"
                class="w-full text-xs rounded-lg px-3 py-2 border focus:outline-none focus:ring-1 transition"
                [ngClass]="dark
                    ? 'bg-zinc-800 border-zinc-700 text-zinc-200 placeholder-zinc-500 focus:border-sky-500 focus:ring-sky-500/30'
                    : 'bg-gray-50 border-gray-200 text-gray-700 placeholder-gray-400 focus:border-sky-400 focus:ring-sky-400/30'" />

            <div *ngIf="mentionActiveField === 'draft' && mentionSuggestions.length > 0"
                class="absolute z-10 top-full left-0 right-0 mt-1 rounded-lg border shadow-lg overflow-hidden"
                [ngClass]="dark ? 'bg-zinc-900 border-zinc-700' : 'bg-white border-gray-200'">
                <button *ngFor="let s of mentionSuggestions; trackBy: trackBySuggestionId" type="button"
                    (click)="selectMention(s)"
                    class="w-full flex items-center gap-2 px-2.5 py-1.5 text-left transition"
                    [ngClass]="dark ? 'hover:bg-zinc-800' : 'hover:bg-gray-50'">
                    <img *ngIf="suggestionPhotoSrc(s) as src" [src]="src" alt="" class="w-6 h-6 rounded-full object-cover shrink-0" />
                    <div *ngIf="!suggestionPhotoSrc(s)" class="w-6 h-6 rounded-full bg-sky-500/10 flex items-center justify-center shrink-0">
                        <i-feather name="user" class="text-sky-500" style="width:11px;height:11px;"></i-feather>
                    </div>
                    <div class="min-w-0">
                        <p class="text-[11px] font-semibold truncate" [class.text-gray-900]="!dark" [class.text-white]="dark">{{ s.firstname }} {{ s.lastname }}</p>
                        <p class="text-[10px] text-sky-500 truncate">&#64;{{ s.username }}</p>
                    </div>
                </button>
            </div>
        </div>
        <button type="button" (click)="submit()"
            [disabled]="!draft || !draft.trim() || posting"
            class="w-8 h-8 rounded-lg bg-sky-600 hover:bg-sky-700 text-white flex items-center justify-center
                   shrink-0 transition disabled:opacity-40 disabled:cursor-not-allowed">
            <i-feather *ngIf="!posting" name="send" style="width:13px;height:13px;"></i-feather>
            <i-feather *ngIf="posting" name="loader" class="animate-spin" style="width:13px;height:13px;"></i-feather>
        </button>
    </div>
</div>
