<div class="relative max-w-lg w-full max-h-[80vh] overflow-y-auto p-6 font-sans">

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">
        Notification Details
    </h2>

    <!-- Notification text -->
    <p class="text-gray-800 whitespace-pre-line leading-relaxed text-[15px] text-center">
        {{ data.notification }}
    </p>

    <!-- Date -->
    <div class="mt-6 text-gray-500 text-sm flex items-center justify-center">
        <i-feather name="calendar" class="w-4 h-4 mr-2"></i-feather>
        {{ data.date | date:'fullDate' }}
    </div>

    <!-- Bottom close button -->
    <div class="flex justify-center mt-10">
        <button (click)="close()" class="px-6 py-2 rounded-md border border-white bg-white text-red-600 font-semibold
                   hover:text-red-700 hover:shadow-md hover:scale-105 transition-all duration-300">
            Close
        </button>
    </div>

</div>
