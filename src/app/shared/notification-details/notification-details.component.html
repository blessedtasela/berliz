<div class="max-w-md w-full max-h-[80vh] overflow-y-auto p-6 mx-auto flex flex-col gap-5">

    <!-- Header -->
    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900 flex items-center justify-center">
                <i-feather name="bell" class="text-red-600 dark:text-red-400" style="width:15px;height:15px;"></i-feather>
            </div>
            <h2 class="text-sm font-bold text-gray-900 dark:text-gray-100">Notification</h2>
        </div>
        <button (click)="close()"
            class="w-7 h-7 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center justify-center transition text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300">
            <i-feather name="x" style="width:14px;height:14px;"></i-feather>
        </button>
    </div>

    <!-- Body -->
    <div class="bg-gray-50 dark:bg-gray-800 border border-gray-100 dark:border-gray-700 rounded-xl px-4 py-4">
        <p class="text-gray-800 dark:text-gray-200 text-sm leading-relaxed">
            {{ data.notification }}
        </p>
    </div>

    <!-- Date -->
    <div class="flex items-center gap-1.5 text-xs text-gray-400 dark:text-gray-500">
        <i-feather name="calendar" style="width:12px;height:12px;"></i-feather>
        {{ data.date | date:'fullDate' }}
    </div>

    <!-- Actions -->
    <div class="flex justify-end gap-2">
        <button (click)="close()" class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300
             hover:bg-gray-50 dark:hover:bg-gray-800 transition">
            Close
        </button>
        <button *ngIf="hasDeepLink" (click)="goToEntity()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
             hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-1.5">
            <i-feather name="arrow-right" style="width:12px;height:12px;"></i-feather>
            Go there
        </button>
    </div>

</div>
