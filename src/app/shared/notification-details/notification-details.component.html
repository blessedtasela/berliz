<div class="relative max-w-lg w-full max-h-[80vh] overflow-y-auto p-6 font-sans">

    <!-- Close button -->
    <!-- <button mat-dialog-close class="absolute top-4 right-4 text-gray-500 hover:text-gray-700 transition">
        <i-feather name="x" class="w-5 h-5"></i-feather>
    </button> -->

    <!-- Title -->
    <h2 class="text-2xl font-bold text-gray-900 mb-4 text-center">
        Notification Details
    </h2>

    <!-- Notification text -->
    <p class="text-gray-800 whitespace-pre-line leading-relaxed text-[15px]">
        {{ data.notificationData.notification }}
    </p>

    <!-- Date -->
    <div class="mt-6 text-gray-500 text-sm flex items-center justify-center">
        <i-feather name="calendar" class="w-4 h-4 mr-2"></i-feather>
        {{ data.notificationData.date | date:'fullDate' }}
    </div>

    <!-- Bottom close button -->
    <div class="flex justify-center mt-8">
        <div (click)="close()" class="text-red-600 font-semibold hover:text-red-700 px-2 cursor-pointer
        rounded-md border border-white bg-white hover:scale-105 shadow-lg transition-all duration-300">
            Close
    </div>
    </div>


</div>
