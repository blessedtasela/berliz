<section class="w-full flex items-center justify-center bg-gray-950 rounded-2xl">
  <div class="bg-gray-950 text-white p-6 w-full max-w-md shadow-xl relative">

    <!-- Close button -->
    <button
      class="absolute top-3 right-3 text-gray-400 hover:text-red-500 transition"
      (click)="closeDialog()">
      <i-feather name="x-circle" class="w-5 h-5"></i-feather>
    </button>

    <!-- Title -->
    <h2 class="text-center text-xl font-semibold mb-1">Update Login</h2>

    <!-- Instructions -->
    <p *ngIf="inputToken"
       class="text-yellow-400 text-xs text-center italic mb-4">
      Please check your email and enter the verification code.  
      Do not close this window or the process will restart.
    </p>

    <!-- Validation summary -->
    <div class="text-center text-xs mb-2">
      <span *ngIf="!updateEmailForm.invalid && invalidForm" class="text-green-400">
        Everything looks good
      </span>
      <span *ngIf="updateEmailForm.invalid && invalidForm" class="text-red-400">
        Please complete all fields
      </span>
    </div>

    <!-- Form -->
    <form [formGroup]="updateEmailForm" class="space-y-4">

      <!-- Email -->
      <div>
        <input
          formControlName="email"
          type="text"
          placeholder="Enter new email"
          class="w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700
                 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm"
          [ngClass]="{'border-red-500': updateEmailForm.get('email')?.invalid && updateEmailForm.get('email')?.touched}"
        />
        <p *ngIf="updateEmailForm.get('email')?.invalid && updateEmailForm.get('email')?.touched"
           class="text-yellow-400 text-xs mt-1">
          Email must be valid
        </p>
      </div>

      <!-- Token -->
      <div *ngIf="inputToken">
        <input
          formControlName="token"
          type="text"
          placeholder="Verification code"
          class="w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700
                 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm"
          [ngClass]="{'border-red-500': updateEmailForm.get('token')?.invalid && updateEmailForm.get('token')?.touched}"
        />
        <p *ngIf="updateEmailForm.get('token')?.invalid && updateEmailForm.get('token')?.touched"
           class="text-yellow-400 text-xs mt-1">
          Token is required
        </p>
      </div>

      <!-- Password -->
      <div *ngIf="inputToken">
        <input
          formControlName="password"
          type="password"
          placeholder="Confirm password"
          class="w-full px-4 py-2 rounded-md bg-gray-800 border border-gray-700
                 focus:ring-2 focus:ring-red-500 focus:outline-none text-sm"
          [ngClass]="{'border-red-500': updateEmailForm.get('password')?.invalid && updateEmailForm.get('password')?.touched}"
        />
        <p *ngIf="updateEmailForm.get('password')?.invalid && updateEmailForm.get('password')?.touched"
           class="text-yellow-400 text-xs mt-1">
          Password is required
        </p>
      </div>

      <!-- Buttons -->
      <div class="flex justify-between pt-2">

        <!-- Cancel -->
        <button
          type="button"
          (click)="closeDialog()"
          class="px-4 py-2 bg-gray-800 rounded-md text-sm hover:bg-gray-700 transition">
          Cancel
        </button>

        <!-- Confirm (step 1) -->
        <button
          *ngIf="!inputToken"
          type="button"
          (click)="validateEmail()"
          class="px-4 py-2 bg-red-600 rounded-md text-sm hover:bg-red-700 transition">
          Confirm
        </button>

        <!-- Submit (step 2) -->
        <button
          *ngIf="inputToken"
          type="button"
          (click)="updateEmail()"
          class="px-4 py-2 bg-red-600 rounded-md text-sm hover:bg-red-700 transition">
          Submit
        </button>

      </div>
    </form>
  </div>
</section>
