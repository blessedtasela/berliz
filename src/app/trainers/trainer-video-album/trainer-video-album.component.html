<!-- ═══════════════════════════════════════════════
     VIDEO ALBUM — read-only public card
════════════════════════════════════════════════ -->
<section *ngIf="videos.length > 0" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-6 font-sans">

    <div class="flex flex-col gap-1 mb-4">
        <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
            {{ videos.length }} clip{{ videos.length === 1 ? '' : 's' }}
        </span>
        <h2 class="text-lg font-extrabold text-white leading-tight">
            Video <span class="text-red-500">album</span>
        </h2>
        <p *ngIf="trainerVideoAlbum?.comment" class="text-xs text-zinc-400 leading-relaxed mt-1">
            {{ trainerVideoAlbum?.comment }}
        </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div *ngFor="let video of videos" class="rounded-xl overflow-hidden border border-zinc-800 bg-black">
            <video class="w-full aspect-video object-cover object-top" [src]="videoUrl(video)" controls playsinline
                preload="metadata"></video>
        </div>
    </div>

</section>
