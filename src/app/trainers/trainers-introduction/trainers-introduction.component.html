<!-- ═══════════════════════════════════════════════
     INTRODUCTION — read-only public card
════════════════════════════════════════════════ -->
<section *ngIf="trainerIntroduction?.introduction"
    class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden font-sans">

    <div class="flex flex-col md:flex-row">

        <!-- Cover photo -->
        <div class="md:w-64 shrink-0 bg-zinc-800">
            <img [src]="photoUrl" [alt]="trainerIntroduction?.trainerName"
                class="w-full h-56 md:h-full object-cover object-top" (error)="onImageError($event)" />
        </div>

        <!-- Copy -->
        <div class="flex-1 p-5 sm:p-6 flex flex-col gap-3">

            <div class="flex flex-col gap-1">
                <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
                    Introduction
                </span>
                <h2 class="text-lg font-extrabold text-white leading-tight">
                    Meet {{ trainerIntroduction?.trainerName }}
                </h2>
            </div>

            <div class="w-10 h-0.5 bg-red-600 rounded-full"></div>

            <p class="text-sm text-zinc-400 leading-relaxed whitespace-pre-line">
                {{ trainerIntroduction?.introduction }}
            </p>

        </div>
    </div>
</section>
