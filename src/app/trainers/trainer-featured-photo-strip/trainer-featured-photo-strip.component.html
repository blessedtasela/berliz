<!-- ═══════════════════════════════════════════════
     FEATURED PHOTOS — read-only public strip (PF-40)
════════════════════════════════════════════════ -->
<section *ngIf="photos.length > 0" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-6 font-sans">

    <div class="flex items-center justify-between gap-3 mb-4">
        <div class="flex flex-col gap-1">
            <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
                Gallery
            </span>
            <h2 class="text-lg font-extrabold text-white leading-tight">
                Featured <span class="text-red-500">photos</span>
            </h2>
        </div>

        <button type="button" (click)="viewAllPhotos.emit()"
            class="shrink-0 text-[11px] font-semibold text-zinc-400 hover:text-red-400 transition flex items-center gap-1">
            View all photos
            <i-feather name="arrow-right" style="width:11px;height:11px;"></i-feather>
        </button>
    </div>

    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div *ngFor="let featured of photos" class="aspect-square rounded-xl overflow-hidden border border-zinc-800">
            <img alt="" [src]="photoUrl(featured)" class="w-full h-full object-cover object-top"
                data-fallback-src="assets/avatar.png" />
        </div>
    </div>

</section>
