<!-- ═══════════════════════════════════════════════
     PRICING — read-only public card
════════════════════════════════════════════════ -->
<section *ngIf="hasPricing" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-6 font-sans">

    <div class="flex flex-col gap-1 mb-4">
        <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
            Monthly rates
        </span>
        <h2 class="text-lg font-extrabold text-white leading-tight">
            Training <span class="text-red-500">pricing</span>
        </h2>
    </div>

    <!-- Delivery modes -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div *ngFor="let tier of tiers" class="bg-zinc-950 border border-zinc-800 rounded-xl p-4 flex flex-col gap-2
                   hover:border-red-600/40 transition">

            <div class="flex items-center gap-2">
                <i-feather [name]="tier.icon" class="text-red-500" style="width:13px;height:13px;"></i-feather>
                <span class="text-[11px] uppercase tracking-wide text-zinc-400 font-semibold">
                    {{ tier.label }}
                </span>
            </div>

            <div class="flex items-baseline gap-1">
                <span class="text-2xl font-extrabold text-white">{{ tier.value }}</span>
                <span class="text-[11px] text-zinc-500">/ month</span>
            </div>

            <p class="text-[11px] text-zinc-500">{{ tier.caption }}</p>
        </div>
    </div>

    <!-- Discounts -->
    <div *ngIf="discounts.length > 0" class="mt-5 pt-4 border-t border-zinc-800">

        <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
            Commitment discounts
        </span>

        <div class="flex flex-wrap gap-2 mt-3">
            <span *ngFor="let discount of discounts" class="text-[11px] font-semibold text-zinc-300 bg-zinc-950 border border-zinc-800
                         px-3 py-1.5 rounded-full flex items-center gap-1.5">
                <i-feather name="award" style="width:11px;height:11px;" class="text-red-500"></i-feather>
                {{ discount.label }}
                <span class="text-red-400">−{{ discount.value }}%</span>
            </span>
        </div>
    </div>

</section>
