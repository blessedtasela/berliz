<app-trainers-hero></app-trainers-hero>
<app-trainers-search (allTrainers)="handleSearchResults($event)" [trainers]="trainers">
</app-trainers-search>
<div *ngIf="loadError && trainers.length === 0" class="w-full bg-zinc-950 px-4 py-10 font-sans">
    <div class="max-w-3xl mx-auto">
        <app-load-error [compact]="true" title="Couldn't load trainers" [message]="loadError" (retry)="retryLoad()"></app-load-error>
    </div>
</div>
<app-trainers-search-result *ngIf="!(loadError && trainers.length === 0)" [trainersResult]="trainers">
</app-trainers-search-result>
<app-trainer-partner-form>
</app-trainer-partner-form>
