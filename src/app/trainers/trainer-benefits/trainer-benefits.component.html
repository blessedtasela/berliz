<!-- ═══════════════════════════════════════════════
     BENEFITS — read-only public card
════════════════════════════════════════════════ -->
<section *ngIf="benefits.length > 0" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-6 font-sans">

    <div class="flex flex-col gap-1 mb-4">
        <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
            What you get
        </span>
        <h2 class="text-lg font-extrabold text-white leading-tight">
            Training <span class="text-red-500">benefits</span>
        </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div *ngFor="let benefit of benefits" class="flex items-start gap-2.5 bg-zinc-950 border border-zinc-800 rounded-xl px-3.5 py-3">
            <i-feather name="check-circle" class="text-red-500 shrink-0 mt-0.5"
                style="width:14px;height:14px;"></i-feather>
            <span class="text-xs text-zinc-300 leading-relaxed">{{ benefit }}</span>
        </div>
    </div>

</section>
