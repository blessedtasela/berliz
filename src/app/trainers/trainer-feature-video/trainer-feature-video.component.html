<!-- ═══════════════════════════════════════════════
     FEATURE VIDEOS — read-only public card
════════════════════════════════════════════════ -->
<section *ngIf="trainerVideos.length > 0" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 sm:p-6 font-sans">

    <div class="flex flex-col gap-1 mb-4">
        <span class="text-[11px] uppercase tracking-wide text-zinc-500 font-semibold">
            In action
        </span>
        <h2 class="text-lg font-extrabold text-white leading-tight">
            Featured <span class="text-red-500">videos</span>
        </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

        <div *ngFor="let video of trainerVideos"
            class="flex flex-col bg-zinc-950 border border-zinc-800 rounded-xl overflow-hidden">

            <div class="relative w-full aspect-video bg-black">
                <video class="w-full h-full object-cover" [src]="videoUrl(video)"
                    [attr.poster]="video.thumbnailUrl || null" controls playsinline preload="metadata"></video>

                <span *ngIf="video.featured" class="absolute top-2 left-2 text-[10px] font-semibold text-white bg-red-600
                             px-2 py-0.5 rounded-full">
                    Featured
                </span>
            </div>

            <div class="flex flex-col gap-2 p-4">
                <h3 class="text-sm font-bold text-white leading-tight">
                    {{ video.title }}
                </h3>

                <p *ngIf="video.motivation" class="text-xs text-zinc-400 leading-relaxed">
                    {{ video.motivation }}
                </p>

                <div class="flex items-center gap-4 pt-1 border-t border-zinc-800 mt-1">
                    <span class="text-[11px] text-zinc-500 flex items-center gap-1.5">
                        <i-feather name="eye" style="width:11px;height:11px;"></i-feather>
                        {{ video.views || 0 }}
                    </span>
                    <span class="text-[11px] text-zinc-500 flex items-center gap-1.5">
                        <i-feather name="heart" style="width:11px;height:11px;"></i-feather>
                        {{ video.likes || 0 }}
                    </span>
                </div>
            </div>
        </div>

    </div>
</section>
