<!-- ═══════════════════════════════════════════════
     TRAINERS SEARCH BAR
     Sits on a zinc-950 background (landing page)
════════════════════════════════════════════════ -->
<div class="w-full max-w-2xl mx-auto px-4 py-8 font-sans">

    <!-- Search row -->
    <div class="flex items-stretch gap-2">

        <!-- Input -->
        <div class="flex-1 flex items-center bg-zinc-900 border border-zinc-700 rounded-xl
                    focus-within:border-red-600 focus-within:ring-1 focus-within:ring-red-600/30 transition">
            <i-feather name="search" class="ml-3 text-zinc-500 shrink-0" style="width:15px;height:15px;"></i-feather>
            <input type="text" [(ngModel)]="searchQuery" placeholder="Search by name, services or location…" class="flex-1 bg-transparent px-3 py-2.5 text-sm text-white placeholder-zinc-500
                       focus:outline-none" aria-label="Search trainers" />
        </div>

        <!-- Button -->
        <button type="button" (click)="searchByButton()" class="px-4 py-2.5 rounded-xl bg-red-600 text-white text-xs font-semibold
                   hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2 shrink-0">
            <i-feather name="search" style="width:13px;height:13px;"></i-feather>
            Search
        </button>
    </div>

    <!-- Criteria pills -->
    <div class="flex items-center gap-2 mt-4 flex-wrap">
        <span class="text-[11px] text-zinc-500 font-medium">Filter by:</span>
        <ng-container *ngFor="let opt of searchOptions">
            <button type="button" (click)="selectedSearchCriteria = opt.value; onSearchCriteriaChange()"
                class="px-3 py-1 rounded-full text-[11px] font-semibold border transition" [ngClass]="selectedSearchCriteria === opt.value
                    ? 'bg-red-600 border-red-600 text-white'
                    : 'bg-zinc-900 border-zinc-700 text-zinc-400 hover:border-red-600 hover:text-white'">
                {{ opt.label }}
            </button>
        </ng-container>
    </div>

    <!-- Result feedback (only when a query is active) -->
    <div *ngIf="searchQuery && searchQuery.trim() !== ''" class="mt-4 text-xs text-center">
        <span *ngIf="trainers.length > 0" class="text-zinc-400">
            <span class="text-white font-semibold">{{ trainers.length }}</span> trainer{{ trainers.length === 1 ? '' :
            's' }} found
        </span>
        <span *ngIf="trainers.length === 0" class="text-red-500 font-medium">
            No trainers found for "{{ searchQuery }}"
        </span>
    </div>

</div>
