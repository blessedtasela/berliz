<form [formGroup]="form" class="flex flex-col gap-2">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <label class="text-[11px] font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wide">
      Bio
    </label>

    <button type="button" (click)="onSaveClick()" [disabled]="!canSave"
      class="text-xs font-semibold flex items-center gap-1 transition" [ngClass]="{
    'text-red-600 hover:text-red-700': canSave,
    'text-gray-300 dark:text-gray-600 cursor-not-allowed': !canSave }">
      <i-feather name="save" style="width:12px;height:12px;"></i-feather>
      Save
    </button>
  </div>

  <!-- Textarea -->
  <textarea formControlName="bio" rows="8"
    placeholder="Write a short description about you, your values, and what you aim to achieve..." class="w-full px-3 py-2.5 rounded-xl bg-gray-50 dark:bg-gray-800 border text-sm text-gray-900 dark:text-gray-100
           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent
           resize-none transition placeholder:text-gray-400 dark:placeholder:text-gray-500" [ngClass]="{
      'border-red-300 dark:border-red-800 focus:ring-red-400': isInvalid('bio'),
      'border-green-400 dark:border-green-800 focus:ring-green-400': isValid('bio'),
      'border-gray-200 dark:border-gray-700': !isInvalid('bio') && !isValid('bio')
    }"></textarea>

  <!-- Validation + counter row -->
  <div class="flex items-center justify-between">

    <p *ngIf="isInvalid('bio')" class="text-[11px] text-red-500 dark:text-red-400 flex items-center gap-1">
      <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
      Minimum 10 characters required.
    </p>

    <p *ngIf="isValid('bio')" class="text-[11px] text-green-600 dark:text-green-400 flex items-center gap-1">
      <i-feather name="check-circle" style="width:11px;height:11px;"></i-feather>
      Looks good.
    </p>

    <span class="text-[10px] ml-auto font-semibold" [ngClass]="charCountClass('bio', 10, 1200)">
      {{ charCount('bio') }} / 1200
    </span>

  </div>

</form>
