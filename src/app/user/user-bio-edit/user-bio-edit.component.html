<form [formGroup]="form" class="space-y-3">
  <div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-sm font-semibold text-gray-600 italic">Bio</span>
    </div>
    <textarea
      formControlName="bio"
      rows="5"
      class="w-full px-3 py-2 rounded-md bg-gray-50 border border-gray-300 text-sm
             focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-red-500
             placeholder:text-gray-400"
      placeholder="Write a short description about you, your values, and what you aim to achieve in the fitness and sports industry">
    </textarea>
  </div>

  <div class="flex justify-end">
    <button
      type="button"
      (click)="onSaveClick()"
      class="text-sm font-semibold text-red-600 hover:text-red-700">
      Save
    </button>
  </div>
</form>
