<div class="flex flex-wrap gap-3 text-xs text-gray-500">

  <span class="flex items-center gap-1">
    <i-feather name="calendar" style="width:11px;height:11px;"></i-feather>
    Joined <span class="font-semibold text-gray-700 ml-1">{{ joined }}</span>
  </span>

  <span class="flex items-center gap-1">
    <i-feather name="circle" style="width:11px;height:11px;"
      [ngClass]="status === 'true' ? 'text-green-500' : 'text-red-500'">
    </i-feather>
    Account
    <span class="font-semibold ml-1" [ngClass]="statusClass">{{ statusLabel }}</span>
  </span>

</div>
