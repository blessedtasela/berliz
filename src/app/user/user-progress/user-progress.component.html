<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-emerald-50 border border-emerald-100 flex items-center justify-center shrink-0">
                <i-feather name="trending-up" class="text-emerald-600" style="width:16px;height:16px;"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900">My Progress</h1>
                <p class="text-[11px] text-gray-400">Log your weight, body fat % and progress photos over time</p>
            </div>
        </div>
        <app-refresh-button [loading]="loading" (refresh)="refresh()"></app-refresh-button>
    </div>

    <!-- Log a new check-in -->
    <div class="bg-white rounded-2xl border border-gray-200 p-4 flex flex-col gap-3">
        <h2 class="text-xs font-bold text-gray-900">Log a check-in</h2>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Weight (kg)</label>
                <input type="number" step="0.1" [(ngModel)]="weightKg" placeholder="e.g. 82.5"
                    class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Body fat %</label>
                <input type="number" step="0.1" [(ngModel)]="bodyFatPercent" placeholder="e.g. 18.0"
                    class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500">Date</label>
                <input type="date" [(ngModel)]="date"
                    class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
            </div>
        </div>

        <!-- Photo slots -->
        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500">Progress photos (optional, up to 3)</label>
            <div class="flex gap-3 flex-wrap">
                <div *ngFor="let slot of newEntryPhotoSlots; let i = index"
                    class="w-20 h-20 rounded-lg border border-dashed border-gray-300 flex items-center justify-center relative overflow-hidden shrink-0">

                    <ng-container *ngIf="!slot.uploaded && !slot.uploading">
                        <label class="cursor-pointer flex flex-col items-center gap-1 text-gray-300 hover:text-gray-400">
                            <i-feather name="camera" style="width:18px;height:18px;"></i-feather>
                            <input type="file" accept="image/jpeg,image/png,image/jpg,image/webp" class="hidden"
                                (change)="onNewEntryFileSelected($event, i)" />
                        </label>
                    </ng-container>

                    <div *ngIf="slot.uploading" class="flex items-center justify-center">
                        <i-feather name="loader" class="text-gray-300 animate-spin" style="width:16px;height:16px;"></i-feather>
                    </div>

                    <div *ngIf="slot.uploaded" class="w-full h-full relative">
                        <img [src]="slot.uploaded.photoUrl" class="w-full h-full object-cover object-top" alt="Progress photo" />
                        <button type="button" (click)="removeNewEntryPhotoSlot(i)"
                            class="absolute top-0.5 right-0.5 bg-white/90 rounded-full p-0.5">
                            <i-feather name="x" style="width:12px;height:12px;"></i-feather>
                        </button>
                    </div>
                </div>
            </div>
            <p *ngFor="let slot of newEntryPhotoSlots" class="text-[11px] text-red-500">{{ slot.error }}</p>
        </div>

        <div class="flex justify-end">
            <button type="button" (click)="saveNewEntry()" [disabled]="!canSaveNewEntry"
                class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 disabled:opacity-40 rounded-lg px-3 py-2 transition">
                {{ saving ? 'Saving...' : 'Save check-in' }}
            </button>
        </div>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && entries.length === 0"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white rounded-2xl border border-gray-200">
        <div class="w-14 h-14 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center">
            <i-feather name="trending-up" class="text-gray-300" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400">No check-ins logged yet.</p>
    </div>

    <!-- History -->
    <div *ngIf="!loading && entries.length > 0" class="flex flex-col gap-3">
        <div *ngFor="let entry of entries" class="bg-white rounded-2xl border border-gray-200 p-4 flex flex-col gap-3">

            <!-- Read mode -->
            <ng-container *ngIf="editingId !== entry.id">
                <div class="flex items-center justify-between gap-3">
                    <div class="flex items-center gap-4">
                        <div *ngIf="entry.weightKg != null">
                            <span class="text-sm font-bold text-gray-900">{{ entry.weightKg }}</span>
                            <span class="text-[11px] text-gray-400"> kg</span>
                        </div>
                        <div *ngIf="entry.bodyFatPercent != null">
                            <span class="text-sm font-bold text-gray-900">{{ entry.bodyFatPercent }}</span>
                            <span class="text-[11px] text-gray-400"> % body fat</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <button type="button" (click)="startEdit(entry)" class="text-xs font-semibold text-gray-500 hover:text-gray-800 transition">Edit</button>
                        <button type="button" (click)="deleteEntry(entry)" class="text-xs font-semibold text-red-500 hover:text-red-700 transition">Delete</button>
                    </div>
                </div>

                <!-- Photos -->
                <div *ngIf="entry.photos?.length" class="flex gap-2 flex-wrap">
                    <div *ngFor="let photo of entry.photos" class="w-16 h-16 rounded-lg overflow-hidden relative shrink-0 border border-gray-100">
                        <img [src]="photo.photoUrl" class="w-full h-full object-cover object-top" alt="Progress photo" />
                        <button type="button" (click)="removePhoto(entry, photo.id)"
                            class="absolute top-0.5 right-0.5 bg-white/90 rounded-full p-0.5">
                            <i-feather name="x" style="width:10px;height:10px;"></i-feather>
                        </button>
                    </div>

                    <label class="w-16 h-16 rounded-lg border border-dashed border-gray-300 flex items-center justify-center cursor-pointer text-gray-300 hover:text-gray-400 shrink-0">
                        <i-feather name="plus" style="width:16px;height:16px;"></i-feather>
                        <input type="file" accept="image/jpeg,image/png,image/jpg,image/webp" class="hidden"
                            (change)="onExistingEntryFileSelected($event, entry)" />
                    </label>
                </div>

                <span class="text-[11px] text-gray-400">{{ entry.date | date:'mediumDate' }}</span>
            </ng-container>

            <!-- Edit mode -->
            <div *ngIf="editingId === entry.id" class="flex flex-col gap-3">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <input type="number" step="0.1" [(ngModel)]="editWeightKg" placeholder="Weight (kg)"
                        class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
                    <input type="number" step="0.1" [(ngModel)]="editBodyFatPercent" placeholder="Body fat %"
                        class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
                    <input type="date" [(ngModel)]="editDate"
                        class="text-sm text-gray-700 border border-gray-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-emerald-400" />
                </div>
                <div class="flex items-center gap-2 justify-end">
                    <button type="button" (click)="cancelEdit()" class="text-xs font-semibold text-gray-500 hover:text-gray-700 transition px-2 py-1">Cancel</button>
                    <button type="button" (click)="saveEdit(entry)"
                        class="text-xs font-semibold text-white bg-gray-900 hover:bg-gray-800 rounded-lg px-3 py-1.5 transition">Save</button>
                </div>
            </div>

        </div>
    </div>

</section>
