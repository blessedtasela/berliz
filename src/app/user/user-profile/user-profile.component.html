<app-user-profile-photo-cropper *ngIf="showCropper" [imageChangedEvent]="imageChangedEvent"
    (cropped)="onPhotoCropped($event)" (upload)="onPhotoUpload()" (cancel)="onCancelCrop()">
</app-user-profile-photo-cropper>

<div *ngIf="user" class="bg-white border border-gray-200 rounded-xl overflow-hidden font-sans">

    <!-- Banner -->
    <app-user-profile-banner></app-user-profile-banner>

    <!-- Avatar + identity -->
    <div class="relative -mt-12 flex flex-col items-center px-4 pb-6">

        <app-user-avatar [photo]="user.profilePhoto" (imageSelected)="onImgSelected($event)">
        </app-user-avatar>

        <app-user-profile-identity [firstname]="user.firstname" [lastname]="user.lastname" [role]="user.role">
        </app-user-profile-identity>

        <app-user-profile-stats [stats]="profileData"></app-user-profile-stats>

        <!-- Bio -->
        <div class="w-full mt-5 border-t border-gray-100 pt-5">
            <app-user-bio-edit [form]="bioForm" (save)="onSaveBio()"></app-user-bio-edit>
        </div>

        <!-- Account info + settings -->
        <div
            class="w-full mt-4 pt-4 border-t border-gray-100 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">

            <app-user-account-info [joined]="formatDate(user.date)" [status]="user.status">
            </app-user-account-info>

            <button [routerLink]="['/dashboard/settings']" class="self-start sm:self-auto px-4 py-2 rounded-xl text-xs font-semibold
               bg-red-600 text-white hover:bg-red-700 active:scale-[0.98] transition
               flex items-center gap-2">
                <i-feather name="settings" style="width:13px;height:13px;"></i-feather>
                Go to settings
            </button>

        </div>

    </div>

</div>
