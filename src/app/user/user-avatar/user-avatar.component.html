<div class="relative">

    <img [src]="src" class="w-24 h-24 rounded-full object-cover border-4 border-white shadow-md bg-white cursor-pointer"
        (click)="showModal = true" />

    <label for="avatarFileInput" class="absolute bottom-0 right-0 w-7 h-7 bg-red-600 rounded-full flex items-center justify-center
           shadow cursor-pointer hover:bg-red-700 transition border-2 border-white">
        <i-feather name="camera" style="width:12px;height:12px;" class="text-white"></i-feather>
    </label>

    <input id="avatarFileInput" type="file" accept="image/*" class="hidden" (change)="onFileChange($event)" />

</div>

<!-- Lightbox -->
<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm p-4"
    (click)="showModal = false">

    <div class="relative" (click)="$event.stopPropagation()">

        <img [src]="src"
            class="max-w-[280px] max-h-[280px] rounded-full object-cover border-4 border-white shadow-2xl" />

        <button (click)="showModal = false" class="absolute -top-2.5 -right-2.5 w-7 h-7 rounded-full bg-gray-900 border-2 border-white
             flex items-center justify-center text-white hover:bg-red-600 transition">
            <i-feather name="x" style="width:12px;height:12px;"></i-feather>
        </button>

    </div>

</div>
