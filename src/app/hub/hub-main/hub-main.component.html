<div class="font-sans flex flex-col gap-6">

    <!-- Header -->
    <app-hub-header></app-hub-header>

    <!-- Admin: every record type in one place (browse, edit, delete) -->
    <a *ngIf="userRole === 'admin'" routerLink="/dashboard/cms"
        class="flex items-center gap-3 rounded-2xl border border-gray-200 dark:border-gray-800 bg-white dark:bg-gray-900 px-4 py-3 hover:border-red-300 dark:hover:border-red-800 transition">
        <span class="w-9 h-9 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
            <i-feather name="layers" class="text-red-600" style="width:16px;height:16px;"></i-feather>
        </span>
        <span class="min-w-0 flex-1">
            <span class="block text-sm font-bold text-gray-900 dark:text-gray-100">Records manager</span>
            <span class="block text-[11px] text-gray-500 dark:text-gray-400">Browse, edit and delete the records of every type in Berliz</span>
        </span>
        <i-feather name="chevron-right" class="text-gray-400 shrink-0" style="width:16px;height:16px;"></i-feather>
    </a>

    <!-- Grid -->
    <hub-grid *ngIf="data" [items]="data"></hub-grid>

    <!-- Loading -->
    <div *ngIf="!data && loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 dark:text-gray-600 animate-spin" style="width:24px;height:24px;"></i-feather>
    </div>

    <!-- Failed to load -- distinct from "nothing to show", so a broken request never looks like an empty Hub -->
    <app-load-error *ngIf="!data && !loading && error" title="Couldn't load your Hub" [message]="error"
        (retry)="retry()"></app-load-error>

    <!-- Empty -->
    <div *ngIf="!data && !loading && !error" class="flex flex-col items-center py-16 gap-2 text-center">
        <i-feather name="layout" class="text-gray-300 dark:text-gray-600" style="width:36px;height:36px;"></i-feather>
        <p class="text-sm text-gray-400 dark:text-gray-500 italic">No hub data available</p>
    </div>

</div>
