<div class="font-sans flex flex-col gap-6">

    <!-- Header -->
    <app-hub-header></app-hub-header>

    <!-- Grid -->
    <hub-grid *ngIf="data" [items]="data"></hub-grid>

    <!-- Empty -->
    <div *ngIf="!data" class="flex flex-col items-center py-16 gap-2 text-center">
        <i-feather name="layout" class="text-gray-300" style="width:36px;height:36px;"></i-feather>
        <p class="text-sm text-gray-400 italic">No hub data available</p>
    </div>

</div>
