<a [routerLink]="link" class="relative p-3 border border-gray-200 rounded-xl bg-white flex flex-col gap-3
            hover:shadow-sm hover:-translate-y-0.5 transition cursor-pointer">

  <!-- Top -->
  <div class="flex items-start justify-between gap-2">

    <div class="flex flex-col gap-0.5 min-w-0">
      <span class="text-[11px] font-semibold text-gray-400 uppercase tracking-wide truncate">
        {{ label }}
      </span>
      <span class="text-2xl font-bold text-gray-900 leading-none">
        {{ value }}
      </span>
    </div>

    <div class="w-8 h-8 rounded-xl bg-red-50 border border-red-100 flex items-center justify-center shrink-0">
      <i-feather [name]="icon" class="text-red-600" style="width:14px;height:14px;"></i-feather>
    </div>

  </div>

  <!-- Footer -->
  <div class="pt-2 border-t border-gray-100 flex items-center gap-1 text-xs font-semibold text-red-600">
    Open
    <i-feather name="chevron-right" style="width:12px;height:12px;"></i-feather>
  </div>

</a>
