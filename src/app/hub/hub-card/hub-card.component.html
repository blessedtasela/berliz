<div 
  class="group bg-white border border-gray-200 rounded-xl p-6 shadow-sm 
         hover:shadow-lg transition-all cursor-pointer">
  
  <div class="flex justify-between items-start">
    <div>
      <p class="text-sm text-gray-500 uppercase tracking-wide font-semibold">
        {{ label }}
      </p>
      <p class="text-2xl font-bold text-gray-900 mt-1">
        {{ value }}
      </p>
    </div>

    <div class="text-red-600 group-hover:text-red-700 transition">
      <i-feather name="ArrowRight" class="w-5 h-5"></i-feather>
    </div>
  </div>

  <a 
    [routerLink]="['/dashboard/hub', link]"
    class="mt-6 inline-flex items-center text-sm font-medium text-red-600 
           group-hover:text-red-700 transition">
    Open
    <i-feather name="ChevronRight" class="w-4 h-4 ml-1"></i-feather>
  </a>
</div>
