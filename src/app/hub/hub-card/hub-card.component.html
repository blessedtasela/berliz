<a [routerLink]="link" class="relative p-3 border border-gray-200 dark:border-gray-800 rounded-xl bg-white dark:bg-gray-900 flex flex-col gap-3
            hover:shadow-sm dark:hover:shadow-none hover:border-gray-300 dark:hover:border-gray-700 hover:-translate-y-0.5 transition cursor-pointer">

  <!-- Top -->
  <div class="flex items-start justify-between gap-2">

    <div class="flex flex-col gap-0.5 min-w-0">
      <span class="text-[11px] font-semibold text-gray-400 dark:text-gray-500 uppercase tracking-wide truncate">
        {{ label }}
      </span>
      <span class="text-2xl font-bold text-gray-900 dark:text-gray-100 leading-none">
        {{ value }}
      </span>
    </div>

    <div class="w-8 h-8 rounded-xl bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900 flex items-center justify-center shrink-0">
      <i-feather [name]="icon" class="text-red-600 dark:text-red-400" style="width:14px;height:14px;"></i-feather>
    </div>

  </div>

  <!-- Footer -->
  <div class="pt-2 border-t border-gray-100 dark:border-gray-800 flex items-center gap-1 text-xs font-semibold text-red-600 dark:text-red-400">
    Open
    <i-feather name="chevron-right" style="width:12px;height:12px;"></i-feather>
  </div>

</a>
