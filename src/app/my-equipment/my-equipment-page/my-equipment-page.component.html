<section class="font-sans flex flex-col gap-4 mt-4">

    <!-- Page header -->
    <div class="flex items-center justify-between gap-3">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-blue-50 dark:bg-blue-950/20 border border-blue-100 dark:border-blue-900 flex items-center justify-center shrink-0">
                <i-feather name="package" class="text-blue-600" style="width:16px;height:16px;"></i-feather>
            </div>
            <div>
                <h1 class="text-sm font-bold text-gray-900 dark:text-gray-100">My equipment</h1>
                <p class="text-[11px] text-gray-400 dark:text-gray-500">Equipment assigned to you — feature it to highlight it publicly</p>
            </div>
        </div>
        <app-refresh-button [loading]="loading" (refresh)="refresh()"></app-refresh-button>
    </div>

    <!-- Loading -->
    <div *ngIf="loading" class="flex items-center justify-center py-16">
        <i-feather name="loader" class="text-gray-300 dark:text-gray-600 animate-spin" style="width:20px;height:20px;"></i-feather>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loading && equipment.length === 0"
        class="flex flex-col items-center justify-center py-16 gap-3 text-center bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800">
        <div class="w-14 h-14 rounded-full bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 flex items-center justify-center">
            <i-feather name="package" class="text-gray-300 dark:text-gray-600" style="width:22px;height:22px;"></i-feather>
        </div>
        <p class="text-sm text-gray-400 dark:text-gray-500">No equipment assigned to you yet.</p>
        <p class="text-xs text-gray-400 dark:text-gray-500">An admin can add equipment and assign it to you.</p>
    </div>

    <!-- List -->
    <div *ngIf="!loading && equipment.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div *ngFor="let item of equipment"
            class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-3 flex gap-3 items-start transition-opacity"
            [class.opacity-50]="togglingId === item.id">

            <img alt="" [src]="item.imageUrl | strapiUrl" onerror="this.src='assets/icons/user.png';"
                class="w-14 h-14 rounded-xl object-cover object-top border border-gray-200 dark:border-gray-700 shrink-0 bg-gray-50 dark:bg-gray-800" />

            <div class="flex-1 min-w-0 flex flex-col gap-1">
                <div class="flex items-start justify-between gap-2">
                    <p class="text-xs font-semibold text-gray-900 dark:text-gray-100 truncate">{{ item.name }}</p>
                    <span class="text-[10px] font-semibold text-gray-500 dark:text-gray-400 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700
                                 px-2 py-0.5 rounded-full shrink-0">
                        x{{ item.stockNumber }}
                    </span>
                </div>

                <p class="text-[11px] text-gray-600 dark:text-gray-400 leading-relaxed line-clamp-3">{{ item.description }}</p>

                <div class="flex items-center justify-end pt-1">
                    <button type="button" (click)="toggleFeatured(item)" [disabled]="togglingId === item.id"
                        [title]="item.featured ? 'Unfeature' : 'Feature'"
                        class="text-[10px] font-semibold px-2 py-0.5 rounded-full border transition flex items-center gap-1 active:scale-95 disabled:cursor-not-allowed"
                        [ngClass]="item.featured
                            ? 'border-amber-200 dark:border-amber-900 text-amber-700 dark:text-amber-400 bg-amber-50 dark:bg-amber-950/20 hover:bg-amber-100 dark:hover:bg-amber-950/40'
                            : 'border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800'">
                        <i-feather name="star" style="width:10px;height:10px;"></i-feather>
                        {{ item.featured ? 'Featured' : 'Feature' }}
                    </button>
                </div>
            </div>

        </div>
    </div>

</section>
