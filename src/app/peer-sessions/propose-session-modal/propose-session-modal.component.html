<div class="font-sans flex flex-col gap-4 p-1 max-w-sm w-full">

    <div class="flex items-center justify-between">
        <div>
            <h2 class="text-sm font-bold text-gray-900">Propose a session</h2>
            <p class="text-[11px] text-gray-400 mt-0.5">with {{ data.participantName }}</p>
        </div>
        <button type="button" (click)="closeDialog()" class="w-8 h-8 rounded-lg hover:bg-gray-100 flex items-center justify-center">
            <i-feather name="x" style="width:16px;height:16px;"></i-feather>
        </button>
    </div>

    <form *ngIf="form" [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-3">

        <div *ngIf="invalidForm && form.invalid"
            class="text-[11px] text-red-600 bg-red-50 border border-red-100 rounded-xl px-3 py-2 flex items-center gap-1.5">
            <i-feather name="alert-circle" style="width:12px;height:12px;"></i-feather>
            Please complete all required fields.
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Date</label>
                <input type="date" formControlName="date" [min]="minDate"
                    class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Time</label>
                <input type="time" formControlName="time"
                    class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                           focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition" />
            </div>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Duration</label>
            <select formControlName="durationMinutes"
                class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition">
                <option [ngValue]="30">30 minutes</option>
                <option [ngValue]="45">45 minutes</option>
                <option [ngValue]="60">1 hour</option>
                <option [ngValue]="90">1.5 hours</option>
                <option [ngValue]="120">2 hours</option>
            </select>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-[11px] font-semibold text-gray-500 uppercase tracking-wide">Notes (optional)</label>
            <textarea formControlName="notes" rows="3" placeholder="What do you want to work on together?"
                class="w-full px-3 py-2 rounded-xl bg-white border border-gray-200 text-sm text-gray-900 resize-none placeholder-gray-400
                       focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition"></textarea>
        </div>

        <div class="border-t border-gray-100 pt-3 flex items-center justify-end gap-2">
            <button type="button" (click)="closeDialog()"
                class="px-4 py-2 rounded-xl text-xs font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition">
                Cancel
            </button>
            <button type="submit" [disabled]="saving"
                class="px-4 py-2 bg-red-600 text-white rounded-xl text-xs font-semibold
                       hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2 disabled:opacity-40">
                <i-feather name="send" style="width:13px;height:13px;"></i-feather>
                {{ saving ? 'Sending...' : 'Propose session' }}
            </button>
        </div>

    </form>

</div>
