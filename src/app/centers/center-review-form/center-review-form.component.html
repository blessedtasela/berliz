<section class="bg-white border border-gray-200 rounded-2xl p-5 sm:p-6 font-sans flex flex-col gap-3">

    <h3 class="text-sm font-bold text-gray-900">Leave a review</h3>

    <div *ngIf="!user" class="flex items-center justify-between gap-3 bg-gray-50 border border-gray-200 rounded-xl px-4 py-3">
        <p class="text-xs text-gray-500">Log in to leave a review for this center.</p>
        <button type="button" (click)="goToLogin()"
            class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-red-600 text-white hover:bg-red-700 transition shrink-0">
            Log in
        </button>
    </div>

    <form *ngIf="user" [formGroup]="reviewForm" (ngSubmit)="submit()" class="flex flex-col gap-3">
        <textarea formControlName="comment" rows="3" placeholder="Share what your experience with this center was like..."
            class="w-full px-3 py-2.5 rounded-xl border border-gray-200 bg-gray-50 text-sm text-gray-900 placeholder-gray-400
                   focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent transition resize-none"></textarea>

        <p *ngIf="reviewForm.get('comment')?.invalid && reviewForm.get('comment')?.touched"
            class="text-red-500 text-[11px] flex items-center gap-1">
            <i-feather name="alert-circle" style="width:11px;height:11px;"></i-feather>
            Write at least 10 characters
        </p>

        <button type="submit" [disabled]="reviewForm.invalid || submitting"
            class="self-end px-4 py-2 rounded-xl text-xs font-semibold bg-red-600 text-white
                   hover:bg-red-700 active:scale-[0.98] transition flex items-center gap-2
                   disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
            <i-feather [name]="submitting ? 'loader' : 'send'" [ngClass]="{'animate-spin': submitting}" style="width:13px;height:13px;"></i-feather>
            {{ submitting ? 'Submitting…' : 'Submit review' }}
        </button>
    </form>

</section>
