<section class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-4">

    <div>
        <h2 class="text-sm font-bold text-white">About this center</h2>
        <p class="text-[11px] text-zinc-500 mt-0.5">Who we are and what we stand for</p>
    </div>

    <div class="border-t border-zinc-800"></div>

    <p *ngIf="centerIntroduction?.introduction; else noIntroduction"
        class="text-sm text-zinc-300 leading-relaxed whitespace-pre-line">
        {{ centerIntroduction?.introduction }}
    </p>

    <ng-template #noIntroduction>
        <div class="flex items-center gap-2 text-zinc-500 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3">
            <i-feather name="info" style="width:13px;height:13px;"></i-feather>
            <span class="text-xs">This center has not published an introduction yet.</span>
        </div>
    </ng-template>

</section>
