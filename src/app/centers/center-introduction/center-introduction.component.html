<section class="bg-white rounded-xl border border-gray-200 p-4 flex flex-col gap-4">

    <div>
        <h2 class="text-sm font-bold text-gray-900">About this center</h2>
        <p class="text-[11px] text-gray-400 mt-0.5">Who we are and what we stand for</p>
    </div>

    <div class="border-t border-gray-100"></div>

    <p *ngIf="centerIntroduction?.introduction; else noIntroduction"
        class="text-sm text-gray-700 leading-relaxed whitespace-pre-line">
        {{ centerIntroduction?.introduction }}
    </p>

    <ng-template #noIntroduction>
        <div class="flex items-center gap-2 text-gray-400 bg-gray-50 border border-gray-200 rounded-xl px-3 py-3">
            <i-feather name="info" style="width:13px;height:13px;"></i-feather>
            <span class="text-xs">This center has not published an introduction yet.</span>
        </div>
    </ng-template>

</section>
