<section class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 flex flex-col gap-4">

    <div class="flex items-center justify-between gap-3">
        <div>
            <h2 class="text-sm font-bold text-white">Video gallery</h2>
            <p class="text-[11px] text-zinc-500 mt-0.5">
                {{ videos.length }} {{ videos.length === 1 ? 'video' : 'videos' }} shared by this center
            </p>
        </div>
        <button *ngIf="videos.length > 4" type="button" (click)="allVideos()"
            class="text-[11px] font-semibold text-red-400 hover:text-red-300 transition shrink-0">
            {{ !showAllVideos ? 'See all' : 'See less' }}
        </button>
    </div>

    <div class="border-t border-zinc-800"></div>

    <div *ngIf="videos.length; else noVideos" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div *ngFor="let video of videos; let i = index" [ngClass]="{ 'hidden': i >= 4 && !showAllVideos }"
            class="rounded-xl overflow-hidden border border-zinc-800 bg-zinc-950 flex flex-col">
            <video class="w-full aspect-video object-cover object-top bg-black" [src]="(video.playbackUrl || video.videoUrl) | strapiUrl"
                controls preload="metadata" playsinline>
            </video>
            <p *ngIf="video.name" class="text-[11px] text-zinc-400 px-3 py-2 truncate">{{ video.name }}</p>
        </div>
    </div>

    <ng-template #noVideos>
        <div class="flex items-center gap-2 text-zinc-500 bg-zinc-950 border border-zinc-800 rounded-xl px-3 py-3">
            <i-feather name="info" style="width:13px;height:13px;"></i-feather>
            <span class="text-xs">No videos published for this center yet.</span>
        </div>
    </ng-template>

</section>
