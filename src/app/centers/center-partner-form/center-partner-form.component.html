<!-- ═══════════════════════════════════════════════
     BECOME A CENTER PARTNER — CTA STRIP + MODAL TRIGGER
════════════════════════════════════════════════ -->

<section class="w-full bg-zinc-950 px-4 pb-20 font-sans">
    <div class="max-w-2xl mx-auto">
        <div class="relative overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-900 px-8 py-10">

            <!-- Red glow -->
            <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-red-600/10 blur-3xl pointer-events-none">
            </div>

            <div
                class="w-12 h-12 rounded-xl bg-red-600/10 border border-red-600/20 flex items-center justify-center mx-auto mb-4">
                <i-feather name="home" class="text-red-500" style="width:20px;height:20px;">
                </i-feather>
            </div>

            <h2 class="text-xl font-extrabold text-white text-center mb-2">
                Ready to list your center on Berliz?
            </h2>

            <p class="text-sm text-zinc-400 max-w-md mx-auto text-center mb-8 leading-relaxed">
                Apply to become a certified Berliz center partner. Submit your credentials and we'll review your
                application within 48 hours.
            </p>

            <!-- Requirements -->
            <div class="max-w-lg mx-auto mb-8">
                <p class="text-sm font-semibold text-white mb-3">
                    You will need:
                </p>

                <ul class="flex flex-col gap-3">
                    <li *ngFor="let item of requirements" class="flex items-start gap-3 text-sm text-zinc-300">

                        <i-feather name="check-circle" class="text-red-500 shrink-0 mt-0.5"
                            style="width:14px;height:14px;">
                        </i-feather>

                        <span>{{ item }}</span>
                    </li>
                </ul>
            </div>

            <!-- Button -->
            <div class="flex justify-center">
                <button type="button" (click)="openPartnerForm()"
                    class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-red-600 text-white text-sm font-semibold hover:bg-red-700 active:scale-[0.98] transition">

                    <i-feather name="send" style="width:12px;height:12px;">
                    </i-feather>
                    Start Application
                </button>
            </div>

        </div>
    </div>
</section>
