[[redirects]]
  # Deliberately NOT /index.html: that file is the PRERENDERED landing page (the "/"
  # route's own server-rendered markup, title, canonical and JSON-LD). Falling back to
  # it would hand every non-prerendered route (dashboard, login, dynamic
  # /trainers/:id, etc.) the landing page's raw HTML -- harmless once Angular's CSR
  # bootstrap overwrites it, but wrong markup/title for a split second and for any
  # crawler hitting the URL directly. index.csr.html is the generic empty <app-root>
  # shell every route besides the 10 prerendered ones needs; scripts/finalize-
  # prerender.mjs produces it (from a second, no-prerender build) and verifies every
  # asset it references exists, failing the build otherwise.
  from = "/*"
  to = "/index.csr.html"
  status = 200

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

[[headers]]
  # iOS universal links (the mobile app's linking config, RootNavigator.tsx)
  # -- this file has no extension by spec, so Netlify's default MIME
  # detection would otherwise serve it as application/octet-stream.
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  # Android App Links -- same reasoning as the AASA rule above, and
  # explicit here even though the .json extension already gets this
  # right by default, for parity with it.
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  # Netlify's default COOP (same-origin) blocks the postMessage calls Google
  # Identity Services needs between the page and its Sign-In iframe/popup —
  # this is what breaks the Google button in production while it works fine
  # on localhost (which sends no COOP header at all). same-origin-allow-popups
  # keeps the process-isolation security benefit but permits exactly the
  # popup/iframe communication Google's SDK (and Facebook's, same pattern)
  # relies on.
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

[[headers]]
  # Baseline hardening headers. Built from what's actually loaded live
  # (accounts.google.com + connect.facebook.net for social login,
  # static.cloudflareinsights.com from Cloudflare's own beacon,
  # berliz-api.up.railway.app + wss for the backend/WebSocket,
  # media.berliz.fitness for Strapi-hosted images) rather than guessed.
  # camera/microphone/geolocation are confirmed unused anywhere in src/;
  # payment=(self) because Stripe Checkout is wired for this origin even
  # though the publishable key isn't filled in yet.
  #
  # CSP is ENFORCED. Directives are built from what the app actually loads (social-auth.service.ts injects
  # Google Identity Services + the Facebook SDK; Strapi media; the Railway API + WebSocket; Sentry when a DSN is set).
  # Angular's production build no longer inlines critical CSS (angular.json "inlineCritical": false): that feature
  # swaps in the stylesheet with an inline onload="" handler, which this policy would block and leave pages unstyled.
  # If you add a new third-party origin (analytics, a chat widget, another API), add it to the matching directive
  # below or the browser will refuse it -- the console shows "Refused to ... because it violates the following
  # Content Security Policy directive". style-src keeps 'unsafe-inline' because Angular injects component styles
  # at runtime and a static host can't issue per-request nonces; scripts allow no inline code and no eval.
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self)"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://connect.facebook.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https://berliz-api.up.railway.app wss://berliz-api.up.railway.app https://media.berliz.fitness https://accounts.google.com https://www.facebook.com https://graph.facebook.com https://restcountries.com https://cloudflareinsights.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://accounts.google.com https://www.facebook.com https://web.facebook.com https://staticxx.facebook.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

[build]
  # `prerender` runs the full production browser build (same as the old `ng
  # build`) and then, on top of it, statically renders the 9 public routes
  # listed in prerender-routes.txt into their own <route>/index.html files --
  # see docs/DEPLOYMENT.md. Netlify's static file server already prefers an
  # exact file/folder match over the SPA redirect below, so every other route
  # (dashboard, login, dynamic /trainers/:id, etc.) still falls through to the
  # plain CSR shell unchanged.
  command = "npm run prerender"
  publish = "dist/berliz/browser"

[build.environment]
  NODE_VERSION = "20"
  # `ng run berliz:prerender` builds the browser AND server bundles in the
  # same Node process (Angular's architect schedules both targets and awaits
  # them together, effectively doubling peak webpack memory vs a plain `ng
  # build`) -- with this app's large chunk graph that blew past V8's default
  # ~2GB old-space ceiling and OOM-killed the Netlify build ("JavaScript heap
  # out of memory" during "Generating server application bundles"). Raise the
  # ceiling; bump further if a future build still OOMs.
  NODE_OPTIONS = "--max-old-space-size=4096"
